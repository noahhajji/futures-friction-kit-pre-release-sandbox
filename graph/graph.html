d toward the middle rings. A vertical arrow labelled strategy development space descends from the top into the centre. The figure illustrates how the contextual environment encloses and affects the operating environment, which in turn encloses the space where strategy is developed.\n\nFor the assistant: draw this only in the reply after the person has said yes to your offer to draw it, never in the reply that explains. Show it as a small card, exactly as it is. Never mark, place or add their plan, their assumptions or anything else of theirs on it: placing it for them would make the theory behind the figure too reductive. Where they stand on it is theirs to work out, with you, in words; if they ask you to place it, say why you do not. Add a sentence or two on what to look at. Where HTML would arrive as code, describe it in words instead.\n\n```html\n<svg class=\"ffrng\" viewBox=\"0 0 560 296\" style=\"display:block;width:100%;max-width:480px\" role=\"img\" aria-label=\"Concentric rings: the contextual environment encloses the operating environment, which encloses the strategy development space\">\n<style>\n.ffrng text{font:12.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.5}\n.ffrng .b{font-weight:500;fill-opacity:.95}\n.ffrng .l{fill:none;stroke:#413C38;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}\n.ffrng .m{stroke-opacity:.5}\n.ffrng .f{stroke-opacity:.2}\n.ffrng .o{fill:#FFC7A5;stroke:#413C38;stroke-opacity:.5;stroke-width:.75}\n</style>\n<rect width=\"560\" height=\"296\" rx=\"14\" fill=\"#fff\"/>\n<circle class=\"l f\" cx=\"280\" cy=\"160\" r=\"110\"/>\n<circle class=\"l m\" cx=\"280\" cy=\"160\" r=\"72\"/>\n<circle class=\"o\" cx=\"280\" cy=\"160\" r=\"34\"/>\n<text x=\"40\" y=\"118\">Megatrends and</text>\n<text x=\"40\" y=\"132\">contextual</text>\n<text x=\"40\" y=\"146\">environment</text>\n<path class=\"l m\" d=\"M40,160 L188,160\"/><path class=\"l m\" d=\"M182.7,162.9 L188,160 L182.7,157.1\"/>\n<text x=\"520\" y=\"132\" text-anchor=\"end\">Operating</text>\n<text x=\"520\" y=\"146\" text-anchor=\"end\">environment</text>\n<path class=\"l m\" d=\"M520,160 L336,160\"/><path class=\"l m\" d=\"M341.3,157.1 L336,160 L341.3,162.9\"/>\n<text x=\"292\" y=\"34\" class=\"b\">Strategy development space</text>\n<path class=\"l m\" d=\"M280,24 L280,142\"/><path class=\"l m\" d=\"M277.1,136.7 L280,142 L282.9,136.7\"/>\n</svg>\n```\n\n## Figure: useful elements in a scan\n\n| Element | Description |\n|---|---|\n| Title of scan | Give your scan a title that captures the essence of the signal |\n| Description | The scan in a nutshell. What is the signal about? What do you see? Why is it important and for whom? How and where is the signal emerging? |\n| Awareness | Is the observation already on the radar of the organisation? Does this change something you already know? Is this something new to you? |\n| Strength/Imminence | Assess how strong the signal is and how soon it may materialise (e.g. use a 1-5 scale) |\n| Impact | Assess the potential impact the development could have (e.g. use a 1-5 scale) |\n| Implications | Speculate on the possible implications of the signal |\n| Opposing forces | Consider opposing developments that potentially refute the impact |\n| Horizons | Consider implication pathways and the way a signal might develop in the near and far future |\n| References | Name the source and the publication or interview details |\n\n## Depends on\n\n- [Weak signals](../concepts/weak-signals.md)\n- [Trends](../concepts/trends.md)\n- [Drivers of change](../concepts/drivers-of-change.md)\n- [Megatrends](../concepts/megatrends.md)", "canon/methods/organisational-memory-and-contextual-reuse": "# Organisational memory and contextual reuse\n\nBring an earlier attempt into a current decision together with the conditions it was tried under, so that its lesson is tested rather than repeated blindly or refused on memory.\n\n## When it helps\n\n- Someone says \"we tried something like that and it didn't work\".\n- Nobody knows why an earlier attempt was shelved; the person who ran it has left.\n- An idea is about to be built that someone in the organisation has probably built before.\n\n## The assumption to test\n\n\"We tried that\" settles the matter only if what stopped the last attempt was a property of the idea rather than of the year it was tried in. A fresh attempt is safe only if none of those blockers is still standing.\n\n## How it works\n\n1. Find the last attempt's owner, its evaluation or its deck. Write down what it set out to do, what it showed, and what stopped it: the technology was too complicated, no one owned it, there was no time, the moment was wrong.\n2. Put two columns on the whiteboard, headed with the year of the earlier attempt and this year, and take the attempt through Enablers and blockers as if it were a trend. In the first column, list what carried the attempt as far as it got and what stopped it. In the second, mark each of those forces stronger, weaker or gone, and add any new blocker that did not exist then.\n3. Read the result. If the stopping forces have weakened, the idea has an inflection point and this year may be it. If they stand where they stood, the new attempt is the old one under a new name.\n4. Keep the earlier result next to the new reading, with who ran it and when, and log the answer where the next person who has the idea will find it. Where no record exists at all, ask the longest-serving colleagues, and let the note become the first entry in the record.\n\n## Key things to consider\n\n- The person leaves knowing which forces to watch rather than which idea to avoid.\n- A remembered conclusion is one person's account of what happened. The original evaluation may show something narrower, for example that the need was real but the way people had to reach it was not.\n- The organisation's memory of an attempt often lives in someone who may have left, so every repeat pays the full cost of discovery again.\n- An attempt can fail on timing alone: too early or too late, technologically possible but organisationally immature, or right for a future shift but impossible to anchor at the time.\n\n## Depends on\n\n- [Enablers and blockers](enablers-and-blockers.md)", "canon/methods/pace-layers": "# Pace layers\n\nPace layers, developed by Stewart Brand, is a framework for thinking about the different factors that drive change in complex systems, and how they evolve over time. It highlights how different 'layers' of a system change at different speeds. There are six layers from fastest to slowest, and these layers interact with each other, with the top layers moving faster, while the slower layers provide a stabilising force and drive longer-term change. The (original) layers are Nature, Culture, Governance, Infrastructure, Commerce and Fashion, but practitioners sometimes choose to change the labelling of the different layers.\n\n## The six layers\n\n- Nature: the slowest and most foundational layer, encompassing the natural environment and ecosystems that change over very long timescales.\n- Culture: this layer includes societal values, attitudes, beliefs and practices, evolving slowly over time.\n- Governance: encompasses political structures and legal systems, regulations, shifts in policy and new reforms to provide societal order.\n- Infrastructure: comprises physical and organisational systems that enable a functioning society.\n- Commerce: involves economic activities, markets and competition, changing relatively rapidly to drive innovation and new business models.\n- Fashion: represents trends in style, preferences and consumer behaviour, which reflect currents in society. This layer changes rapidly, influenced by popular culture, social media and short-term fads.\n\n## Use pace layers to\n\n- Think imaginatively about change and obtain a better understanding of how different components of a system interact and evolve over time.\n- Grasp the dynamics of complex systems, and how change in one layer can bring about systemic change, whether rapid or slow.\n- Help design systems, organisations and strategies that are adaptable and resilient by balancing the stability of slower layers with the dynamism of faster layers.\n\n## Key things to consider\n\n- The simplest approach to Pace Layers is to brainstorm ideas about what is shaping your focal topic, working through the pace layers. Start with the top three layers (fashion, commerce, infrastructure) to get an understanding of what is currently influencing future change. Then repeat the exercise for the bottom three layers (governance, culture, nature), keeping the longer timeframes in mind.\n- The brainstorming outcome across layers can ideally be reviewed with the following prompts: \"Which changes feel particularly relevant?\", \"What could accelerate the pace of change in the stabilising bottom layers?\", \"What could slow down the pace of change in the dynamic top layers?\"\n- You can extend the approach by examining how the different elements in the different layers interact and influence each other, looking for both convergence and potential conflicts that could arise between fast and slow layers.\n- It is important not to get too hung up on the specific layers. It is the process of exploring different paces of change that is most important.\n- Be mindful of the unique characteristics and needs of the system you are investigating. Some layers may have different significance or pace in different contexts. Also understand that cultural and historical factors can significantly influence the pace and nature of change in different layers, especially in global or diverse environments.\n\n## Figure: pace layers\n\nSix horizontal arrows stacked vertically, each pointing right, with its layer name to the right of it. The arrows vary in line weight and length to indicate relative speed and reach: the topmost, fashion, is thin and drawn as a wavy line, the fastest and most volatile and the longest, and each successive arrow below is thicker and shorter, slower and more foundational, through commerce, infrastructure, governance and culture to nature at the bottom, the thickest and shortest.", "canon/methods/premortem": "# Pre-mortem\n\n## What it is\n\nA pre-mortem is a short group exercise run at the start of a plan, project or strategy. The facilitator tells the group to assume the plan has been carried out and has failed badly, and asks each person to write down what caused the failure. The exercise inverts the post-mortem, which examines a failure after it has happened, and applies the same diagnostic attention before anything has gone wrong.\n\nThe technique rests on prospective hindsight. When people are told an outcome has already occurred and asked to explain it, they produce more specific and more accurate reasons than when asked what might go wrong. The certainty of the framing, however fictional, unlocks explanations that a hypothetical framing leaves buried.\n\n## When to use it\n\n- Once a plan is concrete enough to be briefed to the people who will carry it out, and before commitments make it costly to change.\n- When a team has converged quickly on a plan and no one has voiced doubts.\n- When the people most likely to see a weakness are junior, new, or otherwise reluctant to contradict the plan's owners in a normal review.\n- In foresight work, inside each scenario in turn, so the same plan is made to fail under several different futures and the causes can be compared.\n\n## The steps\n\n1. Brief the group on the plan so everyone is working from the same picture.\n2. Announce that the plan has been executed and has failed completely. State it as fact, not as a possibility.\n3. Give everyone a few minutes to write, on their own and in silence, every reason for the failure they can think of. Encourage the reasons that would feel impolite or disloyal to raise in a normal meeting.\n4. Go round the room. Each person reads one reason from their list, starting with the person who owns the plan. Continue until every distinct reason has been recorded. No reason is debated during the round.\n5. After the session, the plan's owner works through the list and decides which reasons warrant changes to the plan, which need monitoring, and which can be set aside.\n\n## What it protects against\n\n- Silence in the planning phase. Reservations that would never be raised as objections come out readily as explanations of a failure that has supposedly already happened.\n- Overinvestment. People who are committed to a plan tend to dismiss risks. Asking them to explain a failure loosens that grip without asking them to argue against their own work.\n- Undervalued knowledge. Team members who name a weakness no one else saw are recognised for their experience, and the rest of the group learns what they knew.\n- Late detection. Having rehearsed the ways the plan could fail, the team recognises the early signs of those failures sooner once the plan is under way.\n\n## Exercise sheet: What would make this fail?\n\nOne of the kit's optional exercises: a one-page canvas with short instructions and space to work, for use with pen, paper and conversation, or alongside the assistant.\n\n- Start with: one plan and a future review date.\n- The canvas: a timeline moves from today's plan to imagined failure at a future date, then returns the learning to today. Three rows connect possible causes with changes or checks and responsibility.\n- At the end: possible reasons for failure and practical changes or checks to make now.\n\nOn the sheet:\n\n- After the briefing, agree what failure would mean at the future review date, then imagine that it has happened.\n- Write alone for five minutes, in the past tense: \"It failed because...\".\n- Go round the room, one reason per person per turn, until all are recorded. Discuss afterwards, and note a level of concern from 1 to 5 for each reason.\n- Choose the most consequential concerns. For each, record what you can change or check, connected to its cause, with an owner and a review date.\n\n## Depends on\n\n- [Scenario development](scenario-development.md)", "canon/methods/reimagine": "# Reimagine\n\nReconsider how a product, service or process creates value when its present form is no longer taken for granted.\n\n## When it helps\n\n- Incremental improvement keeps returning the team to the same design.\n- A future condition changes who needs the service, how it is encountered or what creates trust.\n\n## Start with\n\n- An identifiable product, service or process.\n- An underlying need or purpose to examine.\n- A future condition selected by the user. Choose a year only when it helps the inquiry.\n\n## Working with the method\n\n- Make the future condition tangible through a person's day: who they are, what they need, when they encounter information and in which situations. Use relevant moments rather than a compulsory daily timetable.\n- Explore the underlying need, inherited assumptions and commitments through first principles and selective Five Whys. Distinguish what must remain true from what can disappear, including the current format or role.\n- Rebuild the configuration: who interacts, including people, agents or both; where interaction happens; how provenance and editorial authority appear; and what role the newsroom plays. Let these dimensions inform one another.\n- Use a metaphor to investigate the alternative logic and translate it into operations. In Inayatullah's Causal Layered Analysis, myth and metaphor relate to worldview, social causes and visible accounts of a problem. A metaphor exercise alone is not a full Causal Layered Analysis. An optional, explicitly imagined future headline can describe the surrounding world.\n- Examine dependencies and challenges. Three Horizons can clarify whether the configuration changes system logic. Megatrend analysis can test the contextual assumptions; retain promising directions for appropriate testing, including nexus testing once its guidance is available.\n\n## Useful questions\n\n- \"What would you build to serve this need under the conditions you have described?\"\n- \"If the service is now a living memory, what must change in its ownership, corrections and everyday use?\"\n\n## Capture\n\n- Object.\n- Need.\n- Future condition.\n- Person and situation.\n- Commitments.\n- Assumptions.\n- Who, where, trust and newsroom role.\n- Metaphor or imagined headline, if used.\n- Operational meaning.\n- Dependencies.\n\n## Worked example\n\nA constructed illustration, not an observed case.\n\n- During an imagined evening journey, a resident asks how a council proposal has changed.\n- A newsroom reimagines its archive from \"warehouse of published articles\" to \"public memory\".\n- The concept links claims across time, shows sources and corrections, and lets a journalist review contested answers.\n- The metaphor exposes a governance question: whose experiences enter that memory and who can challenge omissions?\n- The concept remains conditional, not a forecast.\n\n## Quality boundaries\n\n- A distant year, new interface or AI component does not establish transformation.\n- Keep the need open to revision. Test what a metaphor hides as well as reveals.\n- Day-in-the-life narratives and imagined headlines are constructions, not user research or forecasts.\n- The assistant helps articulate the user's configuration without silently choosing their preferred future.\n\n## Exercise sheet: What else could this become?\n\nOne of the kit's optional exercises: a one-page canvas with short instructions and space to work, for use with pen, paper and conversation, or alongside the assistant.\n\n- Start with: one news product to rethink and one or two future conditions to explore, drawn from a megatrend or signal.\n- The canvas: a day-in-the-life timeline, the product and the need, five whys, an assumption challenger with what must still be true and what can disappear or be transformed, an imagined news headline, and a rebuild for the future year.\n- At the end: a reimagined news product for a future year you choose, grounded in a human need and an imagined day.\n\n## Depends on\n\n- [First principles](../concepts/first-principles.md)\n- [Five Whys](five-whys.md)\n- [Causal layered analysis](causal-layered-analysis.md)\n- [Three horizons](three-horizons.md)\n- [Megatrends](../concepts/megatrends.md)", "canon/methods/scenario-development": "# Scenario development\n\nScenario development is one of the main concepts and most widely used methods in foresight. Both public and private sector organisations have implemented scenarios for a wide array of functions to support better longer-term strategic anticipation.\n\n## How it works\n\n- Scenario planning offers a structured approach that describes a plausible set of future conditions that are different to the present.\n- Scenarios are always developed as a set, together mapping out a broad outcome space that allows different futures to be contrasted with one another and with the present, helping to break away from a deterministic view of the future. This allows organisations to consider alternative outcomes representing novel perspectives and contexts, as well as discontinuities, that may be difficult to grasp in the present.\n- It is a process that involves both analysis and storytelling to craft credible and engaging images of the future that provoke decision-makers to think differently.\n- Scenarios enable this by always adopting an 'outside-in' approach, focusing on potential changes in an organisation's external environment, including outcomes 'beyond the numbers' that might otherwise be overlooked. This, in turn, influences the organisation's strategic environment and consequently strategic decisions.\n- In this way, scenarios provide a common outset and a basis for a well-informed discussion of future possibilities and challenges, enabling organisations to widen their strategic perspective and approach the future with curiosity, readiness and vision.\n- There are different scenario development methods, two of which are described below. Both these approaches can vary in their level of detail and the resources required, depending on how extensively the process is scoped.\n\n## 2 x 2 scenarios\n\n- This approach is often used to build scenarios with a 'decision focus' and strategic relevance. It starts from identifying critical uncertainties in relation to the future in focus and then leverages these uncertainties to craft alternative futures.\n- It is arguably the most extensive approach to scenario building and generally implies a step-by-step process that takes you through research, driver mapping and uncertainties assessment over a series of participatory workshops.\n- To start building the actual scenarios, there is initially a need to identify critical uncertainties (see Uncertainties Assessment) that are combined as two axes of uncertainty in a 2 x 2 matrix. You should decide on an axis combination that will create the most interesting or valuable scenario matrix.\n- As a rule, the two axes must be independent of each other, so that they don't collapse.\n- Four 'scenario-spaces' emerge from combining the two axes of uncertainty, and each 'scenario-space' is then elaborated into complete narratives that consider relevant drivers and highlight key characteristics to make them relevant for decision-making.\n- You should make sure events and characteristics in the scenarios are plausible and logically consistent. Also make sure that the four scenarios are structurally or qualitatively different.\n\n## Driver-based scenarios\n\n- Rather than organising scenarios around critical uncertainties and a 2 x 2 matrix, the driver-based approach anchors each scenario in a different core driver.\n- You select a core driver, or a small cluster of drivers, to serve as a scenario's anchor, the thing that dominates and gives the world its character, and then build outward, working through how everything else behaves in the scenario given that driver's prominence. Which drivers can carry a world is a judgement made as part of the process, taking into account what is relevant to the project at hand.\n- Contrast between the scenarios therefore comes from which driver dominates. This makes the set considerably more flexible, as driver-based scenarios are each constructed on their own terms and are not structurally locked to one another in a matrix.\n- There are a few reasons to pursue this alternative approach. Most simply, it can move directly from driver mapping to scenario development, without requiring an uncertainties assessment first. It also avoids a common weakness of the 2 x 2, which sometimes invites 'lazy' axis polarity definition, crossing axes that are unidirectional, such as fast/slow or high/low polarities, leaving you with four relatively uninteresting and 'flat' scenarios, with little room for world-building or for properly exploring the focal issue.\n- Alongside the scenario anchors, you identify a set of tension fields. These are further drivers, or central dimensions, each expressed as a spectrum, or slider, between plausible opposing directions of development. Determined by how the scenario unfolds around its anchor, each scenario then sits at a different point on each slider. Because the same tension fields run across every scenario, you can read the whole set at a glance and see how each dimension plays out differently from one future to the next.\n\n## Use scenario development to\n\n- Provoke decision-makers to think differently about alternative future outcomes that may be difficult to grasp in the present.\n- Create a basis for stress-testing strategies against plausible futures, and guide and inform organisations about the threats and opportunities those futures hold.\n- Facilitate futures-oriented conversation that builds shared understanding and stimulates strategic thinking about the future.\n\n## Key things to consider\n\n- Scenarios are not predictions of the future. They are not meant to be 'right' or 'wrong', 'good' or 'bad'. Rather, their function is to challenge assumptions and explore alternative ways that the future may develop. Explorative scenarios can have a richness that quantitative methods can't capture, which also helps to stimulate creativity and to break from the conventional wisdom around present and short-term problems.\n- Crafting credible and useful scenarios is difficult. A good scenario is not just an abstract analysis of trends. Rather, it tells a believable story set in the future. Using a 'behind-the-scenes' scenario grid to map out key variables and elements across all scenarios helps ensure consistency. Additionally, following general guidelines can support the writing of quality scenario narratives.\n- To make a scenario 'come alive', it can be helpful to think about what different personas might be doing in the future. How are they living? What do they value? How are they impacted in this scenario?\n- For scenarios to be used effectively in a decision-making process, stakeholders must be convinced of the soundness, relevance and value of the process. This hinges on the foundations on which scenarios are built, the structures that they use, and the reasoning they employ, which must stand up to critical examination.\n- The articulation and presentation of scenarios depend greatly upon the intended users. Some scenarios stay at the level of broad generalities without much supporting analysis, which may make them less operational and less useful for decision-making, while they may still provide the general public with inspiration on potential futures. Other scenarios that are presented in much more technical and formalised ways may offer deeper insights for decision-making but can be challenging for ordinary readers to assimilate.\n- In a decision-making context, experience suggests that when stakeholders evaluate scenarios that are too extreme or implausible, they often become more confident in their original assumptions about the future. On the other hand, scenarios that are not challenging enough are easily dismissed as pointless. Both situations can lead to distrust in the foresight process. Finding the right balance is crucial for scenarios to have an impact on decision-making.\n\n## Figure: scenario matrix\n\nA 2 x 2 grid formed by two crossing axes, each running between polarity A and polarity B, forming four scenario-spaces labelled scenario A (top left), B (top right), C (bottom right) and D (bottom left).\n\nFor the assistant: draw this only in the reply after the person has said yes to your offer to draw it, never in the reply that explains. Show it as a small card, exactly as it is. Never mark, place or add their plan, their assumptions or anything else of theirs on it: placing it for them would make the theory behind the figure too reductive. Where they stand on it is theirs to work out, with you, in words; if they ask you to place it, say why you do not. Add a sentence or two on what to look at. Where HTML would arrive as code, describe it in words instead.\n\n```html\n<svg class=\"ffscn\" viewBox=\"0 0 560 350\" style=\"display:block;width:100%;max-width:480px\" role=\"img\" aria-label=\"Scenario matrix: two critical uncertainties, each running between polarity A and polarity B, cross to form four scenario spaces, A to D\">\n<style>\n.ffscn text{font:12.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.5}\n.ffscn .b{font-weight:500;fill-opacity:.95}\n.ffscn .s{font-size:10.5px}\n.ffscn .l{fill:none;stroke:#413C38;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}\n.ffscn .m{stroke-opacity:.5}\n.ffscn .f{stroke-opacity:.2}\n.ffscn .x{font-size:9px}\n.ffscn text.ref{font:9.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.55;font-weight:400}\n</style>\n<rect width=\"560\" height=\"350\" rx=\"14\" fill=\"#fff\"/>\n<path class=\"l m\" d=\"M280,164 L158,164\"/><path class=\"l m\" d=\"M163.3,161.1 L158,164 L163.3,166.9\"/>\n<path class=\"l m\" d=\"M280,164 L402,164\"/><path class=\"l m\" d=\"M396.7,166.9 L402,164 L396.7,161.1\"/>\n<path class=\"l m\" d=\"M280,164 L280,42\"/><path class=\"l m\" d=\"M282.9,47.3 L280,42 L277.1,47.3\"/>\n<path class=\"l m\" d=\"M280,164 L280,286\"/><path class=\"l m\" d=\"M277.1,280.7 L280,286 L282.9,280.7\"/>\n<rect class=\"l f\" x=\"172\" y=\"56\" width=\"216\" height=\"216\" rx=\"6\"/>\n<text x=\"226\" y=\"114\" class=\"b\" text-anchor=\"middle\">Scenario A</text>\n<text x=\"334\" y=\"114\" class=\"b\" text-anchor=\"middle\">Scenario B</text>\n<text x=\"334\" y=\"222\" class=\"b\" text-anchor=\"middle\">Scenario C</text>\n<text x=\"226\" y=\"222\" class=\"b\" text-anchor=\"middle\">Scenario D</text>\n<text x=\"150\" y=\"158\" class=\"s\" text-anchor=\"end\">Polarity A</text>\n<text x=\"410\" y=\"158\" class=\"s\">Polarity B</text>\n<text x=\"150\" y=\"172\" class=\"x\" text-anchor=\"end\">Critical uncertainty 1</text>\n<text x=\"410\" y=\"172\" class=\"x\">Critical uncertainty 1</text>\n<text x=\"280\" y=\"22\" class=\"s\" text-anchor=\"middle\">Polarity A</text>\n<text x=\"280\" y=\"34\" class=\"x\" text-anchor=\"middle\">Critical uncertainty 2</text>\n<text x=\"280\" y=\"302\" class=\"s\" text-anchor=\"middle\">Polarity B</text>\n<text x=\"280\" y=\"314\" class=\"x\" text-anchor=\"middle\">Critical uncertainty 2</text>\n<text class=\"ref\" x=\"536\" y=\"334\" text-anchor=\"end\">Scenario matrix \u00b7 Source: CIFS (2026), Toolkit for Applied Strategic Foresight.</text>\n</svg>\n```\n\n## How to frame good scenario axes\n\nCharacteristics of good axes:\n\n- Anchored in critical uncertainty: each axis should represent high impact and high uncertainty, the top right corner of the impact/uncertainty matrix.\n- Explanatory power and relevance: strong explanatory value for the core area of interest and relevance for generating strategic insights. An axis should explain why the future might evolve in different ways.\n- Stretch current thinking: able to challenge organisational perspectives and assumptions and provoke new thinking.\n- Distinct, balanced polarities: each axis's polarities should describe clearly different logics or states of the world and represent balanced plausibility, both feeling credible with some evidence pointing toward them. Ideally 50/50, perhaps 60/40; beyond that it is no longer an uncertainty.\n- Appropriate level of abstraction: an axis often combines several related uncertainties into a single, more meaningful dimension, allowing adequate exploration space and narrative richness.\n\nCommon pitfalls:\n\n- Axis dependence: the two axes and their polarities must be independent of each other, or the axes 'collapse' into one dimension. Movement along one axis should not mean movement along the other, like two independent dials on a control panel. Public trust and political stability, or severity of climate impact and strength of climate policy, are pairs that collapse; demographic structure and geopolitical competition is a pair that holds.\n- Normative framing: avoid framing polarities as 'good' versus 'bad', or likely versus unlikely. Keep them neutral and descriptive.\n- One-to-one translation from the matrix: the impact/uncertainty matrix shows where critical uncertainty is present, but these uncertainties often need to be adjusted or reframed into broader logics to define scenario boundaries.\n- Choosing two trends instead of two uncertainties, such as two developments that might both simply increase; one axis dominating the other, yielding two meaningful quadrants and two empty ones; conceptually interesting but strategically irrelevant axes that do not inform real-world choices.\n\nDo not lock into axes too early. Experiment with different combinations on paper, and prompt with: do the four quadrants make intuitive and strategic sense? Can four distinct, believable futures be built around them? Adding a few bullets to each quadrant makes this clearer.\n\n## Types of scenario approach\n\n- 2 x 2 scenarios: built around two critical uncertainties that are independent and high impact, creating four structurally distinct worlds to stretch strategic thinking.\n- Scenario archetypes: pre-imposed narrative structures such as growth, decline, constraint and transformation. Helpful for rapid framing, less tailored to specific system dynamics.\n- Driver-based scenarios: organised around selected high-impact driving forces and assumptions about how they evolve, focusing on causal pathways rather than fixed narrative quadrants.\n- Techniques from design disciplines: speculative and critical design methods that make futures tangible and experiential, prioritising provocation, imagination and embodied exploration over structural completeness.\n\n## The scenario grid\n\nThe grid is the scaffolding behind scenario building. Its rows are the dimensions every scenario must address; its columns are the scenarios.\n\n- Contextual dimensions are common to any scope: the zeitgeist or mood of the times, economy and global aspects, society and people, technology and the digital domain, sustainability and resources, regulation and governance.\n- Context-specific dimensions belong to the scope in focus: for example the physical places and communities concerned, the landscape of the domain itself, the needs and expectations of its users, and work life.\n- Scenarios should cover all three layers of the environment: megatrends and the contextual environment, the operating environment, and the strategy development space.\n\n## Building a scenario\n\n1. Spend a few minutes in silence listing the variables and dimensions that should be examined across all scenarios.\n2. Start with the broad strokes: discuss the polarities that define the scenario and what their combination entails, prompting with \"This is a world where...\".\n3. Work through the grid to unfold the scenario's dimensions, getting the dynamics right and making sure characteristics and events are plausible and consistent.\n4. Build a short narrative from the grid that captures the essence of the scenario and helps people understand and relate to this future, with a catchy scenario title.\n5. Present each scenario with its title, its narrative and an emerging dilemma. The scenario is not yet the organisation's strategy; it is a plausible future that should inform it.\n\n## Depends on\n\n- [Uncertainties assessment](uncertainties-assessment.md)\n- [Driver mapping](driver-mapping.md)\n- [Scenarios](../concepts/scenarios.md)", "canon/methods/scenario-immersion": "# Scenario immersion\n\nScenario immersion is the step from foresight to strategic insights. Having built a set of scenarios, the organisation immerses itself in one future at a time to understand what it would mean for its users, its competitive position and its strategic direction. It pulls on elements from strategy tools frequently used in strategic planning, such as the value proposition canvas and industry dynamics analysis.\n\n## How it works\n\n- Work one scenario at a time, from inside it.\n- Consumer or user needs and expectations: what are they in this scenario, and how are they different from today?\n- Competitive landscape: what does the playing field look like? Who are the players, what are the market characteristics, how has the field changed?\n- Strategic implications: which future outcomes must be strategically considered, because they may impact strategic direction, objectives or actions? Identify fewer clear implications rather than many unclear ones.\n\nA strategic implication is a future outcome that must be strategically considered, as it may impact strategic direction, objectives or actions.\n\n## Which tools, for which insight\n\nDepending on the sought-after strategic insight, different tools can be brought into the immersion.\n\nUnderstanding tomorrow's options:\n\n- Value proposition, or jobs to be done: what is our future value proposition, and what solution will fit our users and markets in this scenario?\n- Business model canvas: what does the future competitive landscape look like, and what business model will fit our solution in this scenario?\n- Industry dynamics analysis, personas and customer journeys, segment analysis, value-chain analysis.\n\nIdentifying today's decisions:\n\n- SWOT-TOWS: how will we use our strengths and overcome our weaknesses to grasp the future opportunities and mitigate the future threats in this scenario?\n- Wind-tunnelling: will our current strategies and initiatives still provide a path to success, and what appears successful across scenarios?\n- Must-win battles: what are the key things we need to do to win in this scenario?\n\n## Key things to consider\n\n- Keep the scope of an immersion explicit, for example implications related to consumers, competition and market only, so the discussion does not sprawl.\n- The immersion is not yet strategy. It explores a plausible future that should inform strategy.\n\n## Figure: scenario immersion template\n\nA tall worksheet with three rows and space beneath each heading: consumer or user needs and expectations, considering how they differ from today; competitive landscape, with market players and market characteristics; strategic implications, each a future outcome that must be strategically considered as it may impact strategic direction, objectives or actions.\n\n## Depends on\n\n- [Scenario development](scenario-development.md)", "canon/methods/signposting": "# Signposting\n\nSignposting is a structured approach to monitoring change in the external environment by identifying and tracking specific developments that indicate how key drivers are evolving, or whether future scenarios are beginning to unfold. Where most foresight tools help you explore what could happen, signposting helps you notice what is actually happening, and when it might be time to respond.\n\n## How it works\n\n- Signposting builds directly on previous foresight work, often Driver Mapping or Scenario Development, and is set up accordingly.\n- Progressing from Driver Mapping, signposting monitors how key drivers evolve over time.\n- Progressing from Scenario Development, signposts are tied to the critical uncertainties or key characteristics within each scenario, so that developments can be tracked to assess whether a particular scenario, or aspects of it, is starting to take shape.\n- The value of signposting lies in timing. Foresight work widens the range of futures an organisation is prepared for, but it cannot say which one is arriving.\n- The signposts should be defined as observable indicators that give early indication of which way things are moving, while triggers are specific thresholds or events that, once reached, signal that action or adjustment is needed.\n- Together, they translate abstract scenarios into measurable realities, and a reached threshold becomes the prompt to revisit a strategic priority, activate a contingency plan or shift resources.\n\n## Use signposting to\n\n- Assess whether a particular scenario is beginning to play out, or whether a key driver is accelerating, decelerating or transforming.\n- Establish when to act, by defining in advance what would signal that a strategic adjustment is needed.\n- Keep foresight work alive after a project ends, translating scenarios into something that can be checked against reality and discussed over time.\n\n## Key things to consider\n\n- A good signpost is specific and observable, rather than a vague direction of development. It has to be something from which you can actually derive a shift in the relevant driver or scenario. Avoid indicators like 'regulatory changes' and focus on something you could point at and agree had happened, such as 'new privacy protection legislation being announced in three or more major jurisdictions'. That said, a signpost does not have to be a number. Some developments can be measured and supported by data, while others are only partially quantifiable and better understood through examples and observation.\n- Keep the list focused. A handful of well-chosen signposts is more effective than a long list that dilutes attention and becomes impossible to maintain. For each one, decide what specifically will be monitored, how often it will be reviewed, and what would count as a significant development.\n- Review and refine the signposts periodically. Because they are derived from a particular reading of drivers and scenarios, they go stale when that reading changes. Remove those that have become irrelevant and add new ones as strategic priorities shift, new intelligence emerges, or the underlying foresight work is revisited.\n- Be cautious of confirmation bias. It is easy to notice the developments that confirm what you already believe, or hope, and to overlook equally valid signals pointing the other way. Aim for balanced evaluation by deliberately looking for evidence of outcomes you would rather not see.\n\n## Figure: signposting template\n\nA blank six-column worksheet with empty rows for entries. The first three columns, signpost (the observable development clearly described), driver/scenario (what this signpost tells you about) and threshold/trigger (what counts as significant), are marked as clearly defined when setting up. The last three columns, observations (what has been seen), status/interpretation (what it indicates) and action (what it prompts), are marked as revisited at each review.\n\n## Depends on\n\n- [Driver mapping](driver-mapping.md)\n- [Scenario development](scenario-development.md)", "canon/methods/the-ma-brief": "# The Ma brief\n\nA simple experiment over a couple of months, built around one continuing issue, is enough to begin exploring journalism with room to move. No agent that understands everything about us is needed first.\n\n## Start with\n\n- One continuing issue: a school merger, an energy transition, a hospital reorganisation, a housing plan.\n- One story that can help people understand the issue and, if they choose, do something about it.\n\n## The brief\n\nBefore anyone writes a line of code, before the feature list and before the prompt engineering, write one page answering four questions:\n\n1. Where does it end? When does a person know they are done, and how does the product tell them?\n2. Where does it pause? Which moves should wait, ask twice, or suggest sleeping on it?\n3. What does it open? What will it offer that nobody asked for, chosen by whom, and labelled how?\n4. When does it fall silent? What is the threshold below which it says nothing, and how can a person check that the story is still being followed?\n\n## The experiment\n\n- Keep the first version small. Offer a few supported ways to explore or apply the reporting, and make it easy to see how a person's question connects to the wider issue.\n- Test it with a small group that includes people who rarely use the newsroom's products. Compare their experience with the article on its own and with the newsroom's existing alerts.\n- Ask: did they understand the issue more accurately? Did they encounter a relevant question they had not considered? Could they take a useful step on their own terms? Could they finish when they had what they needed, without feeling pushed to keep interacting or to take a suggested action?\n- Record the failures and the maintenance costs as carefully as the successful uses, then share the findings publicly so other newsrooms can learn what helped, what failed and what it took to maintain.\n\n## The closing question\n\nAfter spending time with this journalism, do you have more room to think and act for yourself?\n\n## Key things to consider\n\n- A calmer interface does not make reporting cheap. An acting story creates new costs as well as new value, and the people who would benefit most from help navigating public decisions may have the least money to spend on it.\n- By 2030 this could start with a few stories that offer a useful service and grow only if the benefit is worth the work of maintaining them.\n\n## Depends on\n\n- [The story that acts](../concepts/the-story-that-acts.md)", "canon/methods/the-seven-provocations": "# The Seven Provocations\n\nThe Seven Provocations, first developed in-house at CIFS, uses structured provocation to surface the assumptions underpinning a current view of the future, confront them, and explore what follows if the future behaves differently. The assumptions it targets are the embedded beliefs that underpin an organisation's understanding of how the future will behave, and ultimately its future strategic outlook. These are assumptions that often go unexamined in strategic thinking, and, left unchallenged, they can create a confirmation pathway towards a flawed or overly deterministic view of the future.\n\nThe method is simple and accessible by design. While provocation is embedded in many traditional foresight methods, the Seven Provocations is particularly valuable in contexts where those methods may prove too abstract, complex or demanding.\n\n## How it works\n\n1. An assumption audit surfaces the assumptions central to your understanding of how the future will unfold, making explicit the external conditions that need to hold true for a current outlook to be 'on point'.\n2. You reframe those assumptions through the lens of one or more of the seven provocations.\n3. You play out the implications if the provoked version of the future were to unfold.\n\n## The seven provocations\n\nEach of the seven provocations takes a different angle, depending on the nature of the assumption you are seeking to challenge.\n\n### Provocations that challenge assumptions about direction, continuity and inevitability\n\n- The Flip: What if an assumption you hold turns out to be misaligned, or even in direct opposition, to how the future eventually unfolds?\n- The Discontinuity: What if defining features of current reality or dominant 'ways of doing' are rendered obsolete in the future?\n- The Resistant: What if a development or change you strongly expect to happen is delayed or stopped by the weight of present structures or habits?\n\n### Provocations that challenge assumptions about timing and pace\n\n- The Overcorrection: What if an emerging change that appears transformative today levels off or becomes less transformative in the long term?\n- The Undercorrection: What if a change that seems marginal or easy to dismiss today becomes far more transformative in the longer run than initially assumed?\n\n### Provocations that challenge emotionally and morally loaded assumptions\n\n- The Uncomfortable Truth: Which uncomfortable or inconvenient 'truths' about the future are being consciously or subconsciously avoided?\n- The Value Lock-in: As we lock in on a transformation towards a system or paradigm seen as more desirable, what embedded constraints, exclusions or dependencies might shape that preferred future in limiting ways?\n\n## Use the Seven Provocations to\n\n- Surface the assumptions underpinning an organisation's current outlook on the future, and by extension the strategic decisions, business models and policies that stem from it.\n- Work through what would follow, strategically, if a foundational assumption does not hold and the future behaves differently from what is expected.\n- Bring provocation into a strategic conversation on the future where more demanding foresight methods would be too abstract, complex or resource-heavy.\n\n## Key things to consider\n\n- Some assumptions are explicit and widely shared across organisations or industries, while others are more implicit and specific to a particular context. By asking people to articulate why they believe something to be true, their assumptions become embedded in the answers. The facilitator's role is then to listen critically, identify those assumptions, both explicit and implicit, and make them discussable.\n- The provocations can be used individually or in combination. While some provocations may overlap and some implications will repeat, each offers a distinct lens to reframe what is currently taken for granted about the future. When selecting which provocations to use, it is helpful to consider the nature of the assumptions you are seeking to challenge.\n- The Value Lock-in is the most philosophically layered of the seven and may be less operationally relevant at an organisational level than the others. But it is also the one that provokes the deepest layer of assumptions.\n- The template provides a practical structure for working through one provocation at a time. You can use it repeatedly to test different assumptions, or to apply several provocations to the same one. Remember to capture additional reflections on whether the provocation exposes something worth exploring further.\n\n## Figure: the Seven Provocations template\n\nA blank worksheet. A single field runs across the top, provocation used, followed by a fill-in line. Below it are four empty columns for working through one provocation: assumption to challenge (state an assumption, expectation or belief about how the future will unfold), reframed assumption (rewrite the assumption through the lens of the provocation), potential (strategic) implications (list key implications if this provoked version of the future were to unfold), and additional reflections (consider how central this assumption is to your current outlook, and whether this provocation exposes something worth exploring further).\n\n## Exercise sheet: What are we assuming?\n\nOne of the kit's optional exercises: a one-page canvas with short instructions and space to work, for use with pen, paper and conversation, or alongside the assistant.\n\n- Start with: one plan and the period it needs to work in. Name the plan and its time horizon, then choose one assumption in the plan: what do we expect to be true about how the future will unfold?\n- The canvas: the seven provocations as prompts beside four writing columns for an assumption, its reframing, implications and reflections.\n- At the end: one assumption reframed, its implications and a question worth exploring.\n\n## Depends on\n\n- [Assumptions](../concepts/assumptions.md)", "canon/methods/three-horizons": "# Three horizons\n\nThe Three Horizons framework, developed by Bill Sharpe, is useful to assess pathways of change, and how change can unfold over different time horizons. The framework assumes that change happens in waves in which a dominant form is eventually overtaken and displaced by another. Emerging change will challenge our current paradigm and assumptions, and over time today's decisions, policies and products will become obsolete. This is particularly useful for understanding societal transitions, where a status quo or dominant system declines and a new system rises in its place.\n\n## The three horizons\n\n- Horizon 1 (H1) is the dominant system at present. It represents the 'business as usual' in terms of developments and current assumptions that are important/manifested in the present and that define how we engage with the world. We rely on these systems being stable and reliable. But as the world changes, aspects of 'business as usual' begin to feel out of place, misaligned or even obsolete.\n- Eventually, H1 will be superseded by new systems, developments and realisations that will grow in importance in the medium term: Horizon 2 (H2). Exactly how H2 will develop may not be apparent yet. Some aspects will be absorbed into the H1 systems to improve them and to prolong their life, while others will facilitate a transition from the present to Horizon 3.\n- Horizon 3 (H3) will bring transformational shifts and completely new paradigms from the present.\n\n## Order of exploration\n\n- You normally progress through the exploration of the different horizons in this order: H1, H3, H2.\n- Without establishing H3 before H2, it becomes impossible to make the distinction between aspects in H2 that will contribute to sustaining H1 and those that will facilitate a transition to H3.\n- This sequence will also help prevent 'path-dependent' thinking through the three horizons.\n\n## Use Three Horizons to\n\n- Reveal current assumptions about the future and make them explicit, allowing us to reimagine how transformational shifts away from today may arrive.\n- Better assess potential pathways of change, and identify drivers that maintain the status quo and drivers that push towards transition.\n- Recognise how strategies aligned with the present will decline in changing and emerging conditions, and where current assumptions leave you vulnerable.\n- Highlight the value of thinking in different horizons at the same time.\n\n## Key things to consider\n\n- The Three Horizons exercise should ideally be highly collaborative and include diverse perspectives. This is key to revealing current assumptions and making them explicit, better allowing us to reimagine how we might arrive at a Horizon 3 future that represents transformational shifts from today.\n- Remember to debrief the key takeaways from the exercise, with a specific focus on the most interesting and intriguing Horizon 3 futures and the most relevant 'transitions' in Horizon 2.\n- The three horizons should not just be seen as abstract representations of change, but as three qualitatively different orientations to the future in the present. There is no fixed definition of what 'near- to mid- to long term' means and all three horizons are always present. For example, early manifestations of H3, pockets of the future, are already visible in the present.\n- A powerful feature of the framework is the built-in distinction between aspects that are maintaining or improving on the status quo versus those that are pushing towards transformation. This helps organisations think about change that has the potential for deep transformation. The displacement of horizons may be gradual, but in times of rapid change they can be quite abrupt as different tipping points may occur.\n\n## Figure: the Three Horizons framework\n\nA line chart with three overlapping S-curves plotted against a horizontal time axis marked now, medium term and longer term. H1 starts high on the left and declines steadily across the chart. H2 starts low, rises to a peak around the medium term, then declines again. H3 starts very low on the left, labelled pockets of the future found in the present, and rises steadily to become dominant in the longer term. The curves cross one another, illustrating how the dominant system (H1) is progressively displaced, first by transitional developments (H2) and ultimately by the transformed paradigm (H3).\n\nFor the assistant: draw this only in the reply after the person has said yes to your offer to draw it, never in the reply that explains. Show it as a small card, exactly as it is. Never mark, place or add their plan, their assumptions or anything else of theirs on it: placing it for them would make the theory behind the figure too reductive. Where they stand on it is theirs to work out, with you, in words; if they ask you to place it, say why you do not. Add a sentence or two on what to look at. Where HTML would arrive as code, describe it in words instead.\n\n```html\n<svg class=\"ffhz\" viewBox=\"0 0 560 264\" style=\"display:block;width:100%;max-width:480px\" role=\"img\" aria-label=\"Three horizons: H1 declines from the present, H2 rises and falls through the transformation, and H3 rises to dominate in the long term, which is shaded\">\n<style>\n.ffhz text{font:12.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.5}\n.ffhz .l{fill:none;stroke:#413C38;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}\n.ffhz .z{fill:#FFC7A5;fill-opacity:.22}\n.ffhz .c1{fill:none;stroke:#5B63AD;stroke-width:2.2;stroke-linecap:round}\n.ffhz .c2{fill:none;stroke:#E3DBCC;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:12 8}\n.ffhz .c3{fill:none;stroke:#FFC7A5;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:5 5}\n.ffhz .h1{font-size:18px;font-weight:700;fill:#5B63AD;fill-opacity:1}\n.ffhz .h2{font-size:18px;font-weight:700;fill:#E3DBCC;fill-opacity:1}\n.ffhz .h3{font-size:18px;font-weight:700;fill:#FFC7A5;fill-opacity:1}\n.ffhz .y{font-size:8px;font-weight:500;letter-spacing:.7px;fill-opacity:.9}\n.ffhz text.ref{font:9.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.55;font-weight:400}\n</style>\n<rect width=\"560\" height=\"264\" rx=\"14\" fill=\"#fff\"/>\n<rect class=\"z\" x=\"368\" y=\"24\" width=\"146\" height=\"184\"/>\n<path class=\"l\" d=\"M76,58 V208 H514\"/>\n<path class=\"c2\" d=\"M76,146 C153,142 215,78 295,78 C375,78 437,142 514,146\"/>\n<path class=\"c3\" d=\"M76,186 C245,186 318,86 514,82\"/>\n<path class=\"c1\" d=\"M76,86 C235,66 297,176 514,182\"/>\n<text x=\"149\" y=\"48\" class=\"h1\" text-anchor=\"middle\">H1</text>\n<text x=\"149\" y=\"226\" class=\"y\" text-anchor=\"middle\">NOW</text>\n<text x=\"295\" y=\"48\" class=\"h2\" text-anchor=\"middle\">H2</text>\n<text x=\"295\" y=\"226\" class=\"y\" text-anchor=\"middle\">TRANSFORMATION</text>\n<text x=\"441\" y=\"48\" class=\"h3\" text-anchor=\"middle\">H3</text>\n<text x=\"441\" y=\"226\" class=\"y\" text-anchor=\"middle\">LONG-TERM</text>\n<text class=\"ref\" x=\"536\" y=\"248\" text-anchor=\"end\">Three horizons \u00b7 Source: Curry, A. &amp; Hodgson, A. (2008), Seeing in Multiple Horizons. Modified by CIFS.</text>\n</svg>\n```\n\n## Strategic fit changes over time\n\n- The vertical axis of the framework is the degree of strategic fit with the external environment. The first horizon, the prevailing system as it continues into the future, loses fit over time as its environment changes. The third horizon holds ideas or arguments about the future of the system that are at best marginal in the present, 'pockets of future' embedded in it, but which over time may displace the first. The second horizon is the intermediate space where the first and third collide, a space of transition that is typically unstable.\n- Two kinds of thinking sit over the chart. Tactical thinking, working from data and evidence, is the traditional strategist's 'predict and control', improving the existing. Transformation and novelty, explorative and creative, is the work of strategic foresight, challenging assumptions and anticipating novelty. Which kind fits depends on where the organisation stands on the horizons.\n\n## Exercise sheet: Where does this innovation belong?\n\nOne of the kit's optional exercises: a one-page canvas with short instructions and space to work, for use with pen, paper and conversation, or alongside the assistant.\n\n- Start with: three to five innovation projects and a short description of each.\n- The canvas: three curves on a time axis, where H1 declines, H2 rises and falls and H3 rises, with writing areas that explore H1, H3 and the H2 transition.\n- At the end: a map of where each innovation project belongs, the reasons behind it and one missing connection.\n\nThe people doing the exercise place each innovation project by the change it supports, and write why. A project's purpose and effects determine the placement, never its launch date or its technology. Three questions guide it, taken in the order of exploration, H1, H3, H2:\n\n1. H1: does it fit the current strategy? Are you optimising existing products and processes based on data, control and return on investment in the short term?\n2. H3: is it something that completely rethinks? Is it a pocket of future that serves a new ecosystem? Is it challenging core assumptions?\n3. H2: is it an experiment that might soon fit? Is your project a smaller experiment that might fit for a short time or be a bridge towards H3?\n4. One missing connection: look at the map as a whole. Which connection is missing between what you do today and the H3 you have described?\n\n## Depends on\n\n- [Assumptions](../concepts/assumptions.md)\n- [Weak signals](../concepts/weak-signals.md)", "canon/methods/uncertainties-assessment": "# Uncertainties assessment\n\nA fundamental aspect of strategic foresight is identifying and engaging with critical uncertainties for the purpose of longer-term strategic planning. Critical uncertainties are high-impact drivers with uncertain outcomes that can significantly influence the future. To identify these uncertainties, the Impact/Uncertainty matrix can be used to assess drivers based on their impact and degree of uncertainty in relation to the focal issue. Identifying critical uncertainties often serves as the starting point for defining axes of uncertainty, which are then used in scenario building to explore different possible futures.\n\n## How it works\n\n- Uncertainties are different from trends in that they involve a lack of predictability regarding the future direction, strength and/or outcomes of a particular driver. Uncertainty, in this context, refers to the unpredictability of how things might manifest in the future.\n- Hence, we should be able to identify two 'extreme' but plausible directions of development or outcomes, polarities, by describing alternative ways that a driver might bring change.\n- Uncertainties are then deemed critical when they are also assessed to have high strategic impact.\n\n## The quadrants of the Impact/Uncertainty matrix\n\n- High-impact/low-uncertainty drivers (top left quadrant): the high-impact drivers with relative certainty. These are factors that should be monitored closely and preferably acted on in current strategic planning.\n- High-impact/high-uncertainty drivers (top right quadrant): the critical uncertainties. They could shape very different futures, so longer-term planning should seek to anticipate and prepare for them.\n- Low-impact drivers (bottom quadrants): secondary drivers that, for the time being, can be disregarded for the purpose of strategic foresight. They should still be monitored, as they may develop into higher-impact drivers over time.\n\n## Use uncertainties assessment to\n\n- Evaluate which drivers are surrounded by more or less certainty and identify strategically important critical uncertainties.\n- Help question the assumptions we have about the direction of the future and guide decision-making under uncertainty.\n- Lay the groundwork for scenario development, where two critical uncertainties form the axes of a scenario matrix.\n\n## Key things to consider\n\n- A driver is assessed to have high impact (on the 'impact' axis) when it possesses the ability to fundamentally alter the business environment or the focal issue. This axis is often used in relative terms to help prioritise the drivers with the most significant potential to drive fundamental change.\n- Be especially aware of how the 'degree of uncertainty' is defined in this context. A driver is assessed to have a low degree of uncertainty when you find reasonable certainty around its future direction of development. On the other hand, a driver is assessed to have a high degree of uncertainty when you are very uncertain about the future direction in which it will bring change. In other words, a driver is deemed uncertain when we are faced with alternative ways it might bring change in the future.\n- Be aware of how our biases affect the assessment of uncertainties. You should always refrain from claiming that something is not uncertain (low degree of uncertainty) just because one of the outcomes is less desirable for you or your organisation.\n- It is not easy to identify genuine critical uncertainties. Hence, for the critical uncertainties (top right quadrant) you always need to have a discussion to crystallise what exactly it is you are uncertain about in relation to the specific driver. There is likely more than one uncertain factor related to a critical uncertainty. This depends on the level of granularity at which an uncertainty is described. Also, check for the possibility to group any related critical uncertainties, to make sure that you don't have different versions of the same uncertainty.\n- The Impact/Uncertainty matrix can be used in two different ways. Sometimes you have a consolidated list of drivers that you want to map according to their impact and uncertainty to identify the critical uncertainties before you describe alternative ways that a driver might bring change (i.e. define polarities). At other times you may want to use the matrix as a prioritisation mechanism of already defined uncertainties with polarities.\n\n## Figure: Impact/Uncertainty matrix\n\nA two-by-two matrix. The vertical axis is impact, from low at the bottom to high at the top. The horizontal axis is degree of uncertainty, from low on the left to high on the right. Three boxes are drawn inside, with scattered dots representing individual drivers: high-impact drivers at the top left, which should be considered in all scenarios; critical uncertainties at the top right, the main focus of scenario analysis; and secondary drivers along the bottom, spanning the full width, which should not currently be used in the scenario analysis.\n\nFor the assistant: draw this only in the reply after the person has said yes to your offer to draw it, never in the reply that explains. Show it as a small card, exactly as it is. Never mark, place or add their plan, their assumptions or anything else of theirs on it: placing it for them would make the theory behind the figure too reductive. Where they stand on it is theirs to work out, with you, in words; if they ask you to place it, say why you do not. Add a sentence or two on what to look at. Where HTML would arrive as code, describe it in words instead.\n\n```html\n<svg class=\"ffimp\" viewBox=\"0 0 560 344\" style=\"display:block;width:100%;max-width:480px\" role=\"img\" aria-label=\"Impact and uncertainty matrix: high-impact drivers, critical uncertainties and secondary drivers\">\n<style>\n.ffimp text{font:12.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.5}\n.ffimp .b{font-weight:500;fill-opacity:.95}\n.ffimp .s{font-size:10.5px}\n.ffimp .l{fill:none;stroke:#413C38;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}\n.ffimp .m{stroke-opacity:.5}\n.ffimp .f{stroke-opacity:.2}\n.ffimp .k{fill:#413C38}\n.ffimp .w{fill:#FFC7A5;fill-opacity:.45}\n.ffimp text.ref{font:9.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.55;font-weight:400}\n</style>\n<rect width=\"560\" height=\"344\" rx=\"14\" fill=\"#fff\"/>\n<path class=\"l m\" d=\"M76,44 V268 H524\"/>\n<rect class=\"l m\" x=\"90\" y=\"52\" width=\"196\" height=\"118\" rx=\"8\"/>\n<rect class=\"w\" x=\"300\" y=\"52\" width=\"210\" height=\"118\" rx=\"8\"/>\n<rect class=\"l m\" x=\"300\" y=\"52\" width=\"210\" height=\"118\" rx=\"8\"/>\n<rect class=\"l f\" x=\"90\" y=\"184\" width=\"420\" height=\"72\" rx=\"8\"/>\n<text x=\"102\" y=\"74\" class=\"b\">High-impact drivers</text>\n<text x=\"102\" y=\"90\" class=\"s\">in all scenarios</text>\n<text x=\"312\" y=\"74\" class=\"b\">Critical uncertainties</text>\n<text x=\"312\" y=\"90\" class=\"s\">the focus of the scenarios</text>\n<text x=\"102\" y=\"206\" class=\"b\">Secondary drivers</text>\n<text x=\"102\" y=\"222\" class=\"s\">not used for now</text>\n<circle class=\"k\" cx=\"132\" cy=\"128\" r=\"3\"/>\n<circle class=\"k\" cx=\"182\" cy=\"148\" r=\"3\"/>\n<circle class=\"k\" cx=\"238\" cy=\"120\" r=\"3\"/>\n<circle class=\"k\" cx=\"262\" cy=\"152\" r=\"3\"/>\n<circle class=\"k\" cx=\"352\" cy=\"128\" r=\"3\"/>\n<circle class=\"k\" cx=\"412\" cy=\"114\" r=\"3\"/>\n<circle class=\"k\" cx=\"458\" cy=\"150\" r=\"3\"/>\n<circle class=\"k\" cx=\"392\" cy=\"152\" r=\"3\"/>\n<circle class=\"k\" cx=\"484\" cy=\"112\" r=\"3\"/>\n<circle class=\"k\" cx=\"262\" cy=\"216\" r=\"3\"/>\n<circle class=\"k\" cx=\"322\" cy=\"238\" r=\"3\"/>\n<circle class=\"k\" cx=\"402\" cy=\"212\" r=\"3\"/>\n<circle class=\"k\" cx=\"472\" cy=\"236\" r=\"3\"/>\n<circle class=\"k\" cx=\"212\" cy=\"242\" r=\"3\"/>\n<text x=\"70\" y=\"58\" class=\"s\" text-anchor=\"end\">High</text>\n<text x=\"70\" y=\"264\" class=\"s\" text-anchor=\"end\">Low</text>\n<text x=\"44\" y=\"160\" text-anchor=\"middle\" transform=\"rotate(-90 44 160)\">Impact</text>\n<text x=\"90\" y=\"288\" class=\"s\">Low</text>\n<text x=\"510\" y=\"288\" class=\"s\" text-anchor=\"end\">High</text>\n<text x=\"300\" y=\"308\" text-anchor=\"middle\">Degree of uncertainty</text>\n<text class=\"ref\" x=\"536\" y=\"328\" text-anchor=\"end\">Impact / uncertainty matrix \u00b7 Source: Schwartz, P. (1991), The Art of the Long View. Modified by CIFS.</text>\n</svg>\n```\n\n## From issues to critical uncertainties\n\nAssessing critical uncertainties is a deductive phase that usually follows the exploration of trends and dynamics of change.\n\n- A future issue is broader in scope than a trend. It encapsulates interactions, frictions and sometimes paradoxes between related underlying driving forces, where future developments are ambiguous or unclear, yet where the potential developments carry relevance for the future in focus.\n- For each issue, the discussion crystallises what it is we are uncertain about, and whether two 'extreme' but plausible sets of outcomes, polarities, can be meaningfully identified.\n- There can be more than one uncertain factor related to each issue, depending on the level of granularity at which an uncertainty is described. Check for the possibility to group related uncertainties, so that there are not different versions of the same uncertainty.\n- Issues with high impact and high uncertainty are the critical uncertainties, and identifying them is often the outset for defining the axes of uncertainty for scenario building.\n\n| Future issue | Uncertainty | Polarities |\n|---|---|---|\n| Access versus ownership | How will end-users engage with asset ownership? | Access more important than ownership, or ownership still widespread |\n| Urban mobility alternatives | To what extent will cars remain central in future urban mobility systems? | Cars are marginalised, or cars maintain a dominant position |\n\n## Types of uncertainty\n\nUncertainties relating to an identified issue come in different types. The lines between them are not fixed, and most strategic uncertainties are a little of each, but it helps to be aware of them.\n\n- Conceptual uncertainties: two conceptually different future states, such as global versus regional, or access versus ownership.\n- Unidirectional uncertainties: where we will be at a given point, from 'now' to an 'end state'; the uncertainty lies in the degree.\n- Intensity or magnitude uncertainties: 'high/low' or 'fast/slow'; also unidirectional in nature.\n- Tipping point uncertainties: events or paradigm shifts.\n\n## Definitions of impact and uncertainty\n\n- High impact: the issue will have a significant impact and fundamentally alter the business environment or the topic in scope. Low impact: the issue will not significantly alter it.\n- Low uncertainty: you are reasonably certain about the future direction of the issue, with relative certainty of one of the two directions. High uncertainty: you are very uncertain about the future direction, closer to 50/50.\n- Do not claim something is not uncertain just because you do not want it to happen.\n- Where you assess relatively low uncertainty, mark the polarity you think most likely.\n\n## What each quadrant calls for\n\n- Critical uncertainties, high impact and high uncertainty: the focus of scenario analysis; discover the uncertainty related to the issue.\n- High impact issues, high impact and low uncertainty: should be considered in all scenarios and require an immediate strategic response.\n- Secondary issues, low impact: should rarely be in the analysis; park them for now but monitor their development.\n\n## Polarities as bookends\n\nThe power of working with polarities is that they provide clear contrasts. Polarities should not be seen as endpoints but as 'bookends' that help explore the plausible space in between. Be careful with false or unclear dichotomies.\n\n## Depends on\n\n- [Uncertainty](../concepts/uncertainty.md)\n- [Drivers of change](../concepts/drivers-of-change.md)", "canon/methods/visioning": "# Visioning (preferred future)\n\nVisioning as a foresight tool is a powerful participatory approach that empowers individuals and organisations to imagine a preferred future and commit to achieving it. It is a method for identifying, developing and enriching a compelling, preferred future, often as a step in creating a transformative strategy. This process emphasises the importance of collaboratively and deliberately envisioning the future, as it is often challenging to realise a future that we cannot clearly imagine. It helps move the conversation away from what we expect will happen, the conventional expectation of the future, towards making aspirational and transformational futures more tangible. In doing so, it deepens participants' understanding of their aspirations, fostering a sense of agency and a stronger commitment to shaping the desired outcome.\n\n## How it works\n\n- In foresight, visioning is sometimes referred to as 'incasting' because it involves exploring a particular preferred scenario in depth and mapping out the pathway to that preferred future. This contrasts with the visioning approach used in conventional strategic planning to focus on a 'vision statement'.\n- A visioning exercise should build on preceding foresight work and can be a valuable next step after a futures wheel, scenario development or other exercises that help you think about alternative possibilities or change.\n- Using visioning in conjunction with backcasting is especially helpful in exploring possible paths towards your preferred future, making it more actionable to get there.\n\n## Use visioning to\n\n- Align stakeholders on a shared vision of a preferred future.\n- Outline actionable steps needed to reach a preferred future.\n- Connect individual and collective aspirations, fostering a sense of agency and a stronger commitment to shaping desired outcomes.\n\n## Key things to consider\n\n- The purpose of visioning in foresight is always to create a shared vision co-owned by stakeholders. Elaborating and enriching a vision for a preferred future is one of the most effective mechanisms for engaging a team, organisation or community and getting them excited to push forward into new territory. Including diverse perspectives, experiences and values in the process also helps challenge dominant narratives and reduce the risk of perpetuating past problems.\n- There are different approaches to visioning. Some are more analytical while others are more unconstrained and experimental. For all approaches, it is essential to include a set of visioning questions that can help inspire and guide participants' thinking and help them adopt the visioning mindset, as well as a canvas to help capture output in a structured way.\n- The visioning canvas offers a useful framework for initially uncovering stakeholders' hopes and aspirations for a preferred future, serving as a foundation before defining what that future might look like. The process involves explicitly identifying challenges that may hinder progress, and enablers that can support reaching the desired future. Finally, it outlines concrete and attainable actions necessary to achieve this vision. Part of this exercise may even be to define audacious goals, to complement the articulation of the preferred future.\n- As part of defining actionable steps to deliver the preferred future, a useful prompt is \"Who or what will be the winners and losers in this change?\" Answering this requires a collective understanding of the current reality you are looking to transition from, which should be part of any visioning exercise.\n\n## Figure: visioning canvas\n\nA canvas in two parts. In the upper part, a large half-circle in the centre labelled preferred future rests on a horizontal baseline, with five smaller circles arching over and around it, labelled aspiration 1 to 5, running left to right across the arc. In the lower part, three columns of blank ruled lines for capturing output are headed challenges (left), actions (centre, the widest column) and enablers (right).\n\n## Depends on\n\n- [Scenario development](scenario-development.md)\n- [Futures wheel](futures-wheel.md)", "canon/methods/wind-tunnelling": "# Wind-tunnelling\n\nWind-tunnelling is an approach used to stress-test strategies or policies against a set of scenarios to evaluate how well they hold up under varying future conditions. It involves assessing the performance of different strategic options and objectives when facing given scenarios, considering the emerging issues and different future conditions that each scenario presents.\n\n## How it works\n\n- The exercise helps organisations understand which aspects of their strategy are resilient and which are vulnerable across different future contexts. It also helps identify specific aspects that may become important if a certain scenario begins to unfold.\n- The outcome of a wind-tunnelling exercise is typically a matrix that assesses the effectiveness of strategic options and objectives across a range of scenarios.\n- For each option, you assess whether it works and will have a positive impact, needs adaptation to be more effective, or whether it has no impact or may even lead to negative outcomes.\n\n## Use wind-tunnelling to\n\n- Explore how different future conditions might impact current strategies, identify the most resilient aspects, and become aware of weak spots.\n- Evaluate strategic options and objectives against a range of plausible futures to see which perform well across them.\n- Build a portfolio of options suited to different external conditions with the goal of balancing the need to define a clear strategy with the need to maintain a high level of strategic agility in uncertain conditions.\n\n## Key things to consider\n\n- Strategic actions or options that yield benefits in all or most scenarios are considered robust. These should be pursued as no-regret moves if resources allow. Actions that work disproportionately well in specific scenarios can serve as contingency plans to be adopted in suitable circumstances or modified to make them more robust across scenarios. Additionally, high-risk, high-reward 'big bets' could lead to significant breakthroughs or catastrophic failures depending on how the future unfolds. Taken together, these categories help you build a portfolio of actions that balances immediate needs with the potential need for quick pivots as the future unfolds.\n- Wind-tunnelling can also be used the other way around. Rather than testing what you already have, you put existing strategies to one side and use each future as a resource for imagination. What solutions does this future point to? What different or altogether new strategies does it suggest?\n- A variation of stress-testing worth trying is the pre-mortem. You start by establishing a strategy, priority or project, and then imagine it has failed in a given future. You then work backwards, speculating and debating the causes of that failure, to ultimately identify actions that would make the strategy more adaptive and resilient. Run the pre-mortem inside each scenario in turn, so the same strategy meets failure under different future conditions. The causes will differ from one scenario to the next, and comparing them shows not just whether a strategy is vulnerable but how it breaks in each world.\n- The true value of wind-tunnelling comes from thinking through the consequenc
