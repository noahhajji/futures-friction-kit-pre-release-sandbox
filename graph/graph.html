es of an uncertain future and asking the question \"What if this future happens?\" Engaging a diverse set of stakeholders ensures a broader range of perspectives and helps identify strategic blind spots.\n\n## Figure: wind-tunnelling matrix\n\nA matrix with strategic options as rows and scenarios as columns. Each cell holds a dot indicating how the option performs in that scenario: a filled dot for positive impact in the specific scenario, a peach dot for needs adaptation in the specific scenario, and an open dot for negative impact or counter-productive in the specific scenario. In the example shown, option 1 is positive in scenarios A and B, needs adaptation in C and is negative in D; option 2 is positive in all four; option 3 is negative in A, B and C and positive in D.\n\nFor the assistant: draw this only in the reply after the person has said yes to your offer to draw it, never in the reply that explains. Show it as a small card, exactly as it is. Never mark, place or add their plan, their assumptions or anything else of theirs on it: placing it for them would make the theory behind the figure too reductive. Where they stand on it is theirs to work out, with you, in words; if they ask you to place it, say why you do not. Add a sentence or two on what to look at. Where HTML would arrive as code, describe it in words instead.\n\n```html\n<svg class=\"ffwnd\" viewBox=\"0 0 560 310\" style=\"display:block;width:100%;max-width:480px\" role=\"img\" aria-label=\"Wind-tunnelling matrix: three options tested against four scenarios, each cell positive, needing adaptation or negative\">\n<style>\n.ffwnd text{font:12.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.5}\n.ffwnd .b{font-weight:500;fill-opacity:.95}\n.ffwnd .l{fill:none;stroke:#413C38;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}\n.ffwnd .m{stroke-opacity:.5}\n.ffwnd .f{stroke-opacity:.2}\n.ffwnd .k{fill:#413C38}\n.ffwnd .o{fill:#FFC7A5;stroke:#413C38;stroke-opacity:.5;stroke-width:.75}\n.ffwnd text.ref{font:9.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.55;font-weight:400}\n</style>\n<rect width=\"560\" height=\"310\" rx=\"14\" fill=\"#fff\"/>\n<text x=\"262\" y=\"54\" text-anchor=\"middle\">Scenario A</text>\n<text x=\"340\" y=\"54\" text-anchor=\"middle\">Scenario B</text>\n<text x=\"418\" y=\"54\" text-anchor=\"middle\">Scenario C</text>\n<text x=\"496\" y=\"54\" text-anchor=\"middle\">Scenario D</text>\n<path class=\"l f\" d=\"M40,75 H520 M40,125 H520 M40,175 H520 M40,225 H520\"/>\n<text x=\"40\" y=\"104\" class=\"b\">Option 1</text>\n<circle class=\"k\" cx=\"262\" cy=\"100\" r=\"7\"/>\n<circle class=\"k\" cx=\"340\" cy=\"100\" r=\"7\"/>\n<circle class=\"o\" cx=\"418\" cy=\"100\" r=\"7\"/>\n<circle class=\"l m\" cx=\"496\" cy=\"100\" r=\"7\"/>\n<text x=\"40\" y=\"154\" class=\"b\">Option 2</text>\n<circle class=\"k\" cx=\"262\" cy=\"150\" r=\"7\"/>\n<circle class=\"k\" cx=\"340\" cy=\"150\" r=\"7\"/>\n<circle class=\"k\" cx=\"418\" cy=\"150\" r=\"7\"/>\n<circle class=\"k\" cx=\"496\" cy=\"150\" r=\"7\"/>\n<text x=\"40\" y=\"204\" class=\"b\">Option 3</text>\n<circle class=\"l m\" cx=\"262\" cy=\"200\" r=\"7\"/>\n<circle class=\"l m\" cx=\"340\" cy=\"200\" r=\"7\"/>\n<circle class=\"l m\" cx=\"418\" cy=\"200\" r=\"7\"/>\n<circle class=\"k\" cx=\"496\" cy=\"200\" r=\"7\"/>\n<circle class=\"k\" cx=\"46\" cy=\"258\" r=\"6\"/>\n<text x=\"58\" y=\"262\">Positive</text>\n<circle class=\"o\" cx=\"138\" cy=\"258\" r=\"6\"/>\n<text x=\"150\" y=\"262\">Needs adaptation</text>\n<circle class=\"l m\" cx=\"284\" cy=\"258\" r=\"6\"/>\n<text x=\"296\" y=\"262\">Negative or counter-productive</text>\n<text class=\"ref\" x=\"536\" y=\"294\" text-anchor=\"end\">Wind-tunnelling matrix \u00b7 Source: CIFS (2026), Toolkit for Applied Strategic Foresight.</text>\n</svg>\n```\n\n## Scenario-tested and scenario-led strategy\n\n- Most organisations already have a strategy and a portfolio of initiatives and responses. The strategy-forward approach evaluates current strategies, initiatives, products, services, projects and risk responses against the set of scenarios, to see whether they still provide a path to success. This is wind-tunnelling.\n- The future-back approach puts existing strategies to one side and starts from the scenarios, using each future as a resource for imagination: what solutions does this future indicate, what different or altogether new strategies does it suggest? In practice the two approaches are often blended.\n\n## Decisions for robustness\n\n- No-regret moves largely deliver benefits across all scenarios, regardless of how the future unfolds. These are typically implemented immediately.\n- Options are largely geared toward offering benefits in some, but not all, scenarios. They can be scaled up or down and adjusted as conditions evolve, enabling faster pivots from the current strategy to another that has been pre-developed.\n- Big bets are bold, high-stakes decisions that rely on strong convictions about specific aspects of the future. They often require significant commitment and involve limited reversibility, so they should be selectively implemented, as they may stake the organisation's future.\n- Strategic options are the courses of action an organisation can consider; strategic objectives are the specific goals it aims to achieve within a defined timeframe. Options can be deployed at any point of the value chain, not only in customer-facing products and services: optimising logistics networks, partnerships, joint ventures and acquisitions, procurement and sourcing, divesting or leaving markets, new revenue streams.\n\n## Running it in a room\n\n- Each group holds one scenario and has developed initiatives from within it. A 'host' stays with the group's initiatives to explain them and answer questions; the rest rotate around the room, visiting each of the other scenarios in turn.\n- From your own scenario's perspective, assess whether each other group's initiatives would work and add value in your world. Mark green where the initiative is robust, yellow where it could work with modifications, red where it would not work, would be counter-productive or would destroy value.\n- Debrief in the group and in plenary: do any initiatives prove robust across all scenarios? Did any seem particularly attractive, worth a bet? Could several be pursued at once, for the value of strategic options? Could elements of several be combined into one superior strategy?\n\n## Exercise sheet: Would this idea survive a different future?\n\nOne of the kit's optional exercises: a one-page canvas with short instructions and space to work, for use with pen, paper and conversation, or alongside the assistant.\n\n- Start with: up to three options or strategic initiatives and a set of plausible scenarios for the same time horizon. Agree the aim and time horizon, and test every option against the same scenarios.\n- The canvas: a matrix with up to three options as rows and four scenarios as columns. Each cell holds an impact judgement and a short reason.\n- At the end: an options-by-scenarios matrix showing what works, what needs adapting and what could fail.\n\nOn the sheet:\n\n- Add a judgement and a reason in every cell: + works, ~ needs adaptation, 0 no impact, - negative impact, ? unclear.\n- Read across the matrix: which options hold up across scenarios, and which depend on particular conditions? Keep disagreements and unknowns visible.\n- Scenarios are plausible alternatives, not predictions. If you only have a single trend, develop contrasting future conditions before filling the matrix.\n\n## Depends on\n\n- [Scenario development](scenario-development.md)\n- [Pre-mortem](premortem.md)", "canon/principles/_index": "# canon/principles/\n\n- [/canon/principles/broad-range-of-organisational-contexts.md](broad-range-of-organisational-contexts.md)\n- [/canon/principles/challenge-mental-models.md](challenge-mental-models.md)\n- [/canon/principles/explore-the-future-before-the-present.md](explore-the-future-before-the-present.md)\n- [/canon/principles/foresight-and-strategy-are-one-process.md](foresight-and-strategy-are-one-process.md)\n- [/canon/principles/foresight-as-collective-intelligence.md](foresight-as-collective-intelligence.md)\n- [/canon/principles/look-beyond-the-planning-horizon.md](look-beyond-the-planning-horizon.md)\n- [/canon/principles/plausible-futures-not-predictions.md](plausible-futures-not-predictions.md)\n- [/canon/principles/practice-not-academic-exercise.md](practice-not-academic-exercise.md)\n- [/canon/principles/process-matters-as-much-as-outcomes.md](process-matters-as-much-as-outcomes.md)\n- [/canon/principles/systems-thinking-for-resilient-futures.md](systems-thinking-for-resilient-futures.md)", "canon/principles/broad-range-of-organisational-contexts": "# Strategic foresight can be applied to a broad range of organisational contexts\n\n## Contexts within the organisation\n\n- Better strategic and policy anticipation, to identify and prepare sooner for future opportunities and risks.\n- Business or policy innovation, to spur new thinking.\n- Future-proofing, to identify gaps and stress-test existing or proposed strategies against a range of plausible futures.\n\n## Contexts beyond the organisation\n\n- Context can be extended beyond the organisation to inspire thought-leadership or visioning.", "canon/principles/challenge-mental-models": "# Strategic foresight seeks to challenge mental models and organisational perspectives\n\n## What to challenge\n\n- Our tendency to favour the 'business as usual' future.\n- Our tendency not to adequately explore viable alternatives.\n\n## What to refresh\n\n- Old and obsolete imagery of the future, so often held onto by organisations.\n\n## Why\n\n- For the betterment of decisions that are more informed.\n- For decisions less clouded by judgemental biases and misguided assumptions.\n\n## Depends on\n\n- [Assumptions](../concepts/assumptions.md)\n- [Cognitive biases in futures thinking](../concepts/cognitive-biases-in-futures-thinking.md)", "canon/principles/explore-the-future-before-the-present": "# Strategic foresight explores the future before considering implications for the present\n\n## The principle\n\n- Strategic foresight focuses on exploring the future before considering implications for the present.\n\n## The direction of learning\n\n- We are trying to learn about the present through the lens of the future.\n- This is in contrast to trying to understand the future from the perspective of the present.", "canon/principles/foresight-and-strategy-are-one-process": "# Foresight and strategy are complementary parts of one process\n\n## The principle\n\n- Foresight and strategy are complementary parts of one process in pursuit of future organisational success.\n- Foresight should always be connected to strategic purpose.\n\n## Without foresight\n\n- Strategy easily becomes blind to contextual change.\n- Strategy becomes a recipe for failure when change occurs.\n\n## Without strategy\n\n- Foresight easily becomes conjecture.\n- Foresight becomes disconnected from organisational reality.\n\n## The relationship\n\n- Foresight outcomes are not strategies in themselves.\n- Foresight outcomes should inspire insights for strategic planning.", "canon/principles/foresight-as-collective-intelligence": "# Strategic foresight should be approached as a form of collective intelligence\n\n## The principle\n\n- Strategic foresight should be seen and approached as a form of collective intelligence.\n\n## How quality outcomes arise\n\n- Quality strategic foresight outcomes can only be generated and assessed through dialogue and exchanges between people.\n- Those people bring diverse perspectives to the table, as non-partisan as possible.\n- This is key to facilitating new, viable perspectives concerning future developments of relevance.\n\n## What does not work\n\n- It is not possible to passively 'study the future' and hope to learn much worthwhile.", "canon/principles/look-beyond-the-planning-horizon": "# Strategic foresight looks beyond the traditional strategic planning time horizon\n\n## The principle\n\n- Strategic foresight most often deals with the medium to long-term future.\n\n## The current planning horizon\n\n- The current strategic planning time horizon is three to five years.\n- Thinking within this horizon tends to limit 'mental flexibility'.\n- It often leads to path-dependent thinking.\n\n## Thinking further out\n\n- Thinking ten or more years out better enables the exploration of viable future alternatives.\n- These alternatives may be significantly different from today.", "canon/principles/plausible-futures-not-predictions": "# Strategic foresight explores plausible futures rather than making predictions\n\n## The principle\n\n- Strategic foresight is not about making predictions of the future, but rather exploring plausible futures.\n\n## Why prediction fails\n\n- The future is inherently unpredictable.\n- Many factors may come together in complex ways to create surprising futures in a non-linear world.\n- There are no definitive answers about what the future will hold.\n\n## What informs plausible futures\n\n- Trajectories and external sources of change.\n- Emergent signals of change.\n- Emerging critical uncertainties.", "canon/principles/practice-not-academic-exercise": "# Applying strategic foresight in practice is not an academic exercise\n\n## The academic foundation\n\n- Foresight is a well-established field with a robust academic underpinning.\n- It adopts principles of good scientific practice.\n\n## The practice\n\n- Successful strategic foresight is pragmatic and hands-on.\n\n## What the practice relies on\n\n- Rigorous and structured methodologies.\n- The fine art of sense-making, intuition, curiosity and creativity.", "canon/principles/process-matters-as-much-as-outcomes": "# The strategic foresight process is at least as important as the final outcomes\n\n## The principle\n\n- In strategic foresight, the future is not a destination; it is a tool.\n\n## What the process should do\n\n- Develop learning.\n- Broaden participants' horizons.\n- Help build a shared understanding of potential future outcomes.\n\n## The hardest task\n\n- The most difficult task when working with strategic foresight is to facilitate the transition of helping people think of the future in new ways.", "canon/principles/systems-thinking-for-resilient-futures": "# Strategic foresight is a systems-thinking approach to support resilient organisational futures\n\n## The principle\n\n- In a time where forecasts and projections are not enough, strategic foresight aims to achieve a genuinely high-quality view of potential future outcomes.\n- Strategic foresight focuses on potential changes in an organisation's external environment.\n\n## What this includes\n\n- Outcomes 'beyond the numbers'.\n- Potentially impactful signals that would otherwise be disregarded.\n\n## Why it matters\n\n- These changes influence the strategic environment.\n- The strategic environment in turn shapes strategic decisions.", "context/_index": "# context/\n\n- [/context/sector/index.md](sector/_index.md)\n- [/context/megatrends/index.md](megatrends/_index.md)\n- [/context/signals/index.md](signals/_index.md)\n- [/context/organisation/index.md](organisation/_index.md)", "context/megatrends/_index": "# context/megatrends/\n\n- [/context/megatrends/biotech-revolution.md](biotech-revolution.md)\n- [/context/megatrends/concentration-of-wealth.md](concentration-of-wealth.md)\n- [/context/megatrends/constrained-economy.md](constrained-economy.md)\n- [/context/megatrends/green-transition.md](green-transition.md)\n- [/context/megatrends/health-beyond-the-clinic.md](health-beyond-the-clinic.md)\n- [/context/megatrends/individualised-everyday-life.md](individualised-everyday-life.md)\n- [/context/megatrends/inversion-of-the-population-pyramid.md](inversion-of-the-population-pyramid.md)\n- [/context/megatrends/new-face-of-urbanisation.md](new-face-of-urbanisation.md)\n- [/context/megatrends/power-through-networks.md](power-through-networks.md)\n- [/context/megatrends/rise-of-embedded-ai.md](rise-of-embedded-ai.md)\n- [/context/megatrends/shifting-world-order.md](shifting-world-order.md)", "context/megatrends/biotech-revolution": "# The biotech revolution\n\n## What it is\n\nBiotechnology, the use of living organisms to make products and raw materials, is set to revolutionise the world over the next half-century. It enables us to transcend natural limitations, understand and manipulate genetic codes of plants and animals, create modified crops that are more resilient or require less fertiliser, develop new treatments for hereditary illnesses, and increase life expectancy, perhaps drastically. Over the course of this century, biotechnology will be integrated deeper into nearly all facets of modern society, including healthcare, food production, material design and energy production.\n\nEvery day when we open our fridge, we see the products of biotechnologies: bread made from selectively bred wheat, fruit juice with enzymes, or meat and dairy from animals raised on genetically modified feeds. Biotechnology is so central to the modern world that many of us would not be alive without it. High-yielding crop varieties increased yields by 44% between 1965 and 2010, reducing famine and helping sustain the rapidly growing populations of the late 20th century.\n\n## Sub-trends\n\n- Genomics becoming the operating system of life's essentials, medicine and food production\n- Bioenergy leading to more sustainable heat and fuels\n- Rise of biological carbon sequestration\n- Emergence of bio-based materials\n- Bio-enhanced food production\n- AI-enhancement of biotech innovation\n\n## Uncertainties\n\n- Will ecological engineering be applied on a wide enough scale to counteract the effects of climate change?\n- What regulatory frameworks will shape the rollout of emerging biotechnologies?\n- Can cultivated (lab-grown) foods move from niche innovation to mainstream acceptance?\n- How successfully will synthetic biology deliver on its promise of designing organisms fit for a changed world?\n- What role will ethics play in an accelerated biotech revolution, if any?\n\n## Drivers\n\n- Food production continues to be one of biotechnology's most important frontiers, not only in total yield but increasingly in what ends up on a plate. Six billion people regularly consume milk or dairy products, and the land and water use demanded by conventional livestock, along with the emissions it produces, is a major driver of climate change and environmental degradation.\n- Direct emissions from livestock production are a major source of greenhouse gases, making improvements in animal agriculture an important climate strategy.\n- In shipping and air traffic, electrification is not a viable option, leaving a gap that advanced biofuels (fuels made from non-food biological material) are poised to fill. Past generations of biofuel production competed with food production for agricultural land; during the 2010-11 global food crisis, rising food prices, with land use for first-generation biofuels as a contributing factor, caused riots in Egypt that eventually contributed to the toppling of President Mubarak.\n- The convergence of biotech with artificial intelligence may accelerate progress even further. AlphaFold, Google DeepMind's protein-structure prediction system, solved a problem in months that had occupied structural biologists for half a century, earning its creators the Nobel Prize in Chemistry in 2024. Drug discovery pipelines that once took vast infrastructure and decades are being compressed into years, computationally, by smaller teams at a fraction of the cost.\n- Money is flowing into longevity research, with patrons like Amazon's Jeff Bezos and Saudi Arabia's Crown Prince turning their attention this way. Saudi Arabia's Hevolution Foundation has bankrolled USD 40 million of a USD 101 million XPrize competition for the first team to demonstrably reverse aspects of ageing by ten years.\n\n## Manifestations\n\n- Cultivated meat grabs the most headlines, but an arguably more significant prospect is precision fermentation in dairy production. CIFS research estimates that, based on the technology price curve, milk protein from precision fermentation might reach parity with milk from cows in 10-15 years and from then on start disrupting milk production.\n- Research into the relationship between the rumen microbiome, feed composition and cattle genetics may help lower methane emissions significantly while maintaining productivity. Crops like wheat can be genetically modified to sequester more CO2 underground while increasing food productivity, though these techniques are at a very early stage. Grass-to-protein production could reduce the structural dependence on imported soy that ties American and Asian food systems to land-use decisions in South America; the feedstock is abundant, the land already in use, and the supply chain implications of even modest substitution are significant.\n- Advanced contemporary biofuels largely avoid the land-use dilemma, using feedstocks that do not require agricultural land. The EU's RefuelEU Aviation Regulation (adopted in 2023) mandates 20% sustainable aviation fuel in 2035 and 70% in 2050, most of it from advanced biofuels.\n- In January 2026, the US Food and Drug Administration approved a human clinical trial by Life Biosciences, co-founded by Harvard geneticist David Sinclair, testing a gene therapy targeting vision loss in patients with glaucoma and rare optic nerve conditions. The overarching ambition is the possibility of reversing ageing itself. Longevity research is often at odds with mainstream medical science, but the money flowing into the field makes it difficult to disregard.\n- For the 200 million people worldwide dependent on insulin, manufactured using recombinant DNA techniques, the life-sustaining necessity of biotechnology is self-evident. Within a few years of the COVID-19 viral genome being published, mRNA vaccines were manufactured and administered to billions of people worldwide, perhaps the fastest and largest deployment of a biotechnology product in history. Christopher Voigt of MIT assesses that by 2030, most people in the developed world will have consumed, worn, used, or received medical treatment from products that involved synthetic biology somewhere in their production chain.\n- Neglected diseases, including several tropical diseases affecting hundreds of millions of people, are a prime target for AI-powered drug discovery, which can accelerate the identification of drug candidates and cut the time and cost of bringing new treatments to market.\n\n## Implications\n\n- Longevity research is hugely contested, not just for scientific reasons but for the ethical questions it raises. The most significant is who gets access to treatment. If treatment to extend life significantly becomes mainstream or universally accessible, what happens to pension systems, housing markets and inheritance? Globally, its impacts on population growth and the Earth's already strained resources will have to be considered. Scepticism is warranted, but as with Artificial General Intelligence, considered science fiction two decades ago, longevity research may prove to be one of those rare fields where the science outpaces what human imagination thought possible.\n- The use of biotechnology has been riddled with controversy, particularly surrounding GMO and human cloning. There is no single worldwide treaty that legally prohibits human reproductive cloning; the closest is the UN Declaration on Human Cloning (2005). A powerful taboo around cloning has nevertheless helped prevent an international biological arms race during a period when the technology remained unsafe and its benefits uncertain. The real test of that taboo will come if human enhancement becomes demonstrably safe and effective.\n- The controversies will not disappear and will continue to shape the direction, speed of rollout and impact of biotech. Concerns and risks include ecosystem impacts, monopolisation issues (such as seeds preventing farmers from saving and replanting their own seed stock), and public trust issues, particularly regarding health. The very plausibility of the claim that COVID-19 was engineered in a laboratory and escaped, whatever its truth, shows the potentially very negative consequences that biotechnology could have.\n- Despite risks and controversies, biotech will enable the redesign of biological systems for better health, more resistant food, sustainable fuels and new materials. The challenges of this century will not be solved by any single discipline, but it is hard to construct a credible path through them that does not, at some point, run through biotechnology.", "context/megatrends/concentration-of-wealth": "# Concentration of wealth\n\n## What it is\n\nThe gains of economic growth have never been distributed evenly across the globe, not between countries, not within them, and not between those who own capital and those who sell labour. But the present configuration of global wealth accumulation constitutes something historically distinct, not least in its extremity. As the world gets progressively richer, more productive and more populous, the benefits of this sustained growth are far from shared equally. Growing wealth inequality presents future challenges to state capacity, the ability to meet existential challenges, and perhaps even to the future of democracy itself.\n\n## Sub-trends\n\n- The 'oligarchising' of politics\n- Ownership of platforms, democracy's news and information 'infrastructure', in the hands of the super-wealthy\n- Accounting and tax rules lagging new models of wealth and value creation\n- Declining labour share of income\n- Intergenerational wealth transfer and the concentration of inheritance\n- Asset-based stratification\n\n## Uncertainties\n\n- Can governments act on wealth redistribution before inherited wealth concentrations become too entrenched to reverse?\n- Can democracies effectively counteract 'oligarchising' when wealth easily evades national jurisdictions?\n- How will wealth concentration among platform owners evolve under potential regulatory pressure?\n- Can global collaboration on taxation and financial market controls become a stronger counterweight to inequality?\n- Can redistributive instruments such as a universal basic income compensate for a falling labour share of income, and can a national tax base in the exposed country fund them when the productivity gains accrue elsewhere, i.e. Chennai vs. California?\n\n## Drivers\n\n- Some causes of this extreme divergence have been decades in the making: the deregulation of capital markets, capital accumulation outpacing economic growth, and the gradual weakening of workers' bargaining power relative to capital across much of the world.\n- Other structural drivers are newer. Platform monopolies generate returns at near-zero marginal cost, enabling rapid wealth accumulation. The list of top wealth holders today has an overrepresentation of technology platform owners whose fortunes were built on this mechanism.\n- Platform-based business models have opened a gap between where economic value is created and where it can be measured, taxed and redistributed. Through the 2010s, some of the world's most valuable companies generated extraordinary returns with comparatively little physical capital, their value sitting in intangible assets, networks and globally scalable digital infrastructure. That may now be changing, as the same firms spent several hundred billion dollars in 2026 on data centres, chips and power, tying their value back to places, grids and permits.\n- Accounting, financial and especially taxation systems remain poorly adapted to both versions of the model. The OECD mechanism for shifting taxing rights to the countries where users are, Amount A of Pillar One, has still not come into force, and more than twenty national digital services taxes have filled the gap. Much of the wealth of the very rich is held in appreciating shares, which generally generate tax revenues only when sold, giving owners little incentive to realise gains.\n- Recent international tax negotiations suggest the principal barriers are political rather than technical: many of the necessary mechanisms exist, but access to them is shaped by the relative bargaining power of states and corporations. The clearest example is the January 2026 'side by side' agreement, which largely exempts US multinational companies from the OECD's global minimum tax rules.\n- A new and perhaps more durable dynamic is the transmission of accumulated wealth between generations on a scale unprecedented in recent history. Market-generated concentration is, in principle, reversible through labour market dynamics, taxation or shifts in competitive conditions. Generational wealth does not depend on the continued performance of the inheritor and is protected by trusts, foundations or offshore vehicles designed to minimise erosion through taxation or market risk. The generations set to inherit the so-called Great Wealth Transfer, primarily Generation X and Millennials, are the first to do so after four decades of intensified accumulation at the top.\n- AI is a 'capital-biased' innovation whose returns flow disproportionately to capital rather than labour. This winner-takes-most dynamic echoes past industrial revolutions, from textile mills to industrial robots, which concentrated ownership of capital-intensive machinery while lowering skill requirements and creating an oversupply of replaceable workers.\n\n## Manifestations\n\n- Between 2000 and 2024, the richest 1% of the world population captured 41% of all new wealth, while the bottom half received just 1%. The top 10% own three-quarters of global wealth, while the bottom half holds only 2%. The top 1% alone, roughly the adult population of the United Kingdom, controls 37% of global wealth. Fewer than 6,000 individuals hold 3% of all wealth, more than the entire bottom half of the world's adult population.\n- Corporate tax revenues have broadly held up, so the central dispute is not only how much tax is collected but which country has the right to collect it. The taxation of concentrated corporate and platform wealth is becoming less a question of institutional design than a contest over who has sufficient leverage to determine, and benefit from, the rules.\n- The conversion of concentrated wealth into political influence, the 'oligarchising' of politics, ranges from buying political support to consolidating ownership of key societal institutions and infrastructure. A study covering 120 countries over 23 years found a negative effect of economic concentration on a nation's level of democracy, with corporate political activity as a likely mechanism. Pressures include the funding of foundations, think tanks and policy-planning networks; campaign finance; the shaping of public opinion through media and expert commentary; and constitutional provisions that protect property and create veto points at which change can be blocked.\n- Increasing wealth inequality has been associated with a reduction in the proportion of individuals identifying with the subjective middle class, the group most supportive of democratic governance.\n- 2026 marked the first year when social media and video networks were the most widely used source of news globally (54% of all audiences). Legacy media must lean on corporate scaling or partner with massive tech ecosystems to maintain reach. Social media networks and algorithmic search engines, voting-controlled in several cases by a single individual, act as primary news and information gatekeepers worldwide. Algorithmic ranking by predicted engagement creates new risks, accentuated by the fact that dissemination precedes fact-checking.\n- The rise of 'mega-philanthropy', itself a product of wealth concentration, shows that where public capacity recedes (or was never present), what replaces it is defined by those who own the capital. That replacement is largely unaccountable, and its priorities follow donor preference rather than public consensus.\n\n## Implications\n\n- Wealth polarisation does not in itself produce risks to state capacity, democratic stability and governance. But the uneven playing field it creates contributes to hollowing out the democratic process and makes policies and outcomes that systematically favour the interests of the wealthy more likely.\n- The qualitative shift in the social logic of wealth towards inheritance may further widen the gap between economic position and social contribution, something close to the emergence of a new aristocracy.\n- When the greatest fortunes sat in oil, retail or property, the asset and the political voice it afforded were separable. When the asset is society's information, news and communications infrastructure, the asset and the megaphone are the same object.\n- As AI graduates from tool to embedded infrastructure, one potential outcome, even with productivity growth, is that absent political intervention it contributes to widening inequalities. Past industrial revolutions were followed by counterbalances: organised labour movements, government regulations, the expansion of the welfare state. What the redistributive institutions of the future will look like is an open question. Universal basic income is one proposition, yet it is unclear how it would be financed: the productivity gains of platform and AI infrastructure accrue to owners concentrated in a small number of jurisdictions, while the labour markets those technologies reshape are global. A parliament in Delhi cannot legislate a tax rate in California. Proposals for a coordinated minimum tax on the very wealthy, and the ongoing negotiation of a UN framework convention on international tax cooperation, are attempts to close exactly this gap.\n- For non-inheriting majorities, wealth-based stratification means labour market participation may be increasingly insufficient to generate the asset accumulation necessary for retirement security and housing access. Capital returns concentrate in metropolitan areas where asset prices are highest, producing 'geographies of discontent' and a risk of political backlash.\n- Wealth concentration drives other risks through the social polarisation it foments. Democratic systems eroding through elite capture face another angle of attack from the political mobilisation of those who believe they are not seeing their fair share of growth. The rise of populism in the 2010s and 2020s is also a story of the inequalities produced by a globalised and stratified economy. Some of the most significant upheavals in modern history, pre-revolutionary France, tsarist Russia, Weimar Germany, were preceded by periods of intense inequality.\n- The risks are heightened by the lock-in of structural constraints that make course-correction increasingly difficult. Where governments depend on private capital to finance public functions, through debt, de-risking and public-private partnerships, the range of democratic choice narrows, constrained by the preferences of the private wealth on which fiscal states depend. Rebuilding redistributive institutions requires coalitions that wealth concentration makes harder to assemble. This could create legitimacy problems for a social contract resting on the premise that effort, skill and participation generate a proportional meritocratic reward.\n- The unprecedented concentration of wealth has not been matched by any comparable growth in the capacity to solve shared problems, whether stemming climate change or eradicating hunger. The question for the coming decades is whether fiscal, regulatory and democratic capacity can be rebuilt at the scale at which capital now operates. How it is answered will determine whether the concentration of wealth remains an economic outcome or hardens into a structural feature of how societies are governed.\n\n## Depends on\n\n- [The rise of embedded AI](rise-of-embedded-ai.md)", "context/megatrends/constrained-economy": "# The constrained economy\n\n## What it is\n\nThe global economy is undergoing a structural shift from the expansionary configuration of the post-Cold War era to a more constrained one. Many of the enabling conditions that drove growth, integration and convergence for three decades have either exhausted themselves or gone into reverse. Lower growth is one consequence of this shift, but the deeper change is the constraints and conditions under which states, companies and individuals now pursue economic activity.\n\nThe story of the global economy in the late 20th and early 21st century has been one of convergence and expansion: rising international trade, aided by deeper multilateral engagement and developing nations opening to trade, and the emergence of a truly global economic system following China's opening (late 1970s) and the USSR's collapse (1991), alongside the proliferation of bilateral trade and FDI deals. Underpinning this was a unique set of monetary conditions, dollar hegemony and cheap capital, combined with falling marginal tax rates, privatisation and deregulation. Industrial policy was treated as a controversial, even taboo, topic. The global economy is now entering a new phase defined less by the structures that enabled its expansion and more by those that constrain it.\n\n## Sub-trends\n\n- Rising fiscal and private financial stress\n- Constrained global growth\n- Fading demographic tailwinds leading to shrinking labour supply\n- Geopolitical uncertainty\n- Rise in trade and supply chain disruptions\n- Growing resource constraints\n\n## Uncertainties\n\n- Will rising public debt and underfunded pension systems constrain fiscal space and slow long-term growth, particularly in ageing economies and highly indebted countries?\n- How will geopolitical tensions and shifting trade and industrial policies reshape global trade, investment flows and the resilience of the global economy to external shocks?\n- How large will the economic costs of climate mitigation and adaptation be?\n- Will financial innovation outside the regulated banking system strengthen economic dynamism or create new systemic risks and financial instability?\n- To what extent will the expansion of AI lead to productivity increases, and where in the economy?\n- Can ageing economies reconcile their need for migrants and talent with rising nationalist and anti-immigration politics?\n\n## Drivers\n\n- Many of the conditions that made the post-1990 growth era possible are exhausted. As the demographic tailwinds of the 20th century fade in many regions, labour supply growth is reduced. In the OECD's long-run scenarios, global annual potential output growth is projected to moderate from around 2.9% today to 2.7% in the early 2030s and 2.1% in the early 2040s, reflecting declining working-age population growth and a slowing trend in labour productivity growth in emerging market economies.\n- Investment has weakened, feeding directly into slower productivity growth and lower output growth. Trade has lost momentum as policy uncertainty rises and fragmentation increases trade costs.\n- Debt is a further constraint. High levels of debt have translated into high debt service burdens. Over the last decade, an increasing number of low-income economies spend more on servicing public debt than on health, education and public investment. Higher interest rates amplify this pressure by raising refinancing costs and narrowing fiscal space for infrastructure, education and industrial policy.\n- The distribution of gains from growth remains highly uneven. The key dynamic in the past couple of years has been an increase in the share of wealth of the 0.01% richest people globally. Such concentration shapes consumption patterns, investment allocation and political stability, even when headline GDP growth remains positive.\n- Geopolitical conflict and war have become a more visible economic constraint. Beyond the human cost, conflict increases risk premia, disrupts supply chains, raises energy and food price volatility and accelerates strategic decoupling. With tensions at their highest since the end of the Cold War, the resulting uncertainty depresses investment and trade and can lock economies into lower growth paths. Rising defence spending draws resources away from budgets without the same long-term productive return as other public investment.\n- The structure and complexity of global finance is evolving. The US dollar remains the dominant reserve currency, but official central bank reserves have slowly diversified toward non-traditional reserve currencies such as Australian dollars. Shifts in reserve composition influence liquidity conditions, capital flows and the resilience of the international monetary system in periods of stress.\n- Resource constraints are more pressing. Money cannot simply buy access to what is scarce or politically restricted. Inputs such as lithium, cobalt, nickel, copper and graphite are becoming strategically important for electrification and advanced manufacturing, with rising demand and growing supply chain concentration risks. If access becomes a binding constraint, it can reshape industrial competitiveness and slow the transition investments that many growth strategies rely on.\n\n## Manifestations\n\n- Lower growth rates are the most visible symptom of the structural shift, but they are a consequence rather than the story itself. Global growth slowed from an average of 3.6% per year in the decade before the Global Financial Crisis (1998-2008) to 3.2% in the decade before the Covid pandemic (2010-2020). Restoring growth to earlier decade averages will require a very large collective policy effort, including stronger cooperation, larger financing and mobilising private capital.\n- In the long term, weak growth may be offset by AI, primarily through productivity gains. The IMF describes AI as a potential force that could jumpstart productivity, boost global growth and raise incomes, while warning that benefits may be uneven and could deepen inequality without policy responses. Goldman Sachs Research estimates that generative AI could raise global GDP by 7% over ten years and lift productivity growth by 1.5 percentage points per year, conditional on adoption and task exposure. The OECD frames AI as a general-purpose technology with the potential to influence productivity, distribution and growth, while emphasising uncertainty around macro outcomes and diffusion beyond leading firms.\n- Regardless of whether AI eventually offsets weaker growth rates, the underlying structural reconfiguration of labour, capital, trade, debt and resource conditions is more persistent. An economy that grows at 3% through AI-driven productivity gains while operating under demographic constraint, fragmented trade and resource scarcity is structurally different from one that grew at 3.6% through demographic expansion, open trade and cheap energy. Growth rates can recover while the structure underneath them, debt capacity, labour supply, trade openness and input access, remains permanently more constrained.\n\n## Implications\n\n- Nations and companies will increasingly pay a premium for security in the form of redundant supply chains, strategic reserves, domestic capacity and trusted partners. What once looked inefficient may now become economically rational.\n- Governments will face harder choices on defence, climate, welfare, pensions and more, in an environment where the economic pie expands more slowly and prioritisation matters more.\n- With shrinking domestic labour forces, productivity becomes even more important. AI, automation and organisational innovation become strategic imperatives, while people face growing pressure to continuously adapt their skills.\n- A smaller workforce will be asked to finance larger ageing populations, forcing difficult choices on pensions, healthcare and taxation. For younger people, the implicit promise that each generation will become wealthier than the last could become harder to sustain.\n- Heightened competition for migrants and talent may be expected globally. Individuals with scarce skills gain bargaining power, while others face greater pressure to reskill.\n- Uncertainties abound. Redundant supply chains, strategic reserves and trusted-partner sourcing come at a cost that becomes difficult to sustain amid the rising fiscal and financial stress driving the trend in the first place; resilience may become one of the first casualties when governments and firms are forced to economise. Whether competition for migrants and talent materialises as open competition, or whether nationalist and anti-immigration politics in ageing economies foreclose migration as a lever, is a crucial question. And even in an optimistic scenario, it remains open whether AI-driven productivity growth arrives quickly and broadly enough to ease the financing burden on ageing populations, or stays concentrated in leading firms and high-skill workers, doing little to relieve the distributive strain.", "context/megatrends/green-transition": "# The green transition\n\n## What it is\n\nClimate change, ecological degradation and breached planetary boundaries are forcing a shift away from the fossil-fuel-based, resource-intensive economy of the 20th century. That shift is increasingly reinforced by economics, as renewables are quickly becoming the cheaper option in many markets. The Green Transition encompasses both the shift to renewable energy and efforts to halt the environmental degradation driven by resource-intensive production.\n\nThis transition is underway, but it proceeds unevenly, both in terms of geographies and efforts. Renewable energy capacity is expanding, and CO2 emissions are measurably lower than they would otherwise be, while progress on protecting natural habitats and reducing material consumption lags further behind. Political backlash against sustainability agendas in several major economies creates noise and distracts attention, but it has not reversed the trajectory of the megatrend. The visible pressures continue to build, but these dynamics alone are no guarantee that the transition will happen fast enough to avert severely disruptive climate risks.\n\nUnlike most megatrends, which concern human actions in the social system, the Green Transition occurs in a complex physical system with feedback loops and system thresholds that can produce sudden reversals in indicators. Human action can improve a wide range of parameters, such as the net forest area, but physical mechanisms such as the die-off in the Amazon could still be triggered, fundamentally disrupting the indicator being improved.\n\n## Sub-trends\n\n- Energy transition from fossil fuels to renewables\n- Circular economy and sustainable resource use\n- Electrification\n- Increase in policies to prevent environmental degradation\n- Increase in nature-related financial disclosures\n- Growing climate mitigation and regulation efforts\n- New regions and countries stepping up in climate leadership\n\n## Uncertainties\n\n- What will be the duration and impact of the current backlash against renewables?\n- Will new energy storage technologies achieve major gains in efficiency and propel the pace of electrification and renewable energy use?\n- What would it take for consumer awareness to translate into a widespread shift in consumer choices?\n- Will Earth system tipping points be reached, resulting in runaway climate calamities, before the transition can prevent them?\n- Will the restoration of natural habitats keep in step with the energy transition, or will biodiversity loss continue to worsen?\n- Will the world unite around climate action, or will efforts be regionalised?\n\n## Drivers\n\n- For most of the past century, economic growth came at a measurable cost to the natural world. Livestock now outweigh wild mammals and birds tenfold, air pollution accounts for approximately seven million premature deaths each year, and climate change proceeds at a pace that inches closer to dangerous tipping points in the planet's climate systems.\n- As climate change accelerates, the physical impacts in the form of severe weather events and ecosystem collapse place increasing adaptation demands on societies. The need for robust, science-based tools to anticipate risk, manage uncertainty and design resilient systems will grow over the long term, regardless of short-term political cycles. The transition is not only an environmental necessity but increasingly an economic and strategic one.\n- Economics reinforce the shift. Global clean energy investment stands at USD 1.8 trillion annually, against USD 1 trillion in fossil fuels. Solar paired with 4-hour battery storage is now cheaper than new coal generation in major markets.\n- China's scale and policy direction make it a deciding factor in the global outcome. China leads the world in installed capacity of both solar and wind power and accounts for a substantial share of new additions each year. Massive investments in utility-scale solar farms and offshore wind have driven down costs globally through economies of scale and manufacturing dominance, and grid modernisation, including ultra-high-voltage transmission lines, enables renewable energy generated in remote regions to reach dense urban centres.\n- The evolving climate risk landscape pushes in the direction of a transition. As carbon is increasingly priced into major markets and institutional investors are required to account for climate risk, the economics are shifting in ways that reach beyond the energy sector. Decisions once made purely on cost and convenience now increasingly involve assessing climate risk and meeting new and stronger regulations.\n- International environmental governance is expanding. The High Seas Treaty in 2025 marks a significant step toward protecting marine ecosystems in international waters. The UN Convention to Combat Desertification has gained renewed momentum, with parties pledging to restore one billion hectares of degraded land by 2030. Trade in endangered species is being restricted.\n\n## Manifestations\n\n- The overall picture is one of mixed signals. The global deforestation rate is slowing (from 17.6 million hectares per year in 1990-2000 to 10.9 million in 2015-2025). The average proportion of key biodiversity areas under protection has increased from roughly 25% in 2000 to about 45% in 2025. The share of renewables in the global energy mix is growing steadily. Yet the Red List Index, an indicator of overall extinction risk, has been continuously worsening for decades, and seven of Earth's nine planetary boundaries are now breached.\n- The energy transition is the part of the megatrend furthest along. Across major economies there has been a decoupling of GDP growth and CO2 emissions. Renewables account for a relatively small share of primary energy consumption, but that figure conceals the higher efficiency of electricity: around 40% less renewable energy than fossil fuel energy is needed to perform the same task, so the actual substitution share of renewables is higher and rising quickly.\n- Electrification of transport is a critical trend. The electric vehicle share of global car sales stands at 25% in 2026 and is rising quickly. In Norway, EVs' share of new passenger vehicle sales reached 96% in 2025.\n- The transition is not fast enough. National emissions plans are expected to cut emissions by 12% in the next 10 years, which is not sufficient to curb accelerating climate change. The Paris Agreement aimed to limit warming to well below 2\u00b0C with efforts to cap it at 1.5\u00b0C, yet the world is on track for 2.6\u00b0C. The planet is already 1.41\u00b0C warmer than pre-industrial levels, and the Copernicus Climate Change Service projects a breach of 1.5\u00b0C as early as May 2029 rather than March 2042.\n- Restoration and protection of natural habitats lag behind the energy transition for several reasons. Nature preservation efforts do not scale in the same way renewable energy does. Institutional frameworks are at an earlier stage than climate mitigation. Protecting natural environments often means not doing something, or forgoing short-term economic gain, which is harder to incentivise. And since industrialised agriculture and food production are the leading cause of both deforestation and biodiversity loss, addressing root causes means reforming the very systems that sustain a growing global population and on which the livelihoods of billions depend.\n- Businesses face regulatory pressure in the form of carbon pricing mechanisms and supply chain due diligence laws. Companies that once treated sustainability as a voluntary commitment now navigate it as a compliance obligation, and the pace of regulatory change is itself a challenge. The EU's Right to Repair Directive (adopted 2024, applicable from 2026) and the Ecodesign Regulation for Sustainable Products (2024) aim to combat planned obsolescence.\n- Consumer uptake is slow. Surveys consistently show that large majorities consider climate change a serious threat, yet this concern rarely translates into proportionate changes in behaviour. Most people still fly, consume and buy as many products as they can afford, motivated by convenience and comfort more than ethical considerations. This gap between values and behaviour is one of the defining tensions of the Green Transition. The consumer society is also a product of deliberate psychological and cultural pressures, as industries engineered products and marketing to exploit reward circuits while eroding the expectation of quality.\n- Public resistance accompanies change on this scale. The costs of the transition are sometimes immediately felt as higher fuel prices, restricted choices or disrupted livelihoods, while the benefits feel distant or abstract, so political backlash often follows. Farmers block highways, yellow vests flood the streets, lobbyists roll up their sleeves, and governments that moved ambitiously on climate policy walk back commitments under electoral pressure.\n\n## Implications\n\n- Humanity's shift away from a resource-intensive economy is an accelerating trend, unlikely to be reversed by short-term political backlash, but it does not guarantee arrival at a stable end state. The transition is to a future in which we will likely be forced to mitigate, and adapt to, climate change and environmental degradation simultaneously.\n- The climate is approaching a high risk of Earth system tipping points such as the polar ice sheets melting, permafrost thawing and warm-water coral reefs dying, which would be catastrophic and irreversible. Modestly reduced emissions curves are not likely to prevent one or more of these from being reached. Planning on the assumption of an intact climate system is no longer prudent. Every tenth of a degree still counts, and so does the possibility that some thresholds are passed anyway.\n- The societal and economic knock-on effects are already evident. Clean energy jobs surpassed those from fossil fuels for the first time in 2021, and the clean energy sector accounted for 10% of global GDP growth in 2023, including 20% of China's and nearly one third of the EU's.\n- A 'degrowth' future may be doubtful, but a forced re-emphasis on quality over volume is quite possible.\n- Backlash will not reverse the transition, but it will continue to shape how it proceeds: slowly, unevenly, and through periods of contest and friction.\n\n## Figure: share of primary energy consumption from renewable sources\n\nA single line chart labelled World, plotted from 1997 to 2024, with a vertical axis from 0% to 16%. The line sits flat at roughly 7% from 1997 through about 2008, dips slightly around 2005, then climbs steadily: past 8% by 2010, 10% by 2014, 12% by 2018, and on to roughly 15% by 2024. The share is measured using the substitution method, estimating the fossil fuel input that would have been required to generate the same electricity. Renewables include hydropower, solar, wind, geothermal, bioenergy, wave and tidal, but not traditional biofuels, which can be a key energy source, especially in lower-income settings.", "context/megatrends/health-beyond-the-clinic": "# Health beyond the clinic\n\n## What it is\n\nHealth management is shifting from a matter of communicable disease and acute treatment to one of chronic, long-term management embedded in everyday life. A century ago, infectious disease dominated mortality. Today, non-communicable diseases account for most non-pandemic deaths. This reflects not only ageing, which means people live longer with chronic conditions, but also health outcomes being shaped by people's environment and circumstance well before they reach a doctor.\n\nThe future of health is marked by a series of challenges which include growing self-management (and the inequality in who can do it well), healthcare systems strained by long-term care, and an ageing population whose extra years do not necessarily translate proportionately into extra years of health. New tools like wearables and AI guidance offer partial help but create new risks around reliability, health literacy and trust. Whether interventions can close these gaps, and how, remains a central question.\n\n## Sub-trends\n\n- Rise of chronic diseases\n- Health risks embedded in everyday systems\n- Recognition and growth of mental health needs\n- Expansion of self-managed healthcare\n- Growth of digital health tools\n- New actors and business models\n- Inequality in access to care, health literacy and prevention\n\n## Uncertainties\n\n- Will government interventions in areas such as food security and housing quality mitigate health risks, or will structural drivers of chronic risk remain embedded in systems and infrastructures?\n- How will misinformation and trust (or lack of it) in science-based health information affect attitudes towards public health interventions, medications and diagnostic tools?\n- How will health innovation impact health systems and preventive models of care?\n- Who will have the overview and ownership of all relevant individual health data? Will a balance be struck between data protection and privacy and interoperability of systems and institutions?\n- Who will be held responsible when decision-support tools, AI-mediated or otherwise, produce adverse health outcomes or behaviour?\n- Will health financing and incentive structures evolve to reward innovation, outcomes-based reimbursement for medical professionals, and preventive, healthier-living behaviours among individuals? Or will financing remain anchored to volume-based care and treatment of illness after the fact, leaving current incentive structures largely intact?\n\n## Drivers\n\n- A century ago, infectious diseases such as tuberculosis, influenza and pneumonia were the leading causes of death across much of the world, and only one in six deaths were due to a chronic condition. This began to change in the mid-twentieth century, when sanitation, clean water, vaccination programmes, and the widespread adoption of antibiotics and public health measures greatly extended life expectancy, allowing populations to live long enough to develop chronic conditions.\n- Dietary shifts toward calorie-dense processed foods and increasingly sedentary lifestyles compounded the prevalence of these same chronic conditions. Rapid urbanisation (linked to poor diets, physical inactivity and air pollution), rising global obesity rates, tobacco use and increasingly sedentary jobs are more important contributors than longer lives alone.\n- Health risks are increasingly embedded in everyday systems, like food environments, work life, transport patterns, urban environments and housing conditions. Health outcomes are often shaped long before people consider contacting their doctor.\n- Because chronic disease develops slowly, today's prevalence figures reflect exposures accumulated across a generation rather than recent changes in behaviour. Annual per capita sales of ultra-processed foods rose 40% across lower-middle income countries between 2007 and 2022, and by as much as 60% in Uganda, while sales in high-income countries stayed flat. Today, 31% of adults worldwide do not meet minimum physical activity levels, projected to rise to 35% by 2030 if present trends hold.\n- Pollution in rapidly developing urban areas is a tenacious cause of chronic illness. Air pollution in megacities such as Delhi, Dhaka and Lahore routinely exceeds WHO limits, sometimes more than tenfold. As climate change intensifies, extreme weather and its associated health risks become a permanent part of everyday life in large parts of the world, especially in Africa and Asia. Extreme heat significantly accelerates the progression of chronic kidney disease and can trigger acute cardiovascular problems.\n\n## Manifestations\n\n- Non-communicable diseases account for 75% of all non-pandemic deaths globally. The conditions driving this burden (heart disease, diabetes, cancer, chronic respiratory disease) are not resolved through a single treatment but are lived with and managed over years. Living with multiple chronic conditions at once has become much more common.\n- An estimated 650 million people were living with cardiovascular disease in 2023, some 468 million with a chronic respiratory condition in 2021, and the International Diabetes Federation projects 853 million people living with diabetes by 2050, nearly one in ten adults alive today. Most will be managing their conditions at home or at work, through apps, medication adherence, dietary choices and daily decisions made without clinical support.\n- 82% of premature deaths from non-communicable diseases occur in low- and middle-income countries, where prevention infrastructure is limited, diagnosis often comes late, and chronic disease compounds rather than replaces the existing infectious disease burden.\n- Nearly one in seven people live with a mental disorder, most commonly anxiety and depression. Suicide is the third leading cause of death among people aged 15 to 29 worldwide, with men twice as affected as women, and 73% of the world's suicides happen in low- and middle-income countries. Mental disorders frequently co-occur with physical chronic conditions.\n- Care increasingly relies on tasks that patients and their families carry out themselves. Individuals must navigate an immense amount of health information from clinical portals, apps and wearables, insurers, employers and social media, with varying degrees of reliability or alignment.\n- Health literacy tracks the socioeconomic gradient. Those with more education, more time and more stable circumstances are best placed to engage with a system that requires self-management, while those with the least of these things are offered the least structured support. The democratisation of health technologies, and of AI-mediated health guidance in particular, has begun to narrow parts of this gap by making tailored information available to people who previously had no route to it. But the same tools deliver unverified or unverifiable information at scale, and the capacity to tell the difference is itself a function of health literacy.\n- In nearly three-quarters of countries with data, medicines account for at least 55% of out-of-pocket spending, rising to a median of 60% among people living in poverty. In 2022, 2.1 billion people experienced financial hardship due to out-of-pocket health spending.\n- Health wearables support continuous individualised monitoring of heart rate, nutrition, stress levels and sleep patterns. With AI-powered chatbots, individuals can seek guidance on any health-related question in seconds, though some researchers have found the error rate of AI-generated health answers to be twice as high as for human physicians. People's confidence in their own ability to make health decisions has fallen sharply, down ten points globally in a single year. The erosion of trust in scientific authority predates generative AI, which entered an information environment already shaped by social media and few trusted intermediaries between researchers and the public.\n- The number of years people live in poor health (the morbidity gap) widened globally from 8.8 years in 1990 to 10.7 in 2023, with the largest gaps in the wealthiest countries, led by the United States, Australia and Canada. Those years are spread across adulthood, not only the end of life. 80% of long-term care in Europe is performed by informal caregivers, the majority women.\n- Long-term care is the fastest-growing component of age-related public spending, projected to almost double across OECD countries by 2050 to 2.8% of GDP, and it is the component least amenable to productivity gains, since care requires human interaction.\n- Assisted dying legislation has surfaced in many countries and is under active consideration across a widening set of European jurisdictions. The contested path of Portugal's 2023 law, adopted by parliament but held up by presidential veto and constitutional challenge, illustrates how unsettled the terrain remains.\n- Some signals point to a healthier future. Tobacco use has fallen worldwide continuously over the last 20 years, although gains are partly offset by a shift to e-cigarettes, heated tobacco and nicotine pouches. Consumers in the US, UK, Germany and China rank wellness as a top or important priority, with mental and cognitive health among the areas of greatest unmet need. The global wellness economy has roughly doubled in value since 2013, though it remains concentrated in high-income markets.\n\n## Implications\n\n- Health management is becoming a permanent condition of life, stretching across childhood, education, work, family formation and old age.\n- The health outcome of a worker in an Asian or African megacity is decided less by their genetic makeup or which communicable disease they may contract than by systemic factors: the city they live in, the air they breathe, the food they can access or afford, the way they must conduct their work, and more extreme weather. Health is a systemic challenge like no other and will need to be addressed in a systemic manner.\n- For one group, the new health landscape means flexibility and autonomy. For the other, it is an added burden. More responsibility for health management may also mean higher costs for individuals and families.\n- More input alone, from doctors, AI tools, social media creators and other sources, does not create a better or more empowering information environment.\n- If medicine is increasingly capable of extending life without proportionately extending the quality of it, societies will have to decide what they are extending life for.\n- A major question is how to close the gap between those who can manage their health proactively and those who cannot. If left unsolved, growing health inequality will become a defining feature of this century.\n- Traditional healthcare systems will likely remain the bedrock of health, but they may only handle a fraction of what health management will entail over the coming decades. The rest will be distributed across everyday life: homes, workplaces, devices, family and friends.", "context/megatrends/individualised-everyday-life": "# Individualised everyday life\n\n## What it is\n\nAs individualisation in its various expressions becomes a worldwide condition, the standardised communal scaffolding of the past is giving way to a manifold, negotiated and self-authored pluralisation of everyday life. Across very different societies the underlying indicators point the same way: smaller households, more people living alone, postponement of marriage and childbirth, and less defined and linear life-phases. On the level of individual consciousness, identity shifts from something that is given to something that is constructed, maintained and revised. The forms and expressions of individualisation vary sharply by culture, social structures and political system, yet its overall direction is unmistakable. This also comes with a cost, in the form of rising loneliness, isolation and social fragmentation.\n\nIndividualisation has typically been connected to the progression of developed nations and (Western) values like personal autonomy, self-direction and individual rights, sometimes invoked as the ideal in contrast to the constraints of traditionalism and communal living. The realities of social life are not that simple. Humans are individuals but also social animals, and the idea that we can strip away the layers of collective belonging, social values and culture to arrive at our true authentic selves is little more than a myth. Individualisation can rhyme with empowerment, but it can also rhyme with fragmentation, loneliness and isolation. Considered less as an abstract ideal and more as a composite of concrete indicators, how people live, what their social and relational arrangements are, their goals and values, what they teach their children, it is a trend that has been growing worldwide for decades. Socially, we are moving from more standardised configurations towards more diverse, hybrid, negotiated and context-dependent arrangements.\n\n## Sub-trends\n\n- The decline of traditional social institutions\n- Household downsizing\n- Blurring of life-phases\n- Expansion of the global middle class\n- Expansion of access to education\n- Increasing integration of women into the labour force\n- Lifestyle and consumption as identity markers\n- Individual life becoming 'place-polygamous'\n- Alternative family formations\n\n## Uncertainties\n\n- What will be the extent of the current wave of traditionalist backlash (visible in legislative rollbacks and cultural and political movements)?\n- Will societal efforts to counteract social atomisation, loneliness and other mental health concerns be sufficient to alleviate the negative fallout of individualisation?\n- Might economic constraints and precarity become further barriers for individualised practices?\n- Will renewed spirituality, religion and other forms of cultural community offer an alternative to the isolating effects of individualisation?\n- Does individualisation produce more trust overall (because relationships are chosen rather than inherited) or less (because shared frameworks erode)?\n\n## Drivers\n\n- The shift began in the mid-twentieth century when perceptions, norms and behaviours built around the male-breadwinner household, traditional family formation and household patterns, and a relatively predictable life sequence that organised everyday life across much of the world started to break down.\n- Changes in household structure and life-phase sequencing are the visible outcomes of underlying socioeconomic shifts. Among the most consequential are the global expansion of education, especially for girls and young women, and the steady integration of women into paid work. Other key drivers include the move from rural to urban living and the growth of white-collar employment. Together these forces are the structural engines beneath individualisation and the reconfiguration of social life.\n- The global middle class (people who live on between 10 and 20 USD a day) now comprises over 4 billion people, around half of the world's population. Rapid economic development in Asia means this group is expected to grow by another billion within the next decade, reaching 5.7 billion out of a world population of 8.7 billion by 2035. World Values Survey data show 'self-expression values' rising in step with economic development across many cultures, not only Western ones.\n- Globalisation, technology and media have connected individuals to large abstract systems in a new way, on both a local and a worldwide level. Through technologies, the internet, increased mobility and mass media, the individual has become 'place-polygamous', connected to several places at once that in concert help to form their identity.\n- The social theorist Anthony Giddens links this to 'the institutional reflexivity of modernity' and the reorganisation of time and space, whereby life has become separated from its previous forms and structures and has become more fragmented, unstructured and uncertain. What emerges is the self as a 'reflexive project'.\n- The global ubiquity of platforms like TikTok, Douyin, Instagram, KakaoTalk and WhatsApp, all of which structurally reward individuality and self-presentation, reinforces these dynamics from the digital side.\n\n## Manifestations\n\n- Since the 1960s, a documented trend has been a rise in both individualist practices (indexed by household size, the share of single-person households, and the ratio of divorced or separated to married or widowed people) and individualist values (the relative importance of friends versus family, whether independence rather than obedience is endorsed as a value to teach children, and preference for self-expression goals).\n- Household sizes have been declining by approximately 0.5 people per decade over the past five decades, linked primarily to the global increase in people living alone, but also to declining fertility, smaller families, increasing life expectancy, and smaller household formations arising from divorce or single parenthood. The home is the primary site for the manifestation and reproduction of many of our most fundamental social arrangements.\n- Each society has historically supported one or more dominant family-and-household norms: the extended-family household in South Asia, the nuclear family household in much of the post-war West, polygynous arrangements in parts of West Africa and the Middle East, the matrifocal household across parts of the Caribbean. With decreasing household size comes the weakening grip of these locally dominant family forms and the proliferation of alternative arrangements alongside them.\n- The consequences take culturally distinctive forms. South Korea and Japan have produced perhaps the most extreme expressions: honbap (solo eating), ohitorisama (party of one) culture, some of the world's lowest fertility rates, and kodokushi (lonely deaths) as a social category in its own right. China's post-1980 generations have been described as undergoing a 'rise of the individual', visible in the 'single economy', in tangping ('lying flat'), and in mass migration from close-knit villages to anonymous megacity life. India's urban middle classes have largely shifted away from traditional forms of arranged marriage in a single generation. In Latin America, secularisation and fertility decline run alongside vibrant urban self-expression cultures. Urbanists working in African cities document deeply aspirational, individualised urban subjectivities.\n- Life-phases are blurring, replacing the old linear script of school, career, marriage and retirement with a fluid and more self-authored sequence. The age brackets for when individuals are perceived to be 'young' or 'adult', when they settle down and start a family, or how old they are when they retire are changing, and life-phases are becoming more liquid, extended and overlapping.\n- Family formation is increasingly deferred across the world. The age at which women give birth to their first child began to increase steadily in industrialised countries in the 1960s, and the age span for when the family life phase is initiated widened (at its extreme, family life for women can now start before their 20s or around their 50s). In former Soviet countries a similar trend began in the 1990s, and across many countries in South America and Africa the same postponement is visible today.\n- Marriage is postponed and becoming less common overall. Average marriage age for women has increased across much of the world, from the early-to-mid-twenties to the late twenties or early thirties in some countries. Unmarried couples increasingly live and have children together, leading to a 'decoupling' of marriage and parenthood.\n\n## Implications\n\n- Smaller and more diverse family household manifestations, increasingly decoupled from marriage and distributed across multiple households and locations, will greatly impact how individualisation continues to be nourished and how everyday life is reorganised and lived. These changes extend from consumption patterns and needs, abilities and constraints, over to mobility and communication practices and demands, and much more.\n- Individualisation moves at different speeds and takes different shapes across societies, refracted by class, gender, region, culture and political system.\n- It comes with significant collateral effects. Individual freedom is accompanied by rising loneliness and isolation; self-expression by fragmentation; and in many places by a vigorous re-traditionalising backlash, particularly around gender, religion and family.\n- Across the variation, the structural direction is unmistakable. As households continue to shrink and diversify, life-phases loosen, access to education expands, and the global middle class grows, the standardised social scaffolding of the twentieth century gives way to more plural, negotiated and self-authored arrangements of everyday life.", "context/megatrends/inversion-of-the-population-pyramid": "# Inversion of the population pyramid\n\n## What it is\n\nThe global population is being fundamentally restructured through a shift from youth-heavy to increasingly senior-heavy societies, driven by sustained fertility decline and longer lifespans. This transition is universal in direction but uneven in pace. Some countries are already experiencing rapid ageing and population decline, while others still face continued population growth and younger age structures for decades to come. The result is a period where ageing, shrinking population and youth expansion coexist globally.\n\nThe knock-on consequences of this demographic inversion extend across societal domains. They strain pension, healthcare and education systems built for populations that were, on average, younger. They create imperatives for investment in AI and automation to offset a shrinking labour supply. They drive migration flows and affect intergenerational relations. And they shift the political calculus around conflict, innovation and institutional risk-taking.\n\n## Sub-trends\n\n- Uneven population growth concentration\n- Sustained decline in fertility rate\n- Rising life expectancy and ageing\n- Increasing dependency burdens\n- Migration pressures\n\n## Uncertainties\n\n- Will barriers to family formation, including housing costs, labour market insecurity, gender inequality and changing social norms, persist or intensify, further suppressing fertility rates?\n- To what extent will international migration cushion the effects of ageing and workforce contraction in low-fertility countries?\n- Is migration managed or disruptive, both at point of origin and destination?\n- To what extent can productivity gains through technology and automation offset the economic effects of shrinking or ageing workforces?\n- Will governments be able to adapt social systems such as pensions, healthcare and education to match changing population structures?\n- Will lower-income countries be able to keep up with the needs of their rapidly growing young population?\n\n## Drivers\n\n- The latest century of human history has been marked by unprecedented population growth. For millennia, the global population was on a slow but steady increase, as high birth ra
