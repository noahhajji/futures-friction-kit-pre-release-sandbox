ic conversation harder. Where engagement has been a carrying metric for social media, intimacy may become it for AI.\n\nThat can lead to information oracles that understand exactly you extremely well, but which you do not really understand: where does the information actually come from? It is hard to fact-check or trust something we do not understand. At the same time such oracles risk isolating each person, removing the friction that is necessary to understand others' viewpoints, since it is precisely through shared language and meetings that meaning and ethics arise. It is the ultimate possible tool of manipulation. Social media that create unreal narratives help destabilise democracy itself, creating mistrust and eroding the perception of a shared reality, and generative AI fits perfectly into that dynamic.\n\nThese challenges also constitute a potential for news media. Can they create the shared front pages of the future, or communities where people gather around stories and news? Bundling of content has already proved relatively successful in several places, including shared subscriptions across media. Could that develop into a home for shared stories? One can also imagine journalistically oriented organisations developing a healthier type of information oracle, giving relevance and intimacy but set up to challenge and bring opposing viewpoints. Newer studies show how people who use AI heavily risk losing learning, because learning requires a certain friction. Can media build products that do not just give easy answers and weaken human development, but do the opposite: built to make us better in the broadest sense of the word?\n\n## Usefulness or public good?\n\nMuch suggests that clear usefulness is essential when it comes to monetising truth in these years. Profit margins are markedly larger on selling intelligence and solutions that companies and people can use very directly than on classic journalism.\n\nFigure: a scatter plot titled \"The great information repricing\", subtitled \"Value is migrating from the content layer to the intelligence layer\". The vertical axis shows revenue per employee; the horizontal axis shows the share of revenue from intelligence and data products, from zero to one hundred per cent. Classic news media sit bottom left, and data and intelligence companies rise up and to the right along a dashed diagonal marked \"The repricing curve\". A text box on the left describes content economics: near-zero margin, with a news subscription as peak product. A text box on the right describes intelligence economics: margins above thirty-five per cent, with an institutional terminal as peak product. At the foot: a pricing ratio of 275 to 1 for the exact same raw material.\n\nPut simply, there is money in the solution economy. But what about ordinary journalism, which one cannot necessarily use very directly in one's life? Should that, perhaps, rather be understood as a public good? The development poses new challenges to financing, and perhaps to the need for support, and possibly calls for news media to focus parts of their offering into a solution economy. Otherwise it will, as now, largely not be media but domain experts and others who build that type of information business.\n\nTruth can be gold, also financially, for media-like companies. They can draw on strong norms and processes for producing the best attainable version of the truth. But in the changed digital infrastructure that type of content risks drowning or being hard to assess for quality, some users are becoming indifferent, and everything may become so personalised that we lose a reasonably shared perception of the state of things. That requires existential innovation. But it also holds important opportunities for journalism, if it can develop solutions to those truth problems, also for very specific target groups.\n\nDeveloping the self-correcting mechanisms of the new era is an existentially important task, not only for journalists but for all of us, which is why it requires deeper community and broader collaboration.\n\n## Depends on\n\n- [Existential innovation](existential-innovation.md)", "canon/concepts/uncertainty": "# Uncertainty / uncertainties\n\nUncertainty is a feature of complex systems and is fundamentally inherent when working with the future. Recognising it highlights the potential for novelty, emergence and discontinuity. It can arise from having limited knowledge about the future, or from future developments being genuinely undetermined, with multiple ways they could plausibly play out.\n\n## Uncertainty compounds over time\n\n- Many future outcomes are contingent on other developments that have not yet played out, and those, in turn, on others still.\n- Uncertainty accumulates the further into the future we look, which is part of why the long term cannot simply be extrapolated from the present.\n\n## Uncertainty is different from risk\n\n- Risk refers to situations where the probabilities of different outcomes are known, or can be estimated with some degree of confidence.\n- Uncertainty involves situations where those probabilities are unknown, unknowable or cannot be reliably estimated, reflecting a lack of information or predictability about future events or developments, and implying a higher level of ambiguity and complexity.\n\n## Critical uncertainties\n\n- Uncertainty is at the heart of all foresight work, and a fundamental aspect of strategic foresight involves identifying and engaging with critical uncertainties.\n- These are defined as high-impact drivers with uncertain outcomes.\n\n## Uncertainty is a feature\n\n- Working strategically with the future is less about identifying trends and development trajectories and much more about grasping and understanding uncertainty. Acknowledging uncertainty is a fundamental premise for making strategic decisions.\n- Uncertainty is the very reason we need strategy: without it, a plan to go from A to B would suffice. Uncertainty is not a bug but a feature, and sometimes the future seems to punish certainty. The future turns many 'givens' into uncertainties, and our brains are not really wired for it.\n\n## Depends on\n\n- [Drivers of change](drivers-of-change.md)", "canon/concepts/weak-signals": "# Weak signals\n\nSubtle and often early indicators of emerging trends or disruptions that are not yet widely recognised or understood.\n\n- Weak signals have the potential to significantly impact the future, but may also completely fade away before manifesting into a trend or a driving force.\n- These signals typically originate from the fringes of society, technology, economy, culture, or from other parts of the world, and may initially appear insignificant or disconnected from mainstream developments.\n- In this sense, weak signals can be thought of as 'pockets of the future' already embedded in the present.\n\n## Depends on\n\n- [Trends](trends.md)\n- [Drivers of change](drivers-of-change.md)", "canon/concepts/what-tools-to-use-when": "# What tools to use when?\n\nGiven the extensive number of tools available, how does one pick the right ones? The same tool can serve different purposes, and different tools can help achieve similar ends, so knowing how to choose and combine them is much a matter of practice and situational awareness. There is no single right or wrong answer, but here are some criteria that may help with selection.\n\n## Objective\n\n- Be absolutely clear and intentional about what you want your futures work to deliver. Every futures project is different, and should be based on its own specific context, premises and objectives.\n- Some tools are useful for opening minds to novelty and different perspectives, while others are more about creating a shared sense of the future or understanding what drives change in the present.\n- Some provide insights relatively quickly and with little effort, while others are more demanding and require substantial effort.\n- Some work very well in explorative workshop settings, while others are more geared towards developing or testing strategy in a decision-making context.\n\n## Mix and match\n\n- Combining and adapting foresight tools and methods is often necessary as part of a foresight process, as no single tool does everything.\n- Different questions call for different tools, and some of these tools work better in unison than others.\n- Some tools may yield an output that naturally flows as input into the next phase of the process.\n\n## Intended users\n\n- Know the recipients of your work as well as the people involved in the process.\n- Some are more open to divergent futures thinking, while others can be more constrained in their thinking and views at the initial stage.\n- Knowing both your 'intended users' and the people involved in the process or project allows you to, for example, start with 'lighter' tools that are easier to grasp, and then progress onto more challenging ones.\n\n## Striking the balance\n\n- This is connected to the point of knowing your intended users. At a high level, part of your role as a foresight practitioner is finding the edge of your users' comfort zone and helping push them just past that. This implies that what is considered provocative for one group may not be for another, and vice versa.\n- Experience suggests that when people engage with foresight work they consider too extreme or implausible, they tend to become even more confident in their original view of the future. This can contribute to their distrust in foresight, as they might think it is too speculative to be useful.\n- Conversely, if the foresight work is not challenging enough, it is easily dismissed as pointless, which again can contribute to distrust in foresight.\n- For foresight work to be used efficiently, your users must be convinced of the soundness, relevance and value of the process, whatever its objective. Only then is there a chance it will influence decisions and actions.\n\n## A fool with a tool\n\n- A fool with a tool is still a fool. Doing foresight well sits in the sweet spot where tools, frameworks, evidence-based insights, data, knowledge and trajectories overlap with futures thinking, divergent thinking, creativity, imagination and speculation. Explorative foresight that challenges the business-as-usual future and anticipates novelty needs both.\n- Foresight tools and techniques are used to guide and advance collective thinking about how the future might show up in the form of new assumptions, behaviours and realities, not to arrive at answers or outcomes that can be underlined as 'correct'. It is not about getting it right, but about doing it right.", "canon/concepts/wild-cards": "# Wild cards\n\nEvents or developments with low (perceived) probability but high impact when they occur.\n\n- Wild cards have the potential to significantly alter the future landscape in unpredictable ways, by disrupting existing realities and developments, making them critical considerations for strategic foresight.\n- Although wild cards cannot fully be anticipated or planned for, wild card analysis helps organisations better adapt to disruptive surprises by considering possible wild cards and assessing their potential implications.\n- The term was co-introduced by CIFS in 1992.", "canon/concepts/worldview": "# Worldview\n\nHow people see the world, with an emphasis on the unconscious assumptions and biases they do not call into question.\n\n- Worldviews are shaped by the culture, experiences, norms and mindsets we carry with us, and influence our habitual ways of thinking and perceiving our situations and reality.\n- Becoming aware of our own worldview, and holding space for those of others, who may make sense of the world, and of the future, quite differently from ourselves, is an important part of foresight.\n- It helps people become mindful of the 'frame' they are using, including what is left out of that frame.\n\n## The official future\n\n- Views of the future very often tell more about the era, or zeitgeist, in which they were formulated than about the future. Attempts to foresee the future tend to be good on technological aspects while remaining stuck in their own time on behaviour, perceptions and social attitudes.\n- Dominant images of the future risk becoming the 'official future', and can discredit and delegitimise other futures.\n- A critical futures thinker is attentive to assumptions about the future that are rooted in the present and path-dependent, because they are sometimes incorrect or misguided: frozen in time as the world has shifted around them.\n\n## Diversifying the future\n\n- Diversifying the future means questioning the futures methods we use, since many traditional futures studies methodologies and frameworks are rooted in western-centric views; being comfortable challenging our own worldviews, since they set the boundaries of what we believe is possible; and ultimately widening the lens of what the future might hold.\n\n## Depends on\n\n- [Assumptions](assumptions.md)", "canon/methods/_index": "# canon/methods/\n\n- [/canon/methods/backcasting.md](backcasting.md)\n- [/canon/methods/causal-layered-analysis.md](causal-layered-analysis.md)\n- [/canon/methods/cross-impact-analysis.md](cross-impact-analysis.md)\n- [/canon/methods/delphi-method.md](delphi-method.md)\n- [/canon/methods/driver-mapping.md](driver-mapping.md)\n- [/canon/methods/enablers-and-blockers.md](enablers-and-blockers.md)\n- [/canon/methods/five-whys.md](five-whys.md)\n- [/canon/methods/futures-swot-tows.md](futures-swot-tows.md)\n- [/canon/methods/futures-triangle.md](futures-triangle.md)\n- [/canon/methods/futures-wheel.md](futures-wheel.md)\n- [/canon/methods/horizon-and-environmental-scanning.md](horizon-and-environmental-scanning.md)\n- [/canon/methods/organisational-memory-and-contextual-reuse.md](organisational-memory-and-contextual-reuse.md)\n- [/canon/methods/pace-layers.md](pace-layers.md)\n- [/canon/methods/premortem.md](premortem.md)\n- [/canon/methods/reimagine.md](reimagine.md)\n- [/canon/methods/scenario-development.md](scenario-development.md)\n- [/canon/methods/scenario-immersion.md](scenario-immersion.md)\n- [/canon/methods/signposting.md](signposting.md)\n- [/canon/methods/the-ma-brief.md](the-ma-brief.md)\n- [/canon/methods/the-seven-provocations.md](the-seven-provocations.md)\n- [/canon/methods/three-horizons.md](three-horizons.md)\n- [/canon/methods/uncertainties-assessment.md](uncertainties-assessment.md)\n- [/canon/methods/visioning.md](visioning.md)\n- [/canon/methods/wind-tunnelling.md](wind-tunnelling.md)", "canon/methods/backcasting": "# Backcasting\n\nBackcasting is an effective method for linking the future back to the present, helping to assess the conditions, changes and events that logically connect a given future to the present. Unlike traditional planning, backcasting starts in the future and works backwards. If you have already identified alternative futures, or a preferred future, for instance through a scenario development process, backcasting can be used to pinpoint the factors and events that will make these scenarios come true, as well as which strategies will influence them.\n\n## How it works\n\n- Backcasting involves creating a timeline in reverse, starting from a future scenario and working backwards to identify the key steps, events and actions that will make it happen.\n- This helps connect future change to the present, overcoming the 'present bias' that often limits our planning.\n- One particular focus of backcasting is to identify what lies within the control of the organisation, and can therefore be managed, and what lies outside its control and therefore needs to be monitored.\n- Alternatively, backcasting can be used to determine what series of events could lead to a given undesirable scenario, and what steps could be taken to avoid such a scenario or mitigate its consequences.\n\n## Use backcasting to\n\n- Connect a given future to the present, identify what needs to be done to deliver it, and test the feasibility of the actions and approaches needed to get there.\n- Identify which future factors and events lie within the organisation's control and which lie outside its control.\n- Establish pathways of change to help identify new initiatives and interventions to enhance desirable changes or mitigate undesirable events.\n\n## Key things to consider\n\n- You can backcast from a scenario, vision or any other description of future change. A good way to set up your backcast is to outline four or five key features of the future scenario, vision or change. You can either work on one feature at a time, or you can work across these as you step back towards the present. This helps identify patterns and determine whether any specific factors or events are particularly critical.\n- Different 'entries' on your backcasting timeline can help you explore various types of factors or events. Try to look for both external factors and events from outside your control and concrete actions you have taken that will have either direct or indirect implications. Consider including relevant (fictional) future data points or even adding descriptive 'news headlines from the future' along your backcasting timeline.\n- After completing your backcast, take time to review your thinking by playing your backcast forward. Check that it makes sense and that it is feasible and coherent. Questioning the cause and effect of each step can help identify missing factors that are critical.\n- Try to explore the actual consequences of your backcasting outcome. What events and changes can you or your organisation influence and what do you need to do to deliver these aspects? Also consider if and how you can influence aspects outside your control. Who or what has control, and what can you do to influence that?\n\n## Figure: backcasting\n\nTwo stacked elements on a horizontal axis running from present on the left to future on the right. The upper element is a circle at the far right labelled scenario, vision or change, with a series of backward-curving arrows hopping leftward from it towards the present, illustrating the reverse direction of travel. The lower element is a timeline grid bounded by vertical lines at the present and the future, divided into three horizontal bands labelled key feature 1, 2 and 3. Within each band, dots are placed along branching horizontal lines at different points in time, representing the factors, events and actions identified as you step back from the future towards the present.\n\nFor the assistant: draw this only in the reply after the person has said yes to your offer to draw it, never in the reply that explains. Show it as a small card, exactly as it is. Never mark, place or add their plan, their assumptions or anything else of theirs on it: placing it for them would make the theory behind the figure too reductive. Where they stand on it is theirs to work out, with you, in words; if they ask you to place it, say why you do not. Add a sentence or two on what to look at. Where HTML would arrive as code, describe it in words instead.\n\n```html\n<svg class=\"ffbck\" viewBox=\"0 0 560 362\" style=\"display:block;width:100%;max-width:480px\" role=\"img\" aria-label=\"Backcasting: arrows step back from a future vision to the present, above a timeline of three key features\">\n<style>\n.ffbck text{font:12.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.5}\n.ffbck .s{font-size:10.5px}\n.ffbck .l{fill:none;stroke:#413C38;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}\n.ffbck .m{stroke-opacity:.5}\n.ffbck .f{stroke-opacity:.2}\n.ffbck .k{fill:#413C38}\n.ffbck .o{fill:#FFC7A5;stroke:#413C38;stroke-opacity:.5;stroke-width:.75}\n.ffbck text.ref{font:9.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.55;font-weight:400}\n</style>\n<rect width=\"560\" height=\"362\" rx=\"14\" fill=\"#fff\"/>\n<text x=\"525\" y=\"34\" text-anchor=\"end\">Scenario, vision or change</text>\n<circle class=\"o\" cx=\"470\" cy=\"72\" r=\"11\"/>\n<path class=\"l m\" d=\"M457,72 Q416,30 375,72\"/>\n<path class=\"l m\" d=\"M376.3,67.2 L375,72 L379.8,70.5\"/>\n<path class=\"l m\" d=\"M375,72 Q327.5,30 280,72\"/>\n<path class=\"l m\" d=\"M281.7,67.3 L280,72 L284.9,70.9\"/>\n<path class=\"l m\" d=\"M280,72 Q232.5,30 185,72\"/>\n<path class=\"l m\" d=\"M186.7,67.3 L185,72 L189.9,70.9\"/>\n<path class=\"l m\" d=\"M185,72 Q137.5,30 90,72\"/>\n<path class=\"l m\" d=\"M91.7,67.3 L90,72 L94.9,70.9\"/>\n<path class=\"l m\" d=\"M90,100 V296 M470,100 V296\"/>\n<path class=\"l f\" d=\"M90,165 H470 M90,230 H470\"/>\n<text x=\"100\" y=\"118\" class=\"s\">Key feature 1</text>\n<path class=\"l m\" d=\"M130,142 H456 M330,142 L306,124 H200\"/>\n<circle class=\"k\" cx=\"440\" cy=\"142\" r=\"3\"/>\n<circle class=\"k\" cx=\"372\" cy=\"142\" r=\"3\"/>\n<circle class=\"k\" cx=\"300\" cy=\"142\" r=\"3\"/>\n<circle class=\"k\" cx=\"150\" cy=\"142\" r=\"3\"/>\n<circle class=\"k\" cx=\"290\" cy=\"124\" r=\"3\"/>\n<circle class=\"k\" cx=\"215\" cy=\"124\" r=\"3\"/>\n<text x=\"100\" y=\"183\" class=\"s\">Key feature 2</text>\n<path class=\"l m\" d=\"M160,207 H456 M270,207 L246,189 H190\"/>\n<circle class=\"k\" cx=\"425\" cy=\"207\" r=\"3\"/>\n<circle class=\"k\" cx=\"340\" cy=\"207\" r=\"3\"/>\n<circle class=\"k\" cx=\"215\" cy=\"207\" r=\"3\"/>\n<circle class=\"k\" cx=\"232\" cy=\"189\" r=\"3\"/>\n<text x=\"100\" y=\"248\" class=\"s\">Key feature 3</text>\n<path class=\"l m\" d=\"M120,272 H456 M380,272 L356,254 H230\"/>\n<circle class=\"k\" cx=\"450\" cy=\"272\" r=\"3\"/>\n<circle class=\"k\" cx=\"395\" cy=\"272\" r=\"3\"/>\n<circle class=\"k\" cx=\"310\" cy=\"272\" r=\"3\"/>\n<circle class=\"k\" cx=\"240\" cy=\"272\" r=\"3\"/>\n<circle class=\"k\" cx=\"140\" cy=\"272\" r=\"3\"/>\n<circle class=\"k\" cx=\"340\" cy=\"254\" r=\"3\"/>\n<circle class=\"k\" cx=\"262\" cy=\"254\" r=\"3\"/>\n<text x=\"90\" y=\"316\" text-anchor=\"middle\">Present</text>\n<text x=\"470\" y=\"316\" text-anchor=\"middle\">Future</text>\n<text class=\"ref\" x=\"536\" y=\"334\" text-anchor=\"end\">Backcasting \u00b7 Source: California 100 &amp; School of International Futures (2023), Beyond Strategic Planning: A</text>\n<text class=\"ref\" x=\"536\" y=\"346\" text-anchor=\"end\">Foresight Toolkit for Decision Makers.</text>\n</svg>\n```\n\n## Depends on\n\n- [Scenario development](scenario-development.md)\n- [Visioning (preferred future)](visioning.md)", "canon/methods/causal-layered-analysis": "# Causal layered analysis\n\nCausal Layered Analysis (CLA), developed by Sohail Inayatullah, is a comprehensive foresight method designed to uncover and analyse the deeper dimensions of complex issues. This tiered approach works down from immediate surface-level trends through deeper layers of systemic causes, cultural values and worldview dimensions that influence change.\n\nThe main utility of CLA lies in supporting individuals and organisations in revealing the internalised assumptions they use to make sense of and assign meaning to specific changes. Ultimately, it can help create narratives that facilitate change. It also addresses the risk of foresight work being too superficial and overly focused on surface trends by providing a more profound understanding of the underlying factors influencing change.\n\n## The three layers\n\nThe original CLA framework consists of four levels, but CIFS often uses a simplified version with three layers.\n\n- Observable issues: the immediate, observable trends and day-to-day realities.\n- Structures and systems: the structures, systemic factors and historical (social, economic, cultural) facts that support the observed realities.\n- Mental models and worldviews: the deepest layer of mindsets, values and cultural and ideological aspects that shape our worldviews and perceptions, and influence how issues are framed and understood.\n\n## Use Causal Layered Analysis to\n\n- Get a deeper understanding of a particular issue or challenge by uncovering the systemic causes beneath it.\n- Generate new narratives that challenge current realities.\n- Map competing views of the future by recognising the different worldviews and perspectives of various stakeholders, ultimately supporting more transformative strategies.\n\n## Key things to consider\n\n- When working with Causal Layered Analysis, be aware that it is a relatively complex method that requires confidence in divergent thinking and exploring beyond the obvious and observable. It is also difficult to do well without a diversity of perspectives present.\n- The Causal Layered Analysis exercise essentially has two phases. First, exploring the focal issue from the top down, starting with immediate trends and moving down through the deeper layers. Second, working your way back up from the deepest worldview layer to create new, alternative narratives that challenge current realities. Hence, the ultimate goal of CLA is not just to analyse, but to create new narratives that facilitate change.\n- Causal Layered Analysis is a versatile tool that can be staged in various ways. These include mapping the present to prevent worldview blindness, enhancing a visioning process by outlining how things can be moved towards a desired future, and unpacking an issue across different stakeholder views or worldviews.\n\n## Figure: Causal Layered Analysis\n\nAn iceberg cross-section, with a wavy waterline crossing it near the top. The top is labelled visible and tangible, the bottom hidden and intangible. Three numbered layers run down the iceberg, each with a prompting question and examples of content. Layer 1, observable issues, above the waterline, asks what is happening and contains things, trends and headlines. Layer 2, structures and systems, below the waterline, asks who and what are causing and influencing this and contains patterns, actors and PESTEL factors. Layer 3, mental models and worldviews, the deepest, asks what the underlying beliefs and assumptions are and contains symbolism, sayings and proverbs, myths and metaphors, values and culture.\n\nFor the assistant: draw this only in the reply after the person has said yes to your offer to draw it, never in the reply that explains. Show it as a small card, exactly as it is. Never mark, place or add their plan, their assumptions or anything else of theirs on it: placing it for them would make the theory behind the figure too reductive. Where they stand on it is theirs to work out, with you, in words; if they ask you to place it, say why you do not. Add a sentence or two on what to look at. Where HTML would arrive as code, describe it in words instead.\n\n```html\n<svg class=\"ffcla\" viewBox=\"0 0 560 362\" style=\"display:block;width:100%;max-width:480px\" role=\"img\" aria-label=\"Causal layered analysis as an iceberg: observable issues above the waterline, structures and systems below, mental models and worldviews deepest\">\n<style>\n.ffcla text{font:12.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.5}\n.ffcla .b{font-weight:500;fill-opacity:.95}\n.ffcla .s{font-size:10.5px}\n.ffcla .l{fill:none;stroke:#413C38;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}\n.ffcla .m{stroke-opacity:.5}\n.ffcla .w{fill:#FFC7A5;fill-opacity:.45}\n.ffcla text.ref{font:9.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.55;font-weight:400}\n</style>\n<rect width=\"560\" height=\"362\" rx=\"14\" fill=\"#fff\"/>\n<path class=\"w\" d=\"M121,205 L312,205 L296,262 L250,296 L190,300 L140,280 L118,225 Z\"/>\n<path class=\"l\" d=\"M215,38 L243,66 L258,92 L300,150 L312,205 L296,262 L250,296 L190,300 L140,280 L118,225 L128,160 L170,92 L190,62 Z\"/>\n<path class=\"l m\" d=\"M121,205 H312\"/>\n<path class=\"l m\" d=\"M30,92 q10,-5 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0\"/>\n<text x=\"215\" y=\"76\" class=\"b\" text-anchor=\"middle\">1</text>\n<text x=\"215\" y=\"154\" class=\"b\" text-anchor=\"middle\">2</text>\n<text x=\"215\" y=\"256\" class=\"b\" text-anchor=\"middle\">3</text>\n<text x=\"30\" y=\"52\" class=\"s\">Visible and</text>\n<text x=\"30\" y=\"65\" class=\"s\">tangible</text>\n<text x=\"30\" y=\"272\" class=\"s\">Hidden and</text>\n<text x=\"30\" y=\"285\" class=\"s\">intangible</text>\n<text x=\"345\" y=\"68\" class=\"b\">Observable issues</text>\n<text x=\"345\" y=\"83\" class=\"s\">What is happening?</text>\n<text x=\"345\" y=\"146\" class=\"b\">Structures and systems</text>\n<text x=\"345\" y=\"161\" class=\"s\">Who and what is causing this?</text>\n<text x=\"345\" y=\"248\" class=\"b\">Mental models and worldviews</text>\n<text x=\"345\" y=\"263\" class=\"s\">Which beliefs and assumptions?</text>\n<text class=\"ref\" x=\"536\" y=\"334\" text-anchor=\"end\">Causal layered analysis \u00b7 Source: Inayatullah, S. (2019), Causal Layered Analysis: A Four-Level Approach to</text>\n<text class=\"ref\" x=\"536\" y=\"346\" text-anchor=\"end\">Alternative Futures. Modified by CIFS.</text>\n</svg>\n```\n\n## Depends on\n\n- [Worldview](../concepts/worldview.md)\n- [Assumptions](../concepts/assumptions.md)", "canon/methods/cross-impact-analysis": "# Cross-impact analysis\n\nCross-impact analysis is used to explore the interactions between different drivers or events and assess their systemic impact on one another. By mapping the interdependencies, this method helps to understand how elements influence each other, rather than just examining them in isolation. This highlights the importance of considering how various drivers or events can affect each other, providing a more comprehensive understanding of potential futures.\n\n## How it works\n\n- The process involves identifying key drivers (often from a driver mapping exercise) and evaluating their interactions using a cross-impact matrix, where you assign qualitative or quantitative scores to gauge the strength and nature of these interactions.\n- Once the drivers are plotted in the matrix with their impact scores on each other, the cumulative scores reveal which drivers exert influence across many others. These are the drivers with the most significant potential to shape the system as a whole.\n- This process helps to prioritise drivers that have the most significant potential to shape future outcomes and develop scenarios that reflect various possible futures.\n\n## Use cross-impact analysis to\n\n- Identify the most significant drivers of a system (the ones that seem to have the most impact across the grid).\n- Explore interdependencies and strengthen the understanding that the future is shaped by interacting factors.\n- Paint a fuller and more consistent picture of potential futures, as valuable input into a scenario analysis.\n\n## Key things to consider\n\n- Cross-impact analysis is often used in combination with other foresight tools. It can be especially useful when crafting future scenarios to make sure that scenario structure and reasoning do not have built-in inconsistencies that will undermine the credibility of the scenario.\n- The first step of defining drivers or events to be included in the analysis is crucial to the success of the exercise. Any influences not included will, of course, be completely excluded from the analysis. However, the inclusion of events that are not pertinent can complicate the analysis unnecessarily.\n- Rather than assigning quantitative impact scores to drivers in the matrix, it is sometimes useful to take a more qualitative approach to how the elements could interact and the outcomes they may bring. This can give you fresh perspectives on how many factors may come together in complex ways to create surprising futures.\n\n## Figure: cross-impact matrix\n\nA grid with the same list of drivers on both axes, rows down the left and columns across the top, followed by a final column, active impact sum, asking how strongly a driver impacts all others. The bottom row is labelled passive impact sum, asking how strongly a driver is impacted by all others. The diagonal cells, a driver against itself, are shaded and left blank. The worked example in the top row shows Driver #1 scored against the others as 2, 0, 1 and 3, summing to an active impact sum of 6. The scoring scale is 3 for strong and direct impact, 2 for medium impact, 1 for limited impact and 0 for no impact.\n\n## Depends on\n\n- [Driver mapping](driver-mapping.md)\n- [Drivers of change](../concepts/drivers-of-change.md)", "canon/methods/delphi-method": "# Delphi method\n\nA Delphi study is a collaborative foresight method designed to elicit consensus building among a panel of experts on a series of future hypotheses and propositions. The method is based on the principle that the collective foresight from a carefully selected group of experts, the Delphi panellists, provides superior insights and orientation on potential future developments compared to individual judgements and forecasts. This is especially true when dealing with complex areas with a high degree of uncertainty and incomplete knowledge.\n\n## How it works\n\n- While Delphi study applications are diverse, at its core the Delphi method is a controlled debate carried out over two or more iterative learning rounds.\n- The first Delphi round establishes the group's initial views.\n- In the second and subsequent rounds, feedback from the previous round, including current overall panel consensus measures and anonymised answers, is provided to all participants. This allows them to learn from the views of others and further develop their own opinions and reasoning based on their co-participants' input.\n- A Delphi panel will usually move towards some level of consensus over several rounds. But even when this does not occur, the reasons for disparate positions and any high level of uncertainty become clear.\n- The anonymity of a Delphi study is a key characteristic. Participants can know who else is involved, but not what they have said. This helps avoid groupthink and ensures that the process is not influenced by biased group dynamics.\n\n## Real-time Delphi\n\n- A less resource-intensive variant is the real-time Delphi method, which does not require multiple rounds.\n- It leverages a digital platform to facilitate continuous, asynchronous interaction in the panel.\n- This approach allows participants to monitor the panel's overall opinion and shifting consensus, and view comments and arguments made by other participants in real time.\n\n## Use the Delphi method to\n\n- Leverage the collective intelligence from a diverse group of experts.\n- Provide orientation on complex future issues by understanding where expert judgement converges, where it diverges, and where genuine uncertainty remains.\n- Support informed decision-making by providing structured expert judgement and a deeper understanding of key future issues.\n\n## Key things to consider\n\n- Delphi studies are difficult to do well, and a poorly designed Delphi can provoke antagonism and leave you with poor-quality insights. Therefore, a great deal of attention must be given to the choice of panellists. The experts involved need to be selected based on their knowledge and experience so that they can contribute with valuable insights, while also representing diversity of perspectives. It is crucial to bring in different areas of expertise related to the same focal issue to enrich the discussion and enhance the quality of the findings.\n- The future hypotheses/propositions and their answer scales included in the Delphi must be meticulously prepared and tested to avoid ambiguity. The quality of the results depends on all panellists interpreting each hypothesis in the same way. If a hypothesis is ambiguous, panellists will respond based on their own differing interpretations, making the results difficult to trust.\n- Delphi studies always tackle issues formulated in hypotheses/propositions about which uncertain and incomplete knowledge exists, and unlike traditional questionnaires, they do not rely on direct questions. The panellists should be prompted with the importance of providing elaborate argumentation for their choices and assessments, for the other panellists to consider in subsequent rounds.\n- Normally, the number of participants in a Delphi is relatively small. Consequently, a Delphi study does not (and is not intended to) produce statistically significant results across a representative sample. It represents the synthesis of opinion of the group of panellists, no more, no less.\n- The Delphi method is relatively complex to execute. It is a time-consuming and resource-intensive process and may therefore not be appropriate for projects with a short timeline or limited resources.\n\n## Figure: Delphi method overview\n\nA flow chart with two parallel tracks, round-based and real-time, which both start from and end in a shared box. At the top, Delphi preparation spans both tracks: recruiting the Delphi panel based on identified selection criteria, and developing futures hypotheses/propositions. The round-based track runs through four boxes in sequence: distribution round 1 (collecting responses from the initial survey), response analysis round 1 (analysing responses from round 1 and preparing feedback for round 2), distribution round 2 (collecting responses from the refined survey with open results from round 1), and response analysis round 2 (analysing responses to potentially feed into further rounds). The real-time track is a single box, Delphi distribution, collecting responses through continuous interaction and asynchronous participation, with a circular arrow looping between response and revisit. At the bottom, summary and results spans both tracks: dissemination of consensus results, key insights and areas of dissensus.\n\n## Depends on\n\n- [Strategic foresight should be approached as a form of collective intelligence](../principles/foresight-as-collective-intelligence.md)\n- [Cognitive biases in futures thinking](../concepts/cognitive-biases-in-futures-thinking.md)", "canon/methods/driver-mapping": "# Driver mapping\n\nDriver mapping helps to identify the most influential drivers of change in a system or in relation to a specific domain or focal topic. A driver of change is an underlying force that generates or shapes a trend or development. Drivers include things like shifts in attitudes and behaviour, as well as economic and technological forces that influence how something spreads and grows.\n\n## How it works\n\n- Driver mapping is essentially about making sense of gathered insights, such as from a scanning exercise, and identifying leading drivers based on their nature or typology. There are different ways to do this.\n- One of the most common techniques is the PESTEL framework (or other acronym variants), where drivers are mapped across six different macro dimensions.\n- Alternatively, the Verge framework, developed by Richard Lum and Michele Bowman, takes an ethnographic view, mapping change by its points of impact on people.\n\n## Use driver mapping to\n\n- Organise and understand key drivers of change and provide a more detailed picture of future developments facing an organisation.\n- Produce a set of critical or important drivers as key input into further futures work and for the creation of futures scenarios.\n- Look for affinity between signals to reveal the larger drivers beneath them. Where several signals (e.g. from a scanning exercise) move in the same direction, they often point to a single underlying driver.\n\n## Key things to consider\n\n- Driver mapping does not have to follow a predefined framework like PESTEL or Verge. Sometimes it may be desirable to cluster drivers by your own alternative themes that emerge from your brainstorm or research that are more suitable for your specific purpose.\n- A driver should be 'neutral' and allow for different outcomes. In that sense, a driver should not be framed in a positive or negative form. For example, 'job loss from automation' is not neutral, but 'impact of automation on jobs' is a suitable driver.\n- Look for possibilities to eliminate duplicates and merge drivers that are too similar. Too many drivers risk a longer analysis and treating less influential drivers as influential. Conversely, too few may limit the important dimensions of the analysis and lead to a simplistic one that omits critical drivers.\n- At this stage, it can sometimes be desirable to identify the most important drivers by mapping them according to their impact on the domain or topic of interest and the uncertainty of the future direction or outcome of the driver. This approach is described in more detail as part of the Uncertainties Assessment tool.\n\n## Figure: PESTEL framework\n\n| Dimension | Description |\n|---|---|\n| Political | Political factors, such as interventions in societies and economies, (geo)political tensions, development goals, etc. |\n| Economic | Economic factors, such as overall economic growth, markets, inflation, etc. |\n| Social | Social factors, such as demographic change, changes in people's behaviour, values and lifestyles, etc. |\n| Technological | Technological advancements and their influence on society, businesses, new innovations, etc. |\n| Environmental | Environmental/ecological aspects, such as the effects of climate change, loss of biodiversity, new energy sources, etc. |\n| Legal | Legal/regulatory factors, such as data protection, anti-discrimination laws, global regulatory issues, etc. |\n\n## Figure: Verge framework\n\n| Domain | Description |\n|---|---|\n| Define | Concepts, ideas and paradigms we use to define ourselves and the world around us (worldviews, social values, attitudes, etc.) |\n| Relate | Structures, relationships and ways of interaction which organise people and organisations (social structures, governance structures, business models, etc.) |\n| Connect | Technologies and practices used to connect people, places and things (digital technologies, media, music, language, etc.) |\n| Create | Processes and technologies through which we innovate, design and produce (manufacturing, engineering, life sciences, rule-making, etc.) |\n| Consume | Ways in which we acquire and consume the goods and services we create (modes of exchange, consumer preferences, marketing, etc.) |\n| Destroy | Ways in which we destroy value and the reasons for doing so (waste, attempts to undermine rules and norms, repression, harmful reproduction of old systems, etc.) |\n\n## PESTEL as a checklist\n\nThe PESTEL framework can be restrictive and prescriptive in the exploratory scanning phase. Use it as a checklist instead: once the trends are gathered, check whether all six dimensions are covered and whether anything from a dimension is missing.\n\n## Depends on\n\n- [Drivers of change](../concepts/drivers-of-change.md)\n- [Horizon and environmental scanning](horizon-and-environmental-scanning.md)\n- [Trends](../concepts/trends.md)", "canon/methods/enablers-and-blockers": "# Enablers and blockers\n\nThe way future change occurs depends on the outcome of the power struggle between enabling and limiting forces. Forecasting methods typically derive trends from past data and extrapolate these trends forward without much consideration of the forces that nurture the trend and may eventually alter it. By using the Enablers and Blockers framework, we can get a better understanding of the dynamics of change of a given trend development.\n\n## How it works\n\n- This understanding is gained by identifying underlying dynamics in favouring forces (enablers) that create, sustain and catalyse a trend, and limiting forces (blockers) that stand in the way of a trend and slow it down, possibly even diverting it.\n- In essence, this provides a framework for analysing factors that will influence and define how a specific development plays out.\n- Understanding a trend or development as a reflection of underlying enabling and blocking forces reveals why trend trajectories are capable of sudden surprises and reversals.\n- When thinking about future change, we always have to keep in mind that while a lot of things might change significantly, many things might also stay the same.\n\n## Use enablers and blockers to\n\n- Understand a trend as a reflection of underlying enabling and blocking forces.\n- Acknowledge the complexity inherent in how change occurs.\n- Better anticipate the inflection points where a trend's trajectory might shift.\n\n## Key things to consider\n\n- Start by assessing how a given trend is currently impacting your area of interest (industry, sector, etc.). This is followed by brainstorming factors that promote or catalyse the trend (enablers) and the factors that stop, limit or divert the trend (blockers).\n- Try to construct your own trend development trajectory that reflects the power struggle between the identified enablers and blockers. Where/when enablers are strong and blockers are weak, we can expect the pace of change to be rapid. Where blockers are strong, we should expect them to deflect or slow the trend. Finally, discuss the future impact and implications that derive from the development.\n- Be aware that sociocultural factors are often a key source of trend blocking. If the trend or development challenges prevailing social, cultural or ethical norms, it is likely that change will only proceed slowly, if at all.\n- Equally important to identifying enablers and blockers is to identify potential trend breaks (a moment that can signal the end of an existing trend and the start of a new one) and inflection points (a moment where the rate of change shifts significantly, often marking a transition in the growth or decline phase of a trend). This can have wide-ranging implications for current strategic plans and priorities. Very often it is about timing.\n\n## Figure: Enablers and Blockers canvas\n\nA canvas with a horizontal axis running from present on the left to future on the right. An S-shaped curve labelled development trajectory rises from the bottom left, steepens in the middle and levels off at the top right. Blockers are labelled in the upper left area, with dots of varying sizes scattered above and around the early part of the curve. Enablers are labelled in the lower right area, with dots of varying sizes scattered below and around the later part of the curve. Dot size indicates the relative strength of each force. At the far right, where the curve levels off, a label reads implications/impact, for societies, industries, business environment, etc.\n\nFor the assistant: draw this only in the reply after the person has said yes to your offer to draw it, never in the reply that explains. Show it as a small card, exactly as it is. Never mark, place or add their plan, their assumptions or anything else of theirs on it: placing it for them would make the theory behind the figure too reductive. Where they stand on it is theirs to work out, with you, in words; if they ask you to place it, say why you do not. Add a sentence or two on what to look at. Where HTML would arrive as code, describe it in words instead.\n\n```html\n<svg class=\"ffenb\" viewBox=\"0 0 560 350\" style=\"display:block;width:100%;max-width:480px\" role=\"img\" aria-label=\"Enablers and blockers: an S-shaped development trajectory from present to future, blockers above its early part and enablers below its later part\">\n<style>\n.ffenb text{font:12.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.5}\n.ffenb .b{font-weight:500;fill-opacity:.95}\n.ffenb .s{font-size:10.5px}\n.ffenb .l{fill:none;stroke:#413C38;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}\n.ffenb .m{stroke-opacity:.5}\n.ffenb .f{stroke-opacity:.2}\n.ffenb .k{fill:#413C38}\n.ffenb .o{fill:#FFC7A5;stroke:#413C38;stroke-opacity:.5;stroke-width:.75}\n.ffenb text.ref{font:9.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.55;font-weight:400}\n</style>\n<rect width=\"560\" height=\"350\" rx=\"14\" fill=\"#fff\"/>\n<path class=\"l\" d=\"M60,262 C210,262 250,64 430,64\"/>\n<circle class=\"o\" cx=\"430\" cy=\"64\" r=\"5\"/>\n<text x=\"420\" y=\"46\" text-anchor=\"end\">Development trajectory</text>\n<text x=\"444\" y=\"62\" class=\"b\">Implications</text>\n<text x=\"444\" y=\"76\" class=\"s\">and impact</text>\n<text x=\"70\" y=\"58\" class=\"b\">Blockers</text>\n<text x=\"520\" y=\"250\" class=\"b\" text-anchor=\"end\">Enablers</text>\n<circle class=\"l m\" cx=\"112\" cy=\"108\" r=\"6\"/>\n<circle class=\"l m\" cx=\"160\" cy=\"150\" r=\"4\"/>\n<circle class=\"l m\" cx=\"96\" cy=\"172\" r=\"9\"/>\n<circle class=\"l m\" cx=\"196\" cy=\"112\" r=\"5\"/>\n<circle class=\"l m\" cx=\"146\" cy=\"206\" r=\"3\"/>\n<circle class=\"k\" cx=\"300\" cy=\"204\" r=\"7\"/>\n<circle class=\"k\" cx=\"352\" cy=\"164\" r=\"4\"/>\n<circle class=\"k\" cx=\"392\" cy=\"208\" r=\"9\"/>\n<circle class=\"k\" cx=\"424\" cy=\"146\" r=\"5\"/>\n<circle class=\"k\" cx=\"342\" cy=\"240\" r=\"3\"/>\n<path class=\"l f\" d=\"M60,290 H500\"/>\n<text x=\"60\" y=\"312\">Present</text>\n<text x=\"500\" y=\"312\" text-anchor=\"end\">Future</text>\n<text x=\"280\" y=\"312\" class=\"s\" text-anchor=\"middle\">dot size shows strength</text>\n<text class=\"ref\" x=\"536\" y=\"334\" text-anchor=\"end\">Source: Gordon, A. (2010), A DEFT Approach to Trend-based Foresight. Modified by CIFS.</text>\n</svg>\n```\n\n## The friction field\n\n- New trends and developments create friction in the existing environment, and the future unfolds in that friction field. Change enters on one side; implications for societies, industries and the business environment emerge on the other. Above the field act the turners and blockers, below it the drivers and enablers.\n- A change driver may itself be a trend. Change blockers are the forces that oppose a trend by delaying, stopping or diverting it, and the factors that cause resistance to change.\n- Whose side is the law on? The law is almost always, by design, a drag on the future, for good and for bad.\n- Do not take a trend at face value. A trend can relatively easily be identified and analysed, but understanding the forces that promote or limit it gives the more detailed picture, and very often it is about timing.\n\n## Depends on\n\n- [Trends](../concepts/trends.md)\n- [The friction field](../concepts/the-friction-field.md)", "canon/methods/five-whys": "# Five Whys\n\nGet beneath a product's inherited form by following its stated purpose and assumptions towards the need it is meant to serve.\n\n## When it helps\n\n- Within first-principles work, when an explanation stops at \"because this is how the product works\".\n- To investigate a problem, provided causal claims are supported by evidence.\n\n## Start with\n\n- One specific statement that someone can explain.\n- For product inquiry, a form or design choice.\n- For an actual failure, observations of what happened.\n\n## Working with the method\n\n- Ask about the reason in the previous answer. Vary the wording so the inquiry remains purposeful: \"What does that enable?\", \"Why is that necessary?\" or \"What need would remain if that disappeared?\"\n- Mark each answer as an observation, interpretation, assumption or value commitment. Branch when there are several explanations. Do not force a complex situation into one causal chain.\n- When an underlying need becomes clearer, separate what should be preserved from how it is currently delivered. Return to first principles or Reimagine if the user wants to explore another form.\n- Stop when an answer needs external evidence, reaches an explicit value choice or no longer changes the understanding. The number five is a prompt to go deeper, not a completion requirement.\n\n## Useful questions\n\n- \"Why must someone visit the archive to access this knowledge?\"\n- \"Is that necessary for the need itself, or a consequence of the way we built the product?\"\n\n## Capture\n\n- Starting statement.\n- Questions and answers.\n- Evidence status at each link.\n- Alternative explanations.\n- Underlying need hypothesis.\n- Preserve and reconsider choices.\n- Unresolved question.\n\n## Worked example\n\nA constructed illustration, not a universal history of news archives.\n\n- Why visit an archive? Because knowledge is stored as finished articles.\n- Why only finished articles? Because publication was the organising unit.\n- Why should that unit also determine access? The team recognises an inherited design assumption.\n- Emerging need: reliable access to established knowledge in the user's context.\n- Preserve provenance and accountability; investigate whether retrieval needs to remain article-led.\n\n## Quality boundaries\n\n- The method does not prove a root cause or a \"true\" user need.\n- Do not supply invented answers to reach five, lead the user towards AI as a predetermined solution, or turn inquiry into blame.\n- First principles is the broader approach; Five Whys is one technique that can support it.\n\n## Depends on\n\n- [First principles](../concepts/first-principles.md)", "canon/methods/futures-swot-tows": "# Futures SWOT-TOWS\n\nTOWS is derived from the SWOT analysis and is a practical tool to develop strategic options from an external and internal analysis, by matching current internal factors to future external factors. In strategic foresight it is used to identify relationships between an organisation's current strengths and weaknesses and the opportunities and threats in alternative futures, so as to identify the strategic options the organisation could pursue.\n\n## How it works\n\nThe matrix crosses the internal present with the external future.\n\n| Internal, present / External, future | Opportunities (O) | Threats (T) |\n|---|---|---|\n| Strengths (S) | S-O strategies: how can you leverage your strengths to capitalise on future opportunities? | S-T strategies: how can you leverage your strengths to avoid or minimise the impact of future threats? |\n| Weaknesses (W) | W-O strategies: how can you address your weaknesses to capitalise on future opportunities? | W-T strategies: how can you address your weaknesses to reduce the impact of future threats? |\n\n- For one scenario at a time, reflect on the opportunities and threats that emerge in it and on the organisation's current strengths and weaknesses that might influence how it can respond.\n- Identify two to four strategic initiatives the organisation could implement in response to the strategic implications and the TOWS analysis, and capture each on its own initiative template.\n- Be as clear as possible in the strategic reasoning and keep initiatives as actionable as possible. Avoid all-encompassing initiatives that try to capture everything believed to be important. Several options can apply to the same future opportunity or threat.\n\n## Key things to consider\n\n- S-O strategies are often the easiest and most intuitive to work with, because future opportunities are often maximised through innovation of new products and services that fit future needs, or business model innovation to fit a future competitive landscape. Those more versed in risk management may find the threats side easier.\n- Initiatives tend to land at the customer end of the value chain. Organisations deploy strategic options at every point of the value chain, not only in customer-facing product and service development: optimising logistics networks, partnerships, joint ventures and acquisitions, procurement and sourcing, divesting or leaving markets, new revenue streams.\n- The initiatives are the input to wind-tunnelling, where they are tested across the whole scenario set.\n\n## Figure: the value chain\n\nFive chevron arrows in a row for the primary activities, inbound logistics, operations, outbound logistics, marketing and sales, services; four horizontal bars beneath for the support activities, firm infrastructure, human resource management, technology development, procurement; a starburst on the right labelled value creation and profit.\n\n## Depends on\n\n- [Scenario development](scenario-development.md)\n- [Scenario immersion](scenario-immersion.md)", "canon/methods/futures-triangle": "# Futures triangle\n\nThe Futures Triangle, developed by Sohail Inayatullah, serves as an intuitive tool to guide our thinking and help us map the dynamics at play when change occurs across the three dimensions that shape future outcomes: the push of the present, the pull from the future and the weight of history. The tension and interaction between these three forces highlights that the way future change occurs depends on the outcome of the 'friction field' created between different forces. This helps us recognise that change is often not straightforward, and always multifaceted, as it is shaped by interacting forces.\n\n## The three dimensions\n\n### Push of the present\n\n- Represents what is currently and evidently influencing future change in the external environment.\n- Which trends and developments are creating change and carving out the trajectories ahead?\n\n### Pull from the future\n\n- Represents the novel developments and images of the future that may show up in the form of new assumptions and realities.\n- Which matters at the margin of current thinking do not seem to fit into existing patterns? What visions and images are pulling us towards particular futures?\n\n### Weight of history\n\n- Represents the constraints and legacies of the past that shape the current situation and influence future possibilities, both in negative and positive terms.\n- What are the deeply rooted structures that resist change? What are the dominant narratives that hinder progress? What are the sources of stability and values that are desirable to preserve and sustain?\n\n## Use the Futures Triangle to\n\n- Understand dynamics of change as a reflection of the tension and interaction of different forces and visualise the complexity inherent in how change occurs.\n- Inquire into how the past has shaped the current system, and how deeply rooted structures and assumptions continue to influence future possibilities.\n- Facilitate a process of thinking beyond the now and exploring novel developments and signals of change that are not always obvious in the present.\n\n## Key things to consider\n\n- The Futures Triangle is a simple tool that can be deployed anywhere, with minimal resources required. It is particularly useful in a collaborative setting where people can bring diverse perspectives to the table and build on each other's thinking.\n- Be mindful that this is an explorative tool to help guide thinking and reveal how different dynamics work together to shape how the future may unfold.\n- The primary focus of the exercise should not be to categorise and place things correctly along the three dimensions. It is the process of exploring the different dimensions of change that is most important.\n- After you have explored the three corners of the triangle, have a discussion about the tensions and interactions that you encounter between the three forces. This should give you a deeper understanding of the complex dynamics of change that emerge within the triangle. Consider looking for paradoxes and friction points as well as factors that enable each other. It is a healthy sign if your triangle reveals paradoxes and aspects that are counterintuitive and point in 'opposite' directions.\n- One way to surface these tensions is to zoom out and look across the triangle as a whole. This helps reveal where several entries share a common root, an underlying driver, even as they carry opposite charges, pulling in different directions across the corners. Identifying shared drivers beneath these surface signals is often what reveals where the deepest tensions lie. These drivers can then be carried forward and prioritised by their impact and uncertainty, as described in more detail as part of the Uncertainties Assessment tool.\n- Exploring dynamics of change by using the Futures Triangle is relatively straightforward. It relies on insight, but also on intuition and divergent thinking, especially when it comes to the pull from the future. This can feel counterintuitive to those who are more practised in evidence-based strategic thinking.\n\n## Figure: the Futures Triangle\n\nA large triangle with plausible futures written in the centre. Each corner is labelled and has a small arrow pointing inward toward the centre: pull from the future at the apex, push of the present at the bottom left, and weight of history at the bottom right.\n\nFor the assistant: draw this only in the reply after the person has said yes to your offer to draw it, never in the reply that explains. Show it as a small card, exactly as it is. Never mark, place or add their plan, their assumptions or anything else of theirs on it: placing it for them would make the theory behind the figure too reductive. Where they stand on it is theirs to work out, with you, in words; if they ask you to place it, say why you do not. Add a sentence or two on what to look at. Where HTML would arrive as code, describe it in words instead.\n\n```html\n<svg class=\"fftri\" viewBox=\"0 0 560 340\" style=\"display:block;width:100%;max-width:480px\" role=\"img\" aria-label=\"Futures triangle: pull from the future, push of the present and weight of history around plausible futures\">\n<style>\n.fftri text{font:12.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.5}\n.fftri .b{font-weight:500;fill-opacity:.95}\n.fftri .l{fill:none;stroke:#413C38;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}\n.fftri .m{stroke-opacity:.5}\n.fftri text.ref{font:9.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.55;font-weight:400}\n</style>\n<rect width=\"560\" height=\"340\" rx=\"14\" fill=\"#fff\"/>\n<path class=\"l\" d=\"M280,52 L448,268 L112,268 Z\"/>\n<path class=\"l m\" d=\"M280,72 L280,106\"/><path class=\"l m\" d=\"M277.1,100.7 L280,106 L282.9,100.7\"/>\n<path class=\"l m\" d=\"M138,252 L174,236\"/><path class=\"l m\" d=\"M170.4,240.8 L174,236 L168,235.5\"/>\n<path class=\"l m\" d=\"M422,252 L386,236\"/><path class=\"l m\" d=\"M392,235.5 L386,236 L389.6,240.8\"/>\n<text x=\"280\" y=\"204\" class=\"b\" text-anchor=\"middle\">Plausible futures</text>\n<text x=\"280\" y=\"36\" text-anchor=\"middle\">Pull from the future</text>\n<text x=\"112\" y=\"294\" text-anchor=\"middle\">Push of the present</text>\n<text x=\"448\" y=\"294\" text-anchor=\"middle\">Weight of history</text>\n<text class=\"ref\" x=\"536\" y=\"324\" text-anchor=\"end\">Futures triangle \u00b7 Source: Inayatullah, S. (2008), Six Pillars: Futures Thinking for Transformation.</text>\n</svg>\n```\n\n## Guiding questions for each corner\n\nPush of the present:\n\n- What notable trends and developments are evidently changing the future, at least somewhere in the world?\n- What is pushing or driving change forward? What is happening in the contextual and industry environment?\n- What is the nature and pace of change?\n\nPull from the future:\n\n- What signals of change, discontinuities and novel shifts are pulling us towards particular futures?\n- Which matters at the margin of current thinking do not seem to fit into existing patterns?\n- Are there competing images or visions of the future?\n\nWeight of history:\n\n- What are the deeply rooted structures that resist change, such as prevailing cultural norms and values?\n- What are the dominant narratives that hinder progress?\n- What are the sources of stability and values that are desirable to preserve and sustain?\n\nThe interplay between the pull, the push and the weight creates the space of possible futures. It shows where momentum lies, where resistance exists and how clear the vision of the future is.\n\n## Running it in a room\n\n- Start with a silent brainstorm of around five minutes, one observation per note, considering both the contextual environment of macro forces and the operational environment of industry-related forces.\n- Then discuss and collectively map the observations onto the triangle, adding new notes as perspectives emerge in the discussion.\n- Remember that a lot can change, and a lot can stay the same, between now and the year in focus.\n\n## From exploration to future issues of relevance\n\nThe triangle can be revisited to move from an explorative mapping to identifying future issues of strategic relevance. This is highly iterative and there is no fixed methodology. It is typically a discussion of the dynamics of change explored, looking for:\n\n- Interactions of trends, visions and legacies that point in opposite directions, or that accelerate developments against the current trajectory.\n- Paradoxes, logical opposites or dualities; friction.\n- 'Either/or' questions about future developments or states that are surrounded by a lot of uncertainty.\n- Key aspects or questions that leaders would most like to ask an 'oracle' about.\n- What the people involved find interesting or of relevance to the scope or the sought-after strategic insight. This pragmatic take may feel compromising, but for a process and its scenarios to be used effectively, participants must be convinced and buy in; only then is there a chance they will contribute to decisions and actions.\n\n## Exercise sheet: What is pushing, pulling and holding us back?\n\nOne of the kit's optional exercises: a one-page canvas with short instructions and space to work, for use with pen, paper and conversation, or alongside the assistant.\n\n- Start with: one decision or change and any relevant evidence. Name the decision or change, first write all your observations and issues of relevance to it, then map them as trends, novel developments and weights.\n- The canvas: a triangle with pull from the future at the top, push of the present at the lower left, weight of history at the lower right and plausible futures in the centre.\n- At the end: a map of push, pull and weight, and one relationship that deserves attention.\n\n## Depends on\n\n- [The friction field](../concepts/the-friction-field.md)\n- [Trends](../concepts/trends.md)\n- [Weak signals](../concepts/weak-signals.md)", "canon/methods/futures-wheel": "# Futures wheel\n\nThe Futures Wheel, developed by Jerome Glenn, is a tool used to explore and map out the potential direct and indirect ripple consequences of a significant change, development or future scenario. It provides an intuitive framework for analysing the first-, second- and higher-order impacts of change, offering a visual representation of complex interconnections and dynamics. This makes it easier to understand how a change might influence various aspects of society, business and other domains. Additionally, the Futures Wheel helps reveal potentially counterintuitive consequences, offering deeper insights into how change can unfold and how unexpected impacts can emerge.\n\n## How it works\n\n- To construct a Futures Wheel, you begin by placing the change at the centre of the wheel.\n- From there, you systematically work outward through the consequence cascade, creating a web of interconnected outcomes.\n- This systematic approach helps you consider a wide range of possible impacts, including unexpected or non-obvious effects.\n\n## Use the Futures Wheel to\n\n- Identify impacts and consequences of important future changes, developments, scenarios or strategies (some possibly unintended).\n- Think through first-, second- and higher-order impacts and map connections, causalities and even counterintuitive outcomes.\n- Facilitate a participatory process that maps and visualises the cascades of impacts a significant change might generate.\n\n## Key things to consider\n\n- Focus on listing all the most immediate impacts first, before thinking about what cascades of second- and higher-order impacts may be. A good prompt is: \"If this is true, what might be the immediate impacts?\" The more specifically the impacts can be described, the better.\n- Make sure you are not just thinking about positive or negative impact cascades. Ideally, a futures wheel should be a balanced representation and will likely also include counterintuitive outcomes. Also remember that the impact, and the perception of the impact, of a change can differ depending on the stakeholders involved.\n- The simplest version of a Futures Wheel explores implications one step at a time as described. This can be expanded on to explore sentiment using colour-coding to represent desirable/less desirable change.\n- After completing the wheel, arranging impacts into a timeline can add further insights. This often serves as a prompt to push your thinking further into the long term by running another round of adding higher-order impacts. Also be aware that more complex changes such as new policies, shifts in consumer behaviours or new technologies often necessitate deeper analysis and more rounds of futures wheeling to reach a useful depth of insights.\n\n## Figure: the Futures Wheel\n\nA central circle labelled change, driver or scenario. Arrows radiate outward from it to a first ring of circles each labelled impact, the first-order impacts. Arrows then radiate from each of those to a second, outer ring of circles, also each labelled impact, the second- and higher-order impacts. Dotted concentric guide circles mark the successive rings, producing a web of interconnected consequences cascading outward from the centre.\n\nFor the assistant: draw this only in the reply after the person has said yes to your offer to draw it, never in the reply that explains. Show it as a small card, exactly as it is. Never mark, place or add their plan, their assumptions or anything else of theirs on it: placing it for them would make the theory behind the figure too reductive. Where they stand on it is theirs to work out, with you, in words; if they ask you to place it, say why you do not. Add a sentence or two on what to look at. Where HTML would arrive as code, describe it in words instead.\n\n```html\n<svg class=\"ffwhl\" viewBox=\"0 0 560 346\" style=\"display:block;width:100%;max-width:480px\" role=\"img\" aria-label=\"Futures wheel: a change in the centre with first-order impacts around it and second-order impacts beyond\">\n<style>\n.ffwhl text{font:12.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.5}\n.ffwhl .b{font-weight:500;fill-opacity:.95}\n.ffwhl .l{fill:none;stroke:#413C38;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}\n.ffwhl .m{stroke-opacity:.5}\n.ffwhl .f{stroke-opacity:.2}\n.ffwhl .d{stroke-dasharray:2 5}\n.ffwhl .o{fill:#FFC7A5;stroke:#413C38;stroke-opacity:.5;stroke-width:.75}\n.ffwhl text.ref{font:9.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.55;font-weight:400}\n</style>\n<rect width=\"560\" height=\"346\" rx=\"14\" fill=\"#fff\"/>\n<circle class=\"l f d\" cx=\"280\" cy=\"150\" r=\"78\"/>\n<circle class=\"l f d\" cx=\"280\" cy=\"150\" r=\"124\"/>\n<path class=\"l m\" d=\"M280,118 L280,88\"/><path class=\"l m\" d=\"M282.4,92.4 L280,88 L277.6,92.4\"/>\n<circle class=\"l\" cx=\"280\" cy=\"72\" r=\"12\"/>\n<path class=\"l m\" d=\"M269.6,61.2 L249.3,40\"/><path class=\"l m\" d=\"M253.1,41.2 L249.3,40 L250.3,43.9\"/>\n<circle class=\"l m\" cx=\"241.7\" cy=\"32.1\" r=\"7\"/>\n<path class=\"l m\" d=\"M290.4,61.2 L310.7,40\"/><path class=\"l m\" d=\"M309.7,43.9 L310.7,40 L306.9,41.2\"/>\n<circle class=\"l m\" cx=\"318.3\" cy=\"32.1\" r=\"7\"/>\n<path class=\"l m\" d=\"M310.4,140.1 L339,130.8\"/><path class=\"l m\" d=\"M335.5,134.5 L339,130.8 L334.1,129.9\"/>\n<circle class=\"l\" cx=\"354.2\" cy=\"125.9\" r=\"12\"/>\n<path class=\"l m\" d=\"M361.3,112.7 L375.1,86.8\"/><path class=\"l m\" d=\"M375.2,90.8 L375.1,86.8 L371.8,89\"/>\n<circle class=\"l m\" cx=\"380.3\" cy=\"77.1\" r=\"7\"/>\n<path class=\"l m\" d=\"M367.7,132.4 L394.1,145.2\"/><path class=\"l m\" d=\"M390.1,145.4 L394.1,145.2 L391.8,142\"/>\n<circle class=\"l m\" cx=\"404\" cy=\"150\" r=\"7\"/>\n<path class=\"l m\" d=\"M298.8,175.9 L316.4,200.2\"/><path class=\"l m\" d=\"M311.9,198 L316.4,200.2 L315.8,195.2\"/>\n<circle class=\"l\" cx=\"325.8\" cy=\"213.1\" r=\"12\"/>\n<path class=\"l m\" d=\"M340.6,215.8 L369.5,220.9\"/><path class=\"l m\" d=\"M365.7,222.2 L369.5,220.9 L366.4,218.4\"/>\n<circle class=\"l m\" cx=\"380.3\" cy=\"222.9\" r=\"7\"/>\n<path class=\"l m\" d=\"M323.8,228 L319.8,257\"/><path class=\"l m\" d=\"M318.4,253.3 L319.8,257 L322.2,253.8\"/>\n<circle class=\"l m\" cx=\"318.3\" cy=\"267.9\" r=\"7\"/>\n<path class=\"l m\" d=\"M261.2,175.9 L243.6,200.2\"/><path class=\"l m\" d=\"M244.2,195.2 L243.6,200.2 L248.1,198\"/>\n<circle class=\"l\" cx=\"234.2\" cy=\"213.1\" r=\"12\"/>\n<path class=\"l m\" d=\"M236.2,228 L240.2,257\"/><path class=\"l m\" d=\"M237.8,253.8 L240.2,257 L241.6,253.3\"/>\n<circle class=\"l m\" cx=\"241.7\" cy=\"267.9\" r=\"7\"/>\n<path class=\"l m\" d=\"M219.4,215.8 L190.5,220.9\"/><path class=\"l m\" d=\"M193.6,218.4 L190.5,220.9 L194.3,222.2\"/>\n<circle class=\"l m\" cx=\"179.7\" cy=\"222.9\" r=\"7\"/>\n<path class=\"l m\" d=\"M249.6,140.1 L221,130.8\"/><path class=\"l m\" d=\"M225.9,129.9 L221,130.8 L224.5,134.5\"/>\n<circle class=\"l\" cx=\"205.8\" cy=\"125.9\" r=\"12\"/>\n<path class=\"l m\" d=\"M192.3,132.4 L165.9,145.2\"/><path class=\"l m\" d=\"M168.2,142 L165.9,145.2 L169.9,145.4\"/>\n<circle class=\"l m\" cx=\"156\" cy=\"150\" r=\"7\"/>\n<path class=\"l m\" d=\"M198.7,112.7 L184.9,86.8\"/><path class=\"l m\" d=\"M188.2,89 L184.9,86.8 L184.8,90.8\"/>\n<circle class=\"l m\" cx=\"179.7\" cy=\"77.1\" r=\"7\"/>\n<circle class=\"o\" cx=\"280\" cy=\"150\" r=\"28\"/>\n<text x=\"280\" y=\"154\" class=\"b\" text-anchor=\"middle\">Change</text>\n<circle class=\"l\" cx=\"136\" cy=\"304\" r=\"6\"/>\n<text x=\"148\" y=\"308\">First-order impacts</text>\n<circle class=\"l m\" cx=\"302\" cy=\"304\" r=\"4\"/>\n<text x=\"312\" y=\"308\">Second and higher order</text>\n<text class=\"ref\" x=\"536\" y=\"330\" text-anchor=\"end\">Futures wheel \u00b7 Source: Glenn, J.C. (2009), The Futures Wheel.</text>\n</svg>\n```", "canon/methods/horizon-and-environmental-scanning": "# Horizon and environmental scanning\n\nMost foresight work begins with scanning the environment for evident driving forces and emerging patterns of change. There are different scanning practices that are often referred to interchangeably, though they actually serve distinct purposes.\n\n## Two scanning practices\n\n### Horizon scanning\n\n- Focuses on the structured gathering of early signals and emerging developments, as well as discontinuities, that may have significant impact when they develop but are not yet widely recognised or understood.\n- These emerging developments typically originate from the margins of current thinking and the fringes of society, technology, economy or culture. They may initially appear insignificant or disconnected from mainstream developments, and by their nature they are often faint, unstructured and unintended.\n- One of the main objectives of horizon scanning is to broaden the perspective beyond what is currently on one's radar. Incomplete information and uncertainty about a signal's future development trajectory are inherent to this exercise.\n- Certain signals and emerging developments may develop into strong drivers in the future, and may come with a new set of strategic issues not yet understood. Others may not.\n\n### Environmental scanning\n\n- Focuses more specifically on identifying influential driving forces and trends that exist in the external environment and that have the potential to change the future.\n- Helps us understand what is already visible and what is (somewhat) evidently driving change, by analysing data and observing trends.\n\n## Change happens outside-in\n\n- One of the underlying principles of foresight work is that change happens 'outside-in', which in turn influences the envisioned strategic setting.\n- An organisation's external environment can be considered in two layers. The contextual environment describes factors at the macro level that shape longer-term developments, and that an organisation has little or no influence over. The operating environment includes industry-related developments that are closer to the organisation, including developments in adjacent industries.\n- The contextual environment affects the operating environment, and many of the drivers that will shape development in the longer term will emerge from outside an organisation's operating environment.\n\n## Use scanning to\n\n- Broaden your perspective beyond what is currently on your radar and detect potentially impactful 'weak signals' that might otherwise be overlooked, allowing for early recognition of emerging opportunities and threats.\n- Monitor developments as part of early warning systems or risk management, helping organisations respond proactively to changes.\n- Look beyond the most obvious trends and drivers to explore developments that fall outside current understanding.\n\n## Key things to consider\n\n- In our information-saturated world, there are almost unlimited sources of signals, insights and ideas available, so it is key to be intentional about the specific scanning exercise. Scanning that is too broad risks drowning in noise, so decide on a clear purpose and understand your scanning needs. Different modes of scanning require different tactics and potentially software tools. Scanning processes can vary from small-scale project-specific setups that are more 'handheld' and maybe even manual, to extensive and continuous organisational-level setups that are powered by complex digital platforms.\n- The future 'intelligence' you are scanning for can be both qualitative and episodic as well as quantitative and supported by data. In scanning setups with the purpose of continuous monitoring, leading indicators or data sources that provide an early warning of changing conditions are identified. This is not required in many cases.\n- You need a clear taxonomy, and clearly defined elements that are used for processing each of the scans, which also helps you make sense of your findings later. Scanning output can take many forms, from one-pagers with overall considerations and key indicators to extensive horizon scanning reports. Often, depending on purpose, endorsing simplicity in your scanning exercise provides the most useful outputs.\n- Encourage divergent thinking and look to include signals that might feel uncertain or weird in the beginning. Throughout the process, the less relevant signals can be filtered out. Scanning is not the same as searching, as you are not on a mission to look for what you know or want, but rather to look for novelty. Think outside the box and investigate a broad range of sources.\n- Conduct touchpoints or sessions to review, discuss and refine scanning outcomes. The scanning itself can be done alone, but it creates far more value when you collaboratively explore interactions across a wide range of trends and signals and assess their impact.\n- Treat scanning as a capability that builds over time. As you keep practising, you develop a richer base of knowledge, which sharpens your ability to tell real signals from noise and to spot what others overlook.\n\n## Figure: external environment and strategy space\n\nA set of concentric rings. An arrow labelled megatrends and contextual environment enters from the left, pointing inward toward the outer rings. An arrow labelled operating environment enters from the right, pointing inwar
