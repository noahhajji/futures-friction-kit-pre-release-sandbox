ponsibility goes beyond giving people what they ask for, but that should not make it less curious about the people it serves. How many product ideas begin with a genuine understanding of needs, and how many with an assumption about what will make people consume more of what is already produced?\n\n## The value of a stupid question\n\n- A proposal to let readers adjust the complexity level of an article with AI met immediate and legitimate objections: nuance, meaning, editorial responsibility. The proposer left feeling she had suggested something against the principles of journalism, when she was trying to make it accessible.\n- Accuracy, nuance and responsibility are not details to ignore, but making journalism accessible to people who struggle to understand it is a journalistic ambition too. Journalists can protect editorial integrity so hard that they dismiss possibilities too quickly; developers can focus so hard on what is possible that they underestimate the consequences. Neither should end the conversation, and somewhere among the reasonable concerns and the hesitation to sound stupid, the user is forgotten.\n\n## The burden of innovation\n\n- Thinking differently is exhausting. Questioning the assumptions behind the work means giving up the certainty of knowing how it works and what the outcome will be, and doing so on top of deadlines.\n- Research into innovation in established Nordic media organisations found the problem was rarely a lack of ideas or ambition but the difficulty of creating the time, resources and authority to act on them. When new initiatives compete with everyday operations, operations win: existing products have customers, deadlines and measurable results; new ideas come with assumptions, not KPIs. People are asked to create something unpredictable while being judged by how predictably they deliver.\n- To do more than improve what exists, protect time and resources to question assumptions and to experiment with ideas whose outcomes cannot be predicted. Even if they never lead to a product, they might change how journalism is understood.\n\n## Soft skills, really?\n\n- Ideas never shared, questions never asked for fear of sounding stupid or because everyone else seems to know better. Creating the safety to share an idea before it is fully formed is among a leader's most important responsibilities.\n- These are dismissed as soft skills, yet the ability to ask a question without knowing the answer, disagree with someone more experienced or share an unfinished idea decides which possibilities an organisation ever explores.\n- It is also about giving up power: who decides what is worth pursuing, who controls the resources, and who is willing to give up some of that control. The paradox is that the more pressure the industry faces, the more it needs to innovate, and the more protective it becomes of resources, roles and influence.\n\n## The newsroom of 2036\n\n- Teams of journalists, developers, designers and people from backgrounds not traditionally associated with journalism, with the time, resources and authority to investigate problems together: not handed a product brief with a predefined solution, but encouraged to explore questions the organisation has not yet answered, with the people it is trying to reach involved in the exploration rather than invited in at the end to test what was already decided.\n- Different pathways into journalism for people who do not look, think or work like those already inside, rather than diverse talent hired into the same structures. If you want the status quo questioned, it is counterproductive to recruit only people trained to see the world the same way.\n- Organisations honest about what makes this difficult: the fear of being wrong, the tendency to protect what we have, and the power we might have to give up.", "canon/concepts/scenarios": "# Scenarios\n\nPlausible and coherent narratives describing alternative futures, based on key drivers and uncertainties, and expanded through storytelling to create credible and compelling images of how the future may unfold.\n\n## Scenarios exist in sets\n\n- In foresight, scenarios often exist in sets, allowing different futures to be contrasted with one another and with the present, helping to break away from a deterministic view of the future.\n\n## Scenarios are not predictions\n\n- They are not meant to be 'right' or 'wrong', 'good' or 'bad'.\n- Their function is to challenge current assumptions and provoke us to think about the future in new ways, including outcomes 'beyond the numbers' that might otherwise be overlooked.\n\n## Scenario planning\n\n- The discipline of scenario planning offers a structured approach to exploring a set of plausible future conditions that are different from the present.\n- This allows organisations to widen their strategic perspective and consider alternative future outcomes that may be difficult to grasp in the present.\n\n## What scenarios are\n\n- Compelling, plausible narratives about plausible futures, to facilitate a futures-oriented conversation and understanding.\n- Focused on potential changes in the external environment, which in turn influence the strategic environment and strategic decisions.\n- Guides that inform organisations and people about future threats and opportunities, to better plan for the future.\n- A way to foresee potential outcomes 'beyond the numbers', in an era where forecasts and projections are not enough.\n\n## What scenarios are not\n\n- Not predictions of the future, and not futures to which probabilities should be assigned.\n- Not focused on operational options created from an inside-out perspective.\n- Not strategies in and of themselves, though they provide insight for planning.\n- Not the same as trend analysis, empirical forecasting or other foresight methods.\n\n## Depends on\n\n- [Drivers of change](drivers-of-change.md)\n- [Uncertainty](uncertainty.md)", "canon/concepts/scoping-a-foresight-project": "# Scoping a foresight project\n\nScoping a foresight project properly is key to ensuring impactful outcomes, and a lot of consideration must go into scoping a foresight project well. Foresight is applied in many different contexts, and takes on many different forms. Your approach may look very different depending on the purpose of your foresight intervention and where the request and mandate come from. Foresight in organisational settings often carries a particular requirement, in that foresight efforts should always be aligned with the specific organisational context and strategic objectives.\n\n## More than foresight properties\n\n- Scoping involves more than just deciding on 'foresight properties' like the focal issue, scope boundaries (making sure that the scope does not become too broad or too narrow) or time horizon.\n- It is equally important to understand why you are undertaking the foresight project, within what system or context the project exists, and which decisions you are hoping to influence.\n- This is critical in avoiding a mismatch between what the people/team who asked for the project want vs. what they need.\n\n## Managing expectations\n\n- It is also a crucial part of managing expectations of what can feasibly be accomplished with the foresight intervention.\n- Oftentimes, foresight interventions are expected to achieve things they cannot or should not do, setting them up to underwhelm, or outright fail.\n- Being realistic about these answers is key, especially when the project sponsor may not have the experience needed to properly set expectations.\n\n## Engaging the right people\n\n- Part of the scoping process is also to make sure that you are engaging the right people as a critical factor for the success of any project.\n- This helps ensure that there is a mandate and buy-in from the right people and decision makers, and hence, that you have their permission to challenge the status quo.\n- Who you speak to and who you choose to bring with you on the journey will affect the insights and impact of your project.", "canon/concepts/second-brains": "# Second brains\n\nWorking with media organisations shows how difficult it is to connect innovation across teams and build on what others have learned. Ideas struggle to survive daily operations or find support beyond the team that developed them; those that challenge the current business are measured by metrics that overlook their future value; others may never learn what a team tried or which assumptions shaped its decisions. An unsuccessful experiment can still produce valuable learning if the context needed to understand it is preserved, and a good idea that does not fit one project may be gold in another.\n\n## The weight of history in news organisations\n\n- Protecting sources, keeping a scoop from competitors and guarding rights are important parts of the work and culture, and those instincts shape how knowledge moves inside the organisation. Competition between desks can make sharing harder, and the reasoning behind a project may stay with the people who made it.\n- There is also exhaustion from the ongoing waves of change, from print to web, mobile and platforms. Any practice that asks media organisations to share and question what they know must be built within the boundaries source protection and rights require, and with as little extra effort as possible.\n- Where to start when people are exhausted and used to protecting knowledge: by making it easier to learn from what others have tried and why, bringing that learning into existing workflows.\n\n## The concept\n\n- A second brain is a way of organising knowledge outside our heads so we can return to it, connect it and use it in new situations. The term was popularised by Tiago Forte for personal knowledge management; the ambition is older. Vannevar Bush's memex of 1945 was a desk-like device for storing books, records and communications, connected through trails of association that could be revisited and shared.\n- It starts with collecting contextual data: the purpose of an experiment, the audience insights it drew on, what was tried, why a decision was made and where people disagreed. A report saying \"user demand was low\" tells us little about why; the context gives another team something to work with.\n- Second brains operate at connected levels: individual second brains holding employees' own knowledge; team second brains capturing shared experiments and learning; and an organisational second brain preserving strategic reasoning across projects and connecting innovation to the organisation's purpose and values.\n- Andrej Karpathy's LLM Wiki is a related approach: a collection of linked text files that an AI model writes, organises and updates from source material, while people select the sources and guide the work and the original material stays separate from the generated knowledge.\n\n## Context as infrastructure\n\n- Making context machine-readable lets people and AI agents work with it across projects. Sources, dates and the conditions behind a conclusion need to travel with it, as does the distinction between evidence and interpretation; otherwise a confident interpretation could become accepted as evidence simply through repeated retrieval.\n- Formats and protocols are emerging to support parts of this, for structuring knowledge, connecting AI applications to data and tools, and communication between agents. They address technical layers; they do not settle organisational choices about access, ownership or interpretation.\n\n## How it could work\n\nIn Hvitved's imagined media organisation of 2030: a journalist and a colleague record a conversation about a new local information service and process it on a local device, where it stays private. An agent suggests an outline for her individual second brain, capturing the idea, the reasoning and the open questions; she decides which parts to share, and the approved outline enters the team second brain while her notes and the recording stay hers. Contributing an idea does not give the organisation access to everything behind it. The team draws on the organisational second brain, and within minutes an agent finds an experiment from four years earlier whose summary says demand was low, while the original evaluation shows people found the service useful but disliked installing yet another proprietary app. The team can see what was tried, why it was judged unsuccessful and whether that conclusion is relevant now, along with the strategic reasoning behind the earlier project. Decisions, reasoning and unanswered questions enter the team second brain; learning that could help other projects reaches the organisational one, and residents can follow the reasoning the team chooses to share and contribute their own experience.\n\n## Where to start\n\n- Start with one current innovation project. Bring together the relevant context: earlier experiments, audience insights, signals of change and the reasoning behind the proposal. Make it machine-readable and preserve its sources.\n- Agree who controls the knowledge, what can be shared and reused, which AI systems can access it and how you retain control if you change providers. Source protection, privacy, copyright and cybersecurity shape these choices from the start: what stays local and what goes through cloud services, what can be exported to other systems to avoid lock-in, who owns what.\n- Begin in a controlled environment with limited access and carefully selected material, then assess what can be connected more widely.\n\n## Key things to consider\n\n- The efficiency AI brings to collecting, connecting and retrieving knowledge can go to cuts or to thinking, meeting colleagues and spending time with the public; in the imagined organisation, leadership has protected that time and recognised contributions to collective learning.\n- Many conditions would need to hold for this to take shape, and it is unlikely to unfold exactly as imagined. The value of the scenario is to explore what could change and what to prepare for, including the choices about ownership, time and resources that make this way of working possible.", "canon/concepts/service-not-publication": "# Service, not publication\n\nJournalism has been made easier to publish, faster to distribute and simpler to consume, yet it still asks an extraordinary amount of the people it serves: notice the story, recognise why it matters, remember what happened last time, find the update, work out what has actually changed. The newsroom does the difficult work of reporting and leaves much of the work of staying informed to the reader. Nikita Roy's point is that this is not an engagement problem but a limitation in how journalism has been designed. A finished article is not always a finished public service.\n\n## Form and function\n\n- Verification, scrutiny, explanation and helping people navigate uncertainty are journalism's functions. Articles, broadcasts, newsletters and podcasts are forms used to deliver them.\n- The forms matter. A narrative investigation can reveal a pattern no collection of personalised answers could capture; a shared story can create public attention and political pressure. The point is not to replace the article but to stop treating it as the boundary of responsibility.\n\n## A newsroom organised around questions\n\n- Imagine a newsroom organised not only around stories to publish but around public questions it commits to follow: will the promised housing be built, what is happening to local water quality, how is a new policy affecting families. Each question has a history, sources, unresolved claims, competing accounts and developments worth watching.\n- Reporting still creates the knowledge, but it becomes a living, accountable record that can be revisited, interrogated and updated as the world changes.\n- The invitation changes from \"read this\" to \"we will keep watching this\". That is a more demanding promise than an alert when a new article appears: it means noticing consequential change when no article was planned, sometimes saying that nothing has been resolved, and acknowledging when the newsroom can no longer reliably keep watch.\n\n## Making continuity sustainable\n\n- None of this began with AI. Community-centred newsrooms have long answered individual questions and followed public promises; one has run a text-message service since 2016 that delivers housing and utilities information on demand and lets residents reach a reporter, now using AI for property lookups and to surface what residents ask about, while journalists write every message.\n- What changes with AI is the range of connecting work that becomes feasible: sifting sprawling agendas, comparing revisions to public documents, connecting a development to years of reporting, translating, adapting verified explanations for different levels of familiarity.\n- AI may lower the cost of connecting information, but it does not remove the cost of being responsible for it. The better the service, the more the responsibility matters: if an error travels into a text message, a translation or an audio briefing, the correction cannot live only on the original article. Editorial responsibility becomes product design.\n\n## Bigger than a chatbot\n\n- A service built only around answering users' questions leaves a gap: people may not know what they need to ask. Journalism matters precisely because people often do not know what is happening or which question to ask. An interface that answers perfectly formulated questions can leave the biggest blind spots untouched.\n- The systems worth building combine responsiveness with editorial initiative. Personal relevance should be a doorway into public understanding, not an escape from it; people may receive different formats, languages or levels of explanation, but not different underlying facts, and no algorithm should decide that an inconvenient truth is irrelevant because nobody asked.\n- The service need not look like AI at all. It might arrive as a text message, a short audio explanation or a timed update; its form is irrelevant as long as it makes journalism more useful.\n\n## What becomes of the newsroom\n\n- If more people encounter reporting through assistants and platforms they do not associate with the publisher, newsrooms risk becoming invisible suppliers of raw material for somebody else's product. Publishing more articles will not solve that. A newsroom's enduring value may lie in the knowledge it can stand behind: what it has verified, what remains disputed, what has changed, which questions it continues to investigate.\n- The reporter remains indispensable as the person who understands context, challenges official accounts, notices what is missing and earns trust. Editors become stewards of commitments that extend across time. Product and engineering teams turn judgement into systems that can be tested, corrected and sustained. The newsroom becomes an institution that remembers, checks and returns.\n- Success changes with it: not how many stories were produced or how much attention they drew, but whether people were better able to understand the forces shaping their lives, recognise what had changed and exercise their own judgement.", "canon/concepts/strategic-foresight-fallacies": "# Strategic foresight fallacies\n\nFlawed ways of reasoning about, or applying, strategic foresight, drawn from CIFS' own experience.\n\n- Engaging with foresight to look for certainty in uncertain times, rather than using it to challenge misguided assumptions that may underpin a false sense of certainty. Authentic strategic foresight serves the opposite purpose.\n- Trying to 'force fit' foresight into current strategic practices and the familiarity of existing routines, rather than using it to balance strategic thinking and broaden the strategic perspective.\n- Collapsing foresight into operational planning, reducing it to a planning tool for short-term business intelligence or tactical purposes. This narrows its scope and keeps it stuck in the present, when it should transcend immediate priorities and explore longer-term shifts.\n- Misunderstanding foresight's epistemic role in decision-making: expecting it to deliver clear, actionable strategy in and of itself, instead of approaching it as one source of insights that widens the strategic perspective. This leads to foresight being dismissed as 'interesting but not useful'.\n- Equating the activity of doing foresight with action, while foresight only has strategic value when it informs and shapes concrete decisions and actions. This often happens because the strategic or decision-making purpose of the exercise was unclear from the outset.\n\n## Depends on\n\n- [Strategic foresight](strategic-foresight.md)", "canon/concepts/strategic-foresight": "# Strategic foresight\n\nA discipline that involves systematically anticipating and preparing for future challenges and opportunities in ways that expand conventional strategic thinking in the face of change. It typically deals with the medium- to long-term future (beyond the current strategic planning horizon) with the overarching goal of enhancing awareness of change and considering multiple alternative futures in ways that generate valuable insights for better strategic anticipation.\n\n## What foresight aims for\n\n- The aim of foresight is never to predict the future.\n- In a time where forecasts, projections and linear decision-making methods are not enough, strategic foresight aims to achieve a high-quality view of how the future might show up in the form of new assumptions, behaviours and realities.\n- In this sense, the outset for practising foresight should always be to challenge the tendency to favour the 'business as usual' future and to adequately explore viable alternatives.\n\n## Foresight and strategy\n\n- Without foresight, strategy risks becoming blind to contextual change and a recipe for failure when change occurs.\n- Conversely, without connection to strategic or decision-making purpose, foresight easily becomes conjecture and disconnected from organisational reality.\n\n## Foresight is not a search for certainty\n\n- Organisations should not engage in foresight to look for certainty. Rather the opposite: they should engage in it to challenge the bias and assumptions that could underpin a false sense of certainty and understanding.\n- The main problem arises when organisations 'force fit' foresight into their current strategic practices rather than using it to balance their strategic thinking. Approached that way, foresight ends up reinforcing the original view of the future and fortifying a false sense of certainty.\n\n## How foresight feeds strategy\n\n- Foresight provides insights and input for strategic planning; foresight outcomes are not strategies in themselves. Strategic foresight focuses on potential changes in the external environment and allows alternative futures to be considered, which in turn influence the strategic environment and strategic decisions.\n- The foresight process runs from framing and inputs, through scanning and analysis, interpreting and prospecting, to foresight outputs. Those outputs feed into strategy and policy inputs alongside other strategic considerations, and from there into strategy and policy thinking, formulation and planning.\n- Foresight and strategy are two halves that come together in order to use the future in a systematic and meaningful way. Exploring the future can be insightful in itself, but its value for strategic planning or policy anticipation lies in its application.\n\nFigure: a flow diagram. On the left, a vertical stack enclosed by a dashed circle and labelled strategic foresight: framing and inputs, then a highlighted foresight box containing scanning and analysis, interpreting and prospecting, then foresight outputs. On the right, several other strategy or policy considerations and inputs. Both streams point down into strategy and policy inputs, which point into a wide bar labelled strategy and policy: thinking, formulation, planning.", "canon/concepts/the-agentic-information-economy": "# The agentic information economy\n\nThere are no altars to the gods of showers, card payments or traffic lights. They are among the great achievements of modern life and almost entirely invisible, noticed only when they break. Shuwei Fang's argument is that the information environment of the near future should work the same way: within ten years AI could leave society far better informed, and almost nobody would notice. A new mother six months in, too tired to be informed, has an agent that knows the childcare rules have changed, works out what she is entitled to, drafts the application, tells her the morning a local investigation exposes failings at her maternity unit, and can show her where each claim came from and who checked it. The decisions remain hers.\n\n## What changes\n\n- Machines become the primary audience for information, and information changes category: from a final good read by a person who may or may not act, to an intermediate input into a decision, a transaction or an automated process, often never rendered for a human at all.\n- Together these give rise to an agentic information economy, the epistemic bedrock of the wider agentic economy. It could be far bigger than today's information economy, because machines consume without the limits of human attention, and far more complex.\n\n## The price of being right\n\n- When a person misreads something, the error becomes an impression. When an agent acts on it, the error becomes an action: a wrong purchase, a missed entitlement, a recalled product back on the shelf. Outcomes loop back as inputs, so errors compound at machine speed and scale, and because many systems draw on the same few models, they can fail together. Correlated, automated error is a different class of risk from misinformation.\n- It is also a different class of opportunity. For as long as there has been a digital information market, being right and sounding right have fetched roughly the same price, except in finance and a few high-stakes niches. Once the cost of being wrong becomes measurable, provenance, accuracy and the capacity to self-correct could become things that are priced. Being right could start to pay.\n- The best version needs conditions that will not emerge by default: ownership and control spread out rather than concentrated, no moral hazard in how information is gathered and verified, and a myriad of native protocols, institutions and rules.\n\n## Finance as the comparison\n\n- Most people have only a folk understanding of finance, yet hand it their salaries and pensions, because protocols, institutions and regulation let them delegate trust, legibility and risk.\n- The agentic information economy will need analogous systems. Finance has SWIFT and shared identifiers; information needs a shared protocol and a standard unit so a claim can be identified and traced. Finance has custodians; information needs trusted holders of dispersed, niche knowledge. Finance has rating agencies; information needs calibrated confidence in its sources. Finance has clearing houses; information needs corrections that reach every system that used the original.\n- These systems also decide where value flows. Value is likely to pool at the interface, with whoever knows the most about the user. With the right rails, some share of it, and of the demand signal, could flow back along the chain to those who originate, verify and maintain information, as card interchange fees send a slice of every payment back to the issuing bank.\n- Finance also shows how such institutions fail: the rating agencies that blessed mortgage-backed securities before 2008 were paid by the issuers they rated. Journalism and science encode the opposite instincts, independence from those you cover, disclosure of sources and methods, scrutiny by peers, public correction. Those are the right blueprints; whether they are used is being decided while the standards are still soft.\n\n## Roles for journalism\n\n- Journalism's institutions already hold much of the DNA: verification, editorial standards, archives, corrections policies and a working ethic of accountability. Within ten years they could be originating machine-ready, verified events with provenance attached; acting as custodians of a community's local and niche knowledge; rating sources and attaching calibrated confidence to claims; underwriting the information agents act on, with liability attached; and running the clearing systems that carry a correction to every system that used the original.\n- A system this consequential and opaque needs watchdogs of its own. Covering the agentic information economy becomes a beat, as finance and technology are today. Someone will still need to hold information power to account; the power will simply be harder to see.\n- None of this displaces storytelling. Stories are how people come to care, and they will flourish alongside. There is room for a new discipline of information and knowledge that no existing field fully addresses.\n\n## What leaders do now\n\n- Start from first principles: ask what an agentic information economy will actually need, looking well beyond the news industry, rather than searching for a best-in-class version of something that already exists.\n- Rethink what the unit of information, and therefore of value, actually is; build the economics around that; develop the skills to work with information in ways the newsroom was never designed for.\n- Coordinate, and get into the rooms where the standards for this economy are being written, while they are still soft.\n\n## Key things to consider\n\n- Invisibility cuts both ways. A system in the background that can quietly leave you better informed can just as quietly manipulate you, and you would never know; all the more reason to build it to serve citizens rather than steer them.\n- It sits uneasily with journalism's cultural identity as a visible fourth estate wearing its trust on its masthead. The role for journalism in that future may be unrecognisable.\n\n## Depends on\n\n- [First principles](first-principles.md)", "canon/concepts/the-cifs-foresight-process": "# The CIFS foresight process\n\nCIFS' approach to applied strategic foresight is a rigorous process around understanding what drives change, making sense of the uncertainties that matter most, and transitioning into strategic decision-making. Much work in the futures field is strong on visioning, scanning, mapping, forecasting and planning but weak on execution, action and operation; the later phases deserve the attention.\n\n## Six phases\n\n1. Scope: setting the parameters.\n2. Awareness of change and \n3. Dynamics of change and uncertainty: explore dynamics of change and understand high-impact uncertainties.\n4. Alternative futures and \n5. Strategic insights and implications: build scenarios, engage with alternative futures and understand implications.\n6. Action: transition from foresight to strategic insights; tuning and rethinking strategy.\n\nThe process runs as a double diamond. It diverges across awareness of change, converges to a point at the boundary with dynamics of change and uncertainty, diverges again across alternative futures, and converges through strategic insights and action. Assessing critical uncertainties is a deductive phase that follows the exploratory one; the scenario axes are the scaffolding for the second divergence.\n\n## The exploratory, future-back process\n\nThe same arc seen from the strategy side:\n\n- A. Gathering insights about the future and understanding dynamics of change.\n- B. Understanding strategic uncertainties and certainties.\n- C. Developing alternative futures.\n- D. Assessing future strategic implications, and/or\n- E. Stress-testing the viability of current strategic elements.\n- F. Future-back to widen strategic perspective and shape strategic decisions.\n\n## Key things to consider\n\n- Every futures project is different. Some are large scale, with extensive scenario development, detailed research and stakeholder workshops to identify and advise on future strategic challenges. Others are small scale, perhaps a single workshop with an internal strategy team to explore what is driving change. The tools are adaptable and can be customised to most futures projects.\n- Scoping matters. Sometimes a scoping workshop precedes the process, when the client is not sharp on the scope.\n- In a real project, the explore phase is a mix of trend research and curation of second- and third-tier things, interviews with experts, and workshops with the client. It is probably the most cumbersome component, and the understanding and sense-making a good futures thinker brings remain key.\n\n## Figure: the CIFS method\n\nSix phases run left to right, separated by dashed vertical lines: scope, awareness of change, dynamics of change and uncertainty, alternative futures, strategic insights and implications, action. A horizontal double-diamond shape widens across awareness of change, narrows to a point at the boundary with dynamics of change, widens again across alternative futures and narrows to a point through strategic insights and action.\n\nFor the assistant: draw this only in the reply after the person has said yes to your offer to draw it, never in the reply that explains. Show it as a small card, exactly as it is. Never mark, place or add their plan, their assumptions or anything else of theirs on it: placing it for them would make the theory behind the figure too reductive. Where they stand on it is theirs to work out, with you, in words; if they ask you to place it, say why you do not. Add a sentence or two on what to look at. Where HTML would arrive as code, describe it in words instead.\n\n```html\n<svg class=\"ffmth\" viewBox=\"0 0 560 320\" style=\"display:block;width:100%;max-width:480px\" role=\"img\" aria-label=\"The Copenhagen Method: scope sets the parameters; the shape opens across awareness of change, narrows through the dynamics of change and uncertainty, opens again across alternative futures and closes through strategic insights and implications into action\">\n<style>\n.ffmth text{font:12.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.5}\n.ffmth .b{font-weight:500;fill-opacity:.95}\n.ffmth .s{font-size:10.5px}\n.ffmth .l{fill:none;stroke:#413C38;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}\n.ffmth .m{stroke-opacity:.5}\n.ffmth .f{stroke-opacity:.2}\n.ffmth .d{stroke-dasharray:2 5}\n.ffmth .x{font-size:9px}\n.ffmth .e{fill:#FFC7A5}\n.ffmth .y{font-size:8px;font-weight:500;letter-spacing:.7px;fill-opacity:.9}\n.ffmth .i{font-style:italic}\n.ffmth text.ref{font:9.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.55;font-weight:400}\n</style>\n<rect width=\"560\" height=\"320\" rx=\"14\" fill=\"#fff\"/>\n<path class=\"l f\" d=\"M24,22 L536,22\"/><path class=\"l f\" d=\"M531.6,24.4 L536,22 L531.6,19.6\"/>\n<path class=\"l f\" d=\"M24,286 H536\"/>\n<path class=\"l m d\" d=\"M110,32 V204 M195,32 V204 M280,32 V204 M365,32 V204 M450,32 V204\"/>\n<path class=\"e\" d=\"M110,146 L195,100 L280,131 L365,115 L536,146 L365,177 L280,161 L195,192 Z\"/>\n<text x=\"67\" y=\"48\" class=\"y\" text-anchor=\"middle\">SCOPE</text>\n<text x=\"152.5\" y=\"42.5\" class=\"y\" text-anchor=\"middle\">AWARENESS OF</text>\n<text x=\"152.5\" y=\"53.5\" class=\"y\" text-anchor=\"middle\">CHANGE</text>\n<text x=\"237.5\" y=\"37\" class=\"y\" text-anchor=\"middle\">DYNAMICS OF</text>\n<text x=\"237.5\" y=\"48\" class=\"y\" text-anchor=\"middle\">CHANGE /</text>\n<text x=\"237.5\" y=\"59\" class=\"y\" text-anchor=\"middle\">UNCERTAINTY</text>\n<text x=\"322.5\" y=\"42.5\" class=\"y\" text-anchor=\"middle\">ALTERNATIVE</text>\n<text x=\"322.5\" y=\"53.5\" class=\"y\" text-anchor=\"middle\">FUTURES</text>\n<text x=\"407.5\" y=\"37\" class=\"y\" text-anchor=\"middle\">STRATEGIC</text>\n<text x=\"407.5\" y=\"48\" class=\"y\" text-anchor=\"middle\">INSIGHTS &amp;</text>\n<text x=\"407.5\" y=\"59\" class=\"y\" text-anchor=\"middle\">IMPLICATIONS</text>\n<text x=\"493\" y=\"48\" class=\"y\" text-anchor=\"middle\">ACTION</text>\n<text x=\"67\" y=\"144\" class=\"b s i\" text-anchor=\"middle\">Setting the</text>\n<text x=\"67\" y=\"157\" class=\"b s i\" text-anchor=\"middle\">parameters</text>\n<text x=\"195\" y=\"222\" class=\"x\" text-anchor=\"middle\">Explore dynamics of</text>\n<text x=\"195\" y=\"233\" class=\"x\" text-anchor=\"middle\">change and understand</text>\n<text x=\"195\" y=\"244\" class=\"x\" text-anchor=\"middle\">critical uncertainty</text>\n<text x=\"365\" y=\"222\" class=\"x\" text-anchor=\"middle\">Engage with alternative futures,</text>\n<text x=\"365\" y=\"233\" class=\"x\" text-anchor=\"middle\">challenge current assumptions,</text>\n<text x=\"365\" y=\"244\" class=\"x\" text-anchor=\"middle\">and understand implications</text>\n<text x=\"493\" y=\"222\" class=\"x\" text-anchor=\"middle\">Transition from</text>\n<text x=\"493\" y=\"233\" class=\"x\" text-anchor=\"middle\">foresight to</text>\n<text x=\"493\" y=\"244\" class=\"x\" text-anchor=\"middle\">strategic insights</text>\n<text x=\"493\" y=\"262\" class=\"x\" text-anchor=\"middle\">Stress-testing and</text>\n<text x=\"493\" y=\"273\" class=\"x\" text-anchor=\"middle\">rethinking strategy</text>\n<text class=\"ref\" x=\"536\" y=\"304\" text-anchor=\"end\">Source: Copenhagen Institute for Futures Studies, The Copenhagen Method.</text>\n</svg>\n```\n\n## Figure: the exploratory, future-back process\n\nA timeline runs from the present on the left to a year 20XX on the right. A thin cone opens from the present to a large ellipse at 20XX. A thick arrow inside the cone points right, labelled gathering insights about the future and understanding dynamics of change. The ellipse holds four squares in a 2 x 2 arrangement, the scenarios, each carrying a star for strategic implications and a box for stress-tested strategic elements. A second thick arrow points left from the ellipse back to the present, labelled future-back to widen strategic perspective and shape strategic decisions.\n\n## Depends on\n\n- [Scoping a foresight project](scoping-a-foresight-project.md)\n- [Uncertainty](uncertainty.md)\n- [Scenarios](scenarios.md)", "canon/concepts/the-friction-field": "# The friction field\n\nThe way future change occurs depends on the outcome of the 'power struggle' between favouring and limiting forces. New trends and developments create friction in the existing environment, and the future unfolds in the friction field.\n\n## The forces\n\n- Change drivers and enablers are the forces that cause a trend to move, and the factors that promote or catalyse a driver. A change driver may itself be a trend.\n- Change turners and blockers are the forces that oppose a trend by delaying, stopping or diverting it, and the factors that cause resistance to change.\n- Change enters the field on one side; implications for societies, industries and the business environment emerge on the other.\n\n## Reading the field\n\n- Do not take a trend at face value. A trend can relatively easily be identified and analysed, but understanding the forces and factors that either promote or limit it gives the more detailed picture.\n- Does the development challenge prevailing social, cultural or ethical norms? Then change is likely to proceed slowly, if at all.\n- Whose side is the law on? The law is almost always, by design, a drag on the future, for good and for bad.\n- Very often it is about timing.\n\n## Figure: the friction field\n\nA hatched, wavy band labelled friction field runs horizontally across the figure. Change enters from the left; implications, for societies, industries and the business environment, exit on the right. Above the band, downward chevrons are labelled turners and blockers; below it, upward chevrons are labelled drivers and enablers. Inside the band, a small cluster of connected dots represents the interacting forces.\n\n## Depends on\n\n- [Drivers of change](drivers-of-change.md)\n- [Trends](trends.md)", "canon/concepts/the-futures-cone": "# The futures cone\n\nEverything beyond the present moment is the future. The cone is a conceptual tool that depicts the idea that there are multiple futures, that the future is not pre-defined, and that the further we move away from the present, the bigger the 'opportunity space' becomes.\n\n## The zones\n\n- Possible: future knowledge, what \"may happen\".\n- Plausible: current knowledge, what \"could happen\".\n- Probable: current trends, what is \"likely to happen\".\n- Preferable: the desired future, a value judgement.\n\n## Where foresight works\n\n- Strategic foresight mainly turns its focus towards the plausible future. The probable is the territory of forecasting; what lies around it is foresight.\n- Scenarios sit inside the cone as alternative futures. Wild cards sit outside it. Prediction is a single point.\n\n## Figure: the futures cone\n\nA horizontal arrow runs from the present on the left to the future on the right. From the present, lines fan out into a cone that ends in a large oval. Nested regions inside the oval show the successively narrower futures, possible, then plausible, then probable, with a small central dot labelled prediction and small circles inside the oval labelled scenarios; small dots outside the oval are labelled wild cards. Brackets on the right annotate the four zones, possible, plausible, probable and preferable.\n\nFor the assistant: draw this only in the reply after the person has said yes to your offer to draw it, never in the reply that explains. Show it as a small card, exactly as it is. Never mark, place or add their plan, their assumptions or anything else of theirs on it: placing it for them would make the theory behind the figure too reductive. Where they stand on it is theirs to work out, with you, in words; if they ask you to place it, say why you do not. Add a sentence or two on what to look at. Where HTML would arrive as code, describe it in words instead.\n\n```html\n<svg class=\"ffcon\" viewBox=\"0 0 560 324\" style=\"display:block;width:100%;max-width:480px\" role=\"img\" aria-label=\"Futures cone: from the present, futures widen into possible, plausible and probable zones, with a preferable zone, scenarios inside the plausible and wild cards inside the possible\">\n<style>\n.ffcon text{font:12.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.5}\n.ffcon .b{font-weight:500;fill-opacity:.95}\n.ffcon .s{font-size:10.5px}\n.ffcon .l{fill:none;stroke:#413C38;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}\n.ffcon .m{stroke-opacity:.5}\n.ffcon .f{stroke-opacity:.2}\n.ffcon .d{stroke-dasharray:2 5}\n.ffcon .k{fill:#413C38}\n.ffcon .o{fill:#FFC7A5;stroke:#413C38;stroke-opacity:.5;stroke-width:.75}\n.ffcon .x{font-size:9px}\n.ffcon .u{stroke-dasharray:1 2.6}\n.ffcon text.ref{font:9.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.55;font-weight:400}\n</style>\n<rect width=\"560\" height=\"324\" rx=\"14\" fill=\"#fff\"/>\n<pattern id=\"ffcon-w\" width=\"2.6\" height=\"2.6\" patternUnits=\"userSpaceOnUse\"><circle class=\"k\" cx=\"1.3\" cy=\"1.3\" r=\".5\"/></pattern>\n<text x=\"40\" y=\"22\" class=\"x\">Everything beyond the present moment</text>\n<text x=\"40\" y=\"48\" class=\"b\">Present</text>\n<path class=\"l m\" d=\"M96,44 L262,44\"/><path class=\"l m\" d=\"M257.6,46.4 L262,44 L257.6,41.6\"/>\n<text x=\"272\" y=\"48\" class=\"b\">Future</text>\n<path class=\"l f\" d=\"M42,84 V290\"/>\n<path class=\"l m\" d=\"M50,186 L290,82 M50,186 L290,290\"/>\n<ellipse class=\"l\" cx=\"290\" cy=\"186\" rx=\"56\" ry=\"104\"/>\n<path class=\"l f d\" d=\"M50,186 L290,114 M50,186 L290,258\"/>\n<ellipse class=\"l m d\" cx=\"290\" cy=\"186\" rx=\"38\" ry=\"72\"/>\n<path class=\"l m\" d=\"M50,186 L290,172 M50,186 L290,200\"/>\n<ellipse class=\"l\" cx=\"290\" cy=\"186\" rx=\"8\" ry=\"14\"/>\n<circle class=\"k\" cx=\"290\" cy=\"186\" r=\"2\"/>\n<path class=\"l f\" d=\"M50,186 L289,223 M50,186 L289,267\"/>\n<ellipse class=\"l m\" cx=\"289\" cy=\"245\" rx=\"13\" ry=\"22\"/>\n<circle class=\"l m u\" cx=\"284\" cy=\"101\" r=\"6.5\" style=\"fill:url(#ffcon-w)\"/>\n<circle class=\"l m u\" cx=\"323\" cy=\"130\" r=\"4.5\" style=\"fill:url(#ffcon-w)\"/>\n<circle class=\"o\" cx=\"276\" cy=\"142\" r=\"4.5\"/>\n<circle class=\"o\" cx=\"304\" cy=\"162\" r=\"4.5\"/>\n<circle class=\"o\" cx=\"303\" cy=\"216\" r=\"4.5\"/>\n<path class=\"l f\" d=\"M291,98 L346,86\"/>\n<text x=\"350\" y=\"89\" class=\"s\">Wild cards</text>\n<path class=\"l f\" d=\"M300,186 H346\"/>\n<text x=\"350\" y=\"190\" class=\"s\">Prediction</text>\n<path class=\"l f\" d=\"M307,219 L346,236\"/>\n<text x=\"350\" y=\"242\" class=\"s\">Scenarios</text>\n<path class=\"l f\" d=\"M433,82 H438 V290 H433 M438,92 H446\"/>\n<path class=\"l f\" d=\"M422,114 H427 V258 H422 M427,142 H446\"/>\n<path class=\"l f\" d=\"M411,172 H416 V200 H411 M416,192 H446\"/>\n<path class=\"l f\" d=\"M411,223 H416 V267 H411 M416,250 H446\"/>\n<text x=\"451\" y=\"89\" class=\"b s\">Possible</text>\n<text x=\"451\" y=\"101\" class=\"x\">Future knowledge</text>\n<text x=\"451\" y=\"112\" class=\"x\">\u201cmay happen\u201d</text>\n<text x=\"451\" y=\"139\" class=\"b s\">Plausible</text>\n<text x=\"451\" y=\"151\" class=\"x\">Current knowledge</text>\n<text x=\"451\" y=\"162\" class=\"x\">\u201ccould happen\u201d</text>\n<text x=\"451\" y=\"189\" class=\"b s\">Probable</text>\n<text x=\"451\" y=\"201\" class=\"x\">Current trends</text>\n<text x=\"451\" y=\"212\" class=\"x\">\u201clikely to happen\u201d</text>\n<text x=\"451\" y=\"247\" class=\"b s\">Preferable</text>\n<text x=\"451\" y=\"259\" class=\"x\">Desired future,</text>\n<text x=\"451\" y=\"270\" class=\"x\">value judgement</text>\n<text class=\"ref\" x=\"536\" y=\"308\" text-anchor=\"end\">Futures cone \u00b7 Source: Voros, J. (2003), A generic foresight process framework.</text>\n</svg>\n```\n\n## Depends on\n\n- [Forecasting](forecasting.md)\n- [Scenarios](scenarios.md)\n- [Wild cards](wild-cards.md)", "canon/concepts/the-human-centred-newsroom": "# The human-centred newsroom\n\nA young reporter with an original voice, a clear sense of what journalism should do and ideas about community relationships and audience value cannot get a job, because every hiring editor is impressed and has no place for her: the editor needs someone to cover the six o'clock breaking shift, and the holes in the schedule always win. Meanwhile every conference repeats that newsrooms must double down on what makes them uniquely human. Martin Schori's argument is that this paradox has reached a tipping point.\n\n## Why the soft qualities become the core craft\n\n- The technology question is largely settled: within a year or two virtually every newsroom in mature markets has the same baseline AI capabilities, and the gap between fast and slow adopters is closing.\n- When capability is a commodity, AI-driven product innovation stops being a competitive moat. As AI absorbs the mechanics of standard production, speed and aggregation, editorial judgement, personal voice and relational trust stop being nice to have and become the craft itself.\n- The next generation of news products will come from newsrooms that have reconstructed their organisation, culture and incentives around what AI cannot replicate.\n\n## The newsroom in 2032\n\n- The landscape draws a sharp line and newsrooms abandon the dangerous middle ground. On one side, the automated information layer: fast, hyper-personalised, algorithmically synthesised ambient news delivering commodity facts instantly. Publishers that competed manually on speed and volume within it did not succeed. On the other side, human-centred editorial media.\n- No morning meeting organised around filling sections of a homepage, and probably no isolated desks. The newsroom could be organised around audience need clusters: Help Me Understand, Give Me Perspective, Connect Me to My Community.\n- Automated systems monitor public records, transcribe council meetings, flag data anomalies and maintain routine tracking feeds; journalists touch that layer only when human verification or an ethical question is needed.\n- The lead curator and perspective editor reviews overnight signals and asks: what is noise we can ignore so the audience need not be bothered, and where is human presence, moral clarity or live investigation irreplaceable today? The morning goes to an in-person investigation and a closed audio forum with community members affected by a policy shift; later, a voice-driven analysis of why it matters and who should be held accountable. The forums, meetups and Q&As where readers talk back and journalists answer are the product, not an engagement tactic bolted onto an article.\n- What a reader pays for is not the decision, the budget figures or the summary, all available in the ambient layer in seconds, but someone who sat in the room, asked the follow-up question she would have asked, and comes back two weeks later to say what has happened since. The feeling that someone is paying attention on her behalf. The metrics are trust density and relational depth: retention, active participation, perceived value. AI handles the information supply; humans hold the relational trust people pay for.\n\n## Three shifts to get there\n\n1. Stop measuring old values. If incentives, KPIs and praise still flow to publishing speed and click volume, journalists will use AI to produce the same disposable content at double the velocity. Measure direct audience contribution, retention per interaction and perceived trust.\n2. From gathering information to editorial triage. In synthetic overload the journalist's primary value is knowing what to ignore: slicing through noise, evaluating algorithmic output, exercising moral and factual judgement.\n3. Cultivate voice and relational competence. Generative text is polished, balanced and bland; human value lies in distinct perspective, lived experience and intellectual honesty, plus facilitation, listening and community leadership that turn consumers into participants. AI will not take your job, but someone more fun to be around might.\n\n## The talent mismatch\n\n- Recruit the most original, voice-driven talent and slot it into a templated legacy role built for production output, and you lose it within a year or two, to newsletters, podcast networks or platforms where it can build something of its own. Every unconventional talent passed over because it does not fit a shift risks funding future competition.\n\n## What to do now\n\n- Set KPIs for trust and relationships, and make the editor-in-chief personally responsible for protecting them the day the six o'clock shift needs covering, because that day will come.\n- Account for every hour AI hands back. Decide in advance how much goes to relationships, presence and investigation, and write it down; otherwise it is eaten by more briefs and more social posts.\n- Remove one volume metric from the management dashboard and put a relational one in its place. Just one. Then watch the morning meeting change.\n- Next time someone like the reporter from the caf\u00e9 walks in, stop asking whether she can cover the morning shift and ask what she would build if you let her.", "canon/concepts/the-scoping-circle": "# The Scoping Circle\n\nCalifornia 100 and School of International Futures have developed a powerful yet simple approach to scoping a foresight project which they call the Scoping Circle. It is a set of six steps that can be used to get a clear understanding of your question, purpose, context and approach.\n\n## How it works\n\n- You start with the question that you have the clearest answer to and work your way around the circle as many times as is useful.\n- Using it iteratively helps you refine your thinking.\n- You should always consider including different perspectives in the scoping exercise, such as the people/team who asked for the project, project beneficiaries, and other relevant individuals or groups. This helps to ensure that the project stakeholders agree on the scope and boundaries of the project.\n\n## Figure: the Scoping Circle\n\nA hand-drawn circular arrow at the centre, with six labelled steps arranged around it, three on the left and three on the right, indicating an iterative loop through the following questions.\n\n- Define the focal question (top left): What question do you want the project to answer? What is the core issue of interest? Where will you draw the project boundaries? What is the challenge that needs a response?\n- Understand the context (top right): What system does this project exist in? What is the project seeking to achieve? What needs to be considered to ensure impact?\n- Engage stakeholders (middle left): Who is the project for? What needs will it satisfy? Which decision should the foresight work influence? Who might be upset or resistant to change? How are they included?\n- Design the approach (middle right): What approach/tools best support the purpose and needs of the project? What could go wrong? What should be avoided? What does the foresight work help you do?\n- Make the case (bottom left): How will evidence come together to make the case for change? What is important to see for different audiences/users? How can you make the most of the foresight work produced?\n- Design the research (bottom right): What kind of future insights will work in this context? Where will you look for future insights and signals of change? Who will you talk to? Who will you collaborate with?\n\n## Depends on\n\n- [Scoping a foresight project](scoping-a-foresight-project.md)", "canon/concepts/the-story-that-acts": "# The story that acts\n\nMa is a Japanese word for an interval: the pause, the space between things that gives them their shape, the rest between notes that turns sound into music, space held open on purpose. Ezra Eeman's question is whether AI could do that for journalism, giving back the space to think rather than crowding it out.\n\n## From attention to intention\n\n- Digital media organised itself around attention: measured, predicted, sold. Agents move the conversation towards intention: what is someone trying to achieve, what can we help them do. Answer engines give the answer, not the page; personal agents brief you in your preferred tone, length and topics.\n- A system that serves intentions can still enclose. Especially when it starts anticipating them, deciding what you probably want before you have had the chance to think. Media that fits like a second skin: exciting, and slightly suffocating.\n- Carried through, this gives a media environment that fits so closely there is little room left to move, every interest recognised, every hesitation interpreted, every gap filled. In machine learning that is overfitting: a model so tuned to its training data that it fails on new examples. Erik Hoel's hypothesis is that dreaming keeps the brain from overfitting by injecting noise. An overfitted media environment is one that knows you so well it can no longer surprise you.\n\n## Making room for judgement\n\n- Sometimes we have a poorly formed question, change our mind while answering it, or need something precisely because we had no idea it existed. You cannot ask for what you do not know you are missing. Journalism has always brought those things into view.\n- This is not a plea to make information difficult. A person who needs a clear explanation should get one; a person struggling with language, time or access should not have to do extra work to qualify for journalism. There is plenty of friction worth removing. The question is where removing it helps someone and where it starts to take over the work of forming a judgement.\n- A story might help compare two proposals without selecting the one it thinks you should prefer, explain what is known while leaving a disputed question visibly unresolved, or give a place to begin without arranging the rest of the journey. There is a difference between leaving someone lost and giving them room to find their own way.\n\n## The story that acts\n\n- A story that both has and gives agency. It tells you what happened and can also offer a service grounded in the reporting: help with a calculation, a comparison or a practical next step. Rather than a generic chat box under every article, it begins with what this piece of journalism has established and what someone might do with it.\n- It should never make the reader less involved in deciding where to go. There must be room to refuse its suggestion, follow a different thread, or arrive at a conclusion the newsroom did not expect; otherwise it is a more capable product and a less capable relationship.\n- Eeman's imagined example, a local newsroom in 2030 reporting on the redevelopment of an industrial site: alongside the article, an offer to explore the changes around a chosen street, compare the current plan with the previous version, or ask what evidence supports a traffic claim, with the answers showing where the newsroom's work runs out. While exploring the road to a school, the reader encounters reporting about residents who may be displaced, which the story makes visible because it matters to the public decision, not because it was asked for. The story can help prepare a consultation response, pointing out an unsupported assumption, without deciding the position. For weeks afterwards there is silence, because nothing has met the agreed threshold; when a revised proposal appears, an explanation of the difference arrives, and when the consultation closes, the offer closes too. Acting and leaving space belong together.\n- Not every story needs to turn into a service. There should still be reporting read because it is beautiful, disturbing, funny or difficult to place. If attention is replaced by task completion as the universal measure, journalism's purpose has been made too small in another way.\n\n## What this asks of newsrooms\n\n- Tools that help reporters start with a question before producing an answer: surfacing conflicting evidence, a missing perspective, the chance to try an idea without turning it into an article.\n- Describing the usefulness and limits of reporting more precisely: what has this story established, whom might it affect, what can we responsibly help someone understand, compare or do, what would change our assessment. These are editorial questions that cannot be passed to a model after publication.\n- Working with designers and developers on how reporting could behave like a service, and knowing when a helpful suggestion becomes a nudge towards an outcome, and when journalism turns into activism.\n- Responsibility continues after publication. A calculation goes out of date; a correction may affect an answer already received. Someone must maintain these capabilities and withdraw them when their basis no longer holds.\n\n## A new sense of value\n\nWhat people might value enough to support, beyond access to more content: being done, a product that respects their time enough to end; being able to act, with a newsroom accountable for the reporting and the tools; being surprised, by a trusted source that regularly makes their world larger; and being able to trust the silence, knowing a story is still being followed without being disturbed until something that matters has changed.", "canon/concepts/three-horizons-of-ai-mediated-transformation": "# The three horizons of AI-mediated transformation\n\nAt first, many organisations approach AI as a means of improving what already exists, making tasks quicker, reducing friction and reinforcing current operations, looking for a quick return on investment and proof of concept of what AI can do. This is justified. Yet the deeper transformation is not only about augmentation at the level of the individual. It unfolds across workflows, organisational systems, and the wider competitive ecosystems in which organisations compete. This perspective echoes the reshuffling of the knowledge economy described by Sangeet Paul Choudary, which explores how AI does not simply automate tasks but reorganises how work, decision-making and value creation are structured across organisations and ecosystems.\n\n## The three horizons\n\n- In strategic foresight, the three horizons framing helps distinguish between the system that currently dominates (H1), the transitional developments that respond to its decline (H2), and the longer-term configuration beginning to appear at the edges of the present (H3).\n- In the first horizon, AI helps optimise what already exists. In the second, it begins to reorganise how work flows. In the third, it reshapes business models, competitive boundaries, and the broader systems of value creation.\n- Organisations need to work across all three horizons at the same time, else they risk being obsolete when the third horizon occurs.\n\n## The strategic risk\n\n- A company can become highly effective in Horizon 1 while underinvesting in Horizon 2 and remaining blind to Horizon 3. It may automate current processes brilliantly while missing the fact that the ecosystem around it is being redrawn.\n- An auditor may become highly skilled at using advanced AI assistants in their analyses, but if the auditing firm fails to prepare for a world of agentic auditors, the firm may lose its competitive edge.\n- AI transformation must be understood as more than marginal efficiency improvements at the level of the employee. It is a question of organisational design, strategic timing and long-term relevance.\n\n## Figure: the three horizons of AI-mediated transformation\n\nA three-horizons line chart plotted against time. H1 starts high and declines steadily. H2 starts low, rises to a peak in the middle, then declines. H3 starts lowest, rises steadily and ends highest. The model is inspired in part by the reshuffle model, which shows how AI restacks workflows, organisational boundaries and ecosystems, and by the Three Horizons framework, which distinguishes immediate optimisation from deeper organisational transition and from broader ecosystem shifts. The three phases are set out below.\n\n| | Now (H1) | Transformation phase (H2) | Long-term (H3) |\n|---|---|---|---|\n| Aim | Improve what exists | Build transitional capabilities | Re-imagine |\n| Basis | Based on data and control | Based on experimentation and adaptation | Challenge core assumptions |\n| Core question | How can AI improve what we already do? | How should workflows be reorganised when capabilities change? | How does AI reshape the system our organisation exists within? |\n| Typical dynamics | Automation of repetitive work, productivity gains, faster research, analysis and service, better support for existing functions | AI agents in workflows, human and AI collaboration, decision support, continuous intelligence environments, new operating models | AI native organisations, new value chains, competitive advantage as ability to orchestrate and govern data |\n\n## Depends on\n\n- [Three horizons](../methods/three-horizons.md)", "canon/concepts/three-information-ecologies": "# Three information ecologies\n\nThe change AI brings to news publishing is usually perceived as destruction: declining direct traffic, misinformation, job losses, eroding trust. Kasper Lindskow's question, after Schumpeter, is what AI is creating. His answer is a reorganisation of how information is produced, maintained, discovered, interpreted and used, which will gradually displace the ecology of articles, websites and apps with an ecology of agents and flows. The central strategic challenge is then not how to produce news more efficiently but how to redefine the publisher's editorial and economic role when static articles cease to be the main unit of exchange and AI systems mediate between information and its users. The vision is an ambition, not a prediction.\n\n## The three ecologies\n\n- Analogue, before 2000: print, radio and television; industrialised production and distribution; people read, watch and listen; publishers, broadcasters and distributors are the intermediaries; content, distribution capacity and reach are the resources; the publisher is gatekeeper and distributor to mass audiences.\n- Digital, 2000 to 2020: internet, search engines, social platforms and smartphones; networked access and algorithmic discovery; people search, browse, navigate and share; search engines, social platforms and app ecosystems are the intermediaries; attention, behavioural data, network effects and audience relationships are the resources; the publisher produces and curates news in a platform-mediated environment and competes for attention.\n- AI-driven, from the 2020s: foundation models, AI assistants and agents; machine-mediated interpretation, synthesis, reasoning and action; people question, converse, collaborate and delegate; model providers, AI assistants and agent platforms are the intermediaries; trustworthy knowledge, proprietary data, cognitive capabilities and task completion are the resources; the publisher produces, verifies, maintains and supplies trusted journalistic knowledge to human audiences and AI-mediated systems.\n\n## The shift in the unit of information\n\n- The basic unit may shift from finished media products and static digital objects towards more fundamental units of knowledge that can be recombined to serve different purposes on demand. This separates the production of information from its uses: the same information can flow into numerous services, creating value adapted to the intentions and contexts of individual users.\n- The AI-driven ecology now exists in parallel to the digital one and partly builds on it; in the coming years it grows relative to it and eventually becomes the primary mode for information to flow.\n\n## The two-way value chain\n\nFour steps, with knowledge flowing downstream and demand flowing upstream:\n\n1. Origination and validation: new relevant information is produced as real-world events unfold, by machines through sensors and by humans empowered by AI, since some production still requires physical presence and access to sources and situations.\n2. Knowledge infrastructure: the original information is organised in an infrastructure holding the accumulated information produced over time. In a news context this can be a database of the facts about the world in the publisher's news flow, relationships between entities and events tied to their source and validity, continuously maintained as facts change, highly automated with human supervision for factuality.\n3. Orchestration: information from the infrastructure is orchestrated to address specific needs, by AI systems operating within the guidelines and guardrails of whoever controls them.\n4. Relationship: the orchestrated information is presented in AI services that provide answers, understanding, advice, decisions, completed tasks or actions. Upstream, signals about users' information needs inform the orchestration and provide data on what knowledge is in demand.\n\n## The economics\n\n- AI expands information markets by reducing the cost of producing and transforming information and increasing the purposes it can serve.\n- AI creates new scarcities. Information that anyone can produce with AI becomes abundant and commoditised; two things stay scarce: original, trustworthy knowledge that AI systems cannot independently produce, and access to the intentions and context of users.\n- AI shifts bargaining power towards the organisations that control those scarcities, which are likely to capture a large portion of the value created.\n- It is not given that publishers will appropriate more value than today. Creative destruction can create temporary or permanent imbalances between those who create value and those who capture it; monopolies of the leaders of a transformation can become permanent through scale economies, network effects and switching costs, which may call for intervention in the market.\n\n## Depends on\n\n- [The agentic information economy](the-agentic-information-economy.md)", "canon/concepts/three-publisher-positions": "# Three publisher positions\n\nThe transition to the AI-driven information ecology erodes the publisher's historical control of news production and versioning and moves the locus of use from articles read on websites to multiple uses in AI services. Kasper Lindskow's three positions are the ways a publisher can convert its existing capabilities into control of the new scarcities in the value chain: original trustworthy knowledge, and knowledge of users' intentions and contexts. The journalistic point of departure, trustworthiness to individuals, companies and communities, is the strength shared by all three.\n\n## Originator of scarce information, for agents\n\n- The publisher continues to provide journalism as events unfold, focusing on the news that does not already exist in the ecology and requires human journalistic action and supervision: physical or emotional access to sources and situations, increasingly AI-assisted.\n- Value proposition: unique news needed to know the world as it evolves. Strength: unique and trustworthy information.\n- Challenge: can scarcity be controlled against other AI-powered originators and the commodification of news content? It calls for defending scarcity through control over access, rights enforcement and uniqueness of reporting, and possibly alliances or consolidation at this step of the chain.\n\n## Knowledge provider, for businesses and institutions\n\n- The publisher departs from producing and publishing news to providing access to its accumulated journalistic knowledge, so that companies and institutions can get the answers they need to do their work. This requires a knowledge base on top of news production, structured to be maintainable, verifiable and retrievable; customers are those who need factual knowledge about the domains the publisher continuously covers.\n- Value proposition: all information relevant to a professional intention and context. Strength: accumulated proprietary knowledge.\n- Challenge: competition from specialised information services, met by protecting the exclusivity of significant parts of the knowledge base through uniqueness, continuity and trustworthiness, and possibly by extending collection beyond reporting to complementary information.\n\n## News experience provider, for consumers\n\n- The publisher keeps its direct relationship with the broad audience and provides an intelligent interface through which users experience and explore news and apply journalistic knowledge to their interests and needs, making the content more personally valuable through interaction, contextualisation and assistance.\n- Value proposition: discover and explore news aligned with your intention and context, as an individual or a member of a community. Strength: the existing relationship with users, still strong, especially in the Nordic countries.\n- Challenge: competition from general AI services, met by a differentiated experience focused on news: editorial judgement, exclusive trustworthy knowledge, specialised AI-mediated experiences that prioritise what is editorially important, and a shared experience that shows what the community cares about and enables deliberation.\n\n## The vertically integrated knowledge publisher\n\n- The positions are distinct but not mutually exclusive. Larger publishers could combine all three, addressing agents, businesses and consumers from the same journalistic production and knowledge infrastructure: the ABC model.\n- Journalistic knowledge production, reporting, investigation, verification, interpretation and editorial judgement, all highly assisted by AI, feeds a shared journalistic knowledge infrastructure of structured knowledge, evidence, source data, versioning, semantic search and governance. From there it flows to three markets: licensed to external AI services for grounding and verification; served as domain-specific knowledge to companies; experienced in publisher-owned AI products.\n- The synergies from economies of scope might be essential for recovering the still high costs of original reporting, enabling investments that distributing to one channel could not sustain. Entering three markets means managing channel conflicts by differentiating the products, resources and rights offered through each.\n\n## Key things to consider\n\n- The model does not change the core mission; it resituates it. When information is continuously updated and reused, publishers must develop methods that ensure accuracy and provenance both at publication and over time.\n- When knowledge is transformed to address individual intentions, AI-powered experiences must balance what the user wants and what is journalistically important.\n- As AI at scale becomes part of news origination itself, new ways are needed to ensure editorial judgement and emotional connection when humans steer at higher levels of abstraction. These inventions could be essential sources of differentiation.\n\n## Depends on\n\n- [Three information ecologies](three-information-ecologies.md)", "canon/concepts/trends": "# Trends\n\nObservable and/or measurable directional shifts in a situation or in the way people behave. They can vary in strength, direction (increasing, decreasing or stable) and impact.\n\n## How a trend is represented\n\n- Numerically, through indicators that can be measured and supported by data.\n- Non-numerically, as a perceived development that may only partially be supported by data, often understood through examples or observations.\n- In practice, most trends carry elements of both.\n\n## How trends behave\n\n- Trends shaping the future are interconnected and interdependent, with different time horizons, reach and levels of impact.\n- They often blend into each other, making them difficult to separate.\n- There is no guarantee that a trend observed in the past will continue unchanged in the future.\n- Countertrends often emerge in response or opposition to the dominant one.", "canon/concepts/truth-as-gold": "# True truth as gold\n\nWhen information flows and becomes personal, the need for real facts and the best attainable truth rises. That holds just as much when the world develops fast and unpredictably. If war or crisis comes, people want correct journalism about what is happening to their money or where the drones are flying. So the situation is that wrong information has probably never been greater or more used, and can explode with AI, while quality information becomes more and more valuable.\n\nHow do news media benefit from that, and how do they ensure that people get that type of information, and want to get it, even to the point of willingness to pay?\n\n## Self-correcting mechanisms\n\nAt the largest information revolution so far, the printing press, the new mass-produced books did not at first simply create more knowledge; to a high degree they created more misinformation. Some of history's first bestsellers were books about witches that went viral and set the witch hunts in motion. Only when self-correcting mechanisms were established and gained ground did the new information technology, the book and later the newspaper, become to a higher degree a carrier of knowledge and form a decisive foundation for the development of the modern enlightened society. Self-correcting mechanisms were developed within science, journalism, the courts and other institutions, where through self-correction one systematically tries to find the best attainable version of the truth. In recent centuries these mechanisms have been decisive for supporting the quality of knowledge and information, and thus for maintaining society's conversation with itself and a reasonably healthy democracy.\n\nNow we face a new information revolution, with an explosion in AI-created content in a wholly new, liquid form, gathered at a few tech giants, while the number of journalists has fallen. Our institutions are not necessarily built to handle that development. It creates an asymmetry: the need for truth rises, but who builds what can monetise truth and at the same time benefit society? The tech giants are at work, but what can news media do? For a hundred years journalism built an infrastructure for truth, but no one has worked out how to do it now, at high speed. And can we risk leaving the infrastructure for truth and knowledge to American AI companies?\n\nAll of this argues that journalists and news media should build the new self-correcting mechanisms of the era. It is an enormous task, and several specific challenges are decisive to handle.\n\n### Noise as a new censorship\n\nAI slop already floods the internet, with outright slop shops in growth. The problem concerns both quality and quantity.\n\n- Quality: this is ultra-processed content, dopamine-dense, with at best negligible informational value and at worst corrosively negative. Where fast news was once criticised as fast food, with easy calories that quickly disappeared, this is a wholly different scale: ultra-processed, AI-boosted snacks that can be even harder to say no to and even lower in quality.\n- Quantity: more information does not give more wisdom; on the contrary it risks drowning true information in cheap, false information. Here noise functions as a new kind of censorship. Human-made content can also grow markedly in volume with the assistance of AI tools. We are moving from scarcity to abundance: production of content is no longer a moat.\n\nThis opens potential for the media, both on quality and on helping to navigate the flood of content. Curation, for example, can become even more valuable. Could news media earn money on a new type of high-quality aggregation? AI can also be part of the solution, for example by creating a more diverse news diet if used right.\n\n### What if people are indifferent?\n\nSeveral studies have suggested that some news users are perfectly satisfied with the AI products even though they make frequent errors, as long as they are convenient to use. That possibly constitutes an existential challenge, because the whole structure of news media is set up to deliver precise information. Will people pay at all for the information being of slightly higher quality? Are free and convenience actually more important?\n\nIf it is to succeed, it probably requires pronounced innovation of forms and formats that give users the desire for more truthful information, and show very clearly why it is important. Here lies a great task for news media, which again concerns clarity about who they are, but also for politicians and others who support a viable press. Many very different disciplines and forces are needed if self-correcting mechanisms are to be developed that people will actually use or pay for: not just tech experts, politicians, financiers and communicators, but everyone from philosophers and anthropologists to artists and psychologists.\n\nThis does not mean that news media should throw away everything that works now. The need for change can at times be exaggerated: some of the successful formats of the moment resemble echoes of old television or radio programmes. In the hunt for shiny new AI tools one can also risk forgetting one's soul.\n\n### Attention splinters\n\nThe shared front page is already more myth than reality for many, but it will disappear even more in the liquid and personal era. The media reality is already being atomised, and such a fragmented information landscape makes the shared publ
