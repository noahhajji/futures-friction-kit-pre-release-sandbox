rn of unclear buy-in.\n\n## Needs\n\n- Prioritised requirements for an innovation sparring tool: frictionless, simple, valuable on first use, secure, cheap, platform-agnostic, restrictable to a small group, able to challenge assumptions and give concrete future-oriented recommendations, able to work across horizons, hackable, role-adaptive, source-transparent, visual where assumptions and management communication are concerned, and able to play a provocative devil's advocate that imposes constraints. (7 mentions)\n- Organisations cannot do everything themselves and would value outside help connecting the dots between initiatives, surfacing practices and ideas from outside the media industry, and simulating how audiences or advertisers might respond to a proposed idea. (3 mentions)\n- A check of the assumptions behind an idea belongs at the very start of product development, as a required step among the other checks an idea must pass, before anything is written down. Few people in a news organisation have the time to think a plan through, and leaving the check to each product manager's choice is not expected to work. (3 mentions)\n- Experiments need portfolio management: an explicit mechanism to see which experiments exist, which horizon they belong to, what resources and metrics apply, which to stop or scale, and how to move them between horizons, since long-horizon work does not land in the next horizon automatically and areas such as AI move faster than expected.\n- To keep innovation projects alive as they near their goal, practitioners propose status updates, reminders, agent support for building a pitch, quick demonstrations on the organisation's own stack, sparring for good process and help qualifying decisions and convincing leadership.\n- Open questions at each stage of a proposed innovation process: vision and anchoring at the need stage, language at the idea stage, how many to involve and how to present work, and resourcing, return and KPIs at the decision stage.\n- Practitioners want a tool that intervenes partway through an innovation process, before resources are spent, to redirect processes heading for the wrong result, and want to map how their process actually works today and where its pain points sit.\n- Analysts want to automate personalised insight delivery to editorial desks and surface patterns they would not see in raw numbers, and internal chatbots over policy documents with human escalation are proposed.\n- Practitioners want ready-made building blocks that already work rather than building from scratch, noting that a large share of what counts as innovation never reaches production.\n\n## Beliefs\n\n- Editorial is often the biggest bottleneck for change: organisations with AI-ready data foundations did not act for lack of leadership interest, and editors of the old school block changes to established formats on the assumption that readers want what they are used to and that the organisation knows best.\n- Some staff frame the desired outcome as an internal community where ideas spark off one another rather than a revenue tool, while questioning whether people are willing to share ideas at all, which they frame as a question of ownership over ideas.\n- Value-driven organisations with a clear mission and journalists retaining unique human expertise are believed to have a viable future; an AI cannot replace a specialist's twenty years of accumulated knowledge though it can support parts of the task.\n- Innovation processes are changing because a working prototype can now be built fast enough to bring a test group to leadership within weeks, whereas many good ideas historically stalled on not knowing how a proposal reaches leadership.\n- A tool that only draws on one team's history risks becoming an echo chamber that keeps re-solving the same systemic problems; insight into other teams' problems is what would let a team change direction.\n- Whenever the organisation commits to a new bet it should set clear objectives and articulate what it expects; once goals are set, an AI agent nudging the organisation toward that shared direction is welcome.\n- Journalists prefer not to write routine data-driven items that could be generated from good data, preferring to go and talk to the people involved.\n- It has to be cheap to fail. A quick prototype in people's hands gets a response at once and says far more about the real need, what can be done and where the potential lies, and its failures hold that information. In older IT projects a failure was a catastrophe, because half a year and millions had already gone into it.", "context/sector/innovation-structures": "# Innovation structures\n\n## Practices\n\n- Organisations that succeed at long-term innovation rely on cross-functional teams on clearly defined problems, embed innovation in daily operations, give teams a mandate to test quickly, protect recurring cross-disciplinary time, run incremental work in sprints, and structure themselves around experiments rather than production. (11 mentions)\n- Several organisations have set up small cross-departmental AI teams working across desks, with editorial perspectives included as needed, self-organising around existing roles with protected time for the work, and given either a cost-saving goal or a deliberately ambitious one. (10 mentions)\n- Recurring, open, informal AI dialogue forums without agenda or minutes can grow quickly and be copied across departments; building cultural 'frequency' around AI through such formats is where some organisations invest most energy. (8 mentions)\n- In current data and automation workflows an external request form is ranked by project leaders, developers are brought in late so information is lost, and communication runs through intermediaries; participants sketched a future state where the developer goes out proactively to understand problems and connects requests to existing ideas.\n- Spin-off companies from internal innovation can grow to serve external markets, at which point they grow away from the parent's needs and take the people who built them, making the pattern hard to sustain.\n- Peer organisations across the Nordics have historically struggled to collaborate because priorities rarely align, though the AI shift is prompting more contact; bringing in high-profile external experts to present scenarios to large leadership groups is effective at paving the way for perspectives insiders struggled to convey.\n- Some organisations use no formal innovation process and consider their lived daily culture their primary innovation tool; they have no innovation group and do not label their work innovation, which makes a pluggable innovation toolkit hard to picture.\n- Adjacent fields show a contextual assistant can open doors to a process, support drafting and translate complex arguments for decision-makers, not only give advice.\n- Protected morning focus blocks with no calls or email, and deliberate breaks, are used to create room for thinking; structured reflection is an organisational capacity many organisations lack.\n- Where no structure around innovation existed, establishing one within a few years meant ideas were carried forward rather than lost; innovation leads offer themselves as a contact point and propose communities for dialogue about innovation.\n\n## Constraints\n\n- Large research-based innovation partnerships struggle: broad partner bases and heavy formal change processes are innovation-killing, and framing everything around responsibility sits in tension with fast continuous improvement.\n\n## Needs\n\n- Where innovation work should be formally anchored within a media organisation is an unresolved question with no shared internal view; the most siloed organisations, where different editorial units think in completely different ways, would need a significant push to adopt a shared framework. (4 mentions)\n- A good local prototype is not sufficient; organisations need an internal ecosystem in which solutions can be implemented and scaled across the organisation.\n\n## Beliefs\n\n- 'Innovation theatre', labs, reports and experiments that display activity without producing change, is a recognised risk, as is a tool nobody uses or a framework that ends up as a PDF filed away; a product does not by itself create a long-term mindset. (5 mentions)\n- A lab inside the organisation is seen as unable to drive transformative change because existing systems are too slow; a separate AI-native unit is argued to get a clearer mandate, resources and the chance to design processes from scratch.\n- Hackathons and ideation weeks generate enthusiasm and concrete ideas across departments, but follow-through is weak: ideas rarely reach production, editorial representation is thin, and it is unclear what to pause and what to prioritise afterwards.\n- Innovation success ultimately depends on the people carrying it forward; it produces changes in thinking more than direct revenue, emerges in clusters, and in uncertain times organisations should rely on iteration and hypothesis-driven learning rather than fixed structures.\n- Experimental units have been closed in reorganisations after failing to produce enough or to communicate their value; the lab model lost support in favour of experimenting inside products, which pushed innovation toward incremental work, though early experimentation left a higher AI maturity.\n- Bringing in talented people is not enough without a pipeline that turns ideas into visible outcomes, or recruits leave as fast as they arrived; restricting a new tool to a small chosen group makes adoption far easier than an organisation-wide rollout.\n- What happens in practice often differs from stated ambitions, and organisations constrained by the pace they feel they must keep keep doing things the way they are used to; outside inspiration is welcomed as a way out of that pattern.\n- Change is most effective when it comes from the organisation's periphery rather than its core.", "context/sector/leadership-and-mandate": "# Leadership and mandate\n\n## Practices\n\n- Building leadership buy-in involves joint presentations, stress-testing the pitch against a strictly numbers-focused stakeholder, and investing time to understand collaborators' differing needs in a complex multi-stakeholder structure; teams can wait a long time to get an audience with senior management. (3 mentions)\n- Some organisations experience their constraint as time and resources rather than culture or structure, and see their competitive advantage as speed: a short distance from spotting a need to acting on it, fast decisions on partial information, ideas resolved informally. They fear any formal innovation tool that slows this down, and note the industry's low tolerance for friction.\n- Presenting current and future AI use to leadership prompts employees to bring forward their own ideas but also overwhelms some; innovation leads count more failures than successes and see the minimum value of a shared horizons vocabulary as letting leadership acknowledge where the organisation is not yet operating.\n\n## Constraints\n\n- Innovation drive is concentrated in a few key individuals; ideas survive because a specific person carries them, and when that person leaves the capacity goes with them, which is a reason to formalise tacit process knowledge and move from person-dependent to collective innovation. (7 mentions)\n- The largest barrier to futures-oriented innovation is human: culture, leadership, understanding and will. Long-term success depends on who holds decision power, what they are measured on, and whether a leader can justify diverting resources from operations and defend investments with no return in the next quarter. (4 mentions)\n- Leadership is often absent from innovation work, so decisions get reduced to simple commercial questions; friction also arises from different leaders owning different parts of the organisation.\n- Framing AI mainly as a cost-cutting lever, premised on how many editorial staff could be made redundant, makes the work impossible to introduce without provoking fear.\n- Incentives at the top are structurally misaligned: a leader whose tenure will end before long-term risks materialise does not feel their urgency.\n- Organisations publicly insist no one will be laid off while restructuring continues regardless, leaving staff distrustful of messaging about transformation already under way at the strategic level.\n\n## Needs\n\n- Innovation often happens only under clear pressure; to create legitimate urgency before a crisis is visible, leadership must be able to explain why the existing model is under pressure, which shifts could be decisive, what is risked by waiting and by investing too early, making uncertainties concrete without artificial panic. (4 mentions)\n- Innovation across organisational boundaries needs an incentive structure that lets people dare to cross them, clarity about the gatekeepers, and a culture that is open without becoming too collective or uniform. (3 mentions)\n- Long-horizon work must be communicable to management and the board: arguments linked to strategy and risk, a visualised portfolio, relevant metrics, small experiments presented as risk reduction, and language for uncertainty that does not sound vague; innovation leads want a tool that helps them present where the organisation is heading. (3 mentions)\n- Board and top management must be committed to moving innovation between horizons and must understand, believe in and personally use any tool, translated into their own language and connected to concrete decisions; without ownership at the top, long-horizon work becomes isolated.\n\n## Beliefs\n\n- New solutions only create value if they are simple to implement, sit inside a familiar work situation and give the user a clear early 'wow moment'. (7 mentions)\n- Established companies rationally allocate capital to their best customers and underinvest in disruptive innovation, retreating upmarket when threatened; transformation cannot show on a quarterly cycle and boards lack patience for eighteen-month cycles, and while a 70-20-10 allocation is cited, organisations land closer to 99-1-0. (6 mentions)\n- The real barrier to senior decision-makers keeping pace with AI is not lack of time but lack of interest or a cautious mindset; some senior figures lack basic understanding of what the tools can do, and keeping pace ought to be treated as a decision rather than something crowded out. (3 mentions)\n- Adopting a provocative, future-oriented tool depends on leaders having enough capacity to tolerate being shown that current practice may be wrong; buy-in requires a clear 'what's in it for me', an open mindset and willingness to relinquish control. (2 mentions)\n- Senior leadership frames the situation as 'change or die' or 'adapt or die': the organisation cannot run its business for another five years as it has, and the decisive factor is the will to act and learn through implementation rather than having ideas.\n- Innovation leaders often see their own strength as making change happen in phases rather than spotting opportunities first.\n- The open question for the industry is whether it can build capabilities, culture and structure in time, which may require centralising power and taking decisions unpopular with journalists; media leadership is rarely trained in structured methods and needs more diverse backgrounds.\n- An organisation's central challenge cannot be solved by AI alone, since AI has no intention of its own; the underlying issue is organisational clarity about purpose and trust rather than processing speed.\n- Making innovation decision-making too collective, standardised and top-down with a near-term cost focus kills experimental ideas before they can live, unless they already have supporting data.", "context/sector/organisational-memory": "# Organisational memory\n\n## Practices\n\n- Individuals, including a growing number of managers, already maintain their own personal AI knowledge bases, task systems and markdown note structures, fed continuously with their own notes; this is individual initiative rather than organisational provision, and some such setups fall out of use. (17 mentions)\n- Self-built shared knowledge bases become disorganised over time, making it hard to know whether an answer already exists or must be re-derived.\n- Some organisations report strong success with internal AI-based knowledge-sharing practices and archive whole strategy processes as onboarding material for new managers.\n\n## Constraints\n\n- Organisations have no central place or knowledge of where things are stored, data is fragmented across tracking tools, no organisation-wide AI system connects content, and AI has deliberately not been connected to internal systems for security, privacy and rights reasons; escalation paths for connecting AI to internal databases are unclear. (8 mentions)\n- People across an organisation independently build near-identical solutions, dashboards and fixes, tweaked slightly each time; repeats go unrecognised because of turnover and changed ways of working, and distilling what actually works across repeated attempts would be valuable. (6 mentions)\n- Objectives are set for projects but not stored systematically: no database links a project to its stated objectives and outcomes, follow-up on a released concept ends in a manager's slide deck, tagging depends on people doing it, and tactical and strategic process knowledge is rarely captured even though that is where practitioners change course. (6 mentions)\n- A knowledge bank of organisational processes and culture is hard to keep current because both change dynamically; it becomes a technical project needing maintenance, gives an advantage only as long as someone feeds it, and raises the question of who may edit its files. (6 mentions)\n- Organisations lack structured knowledge-sharing and rarely evaluate projects afterwards; lessons from larger projects are not carried forward, hypothesis-driven learning stays inside one team, and everyday busyness paradoxically stops teams sharing what works right when they are most successful. (4 mentions)\n- Search tools operate only over the article archive; almost no equivalent internal organisational-knowledge layer exists, and organisations increasingly want a general 'organisation brain' covering handbook, history and operational knowledge, on which personalised layers could sit. (4 mentions)\n- Shelved ideas are handled arbitrarily: some managers track them in personal workflows, some note them in a large management document, some park them on a frozen list; parking is an individual responsibility with no shared system, so knowledge is lost. (4 mentions)\n- No standard or supplier is established for an organisation's AI knowledge base, and AI companies compete to have theirs become the most used. That raises two questions for a newsroom: how it keeps its independence, and how it keeps its knowledge portable between tools. Some answer by building on open source and staying independent of any one technology company. (4 mentions)\n- Institutional history can only be created by someone taking time to tell it, to colleagues or to a system, and everyday work pressure does not leave room for that; any solution must make it easy for every department.\n- An organisation's own culture and structural constraints, such as shift-roster rules, should be part of the knowledge a tool works from, and any output it generates should be correctly sourced rather than fished from memory.\n- An earlier attempt to build a knowledge graph over an article archive stalled because the technology at the time was too complicated.\n- If an assistant does not understand the organisation's infrastructure, information gets lost; its instructions must be equipped to convey that infrastructure.\n\n## Needs\n\n- Organisations want to log which internal experiments worked and which did not, and to build a shared 'innovation bank' or best-practice repository that can be pinged during a meeting and consulted for what has worked elsewhere, since this knowledge is currently scattered. (6 mentions)\n- An organisational 'second brain' would need to account for what was not said and for how it updates over time, since feeding it more can confuse rather than enrich; the label itself is a false analogy, and the only way to learn what such a system is for is to build one and see where it breaks. (6 mentions)\n- Practitioners imagine giving an assistant access to internal communication channels to detect informal success signals, and propose capturing ideas at different steps depending on when they enter a shared knowledge base. (2 mentions)\n- Organisations want an assistant with access to internal channels that proactively surfaces what other teams are doing and what works, replicating a colleague's tacit judgement, since their real challenge is cross-team context sharing rather than generating ideas.\n\n## Beliefs\n\n- Institutional knowledge, not only published output, is a core organisational asset: processes, meetings, chats, decisions, roles, tacit knowledge and reporters' notes. Making it accessible to people and to AI systems is seen as the next major step, and much of it currently sits trapped in individuals or in time. (13 mentions)\n- Markdown is recommended as the best immediate format for institutional knowledge because it is human- and machine-readable and technology-independent; a first knowledge layer need not be a complex knowledge graph. (4 mentions)\n- Practitioners need to see intermediate reasoning and patterns themselves rather than only an AI summary, because confident conclusions across differing inputs require tracing how the analysis got there; AI supports structuring and output, while lived understanding of the organisation and pattern recognition remain human.\n- Much 'tacit' knowledge is technically written down, for instance in prompts, but effectively tacit because no one knows where to look; individuals run many separate system prompts before any shared context exists.\n- Most innovation efforts start by pitching an exciting new solution rather than first making the organisation's existing tacit knowledge visible, which would give people a path to act instead of starting from scratch.\n- Innovation arises where people meet; a knowledge base intersecting with existing domain knowledge could work the same way, generating ideas where established knowledge meets something unfamiliar.\n- Knowledge bases built for a whole organisation's AI use are at a very early stage: a few newsrooms have begun to think about them, and the discussion is expected to look different within half a year. A set of files is enough while the base is small. At the scale of a whole organisation it is not, and questions of ontology, a knowledge graph on top, supplier choice, speed and cost follow.\n- A personal knowledge base has to fit the person who keeps it and cannot be copied from a colleague; each person ends up finding their own way of working with it. A skill is different, because it is built to do one thing and can be shared as it is. Those who keep such a base describe it as taking mental load off them.", "context/sector/sector-conditions": "# Sector conditions\n\n## Practices\n\n- Automation can open new business models and B2B relationships while raising ethical challenges of its own; a problem-first approach challenges every technology request with what problem it solves and whether it is the right one, parking many.\n- Some organisations have reorganised their digital side as a product organisation and moved technology from taking orders to sharing ownership of spending decisions, while professionalisation has lengthened the path from idea to test.\n- Legacy channels still generate significant revenue and will run for years, so organisations discuss delivering the same content through new technology while making digital products more dynamic.\n- Format decisions driven by what users actually did, rather than what they said or the team's gut feeling, can succeed when an organisation briefly breaks its consensus-seeking pattern through logic and psychological safety.\n\n## Constraints\n\n- Many publishers work with decades-old systems and lack technical capacity or an innovation mindset; supporting them matters because where journalism disappears misinformation fills the space, giving sustainable journalism a wider democratic role. (6 mentions)\n- The main obstacle to restructuring around AI-native or agent-fed workflows is that a viable business model for that future does not yet exist; an organisation rewiring its newsroom to feed AI agents today would risk closing quickly.\n- Growth mechanisms that relied on readers sharing journalism on social media have stopped working as platform dynamics shifted, and some organisations have left platforms earlier than their audiences.\n\n## Beliefs\n\n- AI adoption varies sharply by geography and maturity: some markets are far ahead and Europe is seen as more cautious; some organisations have a dedicated AI implementation lead while others have no clear owner and a 'wild west' of self-chosen tools. (9 mentions)\n- Widespread layoffs raise the question of whether media organisations have the right people for a transformed future; defensive moats are scarce, and most organisations extrapolate the present rather than holding a clear three-to-five-year vision of what competitive space to occupy. (3 mentions)\n- Vendors and organisations expect to learn from markets and users with a more mature relationship to AI, and see international contexts as operating in a different reality from the Danish one. (3 mentions)\n- Vendors position sovereignty, trust, quality and control over data as differentiators as core AI capabilities such as transcription become commodities; 'sovereign' must specify where data, models and control actually sit.\n- Initiatives should not be built for yesterday's market; organisations locked into legacy systems and outdated market understanding risk optimising a model losing relevance, and fragmented information sources put the relevance of established media itself in question.\n- Newsrooms need to move from production-heavy workflows to treating news as knowledge and intelligence, and every media organisation increasingly has to become a technology company; refusing to build the infrastructure of the AI era risks losing control of distribution as happened with the printing press.\n- What counts as innovative is not the activity itself but the scale a technology makes viable as a business model; the real innovation is often the enabling infrastructure rather than the visible product.\n- Today's digital news structure is 'paper on a screen'; more fluid content forms are expected to change that structure totally, but such thinking is barely discussed in industry standards bodies.\n- Innovation can be about finding the next revenue-generating product or business model for when the existing business weakens.\n- The question every newsroom has to keep returning to is what the core value of information is today and which jobs it does for its audience; nobody has an answer to it.", "context/sector/strategy-planning-and-practice": "# Strategy, planning and practice\n\n## Practices\n\n- Practitioners cite external references such as sprint methods, facilitation cookbooks, strategy textbooks and business-model canvases as their go-to toolbox. (12 mentions)\n- Scenario planning is valued as robustness training rather than prediction, asking what makes sense regardless of which future unfolds; organisations run scenario days with large leadership groups, though some exercises are experienced as too fast and short. (2 mentions)\n- Fast-moving organisations plan in short horizons because detailed long-range plans lose relevance: roadmaps of one to two years, quarterly framing for returns, a 'long-term' horizon of about five years, and a stated need to still orient toward longer-term structural change.\n- Process knowledge built up by a single internal process lead has lasting value and could be democratised as a best-practice account of good choices and pitfalls; running strategy work internally rather than with external consultants keeps that knowledge in the organisation.\n- Staff who took part in a structured strategy process valued clear structure and governance, a shared goal, a single point of coordination and one person holding a strategically informed overview of where the organisation was heading.\n- Mission statements along digital-first, agenda-setting lines precede strategic focus areas; analogue templates are digitised with AI tools whose quality the user cannot judge.\n- Structured strategy processes in use: shared situation analysis and environmental scan, scenarios for degree of digital development, dilemma sliders stacked across units to reveal hidden disagreement, non-linear priority voting, explicit involvement plans by organisational level, phased timelines, and planning in detail two weeks out, overview three months out, direction two years out.\n- Process-management tools in use are experienced by many as old-school project management used mainly for time registration, which stalls the incentive to use them, while a minority value them for long-running projects because decisions can be traced by newcomers.\n- A simple two-axis effort-versus-value or impact framework, worked in silence with sticky notes and dot-voting rather than open brainstorming, is used to place and prioritise ideas at a realistic size.\n- Some organisations work hypothesis-driven at experiment scale, storing hypotheses in a documentation tool, but such tools are static and hard to retrieve from, prompting experiments with a conversational AI layer over existing documentation.\n\n## Constraints\n\n- Culture and implementation are where organisations struggle most: they are good at workshops and ideas, but no one owns implementation, no dedicated resources exist, and the idea dies once routine takes over; the difference between organisations that succeed at long-term innovation and those stuck in optimisation is execution. (4 mentions)\n- Shift rosters set roughly two months ahead under collective agreements mean any change affecting staff must be planned that far in advance, so implementation requires forward planning combined with continuous adjustment and significant investment in involvement and coordination.\n- Not everyone in a leadership group can work at the same level of abstraction, so strategic work is driven by fewer people; frontline staff cannot reasonably be asked to imagine away their own jobs, so the boldest strategic thinking rarely comes from them.\n- There can be a gap of years between change in the wider world and a media organisation's ability to implement it; switching a whole production flow to a new format can take a year and a half.\n- An AI strategy tends to become outdated before it even takes effect.\n- The three-horizons vocabulary is not self-evident to the people expected to use it. It is described as a muscle still in training, which has to be made simple and tied to everyday work and existing strategies before it helps, and a tool should not assume that its user knows the framework or the literature behind it.\n\n## Needs\n\n- Organisations want a shared vocabulary and a way to document what has already worked, so that ongoing transformation can be formalised, followed up with goals and shared learning, and used to onboard new staff. (3 mentions)\n- Long-term strategic direction must be distinguished from short-term flexible execution; an innovation tool should support long horizons without pretending everything can be planned in detail, and the open question is how to make technology and staff mindset ready for a day that has not yet arrived.\n- Organisations need methods to separate noise from real shifts: whether a signal is strong enough, how large an investment is appropriate, which competencies to build now, and when to scale or stop an experiment.\n- An AI-mediated trend radar is proposed as a use case for an analytics workflow.\n\n## Beliefs\n\n- Good implementation makes change faster and poor process and culture understanding makes it slower; leadership can decide direction and bring in technology relatively easily, whereas moving the actual people is the hard part, and iterative change only reaches a radical goal if the right process understanding and culture already exist.\n- Strategy originates at the top but cannot be implemented without ownership and translation at tactical and operational levels; the levels work with different knowledge, decisions and time horizons, and AI work in media happens mostly at the operational content level rather than at the tactical or strategic knowledge level, so a liaison between levels is essential.\n- Succeeding in closed decision phases depends on understanding the specific people in the room rather than on frameworks; the process lead's job is to hear patterns in what leaders say and operationalise them, since phases are similar everywhere but their value depends on facilitation and adaptation.\n- Organisational change is framed as managed decline of some parts, repurposing of others and room for new things to emerge, or as an existing and an emerging culture growing side by side; the organisation readies itself for a future it cannot force but knows is coming.\n- Uncertainty is paralysing when treated as a problem to solve before acting and productive when treated as a design parameter; fast decisions on partial information are possible where staff can be trusted.\n- A foresight output such as a trend report can have limited direct application yet still create value through the discussion and process it triggers.\n- Imagining what news delivery could look like five years out and challenging why a fixed news format should be taken for granted is valued as a move, even though such questions are rarely taken seriously in the industry.\n- The main barrier to taking future-driven innovation seriously is a lack of courage to accept that it cannot be fully described or reduced to a formula; the interrogatory mindset of investigative journalism maps well onto futures thinking.\n- The direction a media organisation says it works towards is often read differently by top management, by staff and by the outside world: the top finds it clear where the others do not. Innovation then scatters, with nothing to hold a result up against and no measure of success, and whether a clear core exists shows up again and again in which innovations succeed.", "context/signals/_index": "# context/signals/\n\n- [/context/signals/ai-moves-into-the-physical-world.md](ai-moves-into-the-physical-world.md)\n- [/context/signals/attention-splinters.md](attention-splinters.md)\n- [/context/signals/audiences-move-to-creators.md](audiences-move-to-creators.md)\n- [/context/signals/convenience-over-accuracy.md](convenience-over-accuracy.md)\n- [/context/signals/cyber-security-of-ai-mediated-infrastructures.md](cyber-security-of-ai-mediated-infrastructures.md)\n- [/context/signals/from-static-to-liquid.md](from-static-to-liquid.md)\n- [/context/signals/geopolitics-of-tech.md](geopolitics-of-tech.md)\n- [/context/signals/machine-audiences.md](machine-audiences.md)\n- [/context/signals/machines-as-the-primary-audience.md](machines-as-the-primary-audience.md)\n- [/context/signals/neurotechnology-and-the-cognitive-dimensions-of-ai.md](neurotechnology-and-the-cognitive-dimensions-of-ai.md)\n- [/context/signals/newsrooms-start-to-explain-their-ai-choices.md](newsrooms-start-to-explain-their-ai-choices.md)\n- [/context/signals/platforms-move-from-distribution-to-content.md](platforms-move-from-distribution-to-content.md)\n- [/context/signals/public-scepticism-of-ai-in-news.md](public-scepticism-of-ai-in-news.md)\n- [/context/signals/quantum-the-next-era.md](quantum-the-next-era.md)\n- [/context/signals/reshuffling-of-ecosystems.md](reshuffling-of-ecosystems.md)\n- [/context/signals/rise-of-agentic-organisations.md](rise-of-agentic-organisations.md)\n- [/context/signals/simulations-on-the-rise.md](simulations-on-the-rise.md)\n- [/context/signals/sustainability-challenges-of-ai-infrastructure.md](sustainability-challenges-of-ai-infrastructure.md)\n- [/context/signals/the-great-information-repricing.md](the-great-information-repricing.md)\n- [/context/signals/the-knowledge-freezer.md](the-knowledge-freezer.md)\n- [/context/signals/the-zero-click-era.md](the-zero-click-era.md)", "context/signals/ai-moves-into-the-physical-world": "# AI moves into the physical world\n\nRobotics is entering a new phase. What has been confined to automated arms in advanced manufacturing is now leaving the warehouses. Humanoid robots, autonomous machines and other embodied robotic systems are beginning to operate in spaces built for people, not just machines. This marks a shift from automation as fixed infrastructure to robotics as a more flexible operational layer in the real world.\n\n## Beyond manufacturing and logistics\n\n- With the entry of humanoids, robots are no longer just relevant in manufacturing or logistics. As sensing, perception, mobility, language interfaces and planning improve, robotic systems might take on tasks in more everyday settings, where labour might be scarce, routines are repetitive, or safety is a concern.\n- Robotics is becoming part of a wider restructuring of how work is organised and where value is created.\n\n## Benefits and risks\n\n- Robots may help address labour shortages, improve workplace safety, reduce operational friction, and create new forms of service and support.\n- Once robotic systems move from controlled automation to semi-autonomous action in dynamic settings, questions of liability, safety, governance, trust and interoperability become much harder. A software failure in a chatbot is one thing. A robotic failure in a workplace, shop floor, hospital or public setting is something else entirely.\n\n## Across the horizons\n\nRobotics begins by improving specific tasks and isolated functions. It then starts to reshape workflows, maintenance systems, and collaboration between humans and machines across space. In the longer term, it may alter labour structures, service expectations, workplace design, and the competitive importance of physical environments built to work seamlessly with intelligent machines. Robotics should not be viewed only as a hardware story. It is also a story about organisational preparedness, systems design, and the future shape of work.\n\n## This includes\n\n- Humanoid robotics\n- Autonomous robots\n- Robotic systems in operations\n- Physical AI in embodied machines\n\n## Questions\n\n- Where in our organisation could robots create genuine operational value, and where are they still too immature to justify adoption?\n- Which tasks are best suited for robotic systems, and which still depend on human judgement, dexterity, trust, or care?\n- How do we prepare for safety, liability, and accountability when robots begin acting in environments shared with people?\n- What organisational and infrastructural changes are needed to integrate robots into workflows, maintenance, training, and decision systems?\n- How might robotics change expectations around labour, service, workplace design, and competitive advantage in our sector?\n\n## Depends on\n\n- [The rise of embedded AI](../megatrends/rise-of-embedded-ai.md)\n- [Organisational preparedness](../../canon/concepts/organisational-preparedness.md)", "context/signals/attention-splinters": "# Attention splinters\n\nLiquid content can make our attention splinter into each our own small, personalised medium, at the expense of the shared broad narratives and truths that form a foundation for a democratic society in conversation with itself. The single journalistic story, such as the article, loses vitality as a unit; it may become merely an atom in an AI model.\n\nThe shared front page is already more myth than reality for many, but it will disappear even more in the liquid and personal era. The media reality is already being atomised, and such a fragmented information landscape makes the shared public conversation harder. Where engagement has been a carrying metric for social media, intimacy may become it for AI.\n\n## Information oracles\n\nThat can lead to information oracles that understand exactly you extremely well, but which you do not really understand, because where does the information actually come from? It is hard to fact-check, or to trust, something we do not understand. At the same time such oracles risk isolating each person. They remove the friction that is necessary to understand others' viewpoints, since it is precisely through shared language and meetings that meaning and ethics arise. It is the ultimate possible tool of manipulation. Social media that create unreal narratives help destabilise democracy itself, creating mistrust and eroding the perception of a shared reality, and generative AI fits perfectly into that dynamic. Newer studies also show how people who use AI heavily risk losing learning, because learning requires a certain friction.\n\n## Common ground\n\nThe shared front page showed what other people were also following, and so made the shared public conversation more shared. It is decisive that the producers of content also gain access to the demand signal, and that society keeps a kind of common ground. Right now there are no shared frameworks and structures that reward quality in liquid content.\n\n## What it means for news media\n\nThe challenges also constitute a potential. Can news media create the shared front pages of the future, or communities where people gather around stories and news? Bundling of content has already proved relatively successful, including shared subscriptions across media. One can also imagine journalistically oriented organisations developing a healthier type of information oracle, giving relevance and intimacy but set up to challenge and bring opposing viewpoints: products built not to give easy answers that weaken human development, but to make us better in the broadest sense.\n\n## Depends on\n\n- [Liquid content](../../canon/concepts/liquid-content.md)", "context/signals/audiences-move-to-creators": "# Audiences move to creators\n\nTrust in journalism has been challenged over time, but in 2026 it reached a ten-year global low. Changed habits among users, especially in the younger generations, have also long pulled away from established news media towards creators and influencers, with news avoidance as a rising phenomenon. That development has accelerated too. Among the young, sixteen per cent use AI for news.\n\nThe young have chosen sides: they have chosen video platforms, not the established media. So one has to come to them, and use forms of communication that reach them.\n\n## What is happening\n\n- News creators and influencers have seen marked growth in recent years, with individual interview formats on news and politics reaching hundreds of thousands of views on average. A key to their success is understanding the forms and formats of communication on social media: taking formats that already work there and translating them to news and politics.\n- Authenticity is a new currency, and trust arises not from striven-for objectivity but from competence, integrity and goodwill, meaning close contact with one's community.\n- Some established media systematically select already-established young creators and then train them, in ethics and research tools for instance. Creators are audience infrastructure: they bring new users to the medium's other offerings.\n- Where trust has no reach, it has failed; if established media do not engage, the public service of the future will be built outside them.\n\n## A regional caveat\n\nNews media in Denmark and the Nordic countries stand stronger than almost anywhere else. Young Danes largely back news media, and usage figures are often far better than abroad. That gives a starting point and a surplus to act. But the tendencies seen elsewhere in the West exist here too, and everything suggests they will only grow in strength in the coming years.", "context/signals/convenience-over-accuracy": "# Convenience over accuracy\n\nSomething suggests that more news users are already getting a different relationship to truth and facts. The majority in two studies were perfectly satisfied with merely approximately correct information from AI, because it was more convenient than classic news media, even though those were more correct. When the whole structure of news media is set up to deliver precisely accurate information, that tendency constitutes a possible existential challenge.\n\n## What it challenges\n\n- The whole structure of news media is set up to deliver precise information, so users who are indifferent to precision remove the premise of that structure.\n- It raises the question whether people will pay at all for information being of slightly higher quality, and whether free and convenience are in fact more important. Key people in even well-established media ask themselves the same question.\n- Knowledge is never finished or fixed, and often it is simply wrong; AI-generated overviews err in roughly one answer in ten, and the concept of authority is slipping.\n\n## What it calls for\n\nIf news media are to succeed, it probably requires pronounced innovation of forms and formats that give users the desire for more truthful information, and show very clearly why it is important. That task falls to news media, and to their clarity about who they are, but also to politicians and others who support a viable press. Developing self-correcting mechanisms that people will actually use or pay for needs many different disciplines: not just tech experts, politicians, financiers and communicators, but philosophers, anthropologists, artists and psychologists.", "context/signals/cyber-security-of-ai-mediated-infrastructures": "# The cyber security of AI-mediated infrastructures\n\nAs AI is deployed across organisational and societal infrastructures, cyber security moves from a technical concern to a strategic one. The attack surface is expanding fast, not only because organisations are adopting more AI, but because AI is increasingly connected to the systems that shape decisions, workflows, access and operations.\n\n## New risks\n\n- Synthetic media can be used to impersonate executives, deceive employees, and manipulate public trust at scale.\n- Prompt injection and jailbreaks can push AI systems to ignore safeguards, leak sensitive information, or take unintended actions.\n- Data entered into AI tools can expose confidential knowledge, while agentic systems connected to email, files, browsers, workflows or financial tools create new paths for exploitation if they are compromised.\n- Poisoned data, manipulated retrieval sources and corrupted models can distort outputs from within, quietly undermining decision making without triggering immediate alarm.\n\n## Old and new vulnerabilities together\n\n- Traditional risks such as phishing, credential theft and infrastructure compromise remain in place, now joined by model manipulation, synthetic identity, automated exploitation, retrieval poisoning, and system wide weaknesses caused by tightly coupled AI infrastructures.\n- The challenge is intensified by the dual use nature of many of these technologies. The same software can enable productivity, surveillance, misinformation, disruption or defence, depending on who controls it and for what purpose. This mirrors the wider concern that emerging technologies blur civilian and security applications.\n\n## Security as preparedness\n\n- Cyber security needs to be understood as part of organisational preparedness. It is not enough to defend against known threats.\n- Organisations need to ask how AI-mediated systems behave under pressure, misuse, conflict or failure, and how much opacity, dependency and loss of control they are willing to accept in exchange for speed and efficiency.\n- Resilience, fallback mechanisms, verification and governance become just as important as prevention.\n\n## Across the horizons\n\nIn Horizon 1, the priority is securing current tools, data and workflows against emerging AI enabled threats. In Horizon 2, organisations need to redesign processes and oversight models to make human and AI collaboration more resilient. In Horizon 3, they may need to prepare for an environment where cyber conflict, synthetic manipulation, information disorder and contested digital infrastructures are persistent conditions of competition and governance.\n\n## This includes\n\n- Cybersecurity\n- AI security\n- Dual use technologies\n\n## Questions\n\n- How does the growth of AI-mediated infrastructure change our threat landscape, not only technically but strategically?\n- Which systems or workflows create unacceptable levels of dependency or opacity if they are compromised?\n- How can we design for resilience, fallback, and recovery rather than assuming continuous stability?\n- What governance is needed to manage dual use risks and the blurred boundaries between civilian, commercial, and security applications?\n- How do we build leadership awareness of AI security issues before they escalate into reputational or operational crises?\n\n## Depends on\n\n- [Organisational preparedness](../../canon/concepts/organisational-preparedness.md)\n- [The three horizons of AI-mediated transformation](../../canon/concepts/three-horizons-of-ai-mediated-transformation.md)", "context/signals/from-static-to-liquid": "# From static to liquid\n\nThe digital economy has historically been built on information and access to that information. Since the early internet, organisations created reach by producing more content, capturing attention, and securing visibility in search. Generative AI is starting to reorganise that logic.\n\n## From information to context\n\n- In an AI-mediated world, competitive advantage depends less on simply making information available and more on understanding what matters in a given moment, for a given person, in a given situation. The shift is moving from information to context. From static to liquid.\n- Liquid content dynamically adapts in real time across formats, platforms, contexts and users rather than existing as one fixed version.\n- This is already visible in AI-driven search interfaces such as Perplexity and Google AI Overview, where synthesised answers appear directly inside the interface rather than through links to external websites. If that direction continues, we are moving toward a zero-click ecosystem where you get all you need without having to click.\n- Recent developments in so-called vibe coding for building websites, digital products and tools point to a future in which both workflows and products can be iterated and continuously reimagined. In both cases, value lies with the accessibility to the right type of knowledge, context and situational awareness of where it is being applied.\n\n## From attention to intention\n\n- The attention economy begins to give way to the intention economy. Instead of competing mainly for visibility, organisations need to interpret the intent behind an interaction and respond in ways that are relevant, timely and situationally aware.\n- Context-aware systems can adapt interfaces, recommendations, support and content in real time. This is already visible in small pockets of future in generative commerce, adaptive assistants and more responsive work tools. Personal relevance, timing and situational fit become strategic assets in their own right.\n- The implications go far beyond retail or media. When AI systems become the first point of contact, organisations are no longer competing only for attention in crowded information environments. They are competing for inclusion in the systems that interpret intent, shape visibility, and guide action before a user ever reaches a traditional interface. Value may shift away from the interface that attracts the click and toward the infrastructure, context and trusted service that shape the response itself in the moment.\n\n## Challenges\n\n- The quality of liquid content depends on context, data richness, inference and interpretation, which raises questions around privacy, misreading, manipulation and fairness.\n- Tacit knowledge, social cues and cultural understanding remain difficult to capture through data alone.\n- As organisations lose some control over static content in a more liquid digital ecosystem, the challenge is not about simply producing more content, since the static 'artifact' of content is no longer where the value lies. It is about finding new ways to stay relevant.\n\n## Across the horizons\n\nThis shift could begin with a weaker link between visibility and value, as context, timing and intent become increasingly important. It then moves toward products, services and workflows built around more adaptive and fluid interactions. Over time, value may shift away from static content and clicks, and toward systems shaped on new dimensions of meaning, relevance and trust.\n\n## This includes\n\n- Liquid content\n- Context aware AI\n- Intent based interfaces\n- Generative services and commerce\n\n## Questions\n\n- What new services or business models become possible when interfaces respond to intent rather than traditional search behaviour?\n- How do we prepare for a possible zero click ecosystem where AI interfaces intermediate access to information and services?\n- What kinds of contextual understanding would create genuine value for our customers, employees, or partners, and what kinds would feel intrusive or manipulative?\n- How do we collect and use contextual data responsibly, with clear limits, transparency, and consent?\n- What capabilities do we need to design for relevance and adaptability without undermining our values and ethical guidelines?\n\n## Depends on\n\n- [Liquid content](../../canon/concepts/liquid-content.md)", "context/signals/geopolitics-of-tech": "# The geopolitics of tech\n\nOne of the clearest geopolitical shifts is that, although technology was never neutral, this is now becoming far more visible.\n\n## Technology as strategic infrastructure\n\n- Technology is shaped by energy access and prices, water availability, semiconductor supply chains, rare earth mineral extraction, export controls and trade agreements. Access to AI depends not only on software and models, but on who can secure the physical and geopolitical conditions required to build and run them.\n- The old image of software as borderless, frictionless and globally interchangeable is giving way to a more regionalised and contested infrastructure landscape, and awareness of who governs and programmes technologies from LLMs to electric vehicles. Resilience, localisation and strategic autonomy are becoming more important than cost optimisation alone, evident through a return to state industrial policy.\n- Europe offers a clear signal. The EuroStack agenda argues for European capacity across the digital stack, from connectivity and cloud to AI and platforms. France has expanded sovereign state-operated tools such as Tchap and La Suite for public-sector communication and collaboration. The coming EU Tech Sovereignty Package is expected to push further on cloud, chips, open source and AI infrastructure. Geopolitical risk, trade pressure and concern over dependence on foreign providers are changing the norms around who should own, operate and control critical digital systems.\n\n## What it means for organisations\n\n- Infrastructure choices can no longer be treated as purely technical or financial decisions. Dependencies that once looked efficient may become strategic vulnerabilities. Supply chains can fragment. Regulation can diverge. Access to markets may be given, but often constrained by rivalry between states, blocs and standards regimes.\n- Power is unevenly distributed across the technology stack. Some actors shape the terms of access to compute, chips, platforms and cloud infrastructure. Others remain downstream, dependent on systems they do not control. Apparently technical questions become contentious: who controls the mining and processing of rare earth minerals, who can manufacture advanced AI chips at scale, who can secure the energy and water required for advanced data centres, and who controls the infrastructure in space critical for connectivity. As AI becomes more economically significant, these are emerging as levers of power in their own right. They shape what organisations can build, buy, integrate and rely on.\n- Preparedness requires an understanding of contemporary infrastructural dependencies and the geopolitical order these rely upon, a stronger scenario awareness, and a willingness to always think politically about technology.\n\n## The AGI frontier\n\n- Artificial General Intelligence (AGI) refers to systems capable of performing any intellectual task a human can, and potentially far beyond. The race towards achieving such general-purpose frontier systems is inherently geopolitical.\n- If AGI-level systems were developed by a small number of firms or states, the consequences could extend well beyond productivity gains: a system capable of autonomously running scientific research, drafting legislation, managing critical infrastructure, or conducting cyber operations at a speed and scale no human institution could match or monitor. Whichever actors controlled such a system would hold an asymmetric advantage in economic output, military capability, and the ability to shape information at scale. The resulting concentration of power could prove extremely difficult to govern and potentially destabilise the wider international order. The question is not only about the capability of such systems, but who, if anyone, is in control.\n\n## Across the horizons\n\nThis shift begins as a question of supply chain risk and cost, as organisations become more aware of how dependence on external infrastructures can create strategic vulnerability. In the long term, a fragmented technological order may force organisations and governments to rethink sourcing, ownership, and the conditions for staying adaptive and competitive.\n\n## This includes\n\n- Technology sovereignty\n- Strategic autonomy\n- AI infrastructure competition\n\n## Questions\n\n- Which technological dependencies in our organisation could become strategic vulnerabilities under geopolitical stress?\n- How should we think about sovereignty and autonomy in relation to our own data, infrastructure, and suppliers?\n- What scenarios could materially change our access to key technologies, markets, or partners over the next few years?\n- How do regulatory divergence and strategic rivalry affect our long-term innovation choices today?\n- What capabilities do we need to stay adaptive if the technological landscape fragments further along geopolitical lines?\n\n## Depends on\n\n- [Shifting world order](../megatrends/shifting-world-order.md)", "context/signals/machine-audiences": "# Machine audiences\n\nA particular point in the relationship between media and the AI entry points concerns whom media produce content for: human users or a machine audience. Traffic from the latter takes up more and more. The customer or reader is agents that the medium's information passes through. That challenges the business model for publishers when the audience is the machine, and it requires commercial innovation. News media are geared to produce artefacts, not data for agents.\n\n## What it challenges\n\n- News media have to move higher up the value chain. Otherwise they will struggle with what has been called the largest cultural shift ever for news organisations, against which digitisation was a piece of cake.\n- When the customer is an agent, some classic journalistic forms become less valuable. A journalistic narrative of two thousand words is not optimal for AI agents; a list and clear context are more usable. A narrative can still create good value for people, and support what can be called community journalism.\n- Many media are not conscious enough of the two types of content and the two types of user, and they do not use two rigorous approaches.\n\n## What it calls for\n\nAs with the choice between liquid and human-first content, it is about choosing very clearly, or having very great awareness of when you make what. Some media have begun to make two kinds of content: one for machines, for example with lists, in front of the paywall, and another kind for people behind the paywall.\n\n## Depends on\n\n- [Use the liquid wisely or choose human first](../../canon/concepts/liquid-or-human-first.md)", "context/signals/machines-as-the-primary-audience": "# Machines as the primary audience\n\n## The two shifts\n\n- Machines are becoming the primary audience for information. A growing share of what is published, recorded or measured will be read first, and often only, by AI systems acting for people, and increasingly by agents acting for other agents.\n- Information changes category. For most of its history, news, information and knowledge have been a final good, produced before consumption and read by a person who may or may not act on it. In an agentic economy they become an intermediate input into a decision, a transaction or an automated process, and in most cases may never be rendered for a human at all.\n\n## Signs\n\n- In October 2026, Meta and Sierra announced a protocol for how personal agents deal with businesses, with Walmart, Shopify and Stripe on board.\n- Agent protocols such as MCP and content credentials such as C2PA are early versions of a shared protocol and standard unit for information. Data cooperatives such as Switzerland's MIDATA, whose members decide who may use their health data, are an early version of trusted holders of dispersed knowledge. Probabilistic news, which attaches explicit likelihoods to claims, is an early version of calibrated confidence. Crossref's Crossmark, which flags corrected and retracted research, is an early version of corrections that reach every system that used the original.\n- The agentic information economy does not yet have a standard way to represent a piece of information, let alone the institutions to build on one.\n\n## What it signals\n\n- Shuwei Fang's reading: the foundations of the agentic economy are being laid, but the information systems it runs on lag behind. Whether journalism's instincts, independence, disclosure, scrutiny and public correction, become the blueprints is being decided now, while the standards are still soft.", "context/signals/neurotechnology-and-the-cognitive-dimensions-of-ai": "# Neurotechnology and the cognitive dimensions of AI\n\nOne of the more revealing signals to watch is the growing convergence between AI, neuroscience and neurotechnology. It points to a broader shift in how organisations will need to think about cognition, agency, and the changing boundary between human intelligence and machine intelligence.\n\n## Cognitive offloading\n\n- As the historian of technology Melvin Kranzberg noted, \"Technology is neither good nor bad, nor is it neutral.\" In an AI-mediated world this insight becomes particularly relevant as intelligent systems begin to shape how we think, feel and navigate the world.\n- Public concern is surfacing in informal language. Terms such as AI brain fry capture the idea of mental fatigue from excessive use or oversight of AI tools beyond one's cognitive capacity, as well as a growing anxiety that constant reliance on intelligent systems may dull attention, weaken reflection, and reduce our willingness to think through problems ourselves. Behind the phrase is a serious strategic, if not existential, question: what happens if convenience steadily replaces cognitive effort?\n- By delegating tasks that involve critical thinking, creativity and complex reasoning to machines, AI can be understood to be augmenting the cognitive capacity of human beings. However, augmentation requires a form of cognitive offloading. Calculators and computers dramatically extended what we can solve, yet most of us can no longer do the arithmetic we once learned in school. AI augmentation works the same way. Every gain in capability comes with some degree of offloading. This raises profound questions around technological dependence, agency, and what it means to be human.\n\n## Neurotechnology sharpens the question\n\n- Technologies that interact directly with the nervous system, from brain computer interfaces to stimulation-based therapies and neuroadaptive systems, suggest a future where the line between assistance, augmentation and intervention becomes even harder to detect and maintain. The boundary between human and machine thought will only continue to blur.\n- In the short term, these developments are concentrated in health, rehabilitation and specialised treatment. Over time, they may shape wider debates about memory, attention, training, emotional regulation, decision support and mental autonomy.\n- The issue is no longer only what machines can know or generate. It is how deeply they may come to influence the conditions under which people think, judge and act.\n\n## An early warning signal for organisations\n\n- The challenge is not that every company needs a neurotechnology strategy. It is that leaders need a clearer view of the cognitive consequences of AI-mediated futures.\n- If more tasks are delegated to systems that predict, prompt, summarise and decide, then cognitive offloading becomes part of the operating model. Some of that will be useful. Some of it may quietly erode the very human attributes organisations say they value, such as judgement, curiosity, learning and independent thinking.\n- Neurotechnology is not a narrow frontier. It is a glimpse of a wider future in which tech reaches into the core of human cognition itself.\n\n## Across the horizons\n\nThis shift begins as cognitive augmentation, with AI helping people think faster by searching, summarising, prompting, and reducing friction in everyday cognitive tasks. Over time, cognition is treated as an organisational design issue, as workflows, training and decision systems are increasingly built around cognitive offloading and human-AI coordination. In the long term, the frontier may become far more radical, with the conditions for thinking and exercising agency themselves reshaped by AI and neurotechnology.\n\n## This includes\n\n- Neurotechnology\n- Cognitive offloading\n- Brain computer interfaces\n- AI brain fry\n\n## Questions\n\n- Which forms of AI support strengthen human judgement, and which make people mentally passive over time?\n- What cognitive capabilities should organisations deliberately protect, even when AI can perform the task faster?\n- How do we design working routines that reduce overload without outsourcing too much thinking?\n- What ethical boundaries matter when AI and neurotechnology move closer to attention, emotion, and agency?\n- How can leaders build organisations that remain cognitively resilient in increasingly automated decision environments?\n\n## Depends on\n\n- [The rise of embedded AI](../megatrends/rise-of-embedded-ai.md)", "context/signals/newsrooms-start-to-explain-their-ai-choices": "# Newsrooms start to explain their AI choices\n\nExamples collected by Rasmus Kleis Nielsen of newsrooms communicating explicitly about what they do with generative AI and why, in both directions.\n\n## Explaining intense use\n\n- A record number of Pulitzer Prize awardees, eight, disclosed AI use in 2026.\n- The New York Times published a human-computer interaction paper on the development and use of the Epstein Files Engine, an in-house AI agent running database queries across corpora.\n- Bloomberg's AI researchers contributed eight papers to the 2026 Association for Computational Linguistics conference, on subjects from agentic systems to responsible AI and financial language processing.\n- Journalists at Die Zeit and Der Spiegel explained how they used AI to build a searchable database of Nazi Party members.\n\n## Explaining limited use\n\n- A manifesto for the romantic school of journalism was launched at the 2026 International Journalism Festival in Perugia by Lea Korsgaard of Zetland and Joshi Herrmann of Mill Media: limited use of generative AI on the editorial side, explicitly communicated, to stand apart from a profession much of the public assumes is already using it intensely.\n\n## What it signals\n\n- These are not only examples of using or not using AI. They are steps of explicitly communicating how it is used, what for and why. The disclosures are largely oriented at fellow professionals, but they contain the kernel of a more explicit communication about what generative AI in news can mean beyond making it cheaper.\n- Nielsen finds it hard to identify established publishers that combine intense AI use with explicit communication; these are the nearest examples.", "context/signals/platforms-move-from-distribution-to-content": "# Platforms move from distribution to content\n\nSocial media and other platforms, often owned by tech giants, have been dominant for a number of years. But for the first time ever, more people now get their news directly from platforms, not from news media. If people increasingly get their knowledge, information and news directly via AI, it can remove news media's control over their own content and their invaluable direct relationship to users. It moves power over information, and over journalism, away from news media and towards the tech companies that own the AI entry points.\n\nEarlier, tech platforms largely outcompeted news media on distribution and advertising. Now they are going after taking over the content as well. That hits not only the business foundation but the very influence and relevance of news media.\n\nFigure: three boxes in a horizontal row. The first two, \"Advertising\" and \"Distribution\", are drawn with a solid line; the third, \"Content\", is dashed. Above the first two stands \"The technology companies took these areas\", with two arrows pointing down at them. Below the dashed box an arrow points up towards the text \"Now they are going after this\".\n\n## The access model shakes\n\nThe dominant or growing information entry points, platforms and increasingly AI entry points, are controlled and developed by foreign tech companies. Even where media are strong, that challenges the direct relationship between the news medium's brand and journalism and the user. It shakes what can be called journalism's access model. Publishers are losing control over their content, and whoever controls the assembly of information has the power; no news media have that control. The result can be their gradually disappearing relevance. If the front page dies, where does the medium's best content live? Does it become interfaces supported by new AI devices? And does the future of media become to be content factories for the entry points that users find give the greatest value?\n\n## What it calls for\n\nIn the short term, collaboration between media can concern securing real payment for the content used in AI products, possibly via a form of subscription; securing visibility; letting people move easily on to the medium itself; and keeping a degree of control over the content. Alliances between large news organisations and licensing initiatives are already under way. They are decisive for a certain negotiating position towards the tech companies and for innovating towards systems and business models in which news media can also thrive in the new information ecosystem. It may also indicate that the AI companies need some of the journalistic content: AI platforms increasingly rely on trusted news content to understand and respond to real-time events, and agreements giving AI assistants access to news in real time have been seen as a structural shift in the AI ecosystem.\n\nIn the longer term the need for collaboration goes beyond licensing agreements. Are news media merely to be content factories, or can they build a new trusted layer: new interfaces, or layers, that people will use, also as an alternative to AI products and platforms? That will require large, broad collaborations, and it concerns not only the existence and business models of media. Who owns the information infrastructure is a core democratic question. It may call for collaboration with legislators and governments, and with other institutions in society within research, financing, technology and education. Such collaborations will require many difficult trade-offs, not least regarding the independence of news media and their classic internal competition.", "context/signals/public-scepticism-of-ai-in-news": "# Public scepticism of AI in news\n\nFindings from online surveys of nationally representative samples of adults, conducted in 2025 across mostly high-income countries in Europe, North America and Asia, as summarised by Rasmus Kleis Nielsen. They will not represent every country or every community.\n\n## What people expect of AI-made news\n\n- Asked whether news produced mostly by artificial intelligence with some human oversight would be more or less of various qualities than news produced entirely by human journalists, more respondents say it will be more up to date, easier to understand and informative than say the opposite.\n- There are significantly more pessimists than optimists on whether such news will be transparent and, crucially, trustworthy.\n- The quality most people expect of it: cheaper to make.\n\n## What people assume news media already do\n\n- A majority answer that news media use generative AI \"always\" or \"often\", a rate behind only search engine and social media companies.\n- So whether or not a given journalist or publisher uses AI, much of the public is likely to assume they do, and its beliefs about what that means, less transparent, less trustworthy, cheaper, are likely to be priced in either way.\n\n## Not a general crisis of trust\n\n- Trust in news media is in long-term decline in much of the world, as it is for governments and political parties, but trust in the civil service, the legal system and science has held up or increased in many countries over the same period.\n- Asked how generative AI will change their experience of various sectors, optimists outnumber pessimists for most sectors, except news media, governments and political parties. The contrast between optimism about search engine and even social media companies and pessimism about news media is particularly striking.\n\n## Context\n\n- Generative AI use is growing roughly twice as fast as internet use did in the 1990s and early 2000s, and many users find a fair share of synthetic content useful and valuable.\n- Nielsen's reading: many kinds of content are likely to grow ever more commoditised, but relations are not, so the relationship between journalism and the public it claims to serve will only grow more important.", "context/signals/quantum-the-next-era": "# Quantum \u2013 the next era\n\nQuantum is a continuing signal that needs attention. In 2026, most organisations do not need a quantum strategy. It is simply too hard to act upon. But large organisations should now consider creating a quantum taskforce, or assigning clear ownership of the topic across strategy, innovation, cybersecurity, research or foresight. The exact setup is less important than the fact that quantum now deserves structured attention. It should be on the radar. Quantum has the potential to shift the technological ground beneath entire industries and societies.\n\n## The harder challenge is imagination\n\n- The central challenge is not only whether quantum will work, or when it will mature. The harder challenge is whether organisations can even imagine the reality it may unlock.\n- Most firms are still asking whether quantum will produce useful applications. That is too limited a question. The deeper issue is whether leaders are prepared for a world in which the limits of computation, simulation and scientific discovery move beyond today's imagination. If that happens, the impact will not be confined to R&D teams. It could radically change how firms create value, where advantage sits, and which capabilities begin to count.\n- A useful comparison is the printing press. It did not simply improve communication. It altered the infrastructure of knowledge, reduced the cost of coordination, widened access to information, and helped create new centres of power. Quantum could have a similarly structural effect in areas where current computational limits shape what can be invented, secured or understood. If practical thresholds are crossed, advantage may shift towards organisations able to use quantum to solve problems that others still cannot reach.\n\n## Getting the timing right\n\n- Many companies either dismiss quantum as too early, or wait until it becomes impossible to ignore.\n- A better response is to build preparedness without getting pulled into hype: tracking technical progress, watching investment flows, paying attention to standards and regulation, and asking where quantum could intersect with the organisation's future business model, research agenda or security posture.\n- The point is not to predict the exact moment of arrival. It is to avoid strategic surprise.\n\n## Across the horizons\n\nQuantum will look distant from Horizon 1, where near term delivery dominates. In Horizon 2, it becomes a question of literacy, scanning, preparedness and selective experimentation. In Horizon 3, it becomes a possible source of scientific acceleration, market reshuffling and strategic asymmetry. Quantum belongs here not as a near term certainty, but as a signal of a future shift that leaders cannot afford to notice too late.\n\n## This includes\n\n- Quantum computing\n- Post quantum security\n- Quantum enabled discovery\n- Optimisation and simulation\n\n## Questions\n\n- Where could quantum alter the basis of value creation in our sector?\n- Do we need a quantum taskforce, or another organisational mechanism, to monitor developments and translate them into strategic relevance?\n- Are we prepared for a future in which the limits of modelling, discovery, and optimisation begin to shift?\n- How exposed are our systems, data, and security assumptions to quantum enabled disruption?\n- What would we need to see before quantum moves from a signal to active priority in our organisation?", "context/signals/reshuffling-of-ecosystems": "# The reshuffling of ecosystems\n\nOne of the clearest signals is an early reshuffle of competitive ecosystems. AI is starting to change where value is created and captured, not only inside organisations, but across the wider system of platforms, ecosystems, interfaces, infrastructure layers, service providers and end users. As AI becomes embedded across these layers, value does not disappear. It moves.\n\n## From the object to the system\n\n- AI is changing the centre of gravity in many industries. In an AI-mediated economy, advantage may shift from owning the thing to shaping the flow around it.\n- The strongest position may belong less to the company that makes the product, and increasingly to the one that interprets intent, coordinates data, and becomes the trusted layer through which decisions are made. This is the reshuffle, when value moves from the object to the system around it.\n- AI is rearranging relationships between infrastructure providers, model companies, interface owners, data holders, service layers and end users acr
