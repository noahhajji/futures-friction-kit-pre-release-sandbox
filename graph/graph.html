tes were largely offset by high death rates. Beginning in the mid-20th century, this rough equilibrium was broken. Although growth is now slowing, the world population is projected to rise to around 10.3 billion in the mid-2080s (up from 8.2 billion in 2024). This future growth will occur mainly in Sub-Saharan Africa and Asia. More than one fifth of population growth between 2024 and 2054 is expected to come from just nine countries, including Angola, the Democratic Republic of Congo, Niger, Somalia and Tanzania, where populations are projected to at least double.\n- At the core of this shift lies a sustained decline in fertility. Globally, fertility rates have fallen to around 2.3 children per woman, less than half the level observed in the 1950s. Even in many of the world's most populous countries, including India and China, fertility has dropped below the replacement level of approximately 2.1, making long-term population decline increasingly likely without sustained immigration.\n- In many countries, people have fewer children than they desire, pointing to a gap between fertility intentions and outcomes driven by high childcare costs, job insecurity, difficulties in reconciling work and family life, and reproductive health. Fertility outcomes depend not only on financial support for families but also on gender dynamics. In France and Sweden, family policies combined with more equal care structures help sustain relatively higher fertility. In Japan and South Korea, where gender inequality and work-life imbalance persist, increased spending has had limited impact. In other countries, the preference to have fewer or no children is the deciding factor, as in Hungary, where baby loans and income tax exemptions for mothers among the most generous in the world have produced no durable rise in fertility.\n- Alongside declining fertility, rising life expectancy is extending the upper end of the age distribution. Improvements in healthcare, nutrition and living standards have increased longevity across most regions, contributing to increasingly 'top-heavy' age structures. By 2060, 28% of the OECD population will be aged 65 or older, rising to roughly 37% in Italy and Japan.\n\n## Manifestations\n\n- More than one quarter of the global population already lives in countries where population growth has peaked, including China, Germany, Japan and the Russian Federation. Countries such as India, Indonesia, Nigeria, Pakistan and the US are projected to continue growing, with population peaks expected later in the century or beyond 2100. In the long term, even some of the most populous countries today will face a future where labour force expansion can no longer be taken for granted, where dependency ratios begin to rise, and where economic growth becomes increasingly reliant on productivity rather than demographic momentum.\n- The inversion occurs across all regions but at an uneven pace. All societies face a demographic race against time. Some will be pressured to fundamentally restructure their economic and social welfare systems to account for rapidly ageing populations and shrinking workforces, while others will need to make sure that their expanding, youthful population is converted into a productive, healthy and utilised labour force.\n- Ageing leads to financial constraints. Alzheimer's and other dementias alone will cost the world economy USD 14,513 billion between 2020 and 2050, putting pressure on pension and healthcare systems designed for a very different demographic outlook.\n- As populations age, the growing political weight of older cohorts influences fiscal priorities, with increased support for pensions, healthcare and other forms of social protection. Ageing populations are associated with relatively lower public spending on education and lower long-run economic growth, reflecting a shift towards present-oriented welfare over future-oriented expenditure.\n- Automation is being taken up in response. In Japan, faced with steep population decline, increased automation efforts can be seen in the context of the acute need to expand labour productivity and extend working lives. China is heavily investing in automation and AI to offset the negative economic impact of an ageing population.\n- In youthful countries such as Nigeria, Tanzania and the Democratic Republic of Congo, the primary concerns relate to absorbing rapidly expanding labour forces into productive employment and ensuring sufficient investment in education, job creation, housing and infrastructure. Where this is achieved, it could generate a demographic dividend; where it is not, it could increase the risk of persistent unemployment, informality and social instability. This demographic momentum often coincides with mounting pressure on food systems and essential resources, even as fast-growing countries are expected to account for a growing share of global economic expansion.\n- Migration is often seen as a solution to the twin challenges of growth and decline. The global stock of international migrants reached 304 million in 2024, nearly twice as many as in 1990. In several low-fertility destinations, including the United Arab Emirates, Germany, Italy, Portugal and the Czech Republic, immigration accounted for all population growth between 2000 and 2020. Advanced economies already experience societal polarisation and a rise in nativist politics partly in response to immigration. In countries with an outward flow, brain drain and loss of economic momentum become pressing. The African Development Bank estimates that 10 to 12 million young Africans enter the labour market each year while only around three million formal jobs are created; where this gap persists, a youth population that could have powered growth is pushed into unemployment and informality and pressured to seek opportunity abroad.\n\n## Implications\n\n- The growing imbalance will fundamentally alter the relationship between working populations and dependents.\n- Ageing may lessen both the preferences and capacity for warfare in aged countries. A scarcity of young people tends to make 'wasting' their lives in war more costly, and their labour will be needed elsewhere in the economy, potentially pulling the international arena in the direction of a geriatric peace.\n- Risk-averseness is a general characteristic of aged electorates, who tend to be more conservative than younger ones. Ageing populations will increasingly represent a governance dilemma, evident in the tension between systems that function as investments in the future (education, climate and the environment, infrastructure) and those oriented toward managing the present (pensions, sick care and eldercare). As retirees crowd out workers, the notion that each generation supports the previous one in old age will come under increased pressure.\n- One could imagine a future society that is more peaceful, perhaps, but also more stagnant, less innovative, more nostalgic in its culture and politics, and much more demanding on the youth to perform their role as custodians of an ageing society rather than innovators. The generational tensions already evident where young people feel locked out of housing and asset markets could intensify in a future where the youth become simultaneously the most protected and the most extracted-from demographic.\n- In most societies, informal eldercare is performed primarily by women, sometimes at the cost of labour market participation. An ageing society heightens the risk of a structural reinforcement of gender inequality, and may exacerbate declining fertility, since the unequal domestic burden on women is one of its documented drivers.\n- Over the century, as more countries experience labour shortages, large-scale migration will be harder to resist politically, but the impetus to grow the labour force in receiving countries will need to be continuously balanced with the risk of political backlash.\n- There will be an increasingly uneven distribution of labour, capital and institutional capacity. A growing share of global labour force expansion will be concentrated in Sub-Saharan Africa, while capital, financial depth and institutional capacity remain concentrated in higher-income economies. This divergence is expected to reshape patterns of global interdependence and could generate new tensions around migration and investment flows.\n- Two potential futures emerge. One in which intensifying competition for younger workers becomes the focal point of geopolitical bargaining. Another where automation and AI displace jobs at scale, so that labour scarcity is not as big an issue as expected, placing economic and social systems on new foundations and raising questions about who owns the output and how it is shared, and about the value of care work that markets still do not price.\n- The great demographic inversion will not produce a single global outcome. Economies will face fundamentally different challenges, whether managing labour scarcity and fiscal pressure in ageing societies or creating employment and opportunity in younger ones. These asymmetries will shape economic performance, social organisation and political dynamics for decades to come.\n\n## Figure: the East Asian demographic inversion\n\nTwo population pyramids side by side, each split into male and female halves, with five-year age bands from 0-4 at the bottom to 100+ at the top and a horizontal scale from 10% through 0% to 10%. Eastern Asia in 2000, with a population of just under 1.5 billion, is a broad-based triangle whose widest bands sit in the 25-39 brackets, tapering steadily upward with very narrow bands above 70. Eastern Asia in 2100, with a population of around 770 million, has inverted: the base below age 20 is narrow, the widest bands sit in the 70-89 brackets, and the profile bulges near the top before tapering at 100+. A sustained fertility decline narrows the base while longer lives fill out the top, and the region's population is expected to fall over the century to roughly half its size in 2000.", "context/megatrends/new-face-of-urbanisation": "# The new face of urbanisation\n\n## What it is\n\nOver the course of this century, urban milieus, primarily in Asia and Africa, will undergo developmental changes with unprecedented speed and complexity. The new urban epicentres will expand faster than institutions can adapt, often at lower income levels, and under demographic, climate and governance pressures that make comparison to any previous wave of city-building difficult. The central question is not only how many people will live in cities, but also what kinds of urban worlds will emerge and who will be included in them.\n\nCities have always been where human civilisation experiments on itself. Novel ideas emerge there, and radical solutions often get tested there first. They are microcosms of the plurality of futures ahead. More than half of the world's population currently lives in urban areas, and by 2050 this share is projected to rise to 68% (6.6 billion people). Asia and Africa will host around 90% of the additional urban population in the next three decades.\n\n## Sub-trends\n\n- Ascension of megacities (10+ million residents)\n- Urbanisation happening earlier in economic development\n- Growing prevalence of informal housing\n- Housing affordability pressures\n- Rural-to-urban influx\n- Forced migration and displacement\n\n## Uncertainties\n\n- Will governance be able to adapt in the fastest urbanising regions to prevent entrenched poverty at scale?\n- What will be the balance between public and private ownership and governance of the urban infrastructure?\n- To what extent will climate and environmental constraints disrupt urban growth trajectories?\n- Will urban concentration generate broad-based prosperity or deepen inequality between formal and informal zones?\n- Will the new megacities leapfrog to design paradigms suited to emerging needs, or will they be built on models designed for a world that no longer exists?\n\n## Drivers\n\n- Historically, cities have been associated with economic expansion and rising incomes, but the relationship is not straightforward. What makes the current wave historically distinct is the income level at which it is happening. Sub-Saharan Africa and much of South Asia are urbanising far earlier in their economic development than Latin America or East Asia did. These regions cannot always supply the infrastructure, institutions and services that dense urban populations require, leaving them in a permanent state of catch-up.\n- Even under these conditions, cities tend to offer substantially higher incomes and better access to services than the areas people are leaving, which is precisely what sustains the migration.\n- The forces driving urban growth are the economic pull of cities over rural alternatives, the displacement effects of climate stress on agricultural land, and the concentration of infrastructure investment in urban centres.\n- Some planned cities are motivated by existential necessity. Parts of Jakarta, currently the world's most populous city with nearly 42 million inhabitants, are sinking by as much as 25 centimetres per year, with sections at risk of being submerged by 2050, prompting Indonesia to develop Nusantara, a new political capital over 1,000 kilometres away.\n\n## Manifestations\n\n- Dhaka in Bangladesh is expected to become the world's largest city by mid-century with 52 million inhabitants, roughly the size of South Korea's total current population. Towards 2050, Africa's urban population is estimated to double from 700 million to 1.4 billion, almost the equivalent of the entire populations of the United States and the European Union moving into cities within less than 30 years.\n- Megaregions are forming in Asia and Africa as neighbouring cities expand outwards until they merge into continuous urban corridors, such as India's emerging Delhi-Kolkata corridor along the Indo-Gangetic Plain and the Lagos-Abidjan corridor spanning five countries. Both exceed the capacity of governance infrastructures designed for individually separated cities. Megaregions can be products of megacities subsuming urban areas within their reach, or of several closely located cities morphing together. The number of megacities has quadrupled from eight in 1975 to 33 in 2025 and is projected to reach 37 by 2050.\n- Rapidly expanding cities and megaregions will increase informal settlements globally. As new urban epicentres draw in workers, housing costs often exceed what is affordable to low-income migrants, who settle on the urban fringes. Informal settlements are not aberrations from planned urban development but its predictable offshoots, often characterised by self-organised construction along new highways or railways that provide access to the formal city economy. Informality moves into the periphery, the 'gray spaces', producing a tension between the formal core and the gray zones that formality itself generates at the margins.\n- Urban populations in the rest of the world are also expanding, at a much slower pace. In Europe and North America, built-up areas expand faster than urban populations can occupy them, the opposite dynamic from fast-growing cities in Africa and Asia. Housing affordability is an issue across OECD countries, where close to half of low-income owners spent over 40% of disposable income on a mortgage in 2022, as did low-income renters.\n- The flip side is the rapid depopulation of smaller cities and rural areas, risking their collapse. Around 3,000 cities experienced population decline between 2015 and 2025, most with fewer than 250,000 inhabitants, over a third in China and 17% in India, showing that urban growth and decline often occur simultaneously within the same country.\n- In contrast to emergent informal milieus is the wave of master-planned satellite cities in Africa, South-East Asia and the Middle East. Over 90% of urban planning projects announced in the 21st century have or will take place in low-income economies. Egypt's New Administrative Capital, a 700 km2 development east of Cairo, is built to house government ministries and relieve pressure on a city of over 22 million. Tatu City near Nairobi is designed as a self-contained urban hub to attract investment, as is Nigeria's Enyimba Economic City. Saudi Arabia's The Line, now heavily scaled back, was meant to be a model concept city built for liveability, sustainability and urban innovation.\n\n## Implications\n\n- The world's new urban epicentres will not follow neat formulae of growth and development, nor necessarily be considered the pinnacle of urban achievement. Given the speed of their expansion, they will face circumstance-specific obstacles and completely novel forms of urban environment will emerge.\n- The makeshift and the intermediary have traditionally been presented as developmental problems to solve, but cities that have had to improvise their way forward have developed a particular resourcefulness. Coupled with relatively youthful populations, these urban epicentres provide fertile ground for novel solutions to local and global problems. It is also in the margins where ideas and solutions to novel challenges might be sown.\n- The future of urbanisation will be a set of deeply divergent urban worlds, shaped by the speed of each city's expansion, the capacity of its institutions, the climate vulnerability of its location, and the income level of the populations it absorbs. In some places, informal self-organisation will prove more adaptive than formal planning. In others, the gap between population growth and service delivery will become self-reinforcing, locking communities into persistent precarity. In others still, planned city experiments will attract capital and expertise while leaving the surrounding urban fabric largely untouched.\n- What ties these trajectories together is the structural momentum behind them. Even where urban governance fails to keep pace, the cities will grow. The central question is what kinds of places this urbanisation produces and who bears the cost of the gaps it could leave behind.", "context/megatrends/power-through-networks": "# Power through networks\n\n## What it is\n\nPower Through Networks describes the long-term shift from territorial, state-centred sovereignty and power towards authority that is distributed, networked and overlapping. Critical social, economic and security functions increasingly depend on transnational digital infrastructures that no single state controls. Authority is redistributed rather than drained away, since the same networks that put a function beyond one state's reach can extend another's.\n\nMeta, Alphabet, Amazon and other infrastructural giants defy easy categorisation as mere market participants. They are companies, but also private entities grown into para-states with unprecedented political and economic power and geographical reach, achieved through ownership of the infrastructure on which the daily functioning of society, global commerce and states increasingly depend. They exercise power in their own interests, sometimes to the point of influencing elections. But the reverse holds as well: states govern through these private networks, treating their reach as an extension of national jurisdiction and their services as levers that can be tightened or withdrawn. The general picture is a dynamic and fluid reconfiguration, of 'new territories superimposed on older territories'.\n\n## Sub-trends\n\n- Hyperscaler dominance over critical digital infrastructure\n- Divergence of competing infrastructure models: US commercial, EU regulatory, Chinese state-aligned\n- Shift from 'territorial' to 'operational' sovereignty (from jurisdiction over territory to control over infrastructure)\n- Increasing state and public sector dependency on private networks\n- Growing political influence of US-based and Chinese tech sectors, domestically and internationally\n- States projecting power through privately operated infrastructure\n\n## Uncertainties\n\n- Will most developing economies come to depend on US or on Chinese digital infrastructure and solutions?\n- Which public institutions will struggle to discharge their mandates when the infrastructure they depend on sits outside their jurisdiction?\n- Will service suspension become a routine instrument of statecraft, or remain exceptional enough to be shocking?\n- To what extent will Europe succeed in its goal of achieving digital sovereignty through homegrown digital infrastructure?\n- Will the gap between governing role and governing seat ever close formally?\n\n## Drivers\n\n- The megatrend has its origins in the transition of the internet from a government-sponsored network to a commercial one in the mid-1990s. Its historical roots go deeper: Britain's 'All-red Line' telegraph system safeguarded imperial communications though it was mostly privately owned and operated, a past version of today's sovereign cloud.\n- Ownership of digital infrastructure is increasingly concentrated, and in most of the world that concentration sits with a handful of US-based hyperscalers. As of 2025, Amazon, Microsoft and Alphabet held 63% of the worldwide cloud market.\n- Undersea cables, the arteries of the digital world, were historically built by regulated, route-neutral, multi-stakeholder carrier consortiums. Digital giants are now vertically integrating this infrastructure with their services. In 2010, Google, Facebook, Microsoft and Amazon had invested in just one long-distance undersea cable between them; by the end of 2024, they had stakes in more than 60 of about 600 worldwide. Content providers' share of total international cable capacity was 6.3% in 2010 and is expected to reach 78% by 2027.\n- Data centres, fibre optic lines, cloud servers and cellular towers add to these material foundations, which suggest long-term durability.\n- Nations now exercise power alongside and sometimes through 'virtual' or 'supplemental' sovereigns, tech companies and platforms exercising commercial development of and control over critical software and hardware.\n\n## Manifestations\n\n- Governments issue currency and maintain monetary sovereignty, but everyday payments and transactions are increasingly mediated by private transactional networks. Privately owned infrastructure, undersea cables, cloud computing, satellite networks and data centres, has become as crucial as public roads, grids and postal services, or more so.\n- In the United Kingdom, 95% of central and local public sector organisations spent budget on hyperscale cloud services in fiscal year 2023/24, mostly with US-based providers.\n- As passports and driving licences are supplemented by digital IDs, biometrics and verification via social media, citizens become 'users' as well as national subjects. Individual health data is simultaneously personal information safeguarded by national law and a valuable resource for private actors in healthcare and insurance.\n- In politics, maintaining a presence in the 'new public square', digital platforms hosted by private firms, is a necessity for reaching constituents and voters. Political critique of the platforms must often take place on the platforms themselves. Governance relies heavily on private software and utilities, so even functions only the state is authorised to perform are executed on systems it does not own.\n- Not everything is being uprooted. Land and property, many welfare functions, and criminal justice remain more classically territorial.\n- In August 2026, a US presidential memorandum authorised vetted private cybersecurity firms to carry out offensive cyber operations against international criminal networks targeting Americans, breaking from decades-old policy restricting private entities to network defence. Here the state extended its own reach through private actors rather than ceding ground to them.\n- During Covid-19, emergency pandemic response, a core function of territorial sovereignty, hinged on smartphone operating systems, cloud services and API standards outside state control.\n- After Russia's invasion of Ukraine in 2022, Ukraine appealed to ICANN, the US-based non-profit that coordinates the Domain Name System, to exclude Russia from the network. ICANN opted for neutrality, but the refusal was itself an exercise of authority. Starlink, a privately owned civilian network, became essential to Ukraine's ability to defend itself, used particularly for drones and artillery targeting; as of 2026 Starlink operates roughly 59% of all active satellites. The reliance made Ukraine's military more effective, but that effectiveness could be revoked by decisions taken elsewhere.\n- In the EU, a sustained institutional response has taken the form of a digital sovereignty agenda and efforts to reduce dependency on non-EU infrastructure through regulation and targeted investments.\n- In China, tech giants such as Alibaba, Tencent, ByteDance and Huawei have built the country's critical platform and network layers as formally private companies. Rather than replacing them, the state has attached itself to them through 'special management shares' with privileged voting rights, party cells within companies, and at times overt pressure or forced rectification of business leaders, most famously Alibaba founder Jack Ma. Beyond its borders, China's Digital Silk Road has financed fibre-optic cable, mobile networks, satellites and cloud capacity across Africa, Southeast Asia and Central Asia, on the terms of the Chinese state and tech providers. The difference from the American arrangement is one of directness rather than of kind.\n\n## Implications\n\n- The question of who governs, operates and holds authority over the systems that facilitate the functioning of societies and states has become a defining question for the 21st century.\n- Infrastructure owners are, in effect, in governing roles but without formal governing seats. As the logic of the network supersedes the logic of the map, the borders of authority and agency are becoming vague and overlapping.\n- Power, agency and sovereignty are not zero-sum. For states reliant on private networks, augmentation can coincide with vulnerable dependence. Digital infrastructure owners also pose direct challenges to territorial sovereignty; both things are true at the same time.\n- Even the most ambitious European programme will only reshape the terms of dependency, perhaps resulting in a more even balance between homegrown and US-based providers, rather than eliminating it. A fundamental change in ownership patterns from private to fully public would require a momentous historical shake-up, such as a forced breakup or nationalisation of digital infrastructure. Today's regulatory backlash should be understood as a negotiation of the terms of dependency rather than a potential disruption of the trend.\n- The next phase may be determined by the global struggle over whose infrastructure model becomes the default, and where, as the private infrastructure on which sovereignty depends may increasingly be Chinese rather than American in origin in significant portions of the world. The rerouting of sovereignty may be replicated under a different flag but remain a defining feature of the 21st century.", "context/megatrends/rise-of-embedded-ai": "# The rise of embedded AI\n\n## What it is\n\nThe Rise of Embedded AI represents the shift from AI as a tool to AI as infrastructure. As AI becomes embedded into more facets of our lives, society and the economy, new questions and uncertainties related to the relationship between humans and machines start to appear, highlighting that the shift does not imply one predetermined future. The same developments that augment human capabilities can also deepen dependencies on systems few people fully understand, reshape where the value of knowledge work lies, and raise unresolved questions about retaining cognitive ownership and control as more decisions are delegated to machines.\n\nDigitalisation has transformed society so thoroughly that digital technologies now function as the invisible infrastructure that ties the world together. Microprocessors are built into nearly everything, and if these systems suddenly failed, society would cease to function. AI represents the newest wave in this development, in which intelligence, interpretation and agency are being embedded into that same infrastructure. The rise of embedded AI is characterised both by augmentation and mediation: AI can enhance an individual's capabilities while simultaneously reshaping the organisational structures within which those capabilities are exercised.\n\n## Sub-trends\n\n- Increasing automation and augmentation of cognitive tasks and jobs\n- Embodied human competencies, judgement, discernment and deep expertise, as a growing source of value\n- AI and robotics/humanoids converging, the rise of 'physical AI'\n- Personal AI assistants, agents and algorithms as gatekeepers for information, consumer preferences and spending behaviours\n- AI as our 'second brains', individual, collective and organisational\n- Cognitive offloading and the changing nature of cognitive agency in human-AI work\n- AI-mediated relationships and synthetic companionship\n- Concentration of ownership and control of AI infrastructure\n\n## Uncertainties\n\n- Will AI infrastructure become more open and interoperable or consolidate around a small number of proprietary ecosystems?\n- Will humans stay 'in the loop' (actively signing off on AI decisions), move to 'on the loop' (stepping in only if needed), or end up 'out of the loop' (fully autonomous systems with no human check)?\n- Will the advancement of AI provoke job-preserving regulations?\n- Will the energy demand of AI slow down either the energy transition or the rollout of AI?\n- To what extent can the human capability to oversee and validate the labour of AI itself be augmented?\n- Will AGI (a system that matches or exceeds human capabilities across all thinking and working tasks) emerge, and can its alignment with human goals be ensured?\n- Will AI systems mainly be designed to remove cognitive friction, or to strengthen learning, judgement and cognitive agency through their use?\n- Will we see robust and effective AI governance to safeguard humanity from existential risks?\n- Will the gains from AI be broadly shared, or captured by those who already own capital and compute?\n\n## Drivers\n\n- Earlier waves of digitalisation connected people, information and services. Computers, the internet and smartphones revolutionised how people access information and blurred the boundaries between work and leisure. AI systems can now interpret context, generate outputs, recommend actions, and increasingly act across digital environments.\n- AI's capacity for cognitive enhancement is developing rapidly, but not along a single smooth curve. Performance can advance quickly in domains with clear feedback and verifiable outputs, while remaining weaker or less reliable in tasks requiring contextual judgement, ambiguous goals, or interaction with messy real-world environments. This jaggedness makes simple extrapolations from one benchmark to 'AI capability' as a whole misleading.\n- The shift depends on other connectivity technologies such as direct-to-device satellite networks, wearables, connected vehicles, edge computing and smart environments. Together they let AI systems operate across contexts and in more places than phones and laptops. With wearable devices equipped with built-in sensing capabilities, each personal device can effectively become a sensor, providing continuous feeds of location and motion data into spatial models that act as a digital-physical sensing layer.\n- A parallel machine-readable layer is emerging alongside the human-facing internet. Information is increasingly valuable not only when people can read it, but when AI systems can interpret, combine and act on it. Automated traffic already accounts for a larger share of web page requests than human traffic, and the rapid growth of agentic AI points towards an internet increasingly used by machines acting on people's behalf. Machine-readable data, provenance, permissions, interoperability and access therefore become part of the infrastructure itself.\n\n## Manifestations\n\n- Within white-collar work, AI is already automating tasks in legal work, architecture and engineering, business and financial operations, office and administrative support, and sales. A 'reshuffling' of human-machine capabilities is underway, in which AI brings down the economic value of specific individual tasks and causes a revaluation of human competencies. This sets the current era apart from previous waves of automation, which primarily impacted manual labour.\n- Uneven capabilities mean that bottlenecks are likely to move rather than disappear. As the technology is applied to new tasks, novel constraints and unforeseen bottlenecks arise. This is a key restraining factor that the wildest AI predictions tend to ignore.\n- In a future where machines execute more of the tasks of knowledge workers, the inelastic human capability for validation, auditing, and underwriting meaning and responsibility becomes relatively scarcer. As AI graduates from systems with easily verifiable outputs (chatbot text, images, code) to more autonomous, agentic models employed for higher-stakes tasks, verification becomes more necessary, difficult and time consuming.\n- New forms of work are emerging: agentic workflow management, data privacy oversight, output verification, AI literacy (a basic understanding of how AI works and where its limits lie), and AI fluency (the ability to use, question and collaborate with AI effectively and intentionally). Intelligent platforms also need to function with legacy structures. If systems are not trusted, they get overridden and worked around, and if the digital layer never gains internal legitimacy, it never delivers real value.\n- Workforce effects are very uneven. Weaker early-career hiring in some AI-exposed occupations is an early signal that the transition may alter not only jobs but the pathways through which people build expertise and acquire tacit knowledge. Capabilities that are difficult to synthesise will be at a premium, yet the path to building them becomes steeper. This 'missing junior loop' could mirror the youth unemployment seen after the 2008 Financial Crisis.\n- Delegating more cognitive tasks to AI may free up attention and expand human capabilities, but it also changes which skills we practise, retain, or come to depend on machines to perform. Generative AI extends this effect across a much broader range of activities, adding urgency to questions about technological dependence, agency and 'digital dementia'.\n- The proliferation of 'AI slop', the notion of loss of cognitive ownership, and a wider sense that systems are influencing how humans think, feel and make sense of the world are fuelling resistance to broader AI adoption in workplaces and everyday life.\n- Instead of repeatedly opening a chatbot or application, individuals and organisations may increasingly rely on assistants, agents and 'second brains' that carry context across tasks, devices and services.\n- Humanoid robots combining flexible hardware with AI can adapt to different environments, learn human tasks via demonstration, and transfer them to other machine actors. The dynamic is sometimes referred to as 'the codifier's curse', where expert professionals, by sharing their tacit knowledge with AI, accelerate the automation and displacement of their own jobs. Over time, machine intelligence becomes less tied to screens and more capable of perceiving and acting within physical systems, although the timing and scale of general-purpose robots becoming mainstream remains uncertain.\n- Generative AI is already being used to guide couples in their relationships, inform medical decisions, help people parent, or keep people company when they are lonely. AI companionship remains outside the norm for most people today.\n\n## Implications\n\n- How societies respond to shifts in employment, income and pathways into expertise will become an increasingly important policy question. Without a total restructuring of income redistribution, perhaps through a Universal Basic Income (UBI), regulations will likely be used to limit effects on unemployment, since high unemployment undermines social cohesion and destabilises governments. Such interventions need to be applied carefully: a UBI could dull incentives to work and retrain, or pacify displaced workers with a cheque rather than address the underlying loss of bargaining power that comes with being economically unnecessary.\n- The constraint on verification signals a need in parts of the knowledge economy to rethink the value chain, how companies are organised internally, and what gives them an edge over competitors.\n- The key uncertainty is how different forms of AI use and design shape cognitive agency over time. On a deeper level, it forces existential questions about what it means to remain human in increasingly machine-mediated environments.\n- Questions arise about who controls society's emerging 'thinking infrastructure', and how commercial incentives, public interests and individual agency will be balanced. A growing competitive and societal question is who builds, structures, protects and activates the data and context that assistants carry.\n- The machine-readable layer could fundamentally reshape how institutions work with AI, not merely through chatbot subscriptions but through the systems people use across their workflows, devices and organisations.\n- Interconnectivity enables more immersive experiences and real-time coordination, while highlighting the importance of resilience, cybersecurity, sovereignty, and dependency on the infrastructure providers that connect these systems.\n- With humanoid robots, the service economy will eventually face the same technological pressures now reshaping knowledge work, just as the mechanised loom, the steam engine, the conveyor belt and industrial robots reshaped the relationship between machines, labour and human value.\n- Synthetic connection may be valid on its own terms, but this does not resolve what happens to human relationships once the more demanding parts of them can be outsourced and the friction of social interaction bypassed. Cultural norms around technology have shifted before, and what will be considered taboo or socially permissible in an AI-mediated future is not clear today.\n- The benefits and risks of AI-mediated systems will not be evenly distributed. Well-designed AI could lower barriers to expertise, education and sophisticated services, but access to high-quality compute, data, contextual knowledge and trustworthy systems may become an important source of inequality.\n- Like past evolutions in digital infrastructure, AI will become part of the background conditions through which societies organise information, coordinate activity and make decisions. But infrastructure is designed and governed, and it matters who owns it. The future will depend on choices between open and closed ecosystems, cognitive augmentation and passive dependence, distributed and concentrated control, and different models of human-AI agency.", "context/megatrends/shifting-world-order": "# Shifting world order\n\n## What it is\n\nThe structural erosion of the US-led unipolar order and its replacement by a multipolar configuration means that no single power holds uncontested authority over the rules, institutions and norms governing international affairs. The rise of China takes centre stage in the reconfiguration of the geopolitical arena, but an equally important part of the story is played by middle powers with newfound autonomy and diverging interests.\n\nSince the end of the Cold War, American power, military, economic, cultural and technological, has dominated international affairs. That era of near-uncontested hegemony has ended. Different concepts and frameworks have been proposed to help understand the transition period where no clear successor architecture to the Western-led order has yet crystallised, including 'multipolarity' and 'multiplex world'. No consensus has so far emerged, perhaps owing to the uncertainties around how exactly this new constellation will look, what the relative power balance between states will be, and which institutions, if any, will govern.\n\n## Sub-trends\n\n- From alliances to pragmatic and transactional bonds\n- Middle powers multi-aligning\n- The rise of China\n- Breakdown in governing mythologies (e.g. the rules-based order)\n- Rearmament and global growth in military spending\n- Technological leadership rivalry\n- Old institutional order challenged\n\n## Uncertainties\n\n- Which new governing mythologies will become dominant after the transition?\n- Will the Thucydides trap spring, leading to direct conflict between the US and China? (The Thucydides trap is the tendency towards war as an emerging power threatens to displace an existing great power.)\n- How will the distribution of power between the world's multiple geopolitical poles be weighted?\n- Will we see effective global standards and agreements to address cross-border issues, ranging from IP rights and standardisation to climate policy?\n- Will democracy continue its global decline? If not, what might spark its revival?\n- How will the declining legitimacy of Western institutions and frameworks affect the development paths of nations across the world?\n\n## Drivers\n\n- Some of the building blocks for this transition were laid decades ago. The early 21st century saw a high point in US imperial overreach with the invasion of Iraq without a UN mandate in 2003, after which the credibility of American global leadership and the rules-based order it championed began a steady decline.\n- China's rise to an industrial, economic and military powerhouse, decades in the making, has facilitated its ability to mount a growing challenge to the Western-led order.\n- Russia's newfound assertiveness came to a culmination with the full-scale war in Ukraine started in 2022, but its beginnings can be traced back to the incursion into Georgia in 2008 (and the preceding Munich conference in 2007) and the annexation of Crimea in 2014.\n- In the West, the democratic decline witnessed over the last decade has eroded trust in the institutions established in the 20th century to provide the scaffolding of the post-WW2 world order.\n- Taken together, what may have started as weaker signals of a potential transition have converged into the unravelling of the 'unipolar moment' that began at the end of the Cold War in 1991.\n- Macroeconomic indicators support the shift. Measured across regions, the share of global GDP is amid a multi-decade shift from the Global North to China and emerging Asian economies. 'De-dollarisation', a reduction in the use of USD for international trade and financial transactions, is another signal that relative financial and geopolitical power is shifting away from the US, although this trend's future trajectory is highly contingent.\n- Technological leadership is becoming a central axis of geopolitical competition, and China has emerged as a credible systemic contender. Over the past decade, China has moved beyond catch-up dynamics to establish leadership positions in artificial intelligence, clean energy technologies, advanced manufacturing and space capabilities, underpinned by state-led industrial policy, scale advantages in data and infrastructure, and an ability to mobilise capital and coordinate long-term strategic priorities. In solar photovoltaics, battery production and electric vehicles, China already holds dominant global market positions, while in AI and space it is rapidly narrowing gaps with the US. The EU is on a downward slope of relative innovation capacity in many of the same domains.\n- China's Belt and Road Initiative (BRI) is both an economic and a geopolitical instrument. Through large-scale investments in infrastructure, energy and connectivity across Asia, Africa, Europe and Latin America, it has expanded China's economic footprint and deepened interdependencies with participating countries, and it facilitates the diffusion of standards, technologies and governance approaches aligned with Chinese interests. It reflects the emergence of alternative frameworks for global integration that operate alongside, or in competition with, Western-led institutions.\n- The post-Cold War 'peace dividend', a relative decline in interstate conflict along with disarmament and reduced military expenditure across much of the West, enabled a reallocation of resources towards economic integration and domestic development. That period is now clearly ending.\n\n## Manifestations\n\n- Multi-alignment among middle powers. T\u00fcrkiye, a NATO member since 1952, positioned at the intersection of Europe, the Middle East and Asia, operates within multiple overlapping spheres of influence, balancing long-standing ties with Western-led institutions alongside deepening economic, energy, defence and diplomatic relations with non-Western partners. Singapore hosts US military assets while refraining from directly supporting US goals in the region that run counter to Chinese ambitions, and participates in both China's BRI and the US-led Indo-Pacific Economic Framework for Prosperity. India is simultaneously a member of the Quadrilateral Security Dialogue with the US, Japan and Australia, a founding BRICS state, a longtime buyer of Russian arms and (since 2022) discounted Russian oil, and a vocal advocate of strategic autonomy as an explicit doctrinal term. Such behaviour expresses a wider pattern of states hedging risks, diversifying dependencies and maintaining room for manoeuvre where global power is more diffused and less predictable. Multi-alignment is becoming a structural feature rather than a novel phenomenon.\n- Growing geopolitical agency and confidence in the Global South, evidenced in the willingness of countries in Southeast Asia, Sub-Saharan Africa, the Middle East and parts of Latin America to resist alignment pressures, assert independent policy positions and demand greater representation in global governance institutions. Legitimacy is no longer conferred primarily by Western-led institutions but increasingly negotiated across a broader and more diverse set of actors, visible in UN General Assembly voting data where alignment of many Global South countries with Western goals is now less pronounced.\n- Global democratic backsliding and the growing appeal of more autocratic forms of government, although whether this is a contributing cause, a symptom, or both, is an open question. According to the V-Dem Institute, the number of countries autocratising rose from 12 in 2004 to 45 in 2024, while countries democratising fell from 26 to 19. Features of strong liberal democracies like freedom of expression and quality of elections are on a global decline. The US is amid a decade-long democratic backsliding trend, with attacks on the judiciary, the abolition of accountability institutions, military purges and attacks on the freedom of the media as key contributors. Democratisation is highly historically contingent, its strongest waves flowing from changes to geopolitical power dynamics.\n- The breakdown of the governing mythologies that have underpinned the international order for decades. One is the association between liberal democracy and 'the good life': while levels of democracy have decreased globally, the provision of public goods is on the rise across both illiberal and democratic states. Another is the 'rules-based international order', which some argue was always at least partly a mirage, a set of norms and institutions designed to provide legitimacy to powerful states acting out of self-interest. Recent events in Gaza, Ukraine and Iran, and the different responses to them, have illustrated that Western appeals to a 'rules-based order' differ from appeals to 'international law' as administered by the International Court of Justice and the International Criminal Court. The same US House of Representatives that welcomed ICC proceedings against Vladimir Putin voted in favour of the Illegitimate Court Counteraction Act to sanction ICC officials over arrest warrants for Benjamin Netanyahu and Yoav Gallant. Invoking 'the rules' while applying them selectively deepens perceptions of Western hypocrisy. The legitimacy of supranational governance is also counteracted by China's position, which emphasises the primacy of consent and the supremacy of state sovereignty.\n- The growing appeal of non-Western governance frameworks, such as BRICS and Global East forums and the Mecca Defence Alliance between T\u00fcrkiye, Saudi Arabia and Pakistan, constitutes an intensifying legitimacy contest over whose norms, institutions and governing mythologies get to define the international system.\n- Military spending is rising globally, with significant increases across Europe, Asia and the Middle East, reflecting a renewed focus on deterrence, territorial defence and strategic competition.\n- The nature of conflict is expanding beyond traditional domains to include cyber operations, economic coercion, weaponisation of migration and information, and technological rivalry. Space is emerging as a new frontier of great power contest, marked by growing militarisation and competition. The 1967 Outer Space Treaty faces growing strain as spacefaring nations prioritise military applications, and space is a site of competition for resources needed in such large quantities that transportation from Earth is not feasible. As national space agencies and private enterprises establish permanent settlements on the Moon, they may become increasingly controlling over access to certain natural resources found there.\n\n## Implications\n\n- These developments point to a structural transition away from an era defined by expectations of peace and towards one where conflict, both direct and indirect, is a more persistent feature of the international system.\n- Conflict does not need to be the inevitable conclusion to a contested transition. The alternative is painful adjustments and negotiated accommodation by the world's new hegemons and the new cast of middle powers. Some will need to accept a diminished role while others must exercise restraint in their newfound influence and agency.\n- Whether the right balance can be struck will be among the defining questions of the coming decades, shaped not only by Washington, Beijing and Moscow, but by the cumulative choices of the dozens of states now hedging between them.\n- A key question is whether one set of institutions and narratives will dominate or whether the field will remain contested.\n- Standards, platforms and innovation ecosystems may increasingly diverge along geopolitical lines as the technological order becomes more contested.\n\n## Figure: Formal Bilateral Influence Capacity of three middle powers, 1991-2023\n\nThree stacked line charts sharing a common time axis from 1990 to just past 2020, with a shared vertical axis labelled total FBIC. The United Arab Emirates rises from just above zero in the early 1990s, climbing steadily through the 2000s to roughly 6 by the early 2020s, the steepest of the three. Indonesia begins near 1 and rises only gently, to roughly 2-3 by the early 2020s. T\u00fcrkiye begins near zero, rises through the 2000s to around 5 by 2015, then continues up to roughly 7-8 by the early 2020s. Formal Bilateral Influence Capacity measures the capacity for influence between pairs of states across economic, political and security relationships. By this measure, countries like the UAE, Indonesia and T\u00fcrkiye have seen their influence in the international system increase since the end of the Cold War, demonstrating the growing agency of middle powers in a more fluid geopolitical environment.", "context/organisation/_index": "# context/organisation/\n\n", "context/sector/_index": "# context/sector/\n\n- [/context/sector/ai-adoption-and-literacy.md](ai-adoption-and-literacy.md)\n- [/context/sector/ai-systems-and-governance.md](ai-systems-and-governance.md)\n- [/context/sector/culture-and-psychology.md](culture-and-psychology.md)\n- [/context/sector/horizons-measurement-and-priorities.md](horizons-measurement-and-priorities.md)\n- [/context/sector/innovation-process.md](innovation-process.md)\n- [/context/sector/innovation-structures.md](innovation-structures.md)\n- [/context/sector/leadership-and-mandate.md](leadership-and-mandate.md)\n- [/context/sector/organisational-memory.md](organisational-memory.md)\n- [/context/sector/sector-conditions.md](sector-conditions.md)\n- [/context/sector/strategy-planning-and-practice.md](strategy-planning-and-practice.md)", "context/sector/ai-adoption-and-literacy": "# AI adoption and literacy\n\n## Practices\n\n- Individuals in technical, data or development roles have started building AI workflows for the business on their own initiative, often because their role puts them close to data or platforms. (9 mentions)\n- Shadow AI use is widespread and often a workaround for sanctioned tools that lack system access or capability: journalists build and share their own custom GPTs, sales teams use whatever they like, marketing staff prefer external tools, and some paste restricted data into public tools. (7 mentions)\n- Organisations run staged AI-literacy surveys starting with senior management to signal that AI is an organisation-wide matter, map tools and tedious tasks, reinforce staff curiosity rather than mandating courses, and expect technical material that works for a small literate group to confuse a wider audience. (6 mentions)\n- Experienced users treat context as the working material. They keep track of what the model knows and does not know at each point, expect more from supplying the organisation's own knowledge than from a better model, and want a tool to spend its first exchanges asking for context before it advises. (4 mentions)\n- Ideas travel between organisations at industry events; leadership groups find role-based customisation of AI tools compelling. (2 mentions)\n- Coding productivity with AI agents is reported to improve by half or more; whether this means fewer developers or the same people doing far more is contested, and automation of heavy manual review work is framed as freeing staff time rather than replacing them.\n- Where a good sanctioned tool exists, a large majority of editorial staff use it regularly, especially when they can tailor prompts to their own needs.\n- Research on generative-AI adoption across organisations finds similar patterns, including reliance on internal ambassadors to explain the technology.\n- People who use assistants daily report reading less of what they are given: long answers are skimmed rather than read, and short, structured ones are preferred. Where the tool itself suggests the user's next reply, accepted with one keystroke, the answer is skipped altogether and the user is out of the loop, which removes the friction from the exchange.\n\n## Constraints\n\n- Most media organisations are not set up for the newer ways of extending an AI assistant. Many are held to the single office assistant they already have, the one in which least can be done; installing a skill defeats even experienced users; and code-hosting platforms are a hill to climb for anyone non-technical, so one address to connect to is far easier to adopt. (5 mentions)\n- Responsibility for adopting new tools and processes is unclear; where no one owns adoption, use fragments, and access decisions get made informally by individual managers. (4 mentions)\n- Every new AI tool or feature increases complexity and load on the functions that handle security, integration, support and adoption; IT work has become far more reactive as employees introduce tools on their own initiative.\n- There is no shared understanding of basic AI concepts inside organisations; asking colleagues to define an agent produces many different answers.\n- AI initiatives reach good results on the first seventy per cent quickly, but reaching a quality level that can replace human work takes far more tuning than expected, delaying strategic value by a year or more.\n- Because chat assistants write so fluently that their text cannot be told from a person's, users find it strange when another AI tool makes ordinary errors, although generative AI is never perfect. The fluency has blurred the understanding of AI as a tool, and people have to be pushed to think differently about new products.\n\n## Needs\n\n- Media organisations need someone able to follow developments at AI-native companies and frontier labs and translate them into the organisation's own environment.\n- Technology is accelerating faster than people and organisations adapt; employees need time, permission and practical opportunities to develop a mental model of how AI can improve their work.\n\n## Beliefs\n\n- Organisations and their staff perceive internal AI adoption to be more widespread and mature than it actually is; the impression is skewed by highly visible AI-engaged voices, and leadership often initially rejects a more sober assessment. (7 mentions)\n- Getting people to use new tools requires building a supporting culture and deliberate rollout choices such as workshops and demonstrations, not simply handing over the tool. (5 mentions)\n- General AI assistants go straight to a solution. They are not built to raise questions or to deal with ambiguity: they assume from whatever context they hold, and what the user overlooked they decide on the user's behalf. People who work with them every day describe this as a weakness, and value a question that shows them what they had taken for granted. (5 mentions)\n- AI is used for innovation because it is a major accelerator for getting things done, but the more basic work is understanding data activation across the organisation first; organisations discuss needing to become interoperable with AI systems to stay relevant yet are not ready.\n- Cross-organisation collaborations on AI have been rewarding but depend on someone consistently taking the lead.\n- The industry splits into three camps: those still debating whether they may use basic tools, 'tool collectors' who bolt many AI tools onto legacy workflows for efficiency, and a small group of 'rebuilders' redesigning workflows and roles from first principles.\n- Early adopters are estimated to make up only three to five per cent of an organisation or market.\n- Democratising AI and innovation requires more than access to technology: education, recognising that editorial staff have the ideas, easy platforms, ownership, human competencies, psychological safety, knowledge-sharing and integrated user feedback.\n- Newsrooms have many unknown unknowns, and AI is weak at finding radically new ideas; it is better at synthesising and at brainstorming up to a point. In early idea work it carries a second risk: what an assistant has once put in front of a team cannot be unseen, and can corner the work onto a path that may not be the right one.", "context/sector/ai-systems-and-governance": "# AI systems and governance\n\n## Practices\n\n- Some organisations deliberately stay model-agnostic and multi-model, treat chatbots as one interface among many, and run retrieval-based systems over their archives or distribute journalism into conversational AI environments as a channel. (12 mentions)\n- External tool builders are moving from standalone chatbots to protocol-based integrations and constellations of several tools, including ones that stress-test plans and push back on ideas. (4 mentions)\n- Some organisations invest heavily in keeping sensitive data in-house, isolating test environments for frontier tools and building internal tools where data cannot legally be shared with third-party services.\n- Some organisations have built a layered AI platform, combining shared data infrastructure, an agent-building layer and specialised interfaces, with chained workflows from monitoring through drafting to distribution.\n- Editorial colleagues are well placed to judge whether an AI idea is editorially sound when the data work is already involved in their day-to-day.\n- Colleagues delegate routine email to agents that auto-answer, and meeting notes are taken by integrated AI agents; organisations should expect more such delegation.\n\n## Constraints\n\n- Staff are wary of a shared organisational tool exposing their interactions: unsophisticated questions, chat histories in projects with internal politics, or individual-level scoring of innovation performance feel like surveillance and would discourage use. Willingness to share depends on trust, and anonymising contributions risks losing an individual's distinctiveness. (8 mentions)\n- Security perspectives distinguish individual experimentation at personal responsibility from organisation-wide implementation, which requires governance over which data a solution may read, who may write and read, what rights an agent receives, and separation between departments; organisations prefer personal and sensitive information hosted in-house and cannot observe individual AI use beyond network traffic. (8 mentions)\n- Organisations face a dilemma between testing frontier tools and complying with European regulation: compliance status changes quickly, tools previously used have been ruled non-compliant, any AI tool may need a formal approval regime, and even meeting-recording practice is questioned. (5 mentions)\n- What is built for one assistant tends not to carry over to another, and which model answers is increasingly not the user's choice: providers route between their own models, free accounts get the lesser ones, and company accounts drop to a cheaper model once a limit is reached. Making a tool behave the same everywhere is described as an uphill battle. (3 mentions)\n- Staff lack the capacity to verify changes an autonomous agent makes on their behalf, and the resulting structures can become hard to track; security advisers warn that an agent's actions cannot be fully predicted. (2 mentions)\n- Whether productivity tools may read staff email to organise their day is an open legal and compliance question. (2 mentions)\n- Mixing very different roles' data, such as marketing and editorial, could pollute shared organisational learning and make it unusable for either group.\n- Current generative models are poor at distinguishing between versions of similar content and at judging when differences matter, limiting their usefulness for surfacing the right version of institutional knowledge.\n\n## Needs\n\n- Organisations plan to expose internal databases through protocols or APIs so tools can be built on top, structure and centralise data before analysis, and link project, issue and performance data into a layer that tracks how initiatives perform. (11 mentions)\n- Organisations want AI involvement in work to be transparent and traceable, since a lack of traceability is itself a problem in current AI-assisted workflows. (3 mentions)\n- Participating organisations need clarity about what co-creation commits them to and an explicit clearing step before anything said travels further. (2 mentions)\n\n## Beliefs\n\n- Security review can stop an innovation project even when the issue is solvable; some practitioners argue security should not be the top priority for an innovation department's tool, while others list tight access management as a requirement. (4 mentions)\n- Some organisations block AI crawlers as a strategic signal that media content should not simply be collected by external AI actors, treating control over content and data as a significant strategic theme.\n- The AI-native ambition is not small applications such as summaries but a different operating logic: virtual co-workers, multi-agent systems and specialised skills that let a small team or a single journalist do far more; the strategic priority is the system and architecture around the model rather than the model itself.\n- A platform philosophy in use is to build platforms that let people build their own solutions rather than having a central team build everything.\n- Tools that hold context and prompt the user unasked, for instance by asking whether yesterday's discussion was followed up or feedback has come in, are described as a game changer in how people work with AI, compared with tools that wait for a question.", "context/sector/culture-and-psychology": "# Culture and psychology\n\n## Practices\n\n- Startup-style principles, acting on an idea at once and saying no wherever possible, shape some organisations' early culture.\n\n## Constraints\n\n- A cultural commitment to journalism as it is, and the trust that news depends on, make radical experiments with format feel like a break in identity. (4 mentions)\n- Some employees actively resist AI because they fear it will take their job; this fear is psychological rather than technical, confronts people with questions about their security, and cannot simply be talked away. (3 mentions)\n- Many teams keep running a familiar, comfortable routine even when it is not the best long-term approach. (2 mentions)\n- Where staff turnover is low and hiring and firing are constrained, culture must evolve the people in place, which is slow and needs sustained resourcing; organisations must also keep serving user groups still on existing formats.\n- Highly compliant, rules-driven cultures produce continuous improvement but almost no real innovation, ideas failing on 'not invented here' once they must scale; with nearly all staff oriented to routine operations, expecting otherwise without changing that reality is pointless.\n\n## Beliefs\n\n- Danish media innovation culture is seen as less diverse and more conservative than elsewhere in the Nordics: recruitment draws on known networks and legacy structures, media professionals are rarely trained in structured methods, and organisations with a high average age struggle to understand younger users. (6 mentions)\n- Psychological safety is the foundation for experimenting with undefined futures: people need to feel safe raising half-formed ideas and asking naive questions, otherwise they simulate experiments with predefined success criteria; explaining the 'why' and curating positive, curious spaces made the biggest difference in real changes. (6 mentions)\n- Where readiness has been built over time, even radical change meets little resistance provided staff were involved throughout; involving staff early in how AI is used works better than informing them afterwards, and ownership through involvement is distinct from making the strategic decision. (6 mentions)\n- Some teams place high value on sharing knowledge openly and being open-source. (4 mentions)\n- The debate about AI in media is held in binaries, replacement or not, made with AI or not, and says too little about how people and AI should work together. What matters is how AI is used, and a tool that sharpens an idea and shows its owner what they do not see is given as an example of AI helping a person, not replacing one. (4 mentions)\n- The biggest cultural barrier is that newsrooms are built as accuracy machines and lack 'permission to be wrong', whereas innovation requires testing hypotheses that may fail; rigorous AI literacy turns fear into agency, and an organisation cannot assume every employee will move at the same pace. (3 mentions)\n- Spreading a new way of working requires evangelists who carry the message through the flow of information; exciting the top of an organisation is necessary but not sufficient, and the people dealing with AI day to day need a practical sense of what is happening. (3 mentions)\n- Innovation fails on human resistance to giving up what has worked: consensus-seeking, social proof and loss aversion make the safe choice the default. Protecting radical thinking is therefore a choice-architecture problem; experiments must be low-friction, future thinking made the default, and techniques such as pre-mortems and reference-class forecasting used against optimism bias.\n- The word 'innovation' can be absent from an organisation's vocabulary or actively resented on the newsroom floor as consultant-speak; abstract, jargon-heavy packaging triggers instant scepticism, even where the underlying substance framed around concrete needs is welcome.\n- Internal innovation processes are not designed to create habits and momentum, lacking triggers, variable rewards and investment loops, so people engage only when it fits their existing mental model; the gaming industry is an underrated case of deep user involvement and forced iteration.\n- In principle everyone can be an innovator; organisations should involve as many people as possible, identify early innovators and give them mandate and resources.\n- What matters in internal communication is feeling seen; an obviously AI-generated, generic reply from a colleague reads as not having been looked at.\n- A tool that challenges is put down when its friction makes the user feel stupid: conclusions drawn too fast and provocation that seems deliberate frustrate and leave nothing to act on. Questions that guide the user towards something they can do are taken up.", "context/sector/horizons-measurement-and-priorities": "# Horizons, measurement and priorities\n\n## Practices\n\n- Some organisations keep objectives at the operational level, treat depth of reading rather than a surface metric as the meaningful engagement signal, and categorise performance signals into editorial, funnel, conversion and cost, noting retention as a missing category. (4 mentions)\n- Impact of innovation work is currently assessed by gut feeling rather than a defined metric, with formalisation deferred.\n\n## Constraints\n\n- Existing processes, structures and people absorb organisational attention, so the organisation must keep running today's business while creating capacity for a different future model; too much innovation starves operations and too little runs the organisation into the ground. (5 mentions)\n- Practitioners fear that whatever is built gets pulled back into short-term operational framing; organisations cannot jump to long-horizon futures work without formal and cultural foundations, since leadership and colleagues need concrete results before engaging with abstract or radical discussion. (5 mentions)\n- Most newsrooms work only in the first horizon. Where they explore the second, it is without stated objectives or a reason beyond having to try a few things, and the third, where the largest effect is expected, is mostly left alone; work on the long horizon has hardly been seen in the media industry. (3 mentions)\n- Innovation and experimentation are structurally deprioritised in favour of operations because they do not visibly create bottom-line value from day one, unlike converting subscribers or publishing a good article. (2 mentions)\n- Organisations had more slack before successive cost cuts, when media felt like a lifestyle and the path from idea to test was short; a culture where long-tenured staff can ask why things are done a certain way, and an external threat sustaining urgency, are credited for innovation culture, yet organisations question themselves more than they act.\n- Timing is a central problem for long-horizon initiatives: they can be too early or too late, technologically possible but organisationally immature, or right for a future shift but impossible to anchor now.\n\n## Needs\n\n- Most organisations have not yet reached the point of dedicating resources to longer-term research and future preparation, though some intend to work toward it. (2 mentions)\n- Open questions from practitioners about measurement: whether degree of innovation can be scored and at what level, whether the number of innovations per department should be made visible to stakeholders, what data is accessible with what margin of error, how to keep analysis future-oriented, and how to know how close a project is to its goal.\n\n## Beliefs\n\n- Innovation fails when radical and incremental work share the same governance and KPIs: long-term work gets measured on short-term return and is stifled. Organisations should run both in parallel as distinct disciplines, measuring incremental work by KPIs and radical work by hypotheses and learning, but most lack the structure to operate two logics at once. (8 mentions)\n- The print-to-digital transition is the precedent: new activity treated as a marginal experiment while the legacy business keeps attention and power. Several organisations therefore separate radical work from the core, as a spun-out unit, a fully isolated fast track or a small 'speedboat' beside the 'oil tanker', and merge it back only once it dominates. (7 mentions)\n- A three-horizon logic in use: H1 with short horizons, clear ROI and focus on the existing business; H2 connecting new initiatives to products and scaling; H3 as light, cheap experiments under high uncertainty where traditional measures fail and metrics should track learning, assumptions tested, speed to experiment and the ability to stop or promote initiatives. Visible H1 wins are used to earn permission for H2 and H3. (7 mentions)\n- Innovation in media is too often optimisation disguised as innovation: the existing approach is improved but its premise never questioned; organisations are better prepared for sustaining than transformative innovation, which requires changing how journalism is produced and how humans and machines combine, not isolated experiments. (7 mentions)\n- The dominant measure of success for new initiatives is near-term savings in time or money and a demonstrable business case; even projects with UX and technology ready can lack prioritisation because leadership funds what saves money now, and for top management the bottom line comes first with culture treated as secondary. (4 mentions)\n- Organisations tend to bet everything on a single AI tool and stop if it fails; the alternative is many light, cheap parallel experiments with clear metrics, stopping quickly where there is no potential and reinvesting behind what succeeds. (4 mentions)\n- Evolutionary, step-by-step change management remains useful but can be too slow relative to the pace of technological and market change.\n- Whatever a media organisation builds with AI should launch within a couple of months rather than as a long theoretical build, because audiences are already far ahead.\n- Traditional reach metrics such as page views measure a container of consumption that is shifting as human visits decline and AI-agent visits rise; a new paradigm centred on usefulness and retrieval is needed, and the right KPIs differ by type of organisation. The Nokia analogy is used: measuring a categorically new thing against old metrics.\n- Practitioners accept a meaningful margin of error in data and would work with an assistant that is right roughly nine times in ten.\n- At the scale of the whole organisation a single piece of work has negligible cost and value; zooming in to effort changes the picture.", "context/sector/innovation-process": "# Innovation process\n\n## Practices\n\n- Most processes start from unexamined assumptions that sit as a shadow over innovation work; a few practitioners use assumption testing individually rather than as a shared method, and organisations want a tool that surfaces, structures and visualises the assumptions in project material so a team can test them systematically. (7 mentions)\n- New ideas typically originate with a journalist, from a problem, or from inspiration seen at another organisation, online or at a conference; they arise from several siloed directions rather than one shared structure, get discussed informally until they gain verbal traction, and are shelved quickly if the responsible manager lacks capacity. (6 mentions)\n- Live conversational-listening tools that mirror themes, tensions and decisions from a discussion are being prototyped and expected in mainstream collaboration platforms; AI has been reported to outperform humans at spotting outliers across large interview sets. (3 mentions)\n- Some development processes are heavily iterative, with regular review of what works, and look to the software world and agile approaches for method. (2 mentions)\n- Some organisations run a structured involvement cadence, with recurring idea-and-investment meetings and periodic all-staff development sessions, and a looping process from need through idea, involvement, decision, execution and evaluation feeding back into a shared record of what has worked.\n- Practitioners run unsanctioned 'guerrilla' projects, building a quick MVP first and pitching leadership only once the use case is compelling, because formal processes would have meant the projects never happened; this becomes harder as processes formalise, and greater transparency of decision-making would make it impossible.\n- Some staff hide their AI use from colleagues out of embarrassment, and unstructured output from humans predates AI.\n- Reviewing a product a year after launch surfaces material for reconsidering the approach; practitioners argue such discovery should be continuous on everything the organisation builds, so it stays focused on committed priorities instead of many small uncoordinated initiatives.\n- Small technical projects that worked from day one struggle to get follow-through for lack of time and anyone available to roll them out; promising automations go unadopted pending migrations or because outcome quality is uncertain.\n- AI assistants are already routinely part of individuals' idea-generation, with many recent solution ideas developed in dialogue with an assistant rather than alone.\n- Where work can be reused for a new platform, the path from idea to decision moves quickly, though this is not true of most innovation work.\n- Early experiments rarely produce a finished product but build competencies, readiness, networks and a shared language, and the ability to react quickly when a shift accelerates.\n\n## Constraints\n\n- Good ideas often go nowhere because there is no clear route for who to bring them to; people feel alone with their ideas, ideas die inside large internal programmes before reaching senior leadership, and internal advocacy for change gets encouraging feedback and then silence for months. (5 mentions)\n- Ambitions to work iteratively turn into a waterfall model roughly nine times out of ten, because waterfall is ingrained, easy to relate to and forced by time and resource pressure; there is little room to iterate and test, discovery is unstructured, there is no consistent way of working, and temporary fixes become permanent.\n- In a typical editorial-product workflow an idea is discussed with the manager, involves many staff in workshops, proceeds on the promise of savings, and either strands for lack of prioritisation or survives only because a specific desk carries it; choosing among many possible paths and arriving at a deployable product are challenges in themselves.\n- Organisations do not talk to their users directly enough and are reactive about innovation, acting only once a problem has surfaced; they assume what users want or ask in ways that confirm decisions already made, even though behavioural data is more honest than focus groups.\n- Proposals discussed with editorial teams and managers often receive no clear, unambiguous yes; vague responses from leadership create a recurring patte
