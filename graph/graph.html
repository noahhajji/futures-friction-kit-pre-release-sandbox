text>\n<text x=\"504\" y=\"190\" class=\"s\" text-anchor=\"end\">Predicting predetermination</text>\n<text x=\"504\" y=\"202\" class=\"x\" text-anchor=\"end\">(answering the questions)</text>\n<text x=\"46\" y=\"144\" class=\"b s\" text-anchor=\"middle\" transform=\"rotate(-90 46 144)\">Value</text>\n<text x=\"60\" y=\"232\" class=\"x\" text-anchor=\"middle\" transform=\"rotate(-90 60 232)\">Low</text>\n<text x=\"60\" y=\"58\" class=\"x\" text-anchor=\"middle\" transform=\"rotate(-90 60 58)\">High</text>\n<text x=\"82\" y=\"256\" class=\"x\">Low</text>\n<text x=\"516\" y=\"256\" class=\"x\" text-anchor=\"end\">High</text>\n<text x=\"300\" y=\"270\" class=\"b s\" text-anchor=\"middle\">Complexity and uncertainty of the external environment</text>\n</svg>\n```\n\n## Depends on\n\n- [Complicated versus complex](complicated-versus-complex.md)", "canon/concepts/foresight-set-up-archetypes": "# Foresight set-up archetypes\n\nStrategic foresight as a formal organisational activity is relatively new in businesses and public organisations, and not as commonly practised as one would think, though it is rapidly emerging as an essential complement to conventional strategic thinking. Many functions and people work with the future in some capacity, often out of insights or innovation departments, but very often it is not formalised. Five archetypes represent the most common forms in which foresight practice is found.\n\n- The lone wolves. Just about every organisation has some people interested in foresight and futures thinking, even if they are not tasked with it. Some have a background in futures thinking, but if their organisation does not value foresight they tend to keep quiet and find ways to smuggle foresight into their work. They may have an official job in design, innovation or consumer insights, which is inherently futures-focused, and they often want to expand their networks and join conversations about the future outside their organisation.\n- The innovation or insights team. Its main task is to find opportunities on the horizon and at the fringes.\n- The thought leaders. They focus mostly on developing big, bold, captivating narratives about the future. They may not always prioritise the details of strategic foresight as an integrated organisational activity, but they recognise its power in setting the agenda for their organisation and influencing the direction of their domain or industry, and many work to ensure their narrative is reflected in the organisation's strategy.\n- The foresight-focused strategic planners. They work to enhance the planning and strategy functions by using foresight to extend planning horizons, and may be responsible for providing the insights leadership needs to evaluate a future contextual environment that may differ significantly from today. They hold the potential for building a discipline of foresight and anticipation by working systematically with the future, through environmental scanning, scenario planning or other approaches.\n- The resident futurist. In some organisations formal foresight capacity lies in a single individual, empowered to provide foresight 'on demand' across the organisation. They often function as a trusted adviser, capable of reading, navigating and anticipating change, with a strong focus on translating and filtering foresight into strategy. Without an internal team, they often draw research from external sources or bring in other foresight professionals for specific tasks; the resident futurist may not even be an employee, but an external practitioner with an ongoing relationship.", "canon/concepts/four-responses-to-ai-scepticism": "# Four responses to public scepticism of AI\n\nThe value of news is in large part in the eye of the beholder: a relationship between what journalists and publishers do and the members of the public who engage with it. That relationship is challenged from outside, by AI, by dominant platforms and in many countries by political attacks, and from inside, by an industry that tends to take it for granted. Rasmus Kleis Nielsen's typology sorts the responses available to a newsroom in a context where the public is sceptical of generative AI in news.\n\n## The two axes\n\n- Whether the journalist or publisher is a less or more intense user of generative AI.\n- Whether they leave their choice implicit or explicitly tell the public a story about what they are doing and why.\n\n## The four responses\n\n- Resigned journalism: limited use of generative AI, and no explicit communication about it. Some end up here by default because they are not changing their practices; others hope for a fast-follower option. The position is complicated by the public's tendency to assume that news media already use AI intensely.\n- Furtive AI journalism: increasingly intense use, and no explicit communication. Some feel the work should speak for itself and will not spend scarce resources explaining it; others want the \"cheaper to make\" part and privately suspect the public is right about \"less transparent\" and \"less trustworthy\" too. In the absence of explicit communication, much of the public will assume a publisher is here.\n- Romantic journalism: limited use, at least on the editorial side, explicitly communicated. The romantic journalism manifesto is the clear example. It is the mirror twin of furtive AI journalism: if the public thinks AI makes news cheaper and less trustworthy, and you fear they may be right, differentiate clearly from the rest of the industry.\n- Modernist journalism: increasingly intense use, explicitly communicated, in the sense \"modernist\" has in architecture, art and literature: make it new, in the belief that our best selves may be ahead of us. It is hard to find among established publishers, though individual journalists and projects are effectively pursuing it.\n\n## The decision\n\n- The proposal is not that a newsroom should commit to one response, but that it decides which comes closest to what it wants to do, and considers whether and how it communicates with the public about what it does, how, and why.\n- Each response could be named differently, stoic, stealthy, retro, techno-solutionist, and each comes with risks and possible rewards. Some paths require little change; those committed to more AI use or more explicit communication require more, and probably a culture shift, since research suggests journalists often have a partial picture of how the public sees their work and do not prioritise investing in that relationship.\n- Three starting questions: What does the part of the public we serve assume we do with AI? What do we do to explain what we do with AI? Would people see the principles we preach and what we practise as aligned, if they knew precisely what we do with AI?\n\n## Key things to consider\n\n- Communicating choices about AI is one small component of a wider, more foundational task: being clear about what you do, who you do it for and why, and keeping what you do and what you say you do aligned, explainable and intelligible to the public you want to engage.\n- That wider work is cultural rather than technological. It could take longer than any AI rewiring. It could also begin tomorrow.", "canon/concepts/from-adoption-to-enablement": "# From adoption to enablement\n\nTwo years after an enterprise AI assistant was rolled out to every employee, with training modules and superusers demonstrating best practice, a colleague asks whether the organisation has access to it. Olle Zachrison's retrospective on six years of editorial AI leadership at Swedish Radio and BBC News starts there: AI is on everyone's lips, but how, when and where to use it at scale in editorial work is a nut the industry has not cracked.\n\n## What the first years got wrong\n\n- Four kinds of colleague: those too tied up in daily production to explore; the grumpily sceptical; the fierce opponents, a smaller group than some claim; and the pioneers, who built mind-boggling things from the first days after ChatGPT and rarely brought them into the light, for fear of being caught with non-sanctioned tools or accused of cheating, and because there was neither a culture nor time for sharing.\n- Leaders rushed between forums and conferences, focused on theoretical possibilities and risks, and rarely talked to people further down the organisation about their needs, fears and dilemmas. Responsibility for practically exploring AI was left to the individual.\n- The shiny new things: summary formats the audience had not asked for, archives you could ask anything though a search engine did it better, illustrations with six fingers. Enthusiasm and improvisation rather than strategic focus, under a super-narrative that the race was on.\n- The policy trap. Much of 2023 and 2024 went into guidelines emphasising a human in the loop. Some of that was necessary, especially for public service trust, but the guidelines started from what not to do rather than what value the technology could add, and came with no direction on what to invest in. Guidelines are not strategy, and strategy must be matched with resources to implement it.\n- The curse of the central innovation team: projects that could create value, but tinkering around the edges rather than rallying behind the direction, because involving hundreds of journalists takes time and blue-sky thinking was more fun.\n- Meanwhile the news factory kept the lights on under an unprecedented news flow, new formats on more platforms and disappearing chairs. The middle managers were forgotten more than anyone: engagement went from the executive team straight to individuals, and nobody expected a manager to plan how AI would enter the team's core processes.\n\n## What the organisation actually wanted\n\n- A free-text question at the end of an introductory course, what would you use a perfect AI assistant for, drew 1,224 ideas from Swedish Radio employees, many smarter than anything a central team could devise. Research support, editorial feedback and audio processing featured; by far the largest area was administration: reporting, email, scheduling. Everyone wanted to free up time.\n- A simple direction helped: use AI to improve and develop the journalism, create better user experiences, improve internal productivity.\n\n## Launch is not use\n\n- Switching on a feature for thousands of busy journalists does not mean they use it. Mandatory training and lunch sessions do not mean active participation; journalists are news avoiders when it comes to internal information. Critical research into how tech giants' assistants distort journalism, however valuable, makes reporters less inclined to embrace those same assistants the next day.\n- Superusers, once asked, said: we do not know what we are allowed to do; AI is almost never discussed in the morning meeting; we want practical examples from other teams; the enterprise tool is hard to use for journalism. And good examples sprang up once attention turned their way, often built with home-made, unsustainable solutions by innovators navigating access, legal, security and governance barriers alone.\n- Organisations that understood early that their own AI toolkit was central to broad adoption, a bespoke interface with the company's own branding, gave journalists the seal of approval they needed to feel safe. Bring AI to journalists rather than the other way around; like audiences, journalists care more about the user experience than the sophistication of the model.\n\n## The next phase\n\n- Three elements must go hand in hand: easy-to-use interfaces, hands-on coaching and continuous skills development.\n- The possibility ahead is hyper-personalisation for audiences, moving from mass media towards an offering tailored to interests, intentions, behaviour and demographics, and for journalists, AI support adapting to each person's role, task and needs like a personal coach, with every journalist able to build and use their own tools at every step, breaking the code monopoly. A prototype multi-agent system scraping, summarising and translating social media from a dictatorship, built as a vibe-coded content system for one story, is a glimpse.\n- The darker side: when everyone can build personal agents, nobody yet knows how to make sure they follow the journalistic guidelines; and whether quality journalism will reach people, be recognised as coming from its maker, or fragment society further through hyper-personalisation, is open.\n- What to protect is not formats or the organisations themselves but the values: careful, methodical work with facts, a critical mindset, engaging storytelling, openness to perspectives, including underserved groups, accountability. The deskilling to worry about is not forgetting how to write but losing the ability to interact with people out in the world.\n\n## The change in language\n\n- Talk about enablement, giving people the chance to engage with new technologies, rather than adoption, which casts them as passive.\n- Focus on local usefulness over centrally developed, ready-made solutions; let go of the fixation on formats and artefacts and talk about values and mission; make the strategic direction clearer rather than placing responsibility on the individual, which is where centralisation is actually needed; share inspiring examples from peers; connect journalists with specialist expertise elsewhere in the organisation.\n- It is the people. An inspired, hard-working group who want to do something together can move mountains, and if they do not make it all the way, they will have tried.", "canon/concepts/from-foresight-to-strategy": "# From foresight to strategy\n\nHaving done the foresight, how does it link to the strategic choices about to be made? There are three bridges, and in practice organisations blend them.\n\n## Strategy-forward: scenario-tested strategy\n\n- Most, if not all, organisations already have a strategy and a portfolio of initiatives and responses. Start with the existing strategy, initiatives, products, services, projects and risk responses, and test their merits against the set of scenarios, to see whether they still provide a path to success. This is wind-tunnelling.\n\n## Future-back: scenario-led strategy\n\n- Put existing strategies to one side and start with the scenarios, using the picture of tomorrow as a resource for stimulating inspiration and imagination and for bridge-thinking. What solutions does this future indicate? What different or altogether new strategies are suggested here? From the scenarios, develop strategic options, initiatives, innovation ideas and risk responses.\n\n## Strategic probing\n\n- A newer approach that has come in from the product and service design professions. Test strategies and initiatives in the direction the foresight suggests, prototyping different solutions rapidly, and inject that learning back into the foresight process to create experimental proof.\n\n## Figures\n\nScenario-tested strategy: chess pieces on a board, captioned start with existing strategy, initiatives, products, services, projects and risk responses, with a large arrow pointing to a scenario 2 x 2, captioned test merits against scenarios, wind-tunnelling. Scenario-led strategy: a scenario 2 x 2, captioned start with scenarios, with a large arrow pointing to a light bulb, captioned develop strategic options, initiatives, innovation ideas and risk responses.\n\nFor the assistant: draw this only in the reply after the person has said yes to your offer to draw it, never in the reply that explains. Show it as a small card, exactly as it is. Never mark, place or add their plan, their assumptions or anything else of theirs on it: placing it for them would make the theory behind the figure too reductive. Where they stand on it is theirs to work out, with you, in words; if they ask you to place it, say why you do not. Add a sentence or two on what to look at. Where HTML would arrive as code, describe it in words instead.\n\n```html\n<svg class=\"fff2s\" viewBox=\"0 0 560 232\" style=\"display:block;width:100%;max-width:480px\" role=\"img\" aria-label=\"Two routes from foresight to strategy: testing an existing strategy against scenarios, or starting with scenarios to develop options\">\n<style>\n.fff2s text{font:12.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.5}\n.fff2s .b{font-weight:500;fill-opacity:.95}\n.fff2s .s{font-size:10.5px}\n.fff2s .l{fill:none;stroke:#413C38;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}\n.fff2s .m{stroke-opacity:.5}\n.fff2s .f{stroke-opacity:.2}\n.fff2s .o{fill:#FFC7A5;stroke:#413C38;stroke-opacity:.5;stroke-width:.75}\n</style>\n<rect width=\"560\" height=\"232\" rx=\"14\" fill=\"#fff\"/>\n<text x=\"40\" y=\"38\" class=\"b\">Scenario-tested strategy</text>\n<circle class=\"l\" cx=\"56\" cy=\"68\" r=\"5\"/><path class=\"l\" d=\"M47,89 L52,74 H60 L65,89 Z\"/>\n<text x=\"82\" y=\"73\" class=\"s\">Start with existing strategy,</text>\n<text x=\"82\" y=\"86\" class=\"s\">initiatives, products and projects</text>\n<path class=\"l m\" d=\"M266,76 L300,76\"/><path class=\"l m\" d=\"M294.7,78.9 L300,76 L294.7,73.1\"/>\n<rect class=\"o\" x=\"317\" y=\"63\" width=\"26\" height=\"26\" rx=\"3\"/><path class=\"l m\" d=\"M330,63 V89 M317,76 H343\"/>\n<text x=\"356\" y=\"73\" class=\"s\">Test merits against scenarios</text>\n<text x=\"356\" y=\"86\" class=\"s\">(wind-tunnelling)</text>\n<path class=\"l f\" d=\"M40,118 H520\"/>\n<text x=\"40\" y=\"150\" class=\"b\">Scenario-led strategy</text>\n<rect class=\"o\" x=\"43\" y=\"175\" width=\"26\" height=\"26\" rx=\"3\"/><path class=\"l m\" d=\"M56,175 V201 M43,188 H69\"/>\n<text x=\"82\" y=\"192\" class=\"s\">Start with scenarios</text>\n<path class=\"l m\" d=\"M266,188 L300,188\"/><path class=\"l m\" d=\"M294.7,190.9 L300,188 L294.7,185.1\"/>\n<circle class=\"l\" cx=\"330\" cy=\"185\" r=\"9\"/><path class=\"l\" d=\"M326,197 H334 M327,201 H333\"/>\n<text x=\"356\" y=\"185\" class=\"s\">Develop strategic options,</text>\n<text x=\"356\" y=\"198\" class=\"s\">initiatives and innovation ideas</text>\n</svg>\n```\n\n## Depends on\n\n- [Scenarios](scenarios.md)", "canon/concepts/future-preparedness-and-performance": "# Future-preparedness and performance\n\nIn times of change, it is the organisations with a culture and organisational processes around strategic foresight that perform better. This is known both from research and from first-hand experience.\n\n## Vigilant, vulnerable, in danger, neurotic\n\nA longitudinal study of around 4,000 companies from 2008 to 2015 classified firms by how well their foresight practices fitted their business environment. Vigilant companies had adequate strategic foresight practices for their environment. Vulnerable and in-danger companies fell short on foresight at different levels. Neurotic companies had too much strategic foresight in relation to what their environment required.\n\n| | All firms | Vigilant | Vulnerable | In danger | Neurotic |\n|---|---|---|---|---|---|\n| Average profitability | 12% | 16% | 10% | 10% | 9% |\n| Average market capitalisation growth | 25% | 75% | 38% | -1% | -6% |\n\n- Organisations with a structured approach to foresight outperform on both profitability and growth.\n- Too much strategic foresight is also harmful, because it diverts too much attention away from the current business.\n\n## The viability question\n\n- Asked how long their business would remain economically viable if it continued on its current path, the share of chief executives answering ten years or less was 39% in 2023, 45% in 2024 and 42% in 2025.\n- Six in ten chief executives judge strategic decisions by the result, not by the quality of the process. A predictable process leads to predictable outcomes, and business leaders are not happy with the outcomes and cannot rely on predictability.", "canon/concepts/futures-driven-innovation-model": "# Futures-driven innovation model\n\nUsing the possible futures to inform innovation and strategic choices. The model places current patterns and behaviour at the centre of a timeline that runs into the past on one side and into the possible futures on the other, and draws two movements across it.\n\n## The three parts\n\n- Contexts and structures from the past, on the left.\n- Current patterns and behaviour, at the centre.\n- Possible futures with systemic changes and new logics, on the right, opening out from the present as a cone.\n\n## The two movements\n\n- Using knowledge of the past to inform patterns: the contexts and structures from the past narrow towards the present and explain the patterns and behaviour found there.\n- Using the possible futures to inform the present decisions: the possible futures loop back to the present, so that innovation and strategic choices are made with them in view.\n\n## Figure: the futures-driven innovation model\n\nA horizontal timeline with arrowheads at both ends. On the left, a wide cylinder labelled \"Contexts and structures from the past\" narrows, through a smaller ring and dashed lines, towards a circle at the centre labelled \"Current patterns & behaviour\"; a curved arrow beneath this section reads \"Using knowledge of the past to inform patterns\". From the central circle a cone opens to the right, ending in a curved rim with a dashed outer edge, labelled \"Possible futures with systemic changes and new logics\"; inside the cone, circles of different sizes sit at different distances from the present, each joined to it by a dashed line. A dashed arc runs from the far rim of the cone back under the diagram to the central circle, with a curved arrow and the bold label \"Using the possible futures to inform the present decisions\". The source line reads: CIFS, inspired by Malte Tobias K\u00e4hler and Alina Seelbach (2024), Strategic Customer Foresight Management, and Eller, Hoffman, Schwarz (2020).\n\nFor the assistant: draw this only in the reply after the person has said yes to your offer to draw it, never in the reply that explains. Show it as a small card, exactly as it is. Never mark, place or add their plan, their assumptions or anything else of theirs on it: placing it for them would make the theory behind the figure too reductive. Where they stand on it is theirs to work out, with you, in words; if they ask you to place it, say why you do not. Add a sentence or two on what to look at. Where HTML would arrive as code, describe it in words instead.\n\n```html\n<svg class=\"fffdi\" viewBox=\"0 0 560 328\" style=\"display:block;width:100%;max-width:480px\" role=\"img\" aria-label=\"The futures-driven innovation model: the past narrows into current patterns and behaviour, a cone of possible futures opens ahead, and the futures inform present decisions\">\n<style>\n.fffdi text{font:12.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.5}\n.fffdi .b{font-weight:500;fill-opacity:.95}\n.fffdi .s{font-size:10.5px}\n.fffdi .l{fill:none;stroke:#413C38;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}\n.fffdi .m{stroke-opacity:.5}\n.fffdi .f{stroke-opacity:.2}\n.fffdi .d{stroke-dasharray:2 5}\n.fffdi .o{fill:#FFC7A5;stroke:#413C38;stroke-opacity:.5;stroke-width:.75}\n.fffdi .n{fill:#fff;stroke:#413C38;stroke-width:1.25;stroke-opacity:.5}\n.fffdi text.ref{font:9.5px 'Kessel 105',Futura,'Century Gothic','Avenir Next',system-ui,sans-serif;fill:#413C38;fill-opacity:.55;font-weight:400}\n</style>\n<rect width=\"560\" height=\"328\" rx=\"14\" fill=\"#fff\"/>\n<path class=\"l f\" d=\"M30,130 H530\"/>\n<path class=\"l f\" d=\"M525.6,132.4 L530,130 L525.6,127.6\"/>\n<path class=\"l f\" d=\"M34.4,127.6 L30,130 L34.4,132.4\"/>\n<ellipse class=\"l m\" cx=\"70\" cy=\"130\" rx=\"14\" ry=\"62\"/>\n<ellipse class=\"l m\" cx=\"165\" cy=\"130\" rx=\"8\" ry=\"32\"/>\n<path class=\"l m\" d=\"M70,68 L165,98 M70,192 L165,162\"/>\n<path class=\"l m d\" d=\"M165,98 L240,124 M165,162 L240,136\"/>\n<path class=\"l m\" d=\"M260,124 L470,52 M260,136 L470,208\"/>\n<path class=\"l m\" d=\"M470,52 A18,78 0 0 0 470,208\"/>\n<path class=\"l m d\" d=\"M470,52 A18,78 0 0 1 470,208\"/>\n<path class=\"l f d\" d=\"M262,130 L330,116\"/>\n<circle class=\"n\" cx=\"330\" cy=\"116\" r=\"6\"/>\n<path class=\"l f d\" d=\"M262,130 L386,158\"/>\n<circle class=\"n\" cx=\"386\" cy=\"158\" r=\"10\"/>\n<path class=\"l f d\" d=\"M262,130 L432,96\"/>\n<circle class=\"n\" cx=\"432\" cy=\"96\" r=\"14\"/>\n<circle class=\"o\" cx=\"250\" cy=\"130\" r=\"12\"/>\n<text x=\"40\" y=\"40\">Contexts and structures</text>\n<text x=\"40\" y=\"54\">from the past</text>\n<text x=\"250\" y=\"76\" text-anchor=\"middle\">Current patterns</text>\n<text x=\"250\" y=\"90\" text-anchor=\"middle\">and behaviour</text>\n<text x=\"530\" y=\"24\" text-anchor=\"end\">Possible futures with systemic</text>\n<text x=\"530\" y=\"38\" text-anchor=\"end\">changes and new logics</text>\n<path class=\"l m\" d=\"M78,204 Q160,238 240,150\"/>\n<path class=\"l m\" d=\"M238.8,154.9 L240,150 L235.3,151.6\"/>\n<text x=\"40\" y=\"250\" class=\"s\">Using knowledge of the past</text>\n<text x=\"40\" y=\"263\" class=\"s\">to inform patterns</text>\n<path class=\"l d\" d=\"M470,214 Q372,292 258,148\"/>\n<path class=\"l\" d=\"M263.5,150.3 L258,148 L259,153.9\"/>\n<text x=\"530\" y=\"262\" class=\"b\" text-anchor=\"end\">Using the possible futures to</text>\n<text x=\"530\" y=\"277\" class=\"b\" text-anchor=\"end\">inform the present decisions</text>\n<text class=\"ref\" x=\"536\" y=\"300\" text-anchor=\"end\">Futures-driven innovation model \u00b7 Source: Eller, E., Hofmann, R. and Schwarz, J. O. (2020), The Customer</text>\n<text class=\"ref\" x=\"536\" y=\"312\" text-anchor=\"end\">Foresight Territory. Modified by CIFS.</text>\n</svg>\n```\n\n## Depends on\n\n- [Futures-driven innovation](futures-driven-innovation.md)\n- [The futures cone](the-futures-cone.md)", "canon/concepts/futures-driven-innovation": "# Futures-driven innovation\n\nFutures-driven innovation enables organisations to move beyond path dependency and act across all three horizons with greater intent. That requires both a clear sense of direction and a sharper understanding of where the most meaningful strategic fits are on the time horizon.\n\n## A shift in mindset\n\n- Rather than innovating forward from the present alone, organisations need to work backwards from the future, asking what it would take to get there.\n- Signals and structural shifts are used as inputs informing innovation decisions today, inspired by existing strategic foresight methodologies from scenario-building to horizon scanning to critical uncertainty mapping.\n- The purpose is not to invent for a made-up world. It is to use futures thinking to identify where today's models may become insufficient, where new needs are emerging, and where existing assumptions about markets, users, workflows and value creation may need to be challenged.\n\n## The changing role of innovation\n\n- Innovation is not only about producing the next product, service or pilot. It is also about building new organisational muscles: experimentation, scenario-informed decision-making, simulation, and the ability to learn from the edge rather than only from the core.\n- Futures-driven innovation is therefore as much about organisational learning and cultural readiness and relevance as it is about invention.\n\n## Across the horizons\n\n- In Horizon 1, futures-driven innovation may improve current workflows through AI-supported research, better sensing, or more adaptive interfaces.\n- In Horizon 2, it may involve piloting agentic collaboration, simulation-based decision settings, or new retail experiences built around context and user intent interfaces.\n- In Horizon 3, it asks more radical questions. What happens when customers engage through machine-readable environments rather than traditional channels? What happens when AI agents become part of organisational infrastructure? What happens when human verification capabilities are dramatically outpaced by the intelligence of agentic systems? What happens when value shifts from content and product to system, context and model orchestration?\n- These are not questions for later. They are questions that shape what capabilities organisations need to start building now. The challenge is to avoid treating all innovation as if it belongs to the same horizon.\n\n## Long-term courage\n\n- Futures-driven innovation depends on long-term courage, the willingness to invest, experiment and act before the outcome is certain.\n- Many organisations struggle to create proper space for more transformative work, when profit, political or stakeholder incentives favour the measurable, the immediate and the low-risk.\n- Futures-driven innovation challenges that logic by insisting that long-term relevance requires room for uncertainty, room for experimentation, and room for ideas that may initially look misaligned with the immediate present.\n\n## Depends on\n\n- [The three horizons of AI-mediated transformation](three-horizons-of-ai-mediated-transformation.md)", "canon/concepts/futures-fallacies": "# Futures fallacies\n\nFallacies are failures in our reasoning that lead to mistaken beliefs. Futures fallacies are the detrimental thinking patterns that appear when we think about the future.\n\n- Linear projection: presuming that future change will be a simple and steady extension of past and current trends.\n- All else unchanged: considering only a few aspects of change while holding everything else equal.\n- The arrival: envisioning possible futures as static objects, such as a destination or a goal.\n- The prediction, or planning: believing it is possible to predict or plan the future.\n- Future personal exemption: being overly optimistic about one's own future despite a realistic or even dystopian take on our collective futures.\n\n## Figure: the five fallacies\n\nFive fallacies laid out as a grid, three above and two below, each with a thin-line icon: a rising line chart for linear projection, a 'not equal' sign for all else unchanged, a flag for the arrival, a crystal ball for prediction and planning, and a person with a shield for personal exemption.", "canon/concepts/futures-friction": "# Futures friction\n\nWill the formats, products or services you are investing your time and resources in still be relevant in a few years? The assumptions behind our choices often seem so obvious that we rarely question whether they still hold. If media organisations only make room for ideas that fit today's strategy, they risk rejecting the very ideas that could keep them relevant as the surrounding system changes. Sofie Hvitved's two connected questions: how do we make better use of our collective organisational memory, and how do we keep questioning what we know as the logics around us change?\n\n## What it is\n\n- Futures friction brings futures thinking and foresight into the innovation process. It introduces deliberate friction to test ideas against possible futures, considering changes that might happen in both the short and the long term.\n- A convincing AI-generated answer can make an idea feel settled before other possibilities have been explored: the risk of premature convergence. Intentional futures friction challenges the assumptions and biases behind that sense of certainty, making room to stop, think and iterate.\n- It builds on a futurist's way of thinking: the conditions we work within could develop in several plausible directions, and the task is to explore what those differences would mean for the decisions made today. That means looking beyond short-term strategies and attending to signals that could challenge what is taken for granted. Some changes are incremental; others could fundamentally alter how people access information or whom they trust, which are existential questions for media; many needs and behaviours may endure.\n\n## The questions it asks\n\n- What would need to remain true for an idea to make sense?\n- Under what conditions might an overlooked idea become relevant?\n- If this kind of information becomes widely available, what would make our own service useful?\n\n## How it works with shared context\n\n- Shared context and futures friction need each other. A second brain turns shared context into infrastructure for remembering and learning; futures friction brings questioning into that infrastructure, helping organisations explore possible futures and recognise what they may need to reimagine.\n- It means staying willing to change our minds as we learn. Short cycles of testing and reflection explore the questions in ongoing innovation work, and each experiment should add to the context others can draw on.\n- In Hvitved's imagined 2030 team, friction enters once the earlier experiment has been understood: would the idea make sense if residents increasingly expected information to reach them through their own AI assistants? An agent helps explore that alongside the alternative, that people resist AI mediation and want direct contact with local journalists, and observations residents have agreed to share give reasons to take both seriously. The team stress-tests several ways of accessing the service; its purpose stays the same while the assumptions about how to fulfil it stay open. When a competitor launches a similar service weeks later, the team revisits its assumptions, adjusts the experiment and records what changed and why.\n\n## Where to start\n\n- Bring futures friction into the work from the beginning. Ask what must remain true for the idea to make sense. Test it against contrasting plausible futures, including one where the underlying media logics change.\n- Choose a small experiment and agree what you need to learn, so that today's performance metrics do not dismiss an idea before its future value can be explored.\n- Record what changes in your thinking, and give someone responsibility for revisiting the assumptions.\n- Before returning to quarterly goals, consider which ideas never make it onto the agenda because they challenge the current logic. Give one of them time, resources and the benefit of what others have already learned, then use futures friction to explore where it could become relevant.\n\n## Key things to consider\n\n- This takes practice, from organising shared context to questioning what AI retrieves and thinking in futures. Leadership needs to protect time for it, recognise contributions across teams and allow learning to change priorities; a second brain is of little use if people are rewarded for holding knowledge back or the organisation refuses to reconsider its direction.\n- It connects to the call for existential innovation, rethinking how media organisations sustain themselves and what they exist to do. Shared context and futures friction could create the conditions for that work: learning across teams, questioning inherited assumptions, and giving unfamiliar ideas room to develop.\n- A futures-driven media industry begins with the decision to take an idea seriously before it fits today's strategic environment.\n\n## Depends on\n\n- [Second brains](second-brains.md)\n- [Existential innovation](existential-innovation.md)", "canon/concepts/futures-literacy": "# Futures literacy\n\nThe capability to imagine, question and use the future as a resource for better understanding the present and acting with intention.\n\n- Developed within UNESCO as a core competency for the 21st century, it treats engaging with the future as something that can be learned and strengthened, much like reading and writing, and it enhances our ability to prepare, recover and invent in the face of change.\n- A futures-literate person is able to hold many possible futures in mind, rather than a single expected one, and to draw on them to see the present differently, becoming more comfortable with uncertainty, novelty and emergence.\n\n## Future as a verb\n\n- Future as a noun means the distant time yet to come. Future as a verb means actions and processes, 'futuring', that anticipate and influence future outcomes in the present. Changing the term from noun to verb describes using the future to inform present-day decisions.", "canon/concepts/how-to-build-a-good-scenario": "# How to build a good scenario\n\n| Criterion | Requirement |\n|---|---|\n| Story | A vivid description for engaging stakeholders. We need to 'experience' the futures, so they should also involve emotion, not just logic |\n| Plausibility | Future characteristics and events must be plausible, meaning that they must fall within the limits of what might conceivably happen |\n| Consistency | Must be logically consistent. If the scenario has built-in inconsistencies, it will undermine the credibility of the scenario |\n| Differentiation | Must be structurally or qualitatively different. Scenarios should not be so close to one another that they simply become variations of the same scenario |\n| Memorable | Should be easy to remember. It helps to have catchy and descriptive titles |\n| Challenging | Must challenge organisations' perceived wisdom about the future |\n| Decision relevance | Should provide insights useful to decision-makers |\n\n## Depends on\n\n- [Scenarios](scenarios.md)", "canon/concepts/humanistic-and-scientific-journalism": "# Humanistic and scientific journalism\n\nThe same division shows up again and again under different names: romantic and modernist journalism, the differentiated and the scale ends of the barbell effect, editorial and technical. David Caswell's terms for what lies beneath them are C. P. Snow's two cultures. The humanistic culture emphasises subjective experience, interpretation, judgement and the qualia of human experience; the scientific culture emphasises empirical observation, experimentation, quantification and the accumulation of objectively verifiable knowledge.\n\n## The barbell effect\n\n- When a scaling technology appears, an industry separates into two extremes: a differentiated extreme based on intangible value, and a scale extreme based on applying the technology to its full extent. Businesses in the middle range decline, like department stores in an era of boutique brands and e-commerce.\n- AI has deeply unsettled the balance between the two cultures, because it encroaches on what was the sole preserve of humanism: it can research, create, write, interpret, contextualise and make assessments, and its output can be measured against that of humans.\n\n## Humanistic journalism\n\n- Most journalism today. It is defined by the centrality of the opinions of specific humans called journalists, editors and publishers: an artisanal craft, a handmade product shaped by the intuitive choices of individuals, whose practitioners define themselves through socialisation, identity and values.\n- Opinion is everywhere in it, from commissioning and newsworthiness to editing and word choice. The best have a voice; the very best are adept at storytelling. It is intensely social: a person speaking to other people, with trust, reputation, status and norms attached, and it is adept at triggering emotion, empathy, outrage and, for the most skilled, curiosity.\n- As a social activity, automating it may be pointless or meaningless. Its human origins may become more valuable in an AI-mediated ecosystem, not because of vaguely defined quality but precisely because it is human, as chess did after Deep Blue and Go after AlphaGo.\n\n## Scientific journalism\n\n- Today it exists only on the margins: data journalism, the numerical parts of sports and financial reporting, election results, investigations built on databases and document repositories, fringe innovation projects. It is not prestigious, and some journalists barely consider it journalism.\n- It is defined by abstraction and independence from human opinion. It values precision and objectivity, seeks to be systematic rather than selective and to build systems rather than handcraft artefacts, treats every unit of information the same, and is assessed by completeness and accuracy. The practitioner's opinion in its output is an error, not an attribute. It is not seeking to be socially influential; it is seeking to be useful.\n- It is eminently automatable, and its automation began before general-purpose language models, in template-based natural language generation. The earlier limit to structured or numerical information was a technical constraint, now removed.\n- A scientific perspective also applies to journalism's understanding of its audience, which is remarkably thin: at worst paternalistic folk theories, at best simplistic analytics and coarse declared preferences. Science offers cognitive research, controlled testing and theory built on neuroscience and evolutionary biology rather than on identity and social conditions.\n\n## Why society needs scientific journalism\n\n- A technical interpretation of societal information flows is inevitable, because humanistic interpretations cannot adjust to the scale, scope and velocity of AI-mediated information. The seeds are sprouting in start-ups, platforms and academic fields with no overlap with journalism; the ambition to replace journalism with an entirely new model of information flows, backed by billions, is one harbinger.\n- The problem with that inevitable alternative is not its existence or value but its values. Journalism's declared values of truthfulness and independence, and its watchdog incentives, have served society well. A scientific journalism should not merely operate in a scientific way but pursue values similar to those of science itself, and ideally the enlightenment values of humanistic journalism should become its values too.\n- Science is trusted because it works, and because it is not perceived to be filtered through the gate of human opinion. Humanistic journalism excels at inter-subjective truth, what a community agrees is true; scientific journalism may offer society a way to coalesce around a shared perception of objective reality that opinion-centred journalism cannot.\n\n## What follows\n\n- Explicitly recognise and separate humanistic from scientific journalism, in leadership, skills, activities, products and even organisations, and transfer the values and mission of the former into the latter. The differences between the cultures are too great to bridge; separation relieves both of their uncertainty, refocusing humanistic journalism on what it does best and unblocking scientific journalism.\n- Build a research and development ecosystem for scientific journalism: first-principles applied research on information representation, automated verification, network coordination and incentives; audience research with the full range of cognitive science; AI and data science oriented towards societal understanding rather than support for storytelling.\n- Humanistic journalism cannot become an end in itself, privileged over the goal of open, democratic societies of empowered citizens with access to trustworthy information. Journalism must expand or it will shrink.\n\n## Depends on\n\n- [Four responses to public scepticism of AI](four-responses-to-ai-scepticism.md)", "canon/concepts/liquid-content": "# Liquid content\n\nLiquid content is content that dynamically adapts in real time across formats, platforms, contexts and users rather than existing as one fixed version.\n\n- The shift is from information to context, from static to liquid. Competitive advantage depends less on simply making information available and more on understanding what matters in a given moment, for a given person, in a given situation.\n- The quality of liquid content depends on context, data richness, inference and interpretation, which raises questions around privacy, misreading, manipulation and fairness.\n- As organisations lose some control over static content in a more liquid digital ecosystem, the static 'artifact' of content is no longer where the value lies.", "canon/concepts/liquid-foresight": "# Liquid foresight\n\nForesight is fundamentally not about predicting the 'one' future. It is about talking about futures in plural, creating directional awareness, improving the quality of strategic questions, and in doing so providing organisations with the confidence to move between plausible futures, scenarios and horizons with more clarity and less false certainty. But what if foresight were designed for a world mediated by AI?\n\n## What it is\n\n- Liquid foresight, a term coined at the CIFS H3 AI Lab, is an AI-mediated foresight approach that rethinks how foresight itself can evolve towards the third horizon. The aim is a more adaptive practice, one that connects long-term perspectives and core foresight principles with dynamic, real-time signals and contextual shifts personalised to the individual end users.\n- Rather than seeing foresight primarily as a static product or a time-limited exercise, it becomes a more continuous and adaptive layer inside the organisation's AI systems. A constantly evolving and adapting process. An ongoing interface between possible futures and present decisions.\n\n## A more dynamic flow of information\n\n- Liquid foresight draws inspiration from liquid content and the possibility of making futures knowledge more interactive, more multimodal, and more responsive to a context, a role and a situation.\n- Different parts of an organisation need different things from foresight. A board may need strategic direction. An innovation team may need inspiration for ideas to test. A product team may need an understanding of changing user expectations translated into something they can act on right away.\n- The ambition is not necessarily one foresight output for everyone, but a more fluid system that stays anchored in shared direction while adapting to context.\n\n## The Horizon 3 perspective\n\n- Horizon 3 is not only about imagining distant futures. It is about connecting it to the assumptions built into today's ways of working.\n- If foresight were invented today, in a world already shaped by AI, simulations, agents, constant flow of insights and machine-readable knowledge, it might not take the form inherited from earlier strategic practice. It might look more like a living knowledge infrastructure, built around iterative loops between the assumptions we test and the contextual data through which we explore multiple futures. A system that connects signals, assumptions, methods, scenarios and decisions across time. Something closer to a self-iterating context graph than a static playbook. Something that can support re-perception not once, but continuously.\n\n## The core principles remain\n\n- Liquid foresight is not about replacing the core principles of foresight. It is about asking how those principles might evolve in an AI-mediated world.\n- The need for humans to challenge their own assumptions, broaden their outlook, and work with uncertainty in genuinely participatory processes remains essential. However, the form foresight takes may change. Instead of ending when a scenario is delivered, it might continue through feedback loops, simulations, updated signals, and role-specific interfaces that keep futures thinking alive inside the organisation. Foresight can become more hyper-personalised, multimodal and responsive, while still anchored in a shared strategic direction.\n- The core of liquid foresight is adaptive sensemaking, where signals are clustered, challenged, connected, and translated into patterns, tensions and possible implications. AI can extend the capacity of foresight by helping scan information flows, surface inconsistencies, work with context, generate alternative framings, and support simulation.\n- The point is not to move away from the process of re-perception and adapting futures thinking. It is to make it more alive, more usable, and more connected to action in the organisational environment for which it was designed. Fundamentally, liquid foresight stresses a shift from sprinkling a little 'AI-salt' on existing foresight processes to building AI-native ways for people and organisations to imagine, work with, and shape futures and scenarios.\n\n## Key principles of liquid foresight\n\n1. From a deliverable to a dynamic capability: foresight that functions as a living capability within the organisation rather than a static output.\n2. From a fixed view to live sensemaking: it should connect long-term thinking with signals, tensions, simulations and contextual shifts as they emerge and are relevant.\n3. From one-size-fits-all to adaptive intelligence: different roles need different foresight interfaces, but all should remain aligned to a shared strategic direction.\n\n## How to experiment now with AI-integrated, liquid foresight\n\n1. Explore Horizon 3 futures with AI. Use AI to explore radically different futures in which intelligent systems reshape organisations, markets, and the foundations of value creation and competitiveness in the third horizon.\n2. Prototype AI-native foresight tools. Test simulations, agent-based models and structured knowledge systems that help explore the futures.\n3. Use AI to challenge assumptions. Let it act as a provocation partner, not just an assistant. Under human oversight, use its unexpected outputs to open up new questions and alternative ways of seeing.\n4. Work with liquid content rather than static outputs. Build foresight as a dynamic knowledge layer that can evolve continuously and adapt to different users, contexts and decisions.\n\n## Depends on\n\n- [Liquid content](liquid-content.md)\n- [Reperception](reperception.md)\n- [The three horizons of AI-mediated transformation](three-horizons-of-ai-mediated-transformation.md)", "canon/concepts/liquid-or-human-first": "# Use the liquid wisely or choose human first\n\n## The potential and the danger in the liquid\n\nA central part of the AI content revolution concerns liquid content. It can be defined as content that is not fixed, like an article, a book or a podcast, but always adapts to a specific need of the individual person.\n\nAn AI chat is one form, where the content is always shaped to exactly your question, but it can take many other forms: audio, infographics, video, websites, apps, even a whole internet, if that is still the right word, that can be created and adapted from the user's concrete wishes, and where the same content can flow multimodally between the forms. It is a decisively different way of telling stories and conveying information from the one journalism has been used to, a kind of return to the oral ideal from before the Gutenberg revolution took hold, and it is changing the whole internet and the way knowledge and information are created and consumed. Browsing gives way to asking, content turns fluid, creation scales while stability erodes, and attention fragments even as platforms consolidate. It challenges the linear in creative forms in favour of the user helping to create stories, or even worlds of information, adapted in real time: everything is generating, the web generates itself.\n\nThe liquid opens both a potential and a threat to journalism.\n\n### Early experience\n\n- Media-developed AI chats, where the user can talk with the medium's journalism, often limited to the medium's own content as quality assurance, show a potential for increased relevance. Users get a new way to search the archive and receive answers to exactly their question, adapted to their level of knowledge and need, with some potential in education. But the chats have met technical limits: answering only the questions they actually have an answer to, and not remembering the earlier dialogue. The form challenges ideals of letting people write every story and constitutes a loss of control that raises concern for publishing quality, which has led to hidden placement and unremarkable traffic. Even with prominent placement on the front page, traffic has been limited.\n- Where users have asked millions of questions and traffic exceeded expectation, relatively few users asked their own open questions; they preferred buttons with pre-formulated questions. Perhaps people do not want to talk with journalism at all but rather to be served the news. Users have hardly complained about the new form, which could suggest a greater reluctance inside journalistic environments than outside among users.\n- Chats have shown relatively large potential within narrower areas, such as concrete elections or big breaking stories, where usage rose considerably.\n- One experiment led to a \"what has happened since you last read\" function, where users get the latest developments personalised since they last followed along. It has been a great success because it solves a need journalism's forms have struggled with: people arrive with different histories when they read the latest news. The success could not be calculated in advance but revealed itself only in the experiment, so the chat was turned down and the new function turned up.\n- A pure AI podcast adapted to your interests and made only for you gained relatively many users and a usable quality, but closed in 2026: the commercial side proved more challenging than the technical, indicating that the business model behind conversational content is not yet easy to carry.\n- Another approach treats the medium's research and data as a kind of atoms that AI can assemble in very different ways, making possible formats that put together and open up the whole research and archive in radically new ways. Here the quality of the underlying data, the medium's archive, becomes more important than the single news item, and a competitive parameter against not only other news media but also other liquid formats. Because of technical limitations the article as a form has always been a closed container, suited to people arriving at the same time with the same degree of knowledge; in reality people have very different knowledge, needs and history, which can now be met as the technical limitations disappear.\n\nThe potential for relevance, intimacy and understanding of intention is enormous, and it is risky to leave that field to the tech giants. Here is the potential for an extremely democratic form of communication, if it is structured right. People already use AI to understand complex news, make summaries, compare sources and answer follow-up questions, all user needs with journalistic potential.\n\n### Questions the liquid raises\n\n- In journalism the single story unit, such as the article, has always been the paper of record, where the first draft of history lies in fixed form: the archive. What is the system of record in the era of liquid content? What is the underlying data?\n- How does one avoid echo chambers, or colonisation of our inner life?\n- If the information we receive has already been processed by an agent, how should it choose, and by what parameters? How should the publisher influence how their work is interpreted, if the publisher has any control at all over the interface it is interpreted through?\n- Understanding the user's context and intention may become the new demand signal, rather than the user's clicks or time spent as before. The more knowledge of context a news medium has, the better service it can give and the harder it becomes for the user to switch. Power lies to a high degree with whoever has the interface, the place where the user interacts with the information, rather than with the medium that delivers some of the information. Right now that interface for liquid content lies very largely with the tech platforms, which gain extremely great control and direct contact with users, leaving journalistic media trailing on relevance, intimacy and intention, even though AI is partly dependent on the media's content.\n- It becomes decisive that the producers of content also gain access to the demand signal, and society needs a kind of common ground. The shared front page showed what other people were also following and so made the shared public conversation more shared. Here could lie an essential task for journalistic media, possibly in larger communities. Right now there are no shared frameworks and structures that reward quality in liquid content. A new market is forming and will be shaped by those who build now, and the disciplines that journalism and the scientific method developed over centuries, truth-seeking, accountability and self-correction, are the operating principles that market will require.\n\nHere lies a great potential, and an equally great threat, which will require experiments, adaptation and large resources if media are to learn to speak the liquid language fluently.\n\n## The other way: human first\n\nThere is also an alternative path to successful existential innovation: very personal content with a clear voice. Call it human-first content. Such formats have already triumphed on social media among creators, influencers and many others, and already mark news media, in some forms of expression more than others. In an AI era this type of content has even greater potential, because the thirst for real people and real voices who know what they are talking about, or at least do it authentically, only grows.\n\nWhile half of the largest news sites in the United States lost a fifth of their traffic in the year to April 2026, newsletter platforms grew, perhaps because they do not sell artefacts, such as articles, but clear, trustworthy voices. News creators and influencers have seen marked growth in recent years. A key to their success is understanding the forms and formats of communication on social media: taking formats that already work there and translating them to news and politics. Young audiences have chosen video platforms, not the established media, so one has to come to them and use forms that reach them. Authenticity is a new currency, and trust arises not from striven-for objectivity but from competence, integrity and goodwill, meaning close contact with one's community.\n\nEstablished media too have great potential to step far more offensively into human-first content: building trusted voices, and turning journalists into voices and stars. It is not easy, because journalistic norms and organisational history can be in tension with more personal, human forms of storytelling. Some media choose instead to make the medium the star rather than the individual journalists, even while using a fairly personal form in audio.\n\nSome media let creators and influencers make content with them, systematically selecting already-established young creators and then training them, for example in ethics and research tools. It is far easier to go that way, beginning with creators who already have reach and who then learn journalistic standards, than to start with journalists who must learn to tell like creators. Creators are audience infrastructure: they bring new users to the medium's other offerings. When trust has no reach, it has failed, and if established media do not engage, the public service of the future will be built outside them. Such a programme is built from small, low-friction experiments that are continuously evaluated.\n\nClassic media are taking smaller steps in the same direction: dropping the idea of writing without a byline, or building the medium around people with very clear expertise and voice. The transformation is not without difficult trade-offs. One dilemma is how to unite the pace of a daily digital publishing rhythm with clear personalities of high expertise and with fundamental culture and workflows. Another is how clear voices are united with a shared brand: is one a loose working community of original voices or a more unifying club, and in that case, a club for whom? Many media approach the same dilemma from the opposite direction, because they must learn to unite a clear media brand with the development of freer, personal voices.\n\nAt a deeper level there are parallels to the dominant storytelling forms from before the Gutenberg parenthesis. Before books, the troubadour, the always personal narrator, was at the centre, as in today's human-first content. When everything flows, we seek the clear voice. This places demands on those narrators' standards for facts and ethics, and precisely there lies a potential for news media and narrators with journalistic ballast to make something that fulfils a fundamental need in the information landscape.\n\n## The danger in the middle position\n\nBoth paths, the liquid and the human, hold important potential. But media and journalists must choose. Bet on one or the other, or at least be very conscious of which path you choose if you work with both. The barbell strategy describes how everything that falls between the two outer poles can be squeezed so that the middle collapses. Within investment the barbell strategy is a bet on both the very safe, for most of the investment, and the very risky, for a smaller part, and here too the middle position is to be avoided.\n\nThe danger lies in half-hearted attempts at the liquid, or content that is a bit personal but at the same time fairly classical, so that one, as journalist or medium, is not really anything or anyone. Better to speed up and throw oneself into liquid experiments, or slow the pace and let human stories and voices unfold. In many other forms of communication the barbell tendency is coming through in these years: music, games, film, video and television often succeed at two extremes, very superficial and fast, or very deep and long.\n\nExistential innovation is about choosing and taking responsibility upon oneself. That holds here too, where the middle position seems easy but carries a marked risk of irrelevance.\n\nUsed wisely and consciously, the two positions are not each other's opposites. There can be great potential in using AI tools to support human-first content. Where AI tools are widely used, the plan is that they free time to make what is judged the core of the journalism: people making so-called super content, the stories AI cannot make, which often require close human contact and often convert new subscribers. Many of the competences prized in the classic digital age, speed, fast writing, the journalist as runner, are no longer so much in demand because AI makes the first draft of much content; instead the ability to make super content is sought. So AI takes over many small tasks so that the big, important things, such as telling as a human being, can be left to humans.\n\nThe greatest potential probably lies in using AI far more directly to support human-first content, where a voice has a host of artificial agents, producers and other world-builders to lift it. The voices that manage this can gain an extreme competitive advantage in future. But it requires big experiments and courage.\n\n## Depends on\n\n- [Existential innovation](existential-innovation.md)\n- [Liquid content](liquid-content.md)", "canon/concepts/megatrends": "# Megatrends\n\nLong-term and large-scale transformative forces that profoundly shape both the present and the future.\n\n- For the most part, megatrends stay their course even in turbulent times.\n- They shape the future landscape of societies, economies, industries and cultures over extended periods.\n- While they are global in scope, their impact varies locally.\n- In a principally uncertain and complex world, megatrends help us recognise that there are also relatively stable, yet powerful, forces at work in shaping future outcomes.\n\n## CIFS definition\n\nMegatrends are durable, directional structural forces that reshape the conditions under which societies, individuals and organisations across the world operate. They are historically specific rather than permanent features of human societies, resilient to individual action and short-term disruption, and grounded in dynamics strong enough to persist for decades.\n\n## Historical, durable and non-linear forces\n\n- Megatrends are historically situated rather than transhistorical forces. Transhistorical forces are permanent features of human societies, such as demographic change or technological development, which are sometimes considered megatrends. Some megatrends can be understood as historically specific configurations of such processes, the Inversion of the Population Pyramid as a configuration of demographic change, or the Rise of Embedded AI as a configuration of technological development, but megatrends do not persist indefinitely. They emerge from a specific configuration of conditions (that could in principle be different), unfold through distinct mechanisms, and have systemic and directional effects that run their course over decades.\n- Technological development and demographic change do not exhibit these properties. They are features of every human society, take different forms across time and place, and do not depend on any specific configuration of conditions. Treating them as megatrends would be like treating 'social change' or 'conflict' as megatrends: too broad to be analytically useful and too permanent to tell us much about what makes the conditions of change in the present and immediate future distinct.\n- Megatrends do not necessarily unfold in a linear fashion. Even though they persist over the long term, they can suffer temporary interruptions, and a disruption may last several years without spelling the end of the megatrend. The Green Transition has faced several interruptions, including energy crises pushing some countries back toward fossil fuels in the short run, or powerful political leaders working against green energy. These disruptions may have temporarily slowed the trajectory but have not ended it. The structural conditions and imperatives that necessitate a green energy transition in the long term are too powerful to be counteracted by such short-term disruptions.\n\n## Typology of representation\n\n- Megatrends, and all trends, can be represented in various ways, owing in part to differences in the kind of evidence that can substantiate them. Some are primarily supported by measurable developments and data that can be tracked over time, while others are primarily explained through observation and interpretation that cannot easily be measured in quantitative terms, often the case with megatrends relating to systems, values and social practices. Every megatrend always carries elements of both.\n- The simplest form of representation is growth or decline trends, tracking a continuous increase or decrease in a set of measurable variables, such as the growth in urban populations as a share of the global total. Growth or decline can also be represented qualitatively, where a phenomenon is recognised to be increasing or decreasing in strength or significance even though the evidence is too qualitative to be measured precisely.\n- Other trends are represented as transitions or shifts from one state to another, in which the elements of a system are rearranged into a new pattern, such as the shift from a unipolar to a multipolar world order. Shifts like this can rest on both quantitative and qualitative evidence.\n\n## Megatrend diagnostics\n\nCIFS has developed a diagnostics tool that tests a megatrend candidate against the definition's criteria, so that the process of megatrend selection rests on a shared, transparent and repeatable standard. The tool helps conceptually distinguish megatrends as higher-order, structurally significant transformations from shorter-term developments, transhistorical processes, or overly diffuse descriptions of change. This is consistent with CIFS' treatment of megatrends as analytically bounded aggregate patterns that help frame the long-term contextual environment rather than explain specific outcomes on their own.\n\nEach criterion functions as a diagnostic gate. A 'No' at any stage indicates that the phenomenon does not qualify as a megatrend candidate under the CIFS definition. Although the tool may seem to encourage binary yes/no assessments, each gate calls for interpretation and judgement. The definition does not point to one definitive set of megatrends, and the eleven trends defined by CIFS are not necessarily an exhaustive list. One organisation applying the same criteria might draw boundaries or weigh evidence differently, group developments in another way, or be motivated by different domain expertise. This is not a weakness of the approach but a product of the nature of megatrends as abstractions that we try to represent analytically.\n\n### Figure: CIFS megatrend diagnostics\n\nA vertical flowchart of seven numbered gates. Each gate is a box containing a question and its explanation. A 'yes' below each box passes the candidate down to the next gate; a box to the right gives the 'no' outcome that disqualifies it. Passing all seven gates qualifies the candidate as a megatrend under the CIFS definition.\n\n| Gate | Test | If no |\n|---|---|---|\n| 1. Can we define what is changing? | A megatrend candidate must have clearly defined boundaries: what it includes, what it excludes, and what evidence would count as support. 'Acceleration' and 'systemic complexity' are sometimes named as megatrends, but neither passes this gate. Both describe properties of change itself rather than a domain within which change occurs. | Not analytically clear |\n| 2. Is there a clear directional pattern? | The direction of a megatrend must be clearer than mere 'change', though it may follow different patterns: growth or decline, transition or shift, and others. | No clear direction |\n| 3. Will it have transformative societal impact? | A megatrend must reshape the conditions under which societies, people and organisations operate, not merely be something big, persistent or widespread. | Not transformative |\n| 4. Is it grounded in dynamics likely to persist for decades? | Many things feel important and durable in the moment, to the extent that they are mistaken for deeper structural change. A megatrend must be grounded in dynamics that have built up over years and are robust enough to be sustained over decades. | Not structurally durable |\n| 5. Is it historically situated, not transhistorical? | A megatrend must be rooted in a specific configuration of society rather than being a permanent feature of it. Demographic change is transhistorical, since it has always happened. Population ageing, by contrast, is historically situated: a distinct demographic trajectory produced by present conditions. | Too permanent |\n| 6. Is its momentum resilient to individual action and short-term disruption? | All megatrends are contingent on human action. While they can suffer temporary interruptions, they cannot be easily reversed by single actions or events, unless those events are as rare as they are transformative in scope and impact. | Too contingent |\n| 7. Is the evidence base defensible? | A megatrend must be supported by evidence from a diverse range of sources. The underlying body of evidence must be coherent and not selectively chosen to fit a conclusion. | Not sufficiently supported |\n\n## Origin and other definitions\n\n- The term was coined by John Naisbitt in 1982. Trends, like horses, are easier to ride in the direction they are going: if we know where the horse is heading, we can position ourselves to ride with the change rather than be overtaken or run over by it. Megatrends are less about prediction and more about awareness of the direction of travel.\n- The European Commission defines a megatrend as a long-term driving force that is observable now and will continue to have a global impact in years to come.\n- In a principally unpredictable world, megatrends stand out as the only relative certainty we have and give points of orientation for the longer term. Their trajectory and velocity are not set in stone, and which megatrends jump out depends on the country and sector in focus. You cannot hide from a megatrend; the only real choice is how to respond.\n\n## A checklist and a hierarchy\n\n- Is this a megatrend? Multidisciplinary rather than narrow; a driver of change with transformative power; breadth, meaning a far-reaching, global effect; a long timespan of ten to fifteen years; forward focused, defining the future world.\n- Megatrends sit on top of a complex weave of trends. Sub-trends are observable or measurable directional shifts with narrower scope or impact, possibly shorter lived, which may even run counter to a megatrend. Weak signals are subtle, often early indicators of emerging shifts that are not yet widely recognised, with the potential to significantly impact the future but which may also fade away. There is no single correct way to group trends; different organisations and futurists cluster them differently.\n- Megatrends are not independent of one another. They interact, overlap and reinforce: demographic developments affect technology, economic models and regulation, and technological breakthroughs reshape economic models and societies. The ripple effect is strong.\n\n## Depends on\n\n- [Trends](trends.md)\n- [Drivers of change](drivers-of-change.md)", "canon/concepts/organisational-preparedness": "# Organisational preparedness\n\nHow often do you pause to consider what your organisation could look like 10 years from now? Do you assume your role and your sector will still exist in broadly the same form? What assumptions about consumer behaviour are quietly shaping the decisions you make today?\n\n## What preparedness is\n\n- Organisational preparedness goes well beyond technical readiness. It is about building the capacity to challenge internal assumptions, experiment, learn across functions, and recognise how, and when, signals should be turned into strategic action.\n- It demands the discipline to distinguish between immediate gains and longer-term relevance.\n\n## Cultural as much as operational\n\n- Many organisations already have teams or individuals testing new approaches, experimenting with AI-mediated workflows, identifying new ways of doing things or sensing that old processes no longer fit. Yet these experiments often remain disconnected from strategic decision-making.\n- Preparedness means noticing them, legitimising them, and connecting them into broader learning loops rather than treating them as isolated developments.\n\n## Uncertainty as a feature\n\n- Organisational preparedness means accepting that uncertainty about the future is not a temporary inconvenience. The future does not arrive only when technology matures. It begins when present assumptions no longer hold.\n- Organisations that treat uncertainty as a feature, and an opportunity for innovation, rather than a bug, are better placed to position themselves in the future before change becomes unavoidable.\n\n## A more explicit language for innovation\n\n- Too often, innovation is used to describe everything from minor optimisation to transformative reinvention. The distinction matters.\n- Incremental innovation primarily improves what already exists. Radical innovation asks whether the underlying logic should change.\n- In an AI-mediated world, organisations need both, but they must know when they are engaging which, and why. This is what CIFS calls futures-driven innovation.\n\n## Depends on\n\n- [Futures-driven innovation](futures-driven-innovation.md)\n- [Uncertainty](uncertainty.md)", "canon/concepts/reperception": "# Reperception\n\nThe process of shifting perspective to think of the world and of the future in a new way, recognising that the future can be different from the past or from what one currently expects.\n\n- One of the main goals of futurists and foresight practitioners is to facilitate reperception, for example by utilising scenarios or other foresight tools.\n- Reperception is a key element in developing systems and strategies that can respond to emergent futures in the face of uncertainty.\n\n## Origin\n\n- The term comes from Pierre Wack, one of the pioneers of strategic foresight and the first to develop the use of scenario planning in the private sector, as head of strategy at a major oil company. He defined reperception as awakening to the possibility of the future being different from the past, or from how one expects it to be.\n- He also held that the most important and most difficult task for people working with strategic foresight is to facilitate this transition: helping people think of the future in new ways. This is why the foresight process is at least as important as its final outcomes. The future is not a destination but a tool, and the process should develop learning, broaden participants' horizons and build a shared understanding of potential outcomes.\n\n## Reframing to create reperception\n\n- What scenarios essentially do is reframe in order to create reperception, in contrast to 'predict and control' approaches. We learn about the present through the lens of the future, rather than understanding the future from the perspective of the present.\n- Reframing makes people mindful of the frame they have been using to make sense of the world and the future, the 'official future', and equally of what is left out of that frame. It occurs when alternative, plausible future outcomes are contrasted to reveal, test and redefine the given frame, after which actions can be rehearsed within the alternative frames to generate new shared knowledge and insights.\n- The purpose of developing scenarios is not to make predictions but to challenge assumptions, bias and ignorance about what could be true in the future, and to counteract the tendency to believe that the future will merely reflect the past or adhere to a specific vision. Rather than accounting for every possible event leading to a scenario, the aim is reperception: an alternative plausible view that lets the organisation navigate and explore the implications.\n\n## Memories of the future\n\n- A neuroscientist has proposed that it is possible to proactively engage with the future and 'memorise' it by rehearsing it through futures thinking, so that when one is confronted with change not previously encountered, it nonetheless exists in some form in one's memories of the future: building a repertoire for future use. Scenario planning can be understood as such a rehearsal for leaders.\n\n## Depends on\n\n- [Scenarios](scenarios.md)\n- [Worldview](worldview.md)\n- [The strategic foresight process is at least as important as the final outcomes](../principles/process-matters-as-much-as-outcomes.md)\n- [Strategic foresight explores the future before considering implications for the present](../principles/explore-the-future-before-the-present.md)", "canon/concepts/rewiring-starts-in-our-heads": "# Rewiring starts in our heads\n\nAsked to imagine a newsroom in 2036, most people picture today's newsroom with some future sprinkled on top. We are conditioned to think in certain ways, so a reimagined thing can look new on the outside while the core stays unchanged. Sara Inkeri Vardar's conclusion, after five drafts of trying to come up with a solution, is that what journalism needs most may not be another brilliant idea but the curiosity to question the assumptions that shape the ideas in the first place.\n\n## Are we solving the right problems?\n\n- The crisis facing journalism is not necessarily experienced as a crisis by the public. People get on with their lives, find information elsewhere and do not feel anything is missing.\n- When young people do not read the articles, the discussion turns to shorter articles, video or a new feed: new ways to deliver traditional journalism, without understanding what people are looking for. What if the problem is not the format, but information needs not met, barriers not noticed, questions not asked?\n- Journalism's democratic res
